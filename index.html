     help=f\"最も Rs が高いのは tG {peak['tG']:.0f} min / \"\n                      f\"{peak['T']:.0f} ℃ で Rs {peak['Rs_min']:.2f}（\"\n                      f\"{peak['runtime']:.0f} 分）。そこまで伸ばす価値があるかは\"\n                      \"下のグラフで判断してください。\")\n        st.caption(f\"合格した条件 {int(ok.sum())} / {ok.size} 点　|　\"\n                   f\"この条件の臨界ペア: **{best['critical_pair'][0]} ↔ \"\n                   f\"{best['critical_pair'][1]}**\", help=PICK_HELP)\n\n        gone = _outside(best, measured)\n        if gone:\n            st.warning(\n                \"推奨条件の条件が**実測した範囲の外**です（\" + \"／\".join(gone)\n                + \"）。モデルの外挿なので、採用する前にその条件で 1 本流して\"\n                  \"予測と合うか確かめてください。\", icon=\"⚠️\")\n\n    show(plots.plot_resolution_map(rmap, mark=best, measured=measured))\n\n\ndef _rescue(rmap, flow) -> None:\n    \"\"\"届かないときに何をどれだけ変えればいいか。\n\n    最良の点の条件を実際に流し直し、**臨界ペアの実測 α と k***で\n    診断します。以前は α を 1.02 に決め打ちし、しかも k_star() に System を\n    渡す型違いで毎回例外 → 握り潰して診断が黙って空、という壊れ方をして\n    いました。ここは try で包みません（壊れたら画面に出るべき所です）。\n    \"\"\"\n    idx = np.unravel_index(np.argmax(np.nan_to_num(rmap.rs_min, nan=-np.inf)),\n                           rmap.rs_min.shape)\n    best = rmap.point(idx)\n    st.caption(f\"最良条件は tG {best['tG']:.1f} min / {best['T']:.0f} ℃ で \"\n               f\"Rs {best['Rs_min']:.2f}（臨界ペア {best['critical_pair'][0]} ↔ \"\n               f\"{best['critical_pair'][1]}）。\")\n\n    comps = st.session_state[\"comps\"]\n    system = st.session_state[\"system\"]\n    res = simulate(comps, Method(Gradient.linear(rmap.phi0, rmap.phi1,\n                                                 best[\"tG\"]),\n                                 best[\"T\"], flow), system)\n    info = critical_n_req(res, comps, rmap.phi1 - rmap.phi0, best[\"tG\"],\n                          rmap.rs_target)\n    lines = (diagnose_infeasible(info[\"alpha_sel\"], info[\"k_star\"],\n                                 rmap.n_available, rmap.rs_target)\n             if info else [\"臨界ペアが計算できませんでした（溶出しない成分がある\"\n                           \"可能性があります）。\"])\n    with st.expander(\"未達時の対応\", expanded=True):\n        st.caption(f\"臨界ペアの α = {info['alpha_sel']:.4f}、k* = \"\n                   f\"{info['k_star']:.2f} で診断しています。\" if info else \"\")\n        for line in lines:\n            st.markdown(f\"- {line}\" if not line.startswith(\"-\") else line)\n        st.markdown(\n            \"- **カラムを伸ばす／流速を下げる** … 「6. メソッド最適化」で試せます\\n\"\n            \"- **温度域を変える** … 上の範囲を広げて求め直す\"\n            \"（実測範囲の外なので、採用前に 1 本流して確かめること）\\n\"\n            \"- **移動相を変える**（MeOH・三元）／**固定相を変える**（Phenyl 系）\"\n            \" … このツールの外です。モデルを取り直しになります\")\n\n\n# ----------------------------------------------------------------------\n# 3. 分析時間と分離度\n# ----------------------------------------------------------------------\ndef _tradeoff(rmap) -> None:\n    st.header(\"3. 分析時間と分離度\", help=TRADE_HELP)\n    import matplotlib.pyplot as plt\n\n    rs, rt, temps = [], [], []\n    for j in range(rmap.tG.size):\n        col = np.where(rmap.feasible_direct[:, j], rmap.rs_min[:, j], np.nan)\n        if np.all(np.isnan(col)):\n            rs.append(np.nan)\n            rt.append(np.nan)\n            temps.append(np.nan)\n            continue\n        i = int(np.nanargmax(col))\n        rs.append(float(col[i]))\n        rt.append(float(rmap.runtime[i, j]))\n        temps.append(float(rmap.T[i]))\n\n    fig, ax = plt.subplots(figsize=(8.0, 4.0))\n    ax.plot(rt, rs, \"o-\", ms=4, color=\"#1f77b4\")\n    ax.axhline(rmap.rs_target, color=\"k\", lw=1.4, ls=\"--\",\n               label=f\"target Rs = {rmap.rs_target}\")\n    ax.set_xlabel(\"run time / min\")\n    ax.set_ylabel(\"minimum Rs (best temperature)\")\n    ax.grid(alpha=0.25)\n    ax.legend(fontsize=8)\n    fig.tight_layout()\n    show(fig)\n\n    df = pd.DataFrame({\"tG [min]\": rmap.tG, \"最良の温度 [℃]\": temps,\n                       \"最小 Rs\": rs, \"分析時間 [min]\": rt})\n    with st.expander(\"数値\"):\n        st.dataframe(df.dropna(), width=\"stretch\", hide_index=True,\n                     column_config={\n                         \"tG [min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n                         \"最良の温度 [℃]\": st.column_config.NumberColumn(format=\"%.0f\"),\n                         \"最小 Rs\": st.column_config.NumberColumn(format=\"%.2f\"),\n                         \"分析時間 [min]\": st.column_config.NumberColumn(format=\"%.1f\")})\n        download_df(df.dropna(), \"表を CSV 保存\", \"tradeoff.csv\")\n\n\n# ----------------------------------------------------------------------\n# 4. 条件を選ぶ\n# ----------------------------------------------------------------------\ndef _pick(rmap, measured) -> None:\n    st.header(\"4. 条件の選択\")\n    ss = st.session_state\n\n    best = _fastest(rmap) or rmap.plateau(ROBUST_RADIUS)\n    a, b = st.columns(2)\n    tg = a.selectbox(\"グラジエント時間 [min]\", [float(x) for x in rmap.tG],\n                     index=int(np.argmin(np.abs(rmap.tG - best[\"tG\"]))),\n                     format_func=lambda v: f\"{v:.1f}\", key=\"map_pick_tg\")\n    T = b.selectbox(\"カラム温度 [℃]\", [float(x) for x in rmap.T],\n                    index=int(np.argmin(np.abs(rmap.T - best[\"T\"]))),\n                    format_func=lambda v: f\"{v:.0f}\", key=\"map_pick_t\")\n\n    i = int(np.argmin(np.abs(rmap.T - T)))\n    j = int(np.argmin(np.abs(rmap.tG - tg)))\n    point = rmap.point((i, j))\n    rr = rmap.robust_rs(ROBUST_RADIUS)\n    point[\"Rs_neighbourhood_min\"] = float(rr[i, j])\n\n    m = st.columns(4)\n    m[0].metric(\"最小 Rs\", f\"{point['Rs_min']:.2f}\")\n    m[1].metric(\"近傍最小 Rs\", f\"{point['Rs_neighbourhood_min']:.2f}\",\n                help=\"ここが目標を下回るなら、設定が少しずれただけで\"\n                     \"不合格になります。\")\n    m[2].metric(\"分析時間\", f\"{point['runtime']:.0f} 分\")\n    m[3].metric(\"必要 N\", f\"{point['N_req_direct']:,.0f}\",\n                delta=f\"実際 {rmap.n_available:,.0f}\",\n                delta_color=\"off\",\n                help=\"σ の定義から直接逆算した必要理論段数。\"\n                     \"実際の N がこれを下回ると原理的に届きません。\")\n\n    if not point[\"feasible_direct\"]:\n        st.error(\"この条件は理論段数が足りません。\", icon=\"🚨\")\n    elif point[\"Rs_neighbourhood_min\"] < rmap.rs_target:\n        st.warning(\"この点は目標を満たしていますが、**周りが谷**です。\"\n                   \"設定が少しずれると落ちます。\", icon=\"⚠️\")\n    else:\n        st.success(\"目標を満たし、周囲も平らです。\", icon=\"✅\")\n\n    for w in _outside(point, measured):\n        st.warning(f\"この条件は実測範囲の外です（{w}）。採用前に 1 本流して\"\n                   \"予測と合うか確かめてください。\", icon=\"⚠️\")\n\n    if st.button(\"この条件を基準に設定\", type=\"primary\"):\n        ss[\"ref_point\"] = point\n        st.success(f\"tG {point['tG']:.1f} min / {point['T']:.0f} ℃ を\"\n                   \"基準にしました。「6. メソッド最適化」でここから詰めます。\")\n\n    if ss.get(\"ref_point\"):\n        p = ss[\"ref_point\"]\n        st.caption(f\"いまの基準: tG {p['tG']:.1f} min / {p['T']:.0f} ℃　\"\n                   f\"Rs {p['Rs_min']:.2f}　{p['runtime']:.0f} 分\")\n", "app/sections/tune_page.py": "\"\"\"メソッド最適化（速さと選択性を詰める）\n\nページ 5 で選んだ「目標を満たす中で最短の条件」を出発点に、そこから\nさらに詰めます。詰め方は 2 通りしかありません。\n\n**速くする** — 分離度の余裕を時間に振り替える。流速を上げるか\nカラムを短くします。どちらも N を削るので、余裕が無ければ使えません。\n\n**セグメント化** — 組成域ごとに別々の傾きを与えます。やり方は 2 通り:\n\n- **区間ごとに最適化**（既定）… 溶出帯にも空白にも、それぞれ必要なだけの\n  傾きを与える。目的成分が複数の群に分かれているとき、リニアは**いちばん\n  厳しい群に全区間を合わせて**しまうので、そこで大きく時間を捨てています\n- **空白だけ飛ばす**（従来）… 元の傾きは保ち、成分が溶出しない組成域だけ\n  急勾配で通過する\n\n実データでは前者が効きました（58 → 29 分、Rs 2.0 維持）。\n\nどちらも**設定がずれた場合まで込み**で評価します。名目の Rs が高くても、\n温度が 2 ℃ ずれただけで落ちる条件は使えません。多段は装置間のドウェル差に\n弱くなるので、そこも一緒に振ります。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom lcmd import (\n    Gradient, Method, column_length_scan, flow_scan, plots, pressure_profile,\n    robust_evaluation, search_segments, simulate,\n)\nfrom lcmd.design import segment_map\nfrom lcmd.segments import search_slopes\n\nfrom app.common import busy_button, download_df, mono, show, to_psi\n\n# 圧力はここまで。見積もりが 2-3 割ずれるので、上限いっぱいは狙いません。\nPRESSURE_LIMIT = 0.80\n\n# セグメント化で振る「落としてよい Rs の下限」の段数。\n# 分離を保つ側から目標 Rs まで。1 段につき数秒。\nSEG_LEVELS = 3\n\nPAGE_HELP = \"\"\"\nページ 5 で選んだ条件を出発点に、分析時間を詰めます。\n\n- **高速化** … 流速を上げる／カラムを短くする。どちらも N を削るので、\n  分離度に余裕があるときだけ\n- **セグメント化** … 成分が溶出しない組成域を急勾配区間で通過する\n\n**設定がずれた場合まで込みで評価します。** 名目の Rs が高くても、温度が 2 ℃ ずれただけで\n落ちる条件は使えません。装置を変えたら動く（ドウェル容量が違う）ことにも\n気をつけてください。\n\"\"\"\n\nFLOW_HELP = \"\"\"\n**グラジエント容量（tG × 流速）を一定に保ったまま**流速だけを変えます。\nこうすると保持の挙動（k*・溶出組成）はほぼ変わらず、**速さと N だけ**が動きます。\n\nRs が平坦な範囲では分析時間だけが短縮されます。低下し始めたら理論段数を\n失っている合図で、その手前が最適点です。\n\n圧力は Kozeny–Carman の概算（カラムのみ、配管は含まず）で、実測とは 2-3 割\nずれます。上限の 80% で頭打ちにしています。\n\"\"\"\n\nLENGTH_HELP = \"\"\"\nカラム長を変えたときの Rs と時間。N ∝ L、圧力 ∝ L なので、\n**長さを 2 倍にすると Rs は √2 倍、時間と圧力は 2 倍**が目安です。\n\nグラジエント時間も長さに比例させています（b と溶出組成を保つため）。\nそうしないと「長さの効果」と「勾配が急になった効果」が混ざります。\n\n**これは装置設定の話です。** 採用するには、ホームでカラム長と N を\n入れ直してから、このページに戻ってきてください（このページの「採用」は\nグラジエントと温度と流速だけを渡します）。\n\"\"\"\n\nSEG_HELP = \"\"\"\n**成分が溶出する組成の帯だけ元の勾配、その間は急勾配区間**にしたグラジエントです。\n目的は分析時間の短縮で、溶出しない組成域を緩勾配で通過する時間を削ります。\n\n**急勾配区間はタダではありません。** そこを急ぐと、**その後に溶出する全ピーク**の\n分離が落ちます。急勾配では 2 成分の移動速度の差が縮み、溶出組成の差 ΔΦe が\n小さくなるためです。したがって「何分縮めるために、Rs をいくら払うか」の取引に\nなります。裏を返すと、**最後の対象ピークより後ろの組成域だけはほぼタダ**です。\n\n探索は組成域ごとに行います。\n\n1. 各成分の溶出組成 Φe を中心に、**そのピーク自身の幅**から帯を張る\n   （半幅 ＝ 半値幅の 2 倍 ＋ 設定誤差ぶんの 0.5 %B）。重なる帯は繋ぐ\n2. 帯と帯の空白が候補。1 つずつ単独で試して「何分縮むか / Rs をいくら払うか」を測る\n3. 割のよい順に、**最小 Rs が下限を割らない範囲で最も急な傾き**を二分探索で決める\n4. 溶出位置が動くので帯を引き直し、もう 1 巡する\n\n判定は毎回、組み上げたグラジエントをそのまま数値積分した結果で行います。\nRs の下限を数段階振って、**時間と分離の取引の全体像**を候補表に出します。\n\n**装置間差に弱くなります。** 折れ点はドウェル容量に依存するので、ドウェル容量の\n違う装置に移すと折れ点が実質的にずれます。候補は必ず「ずらしたときの最悪値」で\n順位づけしてください。\n\"\"\"\n\nPROFILE_HELP = \"\"\"\n背景が**検出器で見える溶媒組成**、手前が予測されるピークです。\n\n**緩勾配区間にピークが乗り、急勾配区間が空いていれば意図どおりです。**\n急勾配区間で溶出すると時間軸で圧縮され、分離度が低下します。\n\n背景はプログラムそのものではなく、tD ＋ t0 だけ遅れて検出器に届く組成です\n（プログラムを描くとピーク位置と 1 分ほどずれて見えます）。\n\"\"\"\n\n\ndef render(system, flow, temp, rs_target) -> None:\n    st.title(\"メソッド最適化\", help=PAGE_HELP)\n\n    comps = st.session_state.get(\"comps\")\n    if comps is None:\n        st.info(\"**「3. 保持モデル推定」でモデルを確定してください。**\", icon=\"📄\")\n        return\n\n    base = _base_method(flow, temp)\n    if base is None:\n        return\n    _summary(comps, base, system, rs_target)\n\n    st.divider()\n    _faster(comps, base, system, rs_target)\n\n    st.divider()\n    _segments(comps, base, system, rs_target)\n\n    st.divider()\n    _adopt(comps, system, rs_target)\n\n    st.divider()\n    _adopted_map(comps, system, rs_target)\n\n\n# ----------------------------------------------------------------------\n# 出発点\n# ----------------------------------------------------------------------\ndef _base_method(flow, temp) -> Method | None:\n    \"\"\"ページ 5 で選んだ条件から基準のメソッドを組む。\"\"\"\n    ss = st.session_state\n    point = ss.get(\"ref_point\")\n    rmap = ss.get(\"rmap\")\n    if point is None:\n        st.info(\n            \"**「5. デザインスペース探索」で条件を選んでください。**\\n\\n\"\n            \"デザインスペースの図で「この条件を基準に設定」を押すと、\"\n            \"その条件がここに来ます。\",\n            icon=\"📄\")\n        return None\n    p0 = rmap.phi0 if rmap is not None else 0.05\n    p1 = rmap.phi1 if rmap is not None else 0.95\n    return Method(Gradient.linear(p0, p1, point[\"tG\"]), point[\"T\"], flow)\n\n\ndef _metrics(comps, method, system, rs_target, tiers=(1, 2)) -> dict:\n    res = simulate(comps, method, system)\n    p = pressure_profile(system, method)\n    return {\"res\": res, \"Rs\": res.min_rs(tiers),\n            \"runtime\": float(np.nanmax(res.tR)),\n            \"pressure\": p, \"ok\": res.min_rs(tiers) >= rs_target}\n\n\ndef _summary(comps, base, system, rs_target) -> None:\n    st.header(\"1. 基準条件\")\n    m = _metrics(comps, base, system, rs_target)\n    g = base.gradient\n\n    a, b, c, d = st.columns(4)\n    a.metric(\"グラジエント\", f\"{g.duration:.1f} min\",\n             help=f\"{g.phis[0] * 100:.0f} → {g.phis[-1] * 100:.0f} %B のリニア\")\n    b.metric(\"温度 / 流速\", f\"{base.temperature_C:.0f} ℃ / \"\n                             f\"{base.flow_ml_min:.2f}\")\n    c.metric(\"最小 Rs\", f\"{m['Rs']:.2f}\",\n             delta=f\"目標 {rs_target:.1f}\", delta_color=\"off\")\n    d.metric(\"分析時間\", f\"{m['runtime']:.0f} 分\",\n             delta=f\"{to_psi(m['pressure']['max_bar']):,.0f} psi \"\n                   f\"({m['pressure']['fraction_of_limit']:.0%})\",\n             delta_color=\"off\")\n\n    margin = m[\"Rs\"] - rs_target\n    if margin >= 0.5:\n        st.success(f\"目標に対して **Rs {margin:+.2f} の余裕**があります。\"\n                   \"下の高速化で、この余裕を分析時間に振り替えられます。\",\n                   icon=\"✅\")\n    elif margin >= 0:\n        st.info(\"目標は満たしていますが余裕が小さく、高速化の余地はわずかです。\"\n                \"セグメント化を検討してください。\", icon=\"ℹ️\")\n    else:\n        st.warning(\"この条件は目標 Rs に届いていません。ページ 5 で条件を\"\n                   \"選び直してください。\", icon=\"⚠️\")\n\n\n# ----------------------------------------------------------------------\n# 2. 高速化\n# ----------------------------------------------------------------------\ndef _faster(comps, base, system, rs_target) -> None:\n    st.header(\"2. 高速化\")\n    tab_f, tab_l = st.tabs([\"流速\", \"カラム長\"])\n\n    with tab_f:\n        st.caption(\"グラジエント容量（tG × 流速）を保ったまま流速を変えます。\",\n                   help=FLOW_HELP)\n        # 出発点の流速を必ず格子に含める。linspace だけだと基準の流速が\n        # 格子に乗らず、「出発点との差」を出せません（実際、最遅の行を\n        # 基準に差を出していました）。\n        flows = np.unique(np.append(\n            np.linspace(max(0.05, base.flow_ml_min * 0.5),\n                        min(3.0, base.flow_ml_min * 3.0), 9),\n            base.flow_ml_min))\n        rows = flow_scan(comps, system, base, flows)\n        df = pd.DataFrame([{\n            \"流速 [mL/min]\": r[\"flow\"], \"tG [min]\": r[\"tG\"],\n            \"N\": r[\"plates\"], \"最小 Rs\": r[\"Rs_min\"],\n            \"分析時間 [min]\": r[\"runtime\"],\n            \"最大圧 [psi]\": to_psi(r[\"pressure_max_bar\"]),\n            # 表示は % なのでここで 100 倍する。分数のまま \"%.0f%%\" に渡すと\n            # 全部 0% になります（実際にそうなっていた）。\n            \"上限比 [%]\": 100.0 * r[\"pressure_fraction\"],\n        } for r in rows])\n\n        pick = _best_row(rows, rs_target)\n        if pick is None:\n            st.warning(\"目標 Rs と圧力の両方を満たす流速がこの範囲にありません。\",\n                       icon=\"⚠️\")\n        else:\n            base_rt = next(r[\"runtime\"] for r in rows\n                           if abs(r[\"flow\"] - base.flow_ml_min) < 1e-9)\n            a, b, c = st.columns(3)\n            a.metric(\"推奨流速\", f\"{pick['flow']:.2f} mL/min\")\n            b.metric(\"最小 Rs\", f\"{pick['Rs_min']:.2f}\")\n            c.metric(\"分析時間\", f\"{pick['runtime']:.0f} 分\",\n                     delta=f\"{pick['runtime'] - base_rt:+.0f} 分\",\n                     delta_color=\"inverse\")\n            st.caption(f\"圧力は {to_psi(pick['pressure_max_bar']):,.0f} psi\"\n                       f\"（上限の {pick['pressure_fraction']:.0%}）。\"\n                       f\"目標 Rs と上限 {PRESSURE_LIMIT:.0%} の両方を満たす中で\"\n                       \"最短の点です。\")\n            if st.button(\"この流速を採用\", key=\"tune_take_flow\"):\n                _stash(Method(base.gradient.scale_time(\n                    base.flow_ml_min / pick[\"flow\"]), base.temperature_C,\n                    pick[\"flow\"]), f\"流速 {pick['flow']:.2f} mL/min\")\n\n        _scan_table(df, \"flow_scan.csv\")\n\n    with tab_l:\n        st.caption(\"カラム長を変えたときの Rs と時間。\", help=LENGTH_HELP)\n        L0 = system.column.length_mm\n        lengths = [round(x) for x in (0.5 * L0, 0.75 * L0, L0, 1.5 * L0, 2 * L0)]\n        rows = column_length_scan(comps, system, base, lengths)\n        df = pd.DataFrame([{\n            \"長さ [mm]\": r[\"length_mm\"], \"N\": r[\"plates\"], \"tG [min]\": r[\"tG\"],\n            \"最小 Rs\": r[\"Rs_min\"], \"分析時間 [min]\": r[\"runtime\"],\n            \"最大圧 [psi]\": to_psi(r[\"pressure_max_bar\"]),\n            \"上限比 [%]\": 100.0 * r[\"pressure_fraction\"],\n        } for r in rows])\n        st.dataframe(df, width=\"stretch\", hide_index=True, column_config={\n            \"N\": st.column_config.NumberColumn(format=\"%,.0f\"),\n            \"tG [min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n            \"最小 Rs\": st.column_config.NumberColumn(format=\"%.2f\"),\n            \"分析時間 [min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n            \"最大圧 [psi]\": st.column_config.NumberColumn(format=\"%,.0f\"),\n            \"上限比 [%]\": st.column_config.NumberColumn(format=\"%.0f\")})\n        short = [r for r in rows\n                 if r[\"Rs_min\"] >= rs_target\n                 and r[\"pressure_fraction\"] <= PRESSURE_LIMIT]\n        if short:\n            best = min(short, key=lambda r: r[\"runtime\"])\n            st.info(\n                f\"目標を満たす中で最も短いのは **{best['length_mm']:.0f} mm**\"\n                f\"（Rs {best['Rs_min']:.2f}、{best['runtime']:.0f} 分）。\"\n                \"採用するならホームでカラム長と N を入れ直してから、\"\n                \"ページ 5 からやり直してください。\", icon=\"ℹ️\")\n        download_df(df, \"表を CSV 保存\", \"length_scan.csv\",\n                    key=\"dl_length\")\n\n\ndef _best_row(rows, rs_target):\n    \"\"\"目標 Rs と圧力上限の両方を満たす中で、最短の行。\"\"\"\n    ok = [r for r in rows if r[\"Rs_min\"] >= rs_target\n          and r[\"pressure_fraction\"] <= PRESSURE_LIMIT]\n    return min(ok, key=lambda r: r[\"runtime\"]) if ok else None\n\n\ndef _scan_table(df, filename) -> None:\n    st.dataframe(df, width=\"stretch\", hide_index=True, column_config={\n        \"流速 [mL/min]\": st.column_config.NumberColumn(format=\"%.2f\"),\n        \"tG [min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n        \"N\": st.column_config.NumberColumn(format=\"%,.0f\"),\n        \"最小 Rs\": st.column_config.NumberColumn(format=\"%.2f\"),\n        \"分析時間 [min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n        \"最大圧 [psi]\": st.column_config.NumberColumn(format=\"%,.0f\"),\n        \"上限比 [%]\": st.column_config.NumberColumn(format=\"%.0f\")})\n    download_df(df, \"表を CSV 保存\", filename, key=f\"dl_{filename}\")\n\n\n# ----------------------------------------------------------------------\n# 3. 選択性を稼ぐ\n# ----------------------------------------------------------------------\ndef _focus_names(comps):\n    \"\"\"目的成分（tier 1）の名前。無ければ None ＝ 全ペアを見る。\"\"\"\n    names = [n for n, t in zip(comps.names, comps.tier) if int(t) == 1]\n    return set(names) if 0 < len(names) < len(comps.names) else None\n\n\ndef _segments(comps, base, system, rs_target) -> None:\n    st.header(\"3. グラジエントのセグメント化\", help=SEG_HELP)\n    ss = st.session_state\n    g = base.gradient\n    focus = _focus_names(comps)\n\n    mode = st.radio(\n        \"組み方\", [\"区間ごとに最適化\", \"空白だけ飛ばす（従来）\"],\n        horizontal=True, key=\"tune_seg_mode\",\n        captions=[\"溶出帯にも空白にも必要なだけの傾きを与える\",\n                  \"元の傾きは保ち、成分が出ない組成域だけ急勾配で通す\"])\n    c1, c2 = st.columns([1, 1.4])\n    plim = c1.slider(\"圧力上限の使用率\", 0.60, 1.00, PRESSURE_LIMIT, 0.05,\n                     key=\"tune_seg_plim\", format=\"%.2f\",\n                     help=\"上限いっぱいは狙いません。カラムの劣化やガード\"\n                          \"カラムのぶんの余裕を残します。\")\n    adj = c2.checkbox(\"流速をこの上限まで上げる\", value=False,\n                      key=\"tune_seg_adjflow\",\n                      help=\"その温度で圧力上限を超えない最速の流速に上げてから\"\n                           \"傾きを最適化します。分析時間に直接効きます。\"\n                           \"（グラジエントの形を変えても圧力は変わりません。\"\n                           \"圧力の山は粘度が最大になる組成で決まり、そこは\"\n                           \"どんなプログラムでも通るため）\")\n\n    st.caption(\n        f\"{g.phis[0] * 100:.0f} → {g.phis[-1] * 100:.0f} %B / \"\n        f\"{g.duration:.1f} min の基準条件から詰めます。落としてよい Rs の下限を\"\n        f\"{SEG_LEVELS} 段階に振り、**時間と分離の取引**として並べます（数十秒）。\"\n        + (\"　目的成分（tier 1）を **\" + f\"{len(focus)} 成分\" +\n           \"** 指定済みなので、「区間ごとに最適化」では**その成分を含むペア\"\n           \"だけ**を守ります（夾雑どうしの重なりは数えません）。従来の\"\n           \"「空白だけ飛ばす」は全ペアを守ります。\" if focus else\n           \"　tier 1 の指定が無いので、どちらの組み方でも全ペアを守ります。\"))\n\n    clicked, slot = busy_button(\n        \"セグメント化を計算\",\n        help=\"区間ごとに、Rs の下限を割らない範囲で最も急な傾きを\"\n             \"二分探索します。数十秒。\")\n    if clicked:\n        bar = slot.progress(0.0, text=\"評価中…\")\n        cb = lambda done, total: bar.progress(\n            min(done / total, 1.0), text=f\"評価中… {done:.0f}/{total}\")\n        if mode.startswith(\"区間ごと\"):\n            plans = search_slopes(comps, base, system, rs_target=rs_target,\n                                  n_levels=SEG_LEVELS, focus=focus,\n                                  pressure_limit=plim, adjust_flow=adj,\n                                  progress=cb)\n        else:\n            # 従来の探索は目的成分の指定を受け取らない（全ペアを守る）\n            plans = search_segments(comps, base, system, rs_target=rs_target,\n                                    n_levels=SEG_LEVELS, progress=cb)\n        ss[\"segments\"] = plans\n        ss.pop(\"seg_map\", None)\n        st.rerun()\n\n    plans = ss.get(\"segments\")\n    if not plans:\n        return\n\n    lin = _metrics(comps, base, system, rs_target)\n    best = plans[0]\n    a, b, c, d = st.columns(4)\n    a.metric(\"急勾配区間\", f\"{best.n_zones}\",\n             delta=f\"変曲点 {best.n_inflections}\", delta_color=\"off\",\n             help=\"急勾配で通過する組成域の数。入口と出口で折れるので変曲点は\"\n                  \"原則その 2 倍ですが、区間がグラジエントの端に接していると\"\n                  \"その側は数えません。\")\n    b.metric(\"分析時間\", f\"{best.runtime:.1f} min\",\n             delta=f\"{-best.saved_min:.1f} min（{best.saved_frac:.0%} 短縮）\",\n             delta_color=\"inverse\")\n    c.metric(\"最小 Rs\", f\"{best.Rs_nominal:.2f}\",\n             delta=f\"基準 {lin['Rs']:.2f}\", delta_color=\"off\")\n    d.metric(\"最悪 Rs\", f\"{best.Rs_worst:.2f}\",\n             delta=f\"主要因子 {best.worst_label}\", delta_color=\"off\",\n             help=\"1 因子ずつずらしたときの最小値。\")\n    if np.isfinite(best.pressure_fraction):\n        e1, e2 = st.columns(2)\n        e1.metric(\"最大圧力\", f\"{best.pressure_bar:.0f} bar\",\n                  delta=f\"上限の {best.pressure_fraction:.0%}\",\n                  delta_color=\"off\",\n                  help=f\"{to_psi(best.pressure_bar):,.0f} psi 相当。\")\n        e2.metric(\"流速\", f\"{best.flow_ml_min:.2f} mL/min\",\n                  delta=(\"上限まで上げた\" if adj else \"基準条件のまま\"),\n                  delta_color=\"off\")\n        if best.pressure_fraction > plim + 1e-9:\n            st.warning(\n                f\"この候補は圧力上限の {best.pressure_fraction:.0%} を使います\"\n                f\"（設定 {plim:.0%}）。流速を下げるか温度を上げてください。\",\n                icon=\"⚠️\")\n\n    if best.n_zones == 0:\n        st.warning(\n            \"急勾配にできる組成域がありませんでした。ピークが組成軸に\"\n            \"散らばっていて空白が無いか、分離に余裕が無いかのどちらかです。\",\n            icon=\"⚠️\")\n    elif not best.covered:\n        st.warning(\n            f\"追跡対象 {best.n_tracked} 成分のうち {best.n_tracked - best.n_inside} \"\n            \"成分が急勾配区間で溶出しています。そこは時間的に詰まるので分離が\"\n            \"落ちます。分離を残す側の候補を選んでください。\", icon=\"⚠️\")\n    elif best.Rs_worst < rs_target:\n        st.warning(\n            f\"最短の候補は目標 Rs {rs_target:.1f} に届きません\"\n            f\"（最悪 {best.Rs_worst:.2f}）。下の表から分離を残す側の候補を\"\n            \"選んでください。\", icon=\"⚠️\")\n    else:\n        st.success(\n            f\"全 {best.n_tracked} 成分が緩勾配区間で溶出し、目標 Rs を\"\n            f\"満たしたまま **{best.saved_min:.1f} min（{best.saved_frac:.0%}）短縮**\"\n            \"できます。\", icon=\"✅\")\n\n    st.subheader(\"溶媒組成と予測ピーク\", help=PROFILE_HELP)\n    show(plots.plot_method_profile(\n        best.result, windows=best.windows, zones=best.zones,\n        title=\"Segmented gradient: %B and predicted peaks\"))\n\n    df = pd.DataFrame([{\n        \"順\": i, \"急勾配区間\": p.n_zones, \"変曲点\": p.n_inflections,\n        \"最急 [%B/min]\": 100.0 * p.slope_slow * p.max_speedup,\n        \"最小 Rs\": p.Rs_nominal, \"最悪 Rs\": p.Rs_worst,\n        \"分析時間 [min]\": p.runtime, \"短縮率\": 100.0 * p.saved_frac,\n        \"圧力 [%]\": 100.0 * p.pressure_fraction,\n        \"全成分が緩勾配区間\": \"✓\" if p.covered else \"—\",\n    } for i, p in enumerate(plans, 1)])\n    st.dataframe(df, width=\"stretch\", hide_index=True, column_config={\n        \"最急 [%B/min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n        \"最小 Rs\": st.column_config.NumberColumn(format=\"%.2f\"),\n        \"最悪 Rs\": st.column_config.NumberColumn(format=\"%.2f\"),\n        \"分析時間 [min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n        \"短縮率\": st.column_config.NumberColumn(format=\"%.0f%%\"),\n        \"圧力 [%]\": st.column_config.NumberColumn(format=\"%.0f%%\")})\n    st.caption(\"**上ほど速く、下ほど分離が残ります。** 基準のリニアは \"\n               f\"{best.runtime_linear:.1f} min / 最小 Rs {best.Rs_linear:.2f} です。\")\n\n    n = st.selectbox(\n        \"採用候補\", list(range(1, len(plans) + 1)),\n        format_func=lambda i: (\n            f\"{i}. {plans[i - 1].runtime:.1f} min\"\n            f\"（{plans[i - 1].saved_frac:.0%} 短縮） / 最小 Rs \"\n            f\"{plans[i - 1].Rs_nominal:.2f} / 最悪 Rs \"\n            f\"{plans[i - 1].Rs_worst:.2f}\"),\n        key=\"tune_seg_pick\")\n    cand = plans[n - 1]\n    method = Method(cand.gradient, base.temperature_C, base.flow_ml_min)\n    if st.button(\"この条件を採用\", key=\"tune_take_seg\"):\n        _stash(method, f\"セグメント化（急勾配区間 {cand.n_zones} / \"\n                       f\"{cand.runtime:.1f} min / 最小 Rs {cand.Rs_nominal:.2f}）\")\n\n    with st.expander(\"急勾配区間の内訳\"):\n        if cand.zones:\n            zdf = pd.DataFrame([{\n                \"組成域 [%B]\": f\"{z['from_pctB']:.1f} – {z['to_pctB']:.1f}\",\n                \"傾き [%B/min]\": z[\"slope_pctB_min\"],\n                \"基準比\": z[\"speedup\"], \"短縮 [min]\": z[\"saved_min\"],\n            } for z in cand.zone_table()])\n            st.dataframe(zdf, width=\"stretch\", hide_index=True, column_config={\n                \"傾き [%B/min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n                \"基準比\": st.column_config.NumberColumn(format=\"×%.1f\"),\n                \"短縮 [min]\": st.column_config.NumberColumn(format=\"%.2f\")})\n            st.caption(f\"緩勾配区間の傾きは {100 * cand.slope_slow:.2f} %B/min \"\n                       \"（基準のリニアと同じ）です。\")\n        else:\n            st.caption(\"急勾配区間なし（基準のリニアのまま）。\")\n\n    with st.expander(\"グラジエントプログラム\"):\n        mono(cand.gradient.table())\n        st.caption(\"緩勾配区間（溶出帯）: \"\n                   + \" / \".join(f\"{lo * 100:.0f}–{hi * 100:.0f} %B\"\n                                for lo, hi in cand.windows))\n\n    with st.expander(\"因子別の結果\"):\n        rows = robust_evaluation(comps, method, system)[\"rows\"]\n        st.dataframe(pd.DataFrame([{\n            \"条件\": r[\"label\"], \"最小 Rs\": r[\"Rs_min\"],\n            \"臨界ペア\": \" / \".join(r[\"critical\"]) if r[\"critical\"] else \"-\",\n            \"分析時間 [min]\": r[\"runtime\"],\n        } for r in rows]), width=\"stretch\", hide_index=True,\n            column_config={\"最小 Rs\": st.column_config.NumberColumn(format=\"%.2f\"),\n                           \"分析時間 [min]\": st.column_config.NumberColumn(\n                               format=\"%.1f\")})\n        st.caption(\"`nominal` が設定どおりの条件。`tD±` は装置のドウェル容量の\"\n                   \"差で、セグメント化したメソッドで最も影響が大きい因子です。\")\n\n\n# ----------------------------------------------------------------------\n# 4. 採用\n# ----------------------------------------------------------------------\ndef _adopted_segments(method):\n    \"\"\"採用条件がセグメント化由来なら、その緩勾配区間と急勾配区間を図に重ねる。\"\"\"\n    for p in (st.session_state.get(\"segments\") or []):\n        if (len(p.gradient.times) == len(method.gradient.times)\n                and np.allclose(p.gradient.times, method.gradient.times)):\n            return p.windows, p.zones\n    return None, None\n\n\ndef _stash(method: Method, label: str) -> None:\n    st.session_state[\"method\"] = method\n    st.session_state[\"method_label\"] = label\n    # 採用メソッドが変わったら、それに紐づく評価結果は捨てる\n    st.session_state[\"doe\"] = None\n    st.success(f\"採用しました: {label}\")\n\n\ndef _adopt(comps, system, rs_target) -> None:\n    st.header(\"4. 採用条件\")\n    ss = st.session_state\n    method = ss.get(\"method\")\n    if method is None:\n        st.info(\"上のどれかで「採用する」を押すか、出発点のまま進むなら\"\n                \"下のボタンを押してください。\")\n        base = _base_method(ss[\"cfg\"][\"flow\"], ss[\"cfg\"][\"temp\"])\n        if base is not None and st.button(\"基準条件をそのまま採用\"):\n            _stash(base, \"リニア（ページ 5 で選んだ条件）\")\n            st.rerun()\n        return\n\n    m = _metrics(comps, method, system, rs_target)\n    g = method.gradient\n    a, b, c, d = st.columns(4)\n    a.metric(\"最小 Rs\", f\"{m['Rs']:.2f}\",\n             delta=f\"目標 {rs_target:.1f}\", delta_color=\"off\")\n    b.metric(\"分析時間\", f\"{m['runtime']:.0f} 分\")\n    c.metric(\"最大圧力\", f\"{to_psi(m['pressure']['max_bar']):,.0f} psi\",\n             delta=f\"上限の {m['pressure']['fraction_of_limit']:.0%}\",\n             delta_color=\"off\")\n    d.metric(\"段数\", f\"{len(g.times) - 1}\",\n             help=\"グラジエントの区間数。1 ならリニアです。\")\n    st.caption(f\"**{ss.get('method_label', '')}**\")\n\n    if m[\"pressure\"][\"fraction_of_limit\"] > PRESSURE_LIMIT:\n        st.warning(f\"圧力が上限の {m['pressure']['fraction_of_limit']:.0%} です。\"\n                   \"見積もりは 2-3 割ずれるので余裕を見てください。\", icon=\"⚠️\")\n    if not m[\"ok\"]:\n        st.error(\"目標 Rs に届いていません。\", icon=\"🚨\")\n\n    mono(g.table())\n    # 図の中は英語で統一（matplotlib に日本語フォントが無い環境では\n    # 日本語が豆腐になるため。説明はキャプション側の日本語で担う）\n    _win, _zone = _adopted_segments(method)\n    show(plots.plot_method_profile(\n        m[\"res\"], windows=_win, zones=_zone,\n        title=\"Adopted method: %B and predicted peaks\"))\n    st.caption(\"背景が検出器で見える溶媒組成、手前が予測ピークです。\")\n    st.caption(\"次は「7. 頑健性評価・出力」で、装置差・設定誤差に耐えるかを\"\n               \"確かめてから出力します。\")\n\n\n# ----------------------------------------------------------------------\n# 採用条件のデザインスペース\n# ----------------------------------------------------------------------\nMAP_HELP = \"\"\"\nセグメント化した後は傾きが区間ごとに違うので、ページ 5 の「tG × T」では\n振れません（tG が 1 つに決まらない）。そこで**形はそのままに、全体の時間\nだけを伸縮させる**軸を取ります。\n\n見るのは「採用した点が崖の上にいないか」です。等高線が詰まっているところに\n乗っていたら、少しのずれで Rs が落ちます。平らなところを選んでください。\n\"\"\"\n\n\ndef _adopted_map(comps, system, rs_target) -> None:\n    st.header(\"5. 採用条件のデザインスペース\", help=MAP_HELP)\n    ss = st.session_state\n    method = ss.get(\"method\")\n    if method is None:\n        st.info(\"**上で条件を採用すると、その条件まわりの地図を描けます。**\",\n                icon=\"🗺️\")\n        return\n\n    focus = _focus_names(comps)\n    st.caption(\n        f\"採用条件（{method.gradient.duration:.1f} min / \"\n        f\"{method.temperature_C:.0f} ℃ / {method.flow_ml_min:.2f} mL/min、\"\n        f\"{len(method.gradient.times) - 1} 区間）を中心に、**全区間の傾きを\"\n        \"一律に伸縮**させた軸と温度で振ります。x 軸はその結果のグラジエント\"\n        \"時間です。\")\n\n    c1, c2, c3 = st.columns(3)\n    span = c1.slider(\"時間の幅 [倍]\", 1.2, 4.0, 2.0, 0.2,\n                     help=\"採用条件の何分の1〜何倍まで振るか。\")\n    dT = c2.slider(\"温度の幅 [℃]\", 5, 30, 15, 5)\n    n = c3.select_slider(\"格子の細かさ\", [9, 13, 17, 21], value=13)\n    plim = st.slider(\"圧力上限の使用率\", 0.60, 1.00, PRESSURE_LIMIT, 0.05,\n                     key=\"tune_map_plim\", format=\"%.2f\",\n                     help=\"これを超える点は図から抜きます（流せない条件を\"\n                          \"「分離が良い」と見せないため）。温度を下げると\"\n                          \"粘度が上がるので、低温側が削れます。\")\n\n    clicked, slot = busy_button(\"地図を描く\", key=\"tune_map_go\",\n                                help=\"格子の点ごとに数値積分します。数十秒。\")\n    if clicked:\n        bar = slot.progress(0.0, text=\"評価中…\")\n        scales = np.geomspace(1.0 / span, span, int(n))\n        T0 = method.temperature_C\n        Ts = np.linspace(max(T0 - dT, 5.0), T0 + dT, int(n))\n        ss[\"seg_map\"] = segment_map(\n            comps, method, system, scales, Ts, focus=focus,\n            rs_target=rs_target, pressure_limit=plim,\n            progress=lambda d, t: bar.progress(min(d / t, 1.0),\n                                               text=f\"評価中… {d}/{t}\"))\n        st.rerun()\n\n    rmap = ss.get(\"seg_map\")\n    if rmap is None:\n        return\n\n    i = int(np.argmin(np.abs(rmap.tG - method.gradient.duration)))\n    j = int(np.argmin(np.abs(rmap.T - method.temperature_C)))\n    show(plots.plot_resolution_map(\n        rmap, mark={\"tG\": float(rmap.tG[i]), \"T\": float(rmap.T[j]),\n                    \"Rs_min\": float(rmap.rs_min[j, i])},\n        title=\"Design space around the adopted method\"))\n\n    if rmap.pressure is not None and rmap.over_pressure.any():\n        st.caption(f\"白く抜けているところは圧力上限\"\n                   f\"（{rmap.pressure_limit_bar:.0f} bar）を超えて流せません。\")\n    ok = np.nan_to_num(rmap.rs_min, nan=-1.0) >= rs_target\n    here, nb = float(rmap.rs_min[j, i]), rmap.robust_rs(1)\n    near = float(nb[j, i])\n    a, b, c = st.columns(3)\n    a.metric(\"目標を満たす面積\", f\"{100 * ok.mean():.0f} %\",\n             help=\"描いた範囲のうち、目標 Rs を満たす格子点の割合。\"\n                  \"圧力を超える点は満たさない側に数えます。狭いほどシビア。\")\n    b.metric(\"採用点の Rs\", \"圧力超過\" if np.isnan(here) else f\"{here:.2f}\",\n             delta=f\"最大 {np.nanmax(rmap.rs_min):.2f}\", delta_color=\"off\")\n    c.metric(\"採用点の近傍最小 Rs\", \"—\" if np.isnan(near) else f\"{near:.2f}\",\n             delta=(\"圧力で削れた近傍あり\" if np.isnan(near)\n                    else f\"名目との差 {near - here:+.2f}\"),\n             delta_color=\"off\",\n             help=\"自分と周囲 1 マスの中で最も低い Rs。名目と大きく離れて\"\n                  \"いたら崖の上にいます。近傍に流せない点があると「—」。\")\n    if np.isnan(here):\n        st.warning(\"**採用点そのものが圧力上限を超えています。** 流速を下げるか\"\n                   \"温度を上げてください。\", icon=\"⚠️\")\n    elif np.isnan(near):\n        st.info(\"採用点は流せますが、**隣は圧力上限を超えます**。温度を下げる\"\n                \"余地がありません。\", icon=\"🌡️\")\n    elif near < rs_target <= here:\n        st.warning(\"採用点は目標を満たしていますが、**隣のマスは割っています**。\"\n                   \"平らなところへ動かすことを勧めます。\", icon=\"⚠️\")\n", "app/sections/width_page.py": "\"\"\"分散モデル推定（回帰②）\n\n保持の回帰（ページ 3）が Rs の**分子**を決めるのに対して、ここは**分母**を\n決めます。\n\n    Rs = |tR2 − tR1| / (2·(σ1 + σ2))\n\n分子だけ実測に合わせても、分母がカタログ値のままなら「Rs 2.0 が取れる」とは\n言えません。条件の優劣（どっちがマシか）は分子だけでも比べられますが、\n**目標に届くかどうかの判定**には分母の較正が要ります。\n\n決めるのは N・C・V_ext の 3 つ。詳しくは :mod:`lcmd.width` の冒頭。\n\n入力欄はありません\n------------------\n実測の半値幅はページ 2 から、kE と G はページ 3 のモデルから来ます。\n「隣とくっついていて幅が測れていない」点はページ 2 が印を付けて渡してくるので、\nここで自動的に外します（混ぜると N を 1 割以上小さく見積もります）。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom lcmd import fit_widths, rs_sensitivity\n\nfrom app.common import cond_df_to_runs, download_df, mono, show\n\nPAGE_HELP = \"\"\"\n実測のピーク幅から、**分離度の分母**にあたる 3 つを決めます（図の**回帰②**）。\n\n| 記号 | 意味 | 何が決めるか |\n|---|---|---|\n| N | 理論段数（基準流速） | ピークの細さそのもの |\n| C | van Deemter の C 項 | 流速を上げたとき N がどれだけ落ちるか |\n| V_ext | 装置分散 [µL] | 配管・セル・注入による広がり |\n\n$$\\\\sigma_{col} = \\\\frac{t_0 (1+k_E) G}{\\\\sqrt{N(F)}}, \\\\quad\n\\\\sigma_{ext} = \\\\frac{V_{ext}}{F}, \\\\quad\nw_{1/2} = 2.355\\\\sqrt{\\\\sigma_{col}^2 + \\\\sigma_{ext}^2}$$\n\n**k_E と G は実測できません**（保持モデルからしか出せません）。だから\n回帰① → 回帰② の順は動かせません。\n\"\"\"\n\nSPLIT_HELP = \"\"\"\nN と V_ext はどうやって分かれるのか。\n\nσ_col は (1+k_E) に比例し、σ_ext は k_E に依りません。**k_E の違う点が\n混ざっていれば 2 つは分かれます**。k_E は成分ごとにも、グラジエント時間を\n変えても動くので、ふつうのモデル構築ランなら自然に満たされます。\n\nC だけは別で、**流速を振らないと決まりません**。流速が 1 水準しかない\nデータでは、C を既定値に固定したうえでその旨を出します。\n\"\"\"\n\nEXCLUDE_HELP = \"\"\"\n半値幅が信用できない点は自動で外します。外す理由は 2 つだけ。\n\n- **谷どまり** … 隣のピークとくっついていて、半値の高さまで下がりきる前に\n  谷に当たっている。幅が本来より太く出ます\n- **純度低** … ピーク内でスペクトルが変化しており、共溶出やノイズを確認する必要があります\n\n外さずに当てはめると N を小さく見積もります（合成データで 21,000 → 18,300、\nずれ 24%）。**N を小さく見積もる＝分離度を悲観的に予測する**ので、\n本当は届く条件を「届かない」と判定してしまいます。\n\"\"\"\n\nCALIB_HELP = \"\"\"\n反映すると、ホームの装置設定（N・C・装置分散）が**実測からの推定値に変わります**。\n以降のページはこの値で分離度を予測します。残差や未測定条件での誤差は残るため、\n採用条件のRsは実測で確認してください（ホームの図の橙の系統が実線になります）。\n\n元のカタログ値に戻したいときは、ホームの「基準の装置とカラム」で\nプリセットを選び直してください。\n\"\"\"\n\n\ndef render(system, flow, temp, rs_target) -> None:\n    st.title(\"分散モデル推定\", help=PAGE_HELP)\n\n    got = _inputs()\n    if got is None:\n        return\n    comps, runs, widths, exclude = got\n\n    fit = _fit(comps, runs, system, widths, exclude)\n    if fit is None:\n        return\n\n    _summary(fit, system)\n    st.divider()\n    _check(fit)\n    st.divider()\n    _handoff(fit, system)\n\n\n# ----------------------------------------------------------------------\n# 入口\n# ----------------------------------------------------------------------\ndef _inputs():\n    ss = st.session_state\n    comps = ss.get(\"comps\")\n    if comps is None:\n        st.info(\"**「3. 保持モデル推定」でモデルを確定してください。**\\n\\n\"\n                \"ピーク幅の式に入る k_E と G は実測できず、保持モデルからしか\"\n                \"出せません。回帰① が先に要るのはそのためです。\", icon=\"📄\")\n        return None\n\n    widths = ss.get(\"width_obs\")\n    if not widths:\n        st.info(\"**「2. ピーク帰属」の「この成分を確定」を先に押してください。**\\n\\n\"\n                \"そこで渡した実測の半値幅がこのページの入力です。\", icon=\"📄\")\n        return None\n\n    try:\n        runs = cond_df_to_runs(ss.get(\"pda_cond\"))\n    except KeyError as e:  # noqa: BLE001\n        st.error(f\"ラン条件を読めませんでした: {e}\")\n        return None\n    if not runs:\n        st.error(\"ラン条件がありません。「2. ピーク帰属」の条件表を確認してください。\")\n        return None\n\n    exclude = {(str(a), str(b)) for a, b in (ss.get(\"width_exclude\") or [])}\n    return comps, runs, widths, exclude\n\n\n@st.cache_data(show_spinner=False, max_entries=4)\ndef _fit_cached(_comps, _runs, _system, _widths, _exclude, sig: str):\n    return fit_widths(_comps, _runs, _system, _widths, exclude=_exclude)\n\n\ndef _signature(comps, runs, system, widths, exclude) -> str:\n    parts = [f\"{n}:{a:.4f}:{b:.4f}:{c:.4f}:{d:.4f}\" for n, a, b, c, d\n             in zip(comps.names, comps.logkw0, comps.alpha, comps.S0, comps.beta)]\n    for rid in sorted(widths):\n        parts.append(rid + \"|\" + \",\".join(\n            f\"{k}={v:.5f}\" for k, v in sorted((widths[rid] or {}).items())\n            if v is not None and np.isfinite(v)))\n    for r in runs:\n        g, m = r.method.gradient, r.method\n        parts.append(f\"{r.run_id}|{g.duration:.4f}|{m.temperature_C:.3f}|\"\n                     f\"{m.flow_ml_min:.4f}\")\n    c = system.column\n    # dwell を忘れないこと。kE と G は tD に依存するので、ホームでドウェル\n    # 容量を変えたら当てはめ直しになる（無いと古い結果が出続ける）。\n    parts.append(f\"{c.length_mm}|{c.id_mm}|{c.particle_um}|{c.porosity}|\"\n                 f\"{system.dwell_volume_ml}\")\n    parts.append(\"x:\" + \",\".join(f\"{a}/{b}\" for a, b in sorted(exclude)))\n    return \"\\n\".join(parts)\n\n\ndef _fit(comps, runs, system, widths, exclude):\n    with st.spinner(\"当てはめています…\"):\n        try:\n            return _fit_cached(comps, runs, system, widths, exclude,\n                               _signature(comps, runs, system, widths, exclude))\n        except ValueError as e:  # 点が足りない\n            st.error(f\"当てはめられませんでした: {e}\")\n            st.caption(\"「2. ピーク帰属」で検出感度を上げるか、\"\n                       \"谷どまりのピークが多すぎないか確認してください。\")\n            return None\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"当てはめに失敗しました: {e}\")\n            return None\n\n\n# ----------------------------------------------------------------------\n# 1. 結果\n# ----------------------------------------------------------------------\ndef _summary(fit, system) -> None:\n    st.header(\"1. 推定値\", help=SPLIT_HELP)\n\n    col = system.column\n    vd = col.van_deemter\n    before = {\"N\": col.plates, \"C\": vd.C if vd else np.nan,\n              \"V\": system.sigma_ext_ul}\n\n    a, b, c, d = st.columns(4)\n    a.metric(\"N（理論段数）\", f\"{fit.plates:,.0f}\",\n             delta=_delta(fit.plates, before[\"N\"]), delta_color=\"normal\",\n             help=f\"基準流速 {fit.reference_flow:.2f} mL/min での値。\"\n                  f\"いままでの設定は {before['N']:,.0f} でした。\"\n                  \"装置分散を切り分けたぶん、カタログ値より大きく出るのが普通です。\")\n    if \"C\" in fit.fixed:\n        b.metric(\"C（流速の効き）\", f\"{fit.C:.4f}\", delta=\"固定\", delta_color=\"off\",\n                 help=\"流速が 1 水準しかないので推定できません。既定値のままです。\")\n    else:\n        b.metric(\"C（流速の効き）\", f\"{fit.C:.4f}\",\n                 delta=_delta(fit.C, before[\"C\"]), delta_color=\"off\",\n                 help=\"大きいほど、流速を上げたときに N が落ちます。\"\n                      \"速度を上げてよいかの判断はこの値で決まります。\")\n    c.metric(\"装置分散\", f\"{fit.sigma_ext_ul:.2f} µL\",\n             delta=_delta(fit.sigma_ext_ul, before[\"V\"]), delta_color=\"off\",\n             help=\"配管・セル・注入による広がり（σ として）。\"\n                  \"カタログのバンドスプレッド（5σ）と比べるなら 5 倍してください。\")\n    d.metric(\"予測との差\", f\"{fit.rms_percent:.1f} %\",\n             help=\"実測の半値幅と、当てはめた式の食い違い。\"\n                  \"5% 以内なら十分です。Rs の誤差もおおよそ同じ大きさになります。\")\n\n    se = fit.stderr\n    st.caption(\n        f\"標準誤差　N ± {se[0]:,.0f}　\"\n        + (\"C ± —　\" if not np.isfinite(se[1]) else f\"C ± {se[1]:.4f}　\")\n        + f\"装置分散 ± {se[2]:.2f} µL　|　使った点 {fit.n_points} 点\",\n        help=\"ヤコビアンからの近似です。データ点数が多いので普通は十分小さくなります。\")\n\n    rs_err = rs_sensitivity(fit)\n    if np.isfinite(rs_err):\n        st.success(\n            f\"**Rs の絶対値が信用できるようになりました。** N の不確かさから来る \"\n            f\"Rs のぶれは ±{rs_err:.1f}% です\"\n            f\"（較正前はカタログ値の当てずっぽうで ±10% 程度）。\", icon=\"✅\")\n\n    for n in fit.notes:\n        st.warning(n, icon=\"⚠️\")\n    if not fit.converged:\n        st.error(\"当てはめが収束しませんでした。値を使わないでください。\", icon=\"🚨\")\n\n\ndef _clamp(value: float, lo: float, hi: float, label: str, log: list) -> float:\n    v = float(np.clip(value, lo, hi))\n    if abs(v - float(value)) > 1e-9:\n        log.append(f\"{label} {value:,.4g} → {v:,.4g}\")\n    return v\n\n\ndef _delta(new, old):\n    if old is None or not np.isfinite(old) or old == 0:\n        return None\n    return f\"{100.0 * (new / old - 1.0):+.0f}%\"\n\n\n# ----------------------------------------------------------------------\n# 2. 当てはまりの確認\n# ----------------------------------------------------------------------\ndef _check(fit) -> None:\n    st.header(\"2. 適合度の確認\")\n\n    df = pd.DataFrame(fit.rows)\n    df[\"比\"] = df[\"w_obs\"] / df[\"w_pred\"]\n\n    st.caption(\n        \"**実測 ÷ 予測が 1.0 の周りに散らばっていれば良好**です。\"\n        \"特定の流速や k_E に偏っていたら、その軸のモデルが合っていません。\",\n        help=EXCLUDE_HELP)\n\n    show(_plot(df, fit))\n\n    g = df.groupby(\"flow\")[\"比\"]\n    by_flow = pd.DataFrame({\n        \"流速 [mL/min]\": g.mean().index,\n        \"データ点数\": g.size().values,\n        \"実測 ÷ 予測\": g.mean().values,\n        \"標準偏差\": g.std().fillna(0.0).values,\n    })\n    st.dataframe(by_flow, width=\"stretch\", hide_index=True,\n                 column_config={\n                     \"流速 [mL/min]\": st.column_config.NumberColumn(format=\"%.2f\"),\n                     \"実測 ÷ 予測\": st.column_config.NumberColumn(format=\"%.3f\"),\n                     \"標準偏差\": st.column_config.NumberColumn(format=\"%.3f\")})\n\n    # 流速ごとの偏り。単調なドリフトだけでなく、両端が同じ向きに浮く\n    # （U 字）形も拾います。h = A·ν^(1/3) + B/ν + C·ν のうち動かしているのは\n    # C だけなので、U 字が出たら「この装置では A・B も違う」という合図です。\n    off = float((by_flow[\"実測 ÷ 予測\"] - 1.0).abs().max())\n    if len(by_flow) >= 2 and off > 0.05:\n        st.warning(\n            f\"流速によって当てはまりが最大 {100 * off:.0f}% ずれています。\"\n            \"C だけでは流速依存を説明しきれていません（この装置では \"\n            \"A・B 項も既定値と違う）。流速を大きく変えた条件の Rs 予測は\"\n            \"そのぶん割り引いて見てください。\", icon=\"⚠️\")\n\n    worst = df.reindex(df[\"比\"].sub(1.0).abs().sort_values(ascending=False).index)\n    with st.expander(f\"残差の大きい点（{min(10, len(worst))} 件）\"):\n        st.caption(\"同じ成分が並ぶなら、その成分だけ N が違う（＝夾雑と\"\n                   \"重なっている）ことを疑ってください。同じランが並ぶなら\"\n                   \"そのランの条件を疑ってください。\")\n        st.dataframe(\n            worst.head(10)[[\"run_id\", \"component\", \"flow\", \"kE\",\n                            \"w_obs\", \"w_pred\", \"比\"]],\n            width=\"stretch\", hide_index=True,\n            column_config={\n                \"kE\": st.column_config.NumberColumn(format=\"%.2f\"),\n                \"w_obs\": st.column_config.NumberColumn(\"実測 w½\", format=\"%.4f\"),\n                \"w_pred\": st.column_config.NumberColumn(\"予測 w½\", format=\"%.4f\"),\n                \"比\": st.column_config.NumberColumn(format=\"%.3f\")})\n\n    with st.expander(\"全点を数値\"):\n        mono(fit.table())\n\n\ndef _plot(df, fit):\n    \"\"\"実測 vs 予測。流速ごとに色を変え、1:1 線を引く。\"\"\"\n    import matplotlib.pyplot as plt\n\n    fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(10.0, 4.2))\n    flows = sorted(df[\"flow\"].unique())\n    cmap = plt.get_cmap(\"viridis\")\n    for i, f in enumerate(flows):\n        m = df[\"flow\"] == f\n        c = cmap(i / max(len(flows) - 1, 1) * 0.85)\n        ax1.plot(df.loc[m, \"w_pred\"], df.loc[m, \"w_obs\"], \"o\", ms=4,\n                 color=c, label=f\"{f:.2f} mL/min\")\n        ax2.plot(df.loc[m, \"kE\"], df.loc[m, \"比\"], \"o\", ms=4, color=c)\n\n    lim = [0, float(max(df[\"w_pred\"].max(), df[\"w_obs\"].max())) * 1.05]\n    ax1.plot(lim, lim, \"k-\", lw=0.8)\n    ax1.set_xlim(lim)\n    ax1.set_ylim(lim)\n    ax1.set_xlabel(\"predicted w1/2 / min\")\n    ax1.set_ylabel(\"measured w1/2 / min\")\n    ax1.grid(alpha=0.25)\n    ax1.legend(fontsize=8)\n\n    ax2.axhline(1.0, color=\"k\", lw=0.8)\n    ax2.set_xlabel(\"kE  (elution retention factor)\")\n    ax2.set_ylabel(\"measured / predicted\")\n    ax2.grid(alpha=0.25)\n    ax2.set_title(f\"N = {fit.plates:,.0f},  V_ext = {fit.sigma_ext_ul:.2f} uL\")\n    fig.tight_layout()\n    return fig\n\n\n# ----------------------------------------------------------------------\n# 3. 確定\n# ----------------------------------------------------------------------\ndef _handoff(fit, system) -> None:\n    st.header(\"3. 装置設定への反映\", help=CALIB_HELP)\n\n    st.caption(\"反映すると、ホームの装置設定が実測からの推定値に変わります。\"\n               \"以降のページの分離度予測はこの値を使います。\")\n\n    now = st.session_state[\"cfg\"]\n    before = pd.DataFrame([\n        {\"項目\": \"理論段数 N\", \"いまの設定\": f\"{now['col_N']:,.0f}\",\n         \"実測から\": f\"{fit.plates:,.0f}\"},\n        {\"項目\": \"C（流速の効き）\", \"いまの設定\": f\"{now['vd_C']:.4f}\",\n         \"実測から\": f\"{fit.C:.4f}\" + (\"（固定）\" if \"C\" in fit.fixed else \"\")},\n        {\"項目\": \"装置分散 [µL]\", \"いまの設定\": f\"{now['sys_sig_ul']:.2f}\",\n         \"実測から\": f\"{fit.sigma_ext_ul:.2f}\"},\n    ])\n    st.dataframe(before, width=\"stretch\", hide_index=True)\n\n    if st.button(\"装置設定に反映\", type=\"primary\",\n                 disabled=not fit.converged):\n        # ホームのウィジェットが受け付ける範囲に収めます。範囲外の値を\n        # session_state に書くと、ホームを開いた瞬間に number_input が\n        # 丸めて cfg を上書きし、**较正した値が黙って消えます**（当てはめが\n        # 柵に張り付くような壊れたデータで実際に起きました）。\n        clamped = []\n        n_val = _clamp(fit.plates, 1000.0, 200_000.0, \"理論段数 N\", clamped)\n        v_val = _clamp(fit.sigma_ext_ul, 0.0, 200.0, \"装置分散\", clamped)\n        now[\"col_N\"] = n_val\n        now[\"sys_sig_ul\"] = v_val\n        now[\"sys_sig_mode\"] = True          # 容積で持つ（流速を変えても整合する）\n        now[\"vd_on\"] = True\n        if \"C\" not in fit.fixed:\n            now[\"vd_C\"] = _clamp(fit.C, 0.0, 1.0, \"C\", clamped)\n        if clamped:\n            st.warning(\n                \"推定値が設定の範囲を超えたので丸めました（\"\n                + \"／\".join(clamped)\n                + \"）。当てはめが破綻している可能性が高いので、\"\n                \"上の「当てはまりを確かめる」を見てください。\", icon=\"⚠️\")\n        # ウィジェット側の写しも更新しないと、ホームを開いた瞬間に\n        # 古い値で cfg が上書きされます（settings_editor は cfg → ウィジェット →\n        # cfg の順で回すため）。プリセット名も「手入力」に落とします。\n        st.session_state.update({\n            \"col_N\": now[\"col_N\"], \"sys_sig_ul\": now[\"sys_sig_ul\"],\n            \"sys_sig_mode\": True, \"vd_on\": True, \"vd_C\": now[\"vd_C\"],\n            \"preset_column\": \"手入力\", \"preset_instrument\": \"手入力\",\n            \"_preset_column_applied\": \"手入力\",\n            \"_preset_instrument_applied\": \"手入力\",\n        })\n        st.session_state[\"wfit\"] = fit\n        st.success(\"装置設定を実測値で置き換えました。\"\n                   \"ホームの図の橙の系統が「実測で較正済み」になります。\")\n\n    if st.session_state.get(\"wfit\") is not None:\n        w = st.session_state[\"wfit\"]\n        st.caption(f\"較正済み: N = {w.plates:,.0f}　C = {w.C:.4f}　\"\n                   f\"装置分散 = {w.sigma_ext_ul:.2f} µL\")\n        download_df(pd.DataFrame(w.rows), \"実測 vs 予測を CSV 保存\",\n                    \"width_fit.csv\")\n", "examples/demo_case.py": "\"\"\"デモ用のサンプルデータ（架空の 14 成分）\n\n実測データがまだ無い段階でツールの動作を確認するための、もっともらしい\nパラメータを持つ成分セットです。ここから合成した保持時間を「実測」として\n扱い、フィットで元のパラメータを復元できるかを見ます。\n\n**実在の試料ではありません。**\n\n真値の作り方\n------------\n各成分について「この組成で出てほしい」という Φe（溶出組成）と S を先に決め、\nlog k_w を逆算しました。\n\nここで一手間要ります。グラジエントでは、ピークは「k がだいたい k* になった\nところ」で出てきます。k* は勾配の急さで決まる量なので、\n\n    k*ᵢ = 1 / (1.15 · b),  b = t0·Sᵢ·ΔΦ/tG\n\nを基準条件（下の REF_*）で計算し、\n\n    log k_wᵢ = log10(k*ᵢ) + Sᵢ · Φeᵢ\n\nとすれば、基準条件でちょうど狙った Φe に出ます。「Φe で log k = 適当な定数」と\n置くやり方だと、k* を無視しているぶん実際の溶出組成が大きくずれます\n（S が成分ごとに違うため、ずれ方も成分ごとに違う）。\n\n意図的に仕込んである難所:\n\n- **analyte-A1 / A2**: Φe が 1.5 %B しか離れておらず、しかも β（S の温度係数）\n  がほぼ同じ。同族体や幾何異性体で実際に起きる「温度では解けないペア」です。\n- **impurity-D**: analyte-A2 のすぐ後ろに来るが S が大きく違う。\n  こちらは勾配の急さ（tG）で動かせます。\n- **impurity-G**: analyte-C1 のすぐ後ろ。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom lcmd import Column, ComponentSet, System, VanDeemter\n\n# デモの温度基準点。実験温度 30/45 ℃ の中心。\nT_REF = 37.5\n\n# 「狙った Φe に出る」ようにするための基準条件\nREF_TG = 40.0        # min\nREF_DELTA_PHI = 0.90  # 5 -> 95 %B\nREF_FLOW = 0.40       # mL/min\n\n# (name, tier, Phi_e 目標, S0, alpha=dlogkw/dT, beta=dS/dT)\n_SPEC = [\n    # --- Tier 1: 目的 6 成分 ---\n    (\"analyte-A1\", 1, 0.420, 3.70, -0.0200, -0.02050),\n    (\"analyte-A2\",  1, 0.435, 3.75, -0.0198, -0.02030),\n    (\"analyte-B1\",             1, 0.500, 4.30, -0.0215, -0.01800),\n    (\"analyte-A3\",         1, 0.515, 4.00, -0.0205, -0.02040),\n    (\"analyte-C1\",              1, 0.620, 4.80, -0.0225, -0.02400),\n    (\"analyte-B2\",            1, 0.655, 5.00, -0.0230, -0.02100),\n    # --- Tier 2: 追跡できた夾雑 ---\n    (\"impurity-A\", 2, 0.200, 3.20, -0.0180, -0.0170),\n    (\"impurity-B\", 2, 0.280, 3.50, -0.0190, -0.0190),\n    (\"impurity-C\", 2, 0.330, 3.40, -0.0185, -0.0160),\n    (\"impurity-D\", 2, 0.4405, 5.00, -0.0220, -0.0250),\n    (\"impurity-E\", 2, 0.5350, 4.50, -0.0210, -0.0195),\n    (\"impurity-F\", 2, 0.5750, 4.20, -0.0205, -0.0185),\n    (\"impurity-G\", 2, 0.6275, 4.00, -0.0195, -0.0155),\n    (\"impurity-H\", 2, 0.700, 5.20, -0.0240, -0.0230),\n]\n\n# ピーク面積の目安（クロマトグラム描画用。目的成分を 100 とする相対値）\nAREAS = {\n    \"analyte-A1\": 100.0, \"analyte-A2\": 45.0,\n    \"analyte-B1\": 100.0, \"analyte-A3\": 30.0,\n    \"analyte-C1\": 55.0, \"analyte-B2\": 40.0,\n    \"impurity-A\": 25.0, \"impurity-B\": 12.0, \"impurity-C\": 8.0, \"impurity-D\": 6.0,\n    \"impurity-E\": 15.0, \"impurity-F\": 9.0, \"impurity-G\": 4.0, \"impurity-H\": 18.0,\n}\n\n\ndef true_components() -> ComponentSet:\n    \"\"\"真値の ComponentSet を返す。\"\"\"\n    t0 = demo_system().t0(REF_FLOW)\n    recs = []\n    for name, tier, phie, S0, a, b in _SPEC:\n        b_steep = t0 * S0 * REF_DELTA_PHI / REF_TG\n        k_star = 1.0 / (1.15 * b_steep)\n        recs.append(\n            {\n                \"name\": name,\n                \"tier\": tier,\n                \"S0\": S0,\n                \"logkw0\": float(np.log10(k_star) + S0 * phie),\n                \"alpha\": a,\n                \"beta\": b,\n            }\n        )\n    return ComponentSet.from_records(recs, T_ref=T_REF)\n\n\ndef demo_system() -> System:\n    \"\"\"BEH C18 1.7 µm, 2.1 × 100 mm ＋ UHPLC 装置。\n\n    N と σ_ext は Phase 0 で実測した値を入れる場所です。ここではデモ用に\n    仕様書の目安（100 mm で 16,000-20,000）の真ん中を置いています。\n    \"\"\"\n    col = Column(\n        length_mm=100.0, id_mm=2.1, particle_um=1.7,\n        porosity=0.65, plates=18000.0, name=\"BEH C18\",\n        # 流速を上げたときの N の落ち方（Phase 4 で効く）。係数は sub-2 µm の\n        # 一般値。本来は Phase 0 で N を 3-4 流速測って当てはめる。\n        # None にすると N は流速によらず一定になる。\n        van_deemter=VanDeemter(A=1.0, B=2.0, C=0.05, reference_flow_ml_min=0.40),\n    )\n    return System(column=col, dwell_volume_ml=0.10,\n                  sigma_ext_min=0.006, max_pressure_bar=1000.0)\n\n\ndef areas_for(comps: ComponentSet) -> np.ndarray:\n    return np.array([AREAS.get(n, 10.0) for n in comps.names])\n\n\ndef synth_observations(comps, runs, system, noise_min: float = 0.006, seed: int = 7):\n    \"\"\"真値から「実測っぽい」保持時間を合成する。\n\n    noise_min はランごとのばらつき（標準偏差[min]）。既定 0.006 min ≒ 0.4 秒。\n    \"\"\"\n    from lcmd import simulate\n\n    rng = np.random.default_rng(seed)\n    obs: dict = {}\n    for r in runs:\n        res = simulate(comps, r.method, system, dt_frac=0.005)\n        for i, name in enumerate(comps.names):\n            if not res.eluted[i]:\n                continue\n            obs.setdefault(name, {})[r.run_id] = float(\n                res.tR[i] + rng.normal(0.0, noise_min)\n            )\n    tiers = {n: int(t) for n, t in zip(comps.names, comps.tier)}\n    return obs, tiers\n", "examples/synthetic_pda.py": "\"\"\"デモ用の「架空の PDA データ」を合成する\n\n実測の ARW が揃う前に、帰属（:mod:`lcmd.assign`）が正しく動くかを\n確かめるための道具です。:mod:`examples.demo_case` の真値から\n「3D クロマトグラム（時間 × 波長 × 吸光度）」を作ります。\n\nわざと難しくしてあること\n------------------------\n- **同じ群の成分はスペクトルをほぼ同一にしてある**。A 群の 3 本\n  （analyte-A1/A2/A3）と B 群の 2 本（analyte-B1/B2）は λmax も形も\n  そっくりです。同族体や幾何異性体では実際にそうなります。\n  スペクトルだけでは区別できないので、面積と溶出順が効いているか\n  どうかがここで試されます。\n- **移動相のドリフト**を入れてあります（有機溶媒が増えると 210 nm 付近の\n  吸収が上がる）。ベースラインを引かないと面積が滅茶苦茶になります。\n- ノイズとスパイクを入れてあります。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\n\nimport numpy as np\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom lcmd import simulate                                    # noqa: E402\nfrom lcmd.arw import PDAData                                 # noqa: E402\nfrom examples.demo_case import AREAS                        # noqa: E402\n\n# 成分ごとの UV スペクトル: (λmax, 幅, 相対強度) の重ね合わせ\n# 同族体・幾何異性体は同じ組を共有 = スペクトルでは区別できない\n_BANDS = {\n    \"groupA\":   [(232.0, 14.0, 0.55), (269.0, 13.0, 1.00), (280.0, 10.0, 0.72)],\n    \"groupB\":   [(220.0, 12.0, 0.90), (280.0, 16.0, 1.00)],\n    \"groupC\":   [(217.0, 11.0, 0.85), (225.0, 12.0, 0.60), (283.0, 17.0, 1.00)],\n    \"impA\":     [(214.0, 10.0, 1.00), (254.0, 18.0, 0.35)],\n    \"impB\":     [(210.0, 9.0, 1.00), (326.0, 22.0, 0.45)],\n    \"impC\":     [(243.0, 15.0, 1.00), (300.0, 20.0, 0.30)],\n    \"impD\":     [(268.0, 13.0, 1.00), (232.0, 14.0, 0.50)],   # A 群に似せる\n    \"impE\":     [(228.0, 13.0, 1.00), (275.0, 18.0, 0.55)],\n    \"impF\":     [(212.0, 11.0, 1.00)],\n    \"impG\":     [(281.0, 16.0, 1.00), (221.0, 12.0, 0.88)],   # B 群に似せる\n    \"impH\":     [(256.0, 17.0, 1.00), (215.0, 10.0, 0.70)],\n}\n\n_GROUP = {\n    \"analyte-A1\": \"groupA\",\n    \"analyte-A2\": \"groupA\",\n    \"analyte-A3\": \"groupA\",\n    \"analyte-B1\": \"groupB\",\n    \"analyte-B2\": \"groupB\",\n    \"analyte-C1\": \"groupC\",\n    \"impurity-A\": \"impA\", \"impurity-B\": \"impB\", \"impurity-C\": \"impC\", \"impurity-D\": \"impD\",\n    \"impurity-E\": \"impE\", \"impurity-F\": \"impF\", \"impurity-G\": \"impG\", \"impurity-H\": \"impH\",\n}\n\n\ndef spectrum_of(name: str, wl: np.ndarray) -> np.ndarray:\n    \"\"\"成分名から UV スペクトル（吸光度の形）を作る。\"\"\"\n    bands = _BANDS.get(_GROUP.get(name, \"impF\"), _BANDS[\"impF\"])\n    s = np.zeros_like(wl)\n    for lmax, width, amp in bands:\n        s += amp * np.exp(-0.5 * ((wl - lmax) / width) ** 2)\n    # 短波長側の裾（実際のスペクトルは 200 nm に向かって立ち上がる）\n    s += 0.30 * np.exp(-0.5 * ((wl - 200.0) / 12.0) ** 2)\n    return s\n\n\ndef synth_pda(comps, method, system, name: str,\n              wl_range=(200.0, 400.0), wl_step: float = 2.0,\n              dt_min: float = 0.004, tail: float = 1.5,\n              noise: float = 2e-5, drift: float = 0.02,\n              area_scale: float = 1.0, seed: int = 0,\n              spikes: int = 3) -> PDAData:\n    \"\"\"1 ラン分の 3D クロマトグラムを作る。\n\n    Parameters\n    ----------\n    area_scale : float\n        注入量のばらつきを模す全体倍率。\n    drift : float\n        グラジエントによるベースラインの持ち上がり [AU]。\n    \"\"\"\n    rng = np.random.default_rng(seed)\n    res = simulate(comps, method, system, dt_frac=0.005)\n\n    wl = np.arange(wl_range[0], wl_range[1] + 1e-9, wl_step)\n    t_end = max(method.gradient.duration + tail,\n                float(np.nanmax(np.where(res.eluted, res.tR, 0.0))) + tail)\n    t = np.arange(0.0, t_end, dt_min)\n    A = np.zeros((t.size, wl.size), dtype=float)\n\n    for i, nm in enumerate(res.names):\n        if not res.eluted[i]:\n            continue\n        area = AREAS.get(nm, 10.0) * area_scale * 1e-4\n        sg = max(float(res.sigma[i]), dt_min)\n        prof = np.exp(-0.5 * ((t - res.tR[i]) / sg) ** 2) / (sg * np.sqrt(2 * np.pi))\n        A += area * np.outer(prof, spectrum_of(nm, wl))\n\n    # 移動相のドリフト（%B が上がるほど短波長側が持ち上がる）\n    phi = np.array([method.gradient.phi(x - system.tD(method.flow_ml_min))\n                    for x in t])\n    A += drift * np.outer(phi, np.exp(-0.5 * ((wl - 200.0) / 18.0) ** 2))\n\n    # ボイドの溶媒ピーク（試料溶媒による大きな乱れ）\n    t0 = system.t0(method.flow_ml_min)\n    A += 0.35 * np.outer(\n        np.exp(-0.5 * ((t - t0) / (2.5 * dt_min * 8)) ** 2),\n        np.exp(-0.5 * ((wl - 205.0) / 15.0) ** 2),\n    )\n\n    A += rng.normal(0.0, noise, A.shape)\n    for _ in range(spikes):\n        k = rng.integers(0, t.size)\n        A[k] += rng.normal(0.0, 20 * noise, wl.size)\n\n    return PDAData(name=name, times=t, wavelengths=wl,\n                   absorbance=A.astype(np.float32),\n                   meta={\"サンプル名\": name}, source=f\"{name}.arw\")\n\n\ndef synth_run_set(comps, runs, system, **kwargs) -> dict:\n    \"\"\"モデル用ラン一式ぶんの PDA データを作る。{run_id: PDAData}\"\"\"\n    out = {}\n    for k, r in enumerate(runs):\n        out[r.run_id] = synth_pda(\n            comps, r.method, system, name=r.run_id, seed=100 + k,\n            area_scale=float(1.0 + 0.08 * np.sin(k * 1.7)),   # 注入量のばらつき\n            **kwargs,\n        )\n    return out\n\n\nif __name__ == \"__main__\":\n    from lcmd import Run\n    from lcmd.arw import write_arw_3d\n    from examples.demo_case import demo_system, true_components\n\n    outdir = os.path.join(os.path.dirname(os.path.abspath(__file__)),\n                          \"output_arw\")\n    os.makedirs(outdir, exist_ok=True)\n    comps, system = true_components(), demo_system()\n    runs = [Run.linear(f\"tG{int(tG)}_T{int(T)}\", 0.05, 0.95, tG, T, 0.40)\n            for tG in (20.0, 40.0, 80.0) for T in (30.0, 45.0)]\n    for rid, pda in synth_run_set(comps, runs, system).items():\n        path = os.path.join(outdir, f\"{rid}.arw\")\n        write_arw_3d(path, pda)\n        print(f\"{path}  {pda.summary()}\")\n    print(\"\\nこのフォルダを『ピーク帰属』ページに読み込ませると一通り試せます。\")\n", "app/assets/pipeline.svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 735\" width=\"900\" height=\"735\"\n     font-family=\"Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif\"\n     id=\"lcpipe\" role=\"img\" aria-label=\"モデル用ランから分離度予測までの計算の流れ\">\n  <defs>\n    <marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\"\n            markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"currentColor\" fill-opacity=\"0.55\"/>\n    <\/marker>\n  <\/defs>\n\n  <style>\n    /* 進捗の 3 状態は app/sections/home.py が CSS を追記して上書きします。\n       ここでの既定は「全部が有効」。図を単体で開いたときに全体が見えるように。\n       このブロック内にタグを書かないこと（画像として読むとき XML 厳密解析で落ちる）。 */\n    #lcpipe .stage { opacity: 1; }\n    #lcpipe .box { stroke-width: 1.5; }\n    #lcpipe .ret { stroke: #3b82f6; fill: #3b82f6; fill-opacity: 0.09; }\n    #lcpipe .wid { stroke: #e0851f; fill: #e0851f; fill-opacity: 0.10; }\n    #lcpipe .neu { stroke: currentColor; stroke-opacity: 0.38; fill: currentColor; fill-opacity: 0.05; }\n    #lcpipe .out { stroke: #16a34a; fill: #16a34a; fill-opacity: 0.11; stroke-width: 2; }\n    #lcpipe .t { fill: currentColor; }\n    #lcpipe .hd { font-size: 15px; font-weight: 700; }\n    #lcpipe .sub { font-size: 13px; fill-opacity: 0.8; }\n    #lcpipe .eq { font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }\n    #lcpipe .lbl { font-size: 12.5px; font-weight: 700; fill-opacity: 0.75; }\n    #lcpipe .note { font-size: 12px; fill-opacity: 0.62; }\n    #lcpipe .flow { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.6; fill: none; }\n  <\/style>\n\n  <!-- ============ モデル用ラン ============ -->\n  <g class=\"stage s-runs\">\n    <rect class=\"box neu\" x=\"250\" y=\"16\" width=\"400\" height=\"52\" rx=\"8\"/>\n    <text class=\"t hd\"  x=\"450\" y=\"38\" text-anchor=\"middle\">モデル構築ラン<\/text>\n    <text class=\"t sub\" x=\"450\" y=\"57\" text-anchor=\"middle\">グラジエント時間 × 温度 × 流速<\/text>\n  <\/g>\n\n  <path class=\"flow\" d=\"M450 68 L450 100\" marker-end=\"url(#ah)\"/>\n  <text class=\"t note\" x=\"460\" y=\"88\">ピーク帰属<\/text>\n\n  <!-- ============ 実測値 ============ -->\n  <g class=\"stage s-data\">\n    <rect class=\"box neu\" x=\"150\" y=\"100\" width=\"600\" height=\"58\" rx=\"8\"/>\n    <text class=\"t hd\"  x=\"450\" y=\"123\" text-anchor=\"middle\">実測値（成分 × ラン）<\/text>\n    <text class=\"t sub\" x=\"450\" y=\"143\" text-anchor=\"middle\">各ピークの tR と w½<\/text>\n  <\/g>\n\n  <path class=\"flow\" d=\"M300 158 L235 182 L235 190\" marker-end=\"url(#ah)\"/>\n  <text class=\"t lbl\" x=\"196\" y=\"180\" fill=\"#3b82f6\">tR<\/text>\n  <path class=\"flow\" d=\"M620 158 L665 182 L665 356\" marker-end=\"url(#ah)\"/>\n  <text class=\"t lbl\" x=\"676\" y=\"186\" fill=\"#e0851f\">w½<\/text>\n\n  <!-- ============ 左列：保持の系統 ============ -->\n  <g class=\"stage s-ret\">\n    <rect class=\"box ret\" x=\"70\" y=\"190\" width=\"330\" height=\"46\" rx=\"8\"/>\n    <text class=\"t hd\" x=\"235\" y=\"219\" text-anchor=\"middle\">回帰①　保持モデル<\/text>\n\n    <path class=\"flow\" d=\"M235 236 L235 260\" marker-end=\"url(#ah)\"/>\n\n    <rect class=\"box ret\" x=\"70\" y=\"260\" width=\"330\" height=\"66\" rx=\"8\"/>\n    <text class=\"t hd\"  x=\"235\" y=\"284\" text-anchor=\"middle\">保持 4 パラメータ<\/text>\n    <text class=\"t eq\"  x=\"235\" y=\"308\" text-anchor=\"middle\">log k_w0 ・ α ・ S0 ・ β<\/text>\n\n    <path class=\"flow\" d=\"M235 326 L235 356\" marker-end=\"url(#ah)\"/>\n\n    <rect class=\"box ret\" x=\"70\" y=\"356\" width=\"330\" height=\"68\" rx=\"8\"/>\n    <text class=\"t hd\" x=\"235\" y=\"379\" text-anchor=\"middle\">保持モデル<\/text>\n    <text class=\"t eq\" x=\"235\" y=\"401\" text-anchor=\"middle\">log k(Φ,T) =<\/text>\n    <text class=\"t eq\" x=\"235\" y=\"417\" text-anchor=\"middle\">(log k_w0 + αΔT) − (S0 + βΔT)·Φ<\/text>\n\n    <path class=\"flow\" d=\"M235 424 L235 452\" marker-end=\"url(#ah)\"/>\n\n    <rect class=\"box ret\" x=\"70\" y=\"452\" width=\"330\" height=\"64\" rx=\"8\"/>\n    <text class=\"t hd\"  x=\"235\" y=\"475\" text-anchor=\"middle\">任意条件の数値積分<\/text>\n    <text class=\"t sub\" x=\"235\" y=\"497\" text-anchor=\"middle\">→ tR 予測 ・ kE ・ G<\/text>\n  <\/g>\n\n  <!-- 保持モデル → 回帰②（実測できない量の受け渡し） -->\n  <path class=\"flow\" d=\"M400 388 L500 388\" marker-end=\"url(#ah)\" stroke-dasharray=\"5 4\"/>\n  <text class=\"t lbl\" x=\"450\" y=\"379\" text-anchor=\"middle\">kE・G<\/text>\n\n  <!-- 数値積分 → σ（新条件の kE・G） -->\n  <path class=\"flow\" d=\"M400 496 L470 496 L470 545 L500 545\" marker-end=\"url(#ah)\"\n        stroke-dasharray=\"5 4\"/>\n  <text class=\"t lbl\" x=\"446\" y=\"520\" text-anchor=\"middle\">kE・G<\/text>\n\n  <!-- ============ 右列：幅の系統 ============ -->\n  <g class=\"stage s-wid\">\n    <rect class=\"box wid\" x=\"500\" y=\"356\" width=\"330\" height=\"56\" rx=\"8\"/>\n    <text class=\"t hd\"  x=\"665\" y=\"379\" text-anchor=\"middle\">回帰②　分散モデル<\/text>\n    <text class=\"t sub\" x=\"665\" y=\"399\" text-anchor=\"middle\">グラジエント時間で N・V_ext、流速で C<\/text>\n\n    <path class=\"flow\" d=\"M665 412 L665 436\" marker-end=\"url(#ah)\"/>\n\n    <rect class=\"box wid\" x=\"500\" y=\"436\" width=\"330\" height=\"66\" rx=\"8\"/>\n    <text class=\"t hd\" x=\"665\" y=\"460\" text-anchor=\"middle\">分散 3 パラメータ<\/text>\n    <text class=\"t eq\" x=\"665\" y=\"484\" text-anchor=\"middle\">N ・ C ・ V_ext<\/text>\n\n    <path class=\"flow\" d=\"M665 502 L665 530\" marker-end=\"url(#ah)\"/>\n\n    <rect class=\"box wid\" x=\"500\" y=\"530\" width=\"330\" height=\"72\" rx=\"8\"/>\n    <text class=\"t hd\" x=\"665\" y=\"552\" text-anchor=\"middle\">ピーク幅 σ の予測<\/text>\n    <text class=\"t eq\" x=\"665\" y=\"573\" text-anchor=\"middle\">σ_col = t0(1+kE)G / √N<\/text>\n    <text class=\"t eq\" x=\"665\" y=\"591\" text-anchor=\"middle\">σ = √(σ_col² + σ_ext²)<\/text>\n  <\/g>\n\n  <!-- ============ 合流 → Rs ============ -->\n  <path class=\"flow\" d=\"M235 516 L235 656 L250 656\" marker-end=\"url(#ah)\"/>\n  <text class=\"t lbl\" x=\"246\" y=\"612\" fill=\"#3b82f6\">tR 予測<\/text>\n\n  <path class=\"flow\" d=\"M665 602 L665 656 L650 656\" marker-end=\"url(#ah)\"/>\n  <text class=\"t lbl\" x=\"678\" y=\"634\" fill=\"#e0851f\">σ 予測<\/text>\n\n  <g class=\"stage s-out\">\n    <rect class=\"box out\" x=\"250\" y=\"626\" width=\"400\" height=\"60\" rx=\"8\"/>\n    <text class=\"t hd\" x=\"450\" y=\"650\" text-anchor=\"middle\">分離度の予測<\/text>\n    <text class=\"t eq\" x=\"450\" y=\"673\" text-anchor=\"middle\">Rs = |tR₂ − tR₁| / (2·(σ₁ + σ₂))<\/text>\n  <\/g>\n\n  <text class=\"t note\" x=\"450\" y=\"714\" text-anchor=\"middle\">\n    破線 ＝ 実測できない量。kE（溶出時の保持係数）と G（バンド圧縮係数）はモデル経由でしか出ないため、回帰② は回帰① の後にしか行えません。\n  <\/text>\n<\/svg>\n", "app/assets/style.css": "/* =====================================================================\n   アプリ全体の見た目（唯一のスタイル定義）—「ペーパー＆インク」\n\n   白と墨（#111827）だけで組む。色を使っていいのはデータ側\n   （グラフ・アラート・ホームの全体図）だけ。装飾のグラデーション・\n   影・光沢は使わない。強弱は太さ（罫線・ウェイト）で付ける。\n\n   読み込みは app/common.py の inject_style()（入口で毎 run 当たる）。\n   色の基礎値は .streamlit/config.toml（ローカル）と tools/build_stlite.py の\n   streamlitConfig（ブラウザ単体版）にも同じ値を置いてある。墨色 #111827 は\n   3 か所で一致していることをテストが見張る。\n\n   Streamlit の DOM は data-testid で当てる。ここのセレクタが古くなると\n   「エラーは出ずに、ただ素の見た目に戻る」ので、見た目を触ったら必ず\n   ブラウザで目視すること。\n   ===================================================================== */\n\n:root {\n  --ink:        #111827;\n  --ink-soft:   #6B7280;\n  --line:       #E5E7EB;\n  --line-strong:#D1D5DB;\n  --paper:      #FFFFFF;\n  --paper-soft: #FAFAFA;\n  --radius:     .375rem;\n}\n\n/* ------------------------------------------------------------------ */\n/* タイポグラフィ                                                      */\n/* ------------------------------------------------------------------ */\n.stApp {\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\",\n               \"Hiragino Sans\", \"Yu Gothic UI\", \"Noto Sans JP\", sans-serif;\n  font-feature-settings: \"palt\";        /* 和文の詰め */\n}\n.stApp * { font-variant-numeric: tabular-nums; }   /* 数字の桁を揃える */\n\n[data-testid=\"stMain\"] h1 { font-weight: 700; letter-spacing: -0.015em; }\n[data-testid=\"stMain\"] h2 { font-weight: 700; letter-spacing: -0.01em; }\n[data-testid=\"stMain\"] h3 { font-weight: 600; }\n\n[data-testid=\"stMain\"] hr { margin: 1.5rem 0; border-color: var(--line); }\n\n/* ------------------------------------------------------------------ */\n/* サイドバー：白＋ヘアライン                                          */\n/* ------------------------------------------------------------------ */\n[data-testid=\"stSidebar\"] {\n  background: var(--paper);\n  border-right: 1px solid var(--line);\n}\n[data-testid=\"stSidebar\"] h1 {\n  color: var(--ink); font-size: 1.05rem; font-weight: 700;\n  letter-spacing: .01em; padding-bottom: .1rem;\n}\n/* ブランドの短い墨ルール（サイドバーの題字の下） */\n.brand-rule {\n  width: 2.4rem; height: 2px; margin: .15rem 0 1rem 0;\n  background: var(--ink);\n}\n[data-testid=\"stSidebar\"] [data-testid=\"stCaptionContainer\"] p {\n  color: #9CA3AF !important; font-size: .72rem; line-height: 1.45;\n}\n\n/* --- ナビ（radio をナビ項目に見せる） ---\n   radio の内部 DOM は Streamlit の版で違う（ローカル 1.61 と stlite 同梱版）:\n     1.61  : label[stRadioOption] > span(input) + div > [div>div>div(丸)+本文, 説明]\n     stlite: label > div(丸) + input + div > [本文, 説明]\n   どちらでも「サイドバーの radiogroup 直下の label」がナビ項目、\n   本文は stMarkdownContainer。丸ぽちは下の 3 本のセレクタで両方消える。 */\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] {\n  display: flex; flex-direction: column; gap: .1rem;\n}\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] > label {\n  margin: 0; padding: .5rem .7rem;\n  border-radius: 0; cursor: pointer;\n  box-shadow: inset 2px 0 0 transparent;\n  transition: background .12s ease;\n}\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] > label:hover {\n  background: #F7F7F8;\n}\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] > label:has(input:checked) {\n  box-shadow: inset 2px 0 0 var(--ink);\n}\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] > label > div:not(:last-child),\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] > label > span,\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] > label\n  > div:last-child > div:first-child > div:first-child { display: none; }\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] > label\n  [data-testid=\"stMarkdownContainer\"] p {\n  color: var(--ink-soft); font-weight: 500; font-size: .86rem;\n}\n[data-testid=\"stSidebar\"] div[role=\"radiogroup\"] > label:has(input:checked)\n  [data-testid=\"stMarkdownContainer\"] p {\n  color: var(--ink); font-weight: 700;\n}\n\n/* ------------------------------------------------------------------ */\n/* メトリクス：上罫の墨ライン                                          */\n/* ------------------------------------------------------------------ */\n[data-testid=\"stMetric\"] {\n  background: var(--paper-soft);\n  border-top: 2px solid var(--ink);\n  border-radius: 0;\n  padding: .8rem 1rem .7rem;\n}\n[data-testid=\"stMetricLabel\"] p {\n  font-size: .75rem; font-weight: 600; color: var(--ink-soft);\n}\n[data-testid=\"stMetricValue\"] { font-weight: 700; letter-spacing: -.01em; }\n[data-testid=\"stMetricDelta\"] { font-weight: 600; }\n\n/* ------------------------------------------------------------------ */\n/* ボタン：墨のソリッド                                                */\n/* ------------------------------------------------------------------ */\nbutton[kind=\"primary\"], [data-testid=\"stBaseButton-primary\"] {\n  background: var(--ink); border: none; font-weight: 600;\n  transition: background .12s ease;\n}\nbutton[kind=\"primary\"]:hover, [data-testid=\"stBaseButton-primary\"]:hover {\n  background: #1F2937;\n}\nbutton[kind=\"secondary\"], [data-testid=\"stBaseButton-secondary\"] {\n  border: 1px solid var(--line-strong); background: var(--paper);\n  font-weight: 600; transition: border-color .12s ease;\n}\nbutton[kind=\"secondary\"]:hover, [data-testid=\"stBaseButton-secondary\"]:hover {\n  border-color: var(--ink);\n}\n\n/* ------------------------------------------------------------------ */\n/* タブ・折りたたみ                                                    */\n/* ------------------------------------------------------------------ */\nbutton[data-baseweb=\"tab\"] { font-weight: 600; color: var(--ink-soft); }\nbutton[data-baseweb=\"tab\"][aria-selected=\"true\"] { color: var(--ink); }\n[data-baseweb=\"tab-highlight\"] { background: var(--ink); height: 2px; }\n[data-baseweb=\"tab-border\"] { background: var(--line); }\n\n[data-testid=\"stExpander\"] details {\n  border: 1px solid var(--line); border-radius: var(--radius);\n  background: var(--paper);\n}\n[data-testid=\"stExpander\"] summary { font-weight: 600; }\n\n/* ------------------------------------------------------------------ */\n/* 入力まわり                                                          */\n/* ------------------------------------------------------------------ */\n[data-testid=\"stFileUploaderDropzone\"] {\n  border: 1.5px dashed var(--line-strong); background: var(--paper-soft);\n  border-radius: var(--radius);\n}\n\n[data-testid=\"stAlert\"], [data-testid=\"stAlertContainer\"] {\n  border-radius: var(--radius);\n}\n", "examples/__init__.py": ""}</script>
<script type="module">
import { mount } from
  "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

const files = JSON.parse(document.getElementById("py-files").textContent);
mount(
  {
    requirements: ["numpy", "scipy", "pandas", "matplotlib"],
    entrypoint: "app/streamlit_app.py",
    files: files,
    streamlitConfig: {
      "server.maxUploadSize": 400,
      "theme.base": "light",
      "theme.primaryColor": "#111827",
      "theme.backgroundColor": "#FFFFFF",
      "theme.secondaryBackgroundColor": "#F7F7F8",
      "theme.textColor": "#111827",
      "theme.linkColor": "#111827",
      "theme.codeBackgroundColor": "#FAFAFA",
      "theme.baseRadius": "0.375rem",
      "theme.borderColor": "#E5E7EB",
      "client.toolbarMode": "minimal",
    },
  },
  document.getElementById("root"),
);
</script>
