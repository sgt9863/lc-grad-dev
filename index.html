c(\"全ランで見つかった\", n_full)\n    c.metric(\"要確認\", len(review))\n    d.metric(\"基準ラン\", rep.reference)\n\n    st.subheader(\"成分 × ラン 一覧\", help=MATRIX_HELP)\n    w_used = _weights_used()\n    tabs_ui = st.tabs([\"保持時間 [min]\", \"面積\", \"コサイン類似度\",\n                       \"一致スコア\", \"半値幅 [min]\"])\n    with tabs_ui[0]:\n        st.dataframe(_matrix_df(rep, \"tR\", cov), width=\"stretch\",\n                     hide_index=True)\n    with tabs_ui[1]:\n        st.dataframe(_matrix_df(rep, \"area\", cov), width=\"stretch\",\n                     hide_index=True,\n                     column_config={rid: st.column_config.NumberColumn(\n                         format=\"%.4g\") for rid in rep.runs})\n    with tabs_ui[2]:\n        st.caption(\"基準ランのスペクトルとの一致度。1.0 が完全一致で、\"\n                   \"0.99 を下回るあたりから別物の疑いが出ます\"\n                   \"（基準ラン自身は 1.0 固定）。\")\n        st.dataframe(\n            _matrix_df(rep, \"similarity\", cov), width=\"stretch\",\n            hide_index=True,\n            column_config={rid: st.column_config.NumberColumn(format=\"%.4f\")\n                           for rid in rep.runs})\n    with tabs_ui[3]:\n        _score_tab(rep, cov, w_used)\n    with tabs_ui[4]:\n        st.caption(\"`*` が付いた対応は谷にぶつかって半値幅が測れていません\"\n                   \"（隣とくっついている）。\")\n        st.dataframe(\n            _matrix_df(rep, \"width_half\", cov), width=\"stretch\",\n            hide_index=True,\n            column_config={rid: st.column_config.NumberColumn(format=\"%.4f\")\n                           for rid in rep.runs})\n\n    download_df(_long_df(rep, w_used), \"一覧を CSV 保存\",\n                \"assignment.csv\",\n                help=\"成分 × ラン ごとに 保持時間・面積・類似度・半値幅 と、\"\n                     \"スコアの内訳を縦持ちで書き出します。\")\n\n    for n in rep.notes:\n        st.caption(f\"ℹ️ {n}\")\n\n    _review(rep, review)\n\n    st.subheader(\"溶出順の一覧\",\n                 help=\"線が交差していれば溶出順が入れ替わっています。\"\n                      \"点が抜けている所はそのランで見つからなかったピークです。\")\n    show(plots.plot_assignment(rep))\n\n    st.subheader(\"同一帰属ピークのスペクトル\",\n                 help=\"帰属が正しければ全ランのスペクトルが正確に重なります。\"\n                      \"1 本だけ形が違えば、そのランの帰属を疑ってください。\")\n    pick = st.selectbox(\"成分\", rep.labels, key=\"spec_label\")\n    show(plots.plot_label_spectra(rep, tables, pick))\n\n    st.divider()\n    _targets(rep)\n\n    st.divider()\n    _handoff(rep)\n\n\nTARGET_HELP = \"\"\"\n帰属できたピークのうち、**どれを分離の対象にするか**を選んで名前をつけます。\n\n- **対象成分（Tier 1）** … 分けたい成分。以降のページで「分離度が目標に届くか」を\n  判定する主役になります\n- **Tier 2** … 目的成分の近くにいる、または面積が大きい夾雑。分離度の計算には\n  入りますが、目標そのものではありません\n- **Tier 3** … それ以外。計算から外します\n\n選ばなかったピークの Tier は、面積と目的成分との距離から自動でつきます。\n帰属が終わったあとに選ぶ形にしているのは、**全ランでの挙動（何本で見つかったか、\nスペクトルがそろっているか）を見てから決められる**ようにするためです。\n\"\"\"\n\n\ndef _targets(rep) -> None:\n    st.header(\"7. 対象成分の選択\", help=TARGET_HELP)\n\n    ref_tb = st.session_state[\"ptables\"][rep.reference]\n    cov = rep.coverage()\n    tr = rep.value_matrix(\"tR\")\n    by_label = {p.label: p for p in ref_tb.peaks}\n    total = ref_tb.total_area() or 1.0\n\n    rows = []\n    for lab in rep.labels:\n        vals = [v for v in tr[lab].values() if v is not None]\n        p = by_label.get(lab)\n        rows.append({\n            \"ピーク\": lab,\n            \"分離対象\": False,\n            \"名前\": lab,\n            \"平均 tR\": round(float(np.mean(vals)), 3) if vals else None,\n            \"面積%\": round(100.0 * p.area / total, 2) if p else None,\n            \"λmax\": round(p.lambda_max, 1) if p else None,\n            \"検出ラン数\": int(cov[lab]),\n        })\n    df = pd.DataFrame(rows).sort_values(\"平均 tR\", na_position=\"last\")\n    df = df.reset_index(drop=True)\n\n    prev = st.session_state.get(\"peak_targets\")\n    if prev is not None and set(prev[\"ピーク\"]) == set(df[\"ピーク\"]):\n        keep = prev.set_index(\"ピーク\")\n        df[\"分離対象\"] = [bool(keep.loc[k, \"分離対象\"]) for k in df[\"ピーク\"]]\n        df[\"名前\"] = [str(keep.loc[k, \"名前\"]) for k in df[\"ピーク\"]]\n\n    edited = st.data_editor(\n        df, width=\"stretch\", hide_index=True, key=\"target_editor\",\n        disabled=[\"ピーク\", \"平均 tR\", \"面積%\", \"λmax\", \"検出ラン数\"],\n        column_config={\n            \"分離対象\": st.column_config.CheckboxColumn(\n                \"分離対象\", help=\"分けたい成分にチェックを入れてください\"),\n            \"名前\": st.column_config.TextColumn(\n                \"名前\", help=\"化合物名など。空にするとピーク番号のままになります\"),\n            \"平均 tR\": st.column_config.NumberColumn(format=\"%.3f\"),\n            \"検出ラン数\": st.column_config.NumberColumn(\n                help=\"全ランのうち何本で見つかったか。少ないものは\"\n                     \"モデル推定に使えません\"),\n        },\n    )\n    st.session_state[\"peak_targets\"] = edited\n    targets = [r[\"ピーク\"] for _, r in edited.iterrows() if bool(r[\"分離対象\"])]\n    # Tier は _tiers() が選択から計算します（6 の一覧と同じ関数を通すため）\n    st.session_state[\"peak_tiers\"] = tiers = _tiers(rep)\n\n    names = [str(r[\"名前\"]).strip() for _, r in edited.iterrows()\n             if bool(r[\"分離対象\"]) and str(r[\"名前\"]).strip()]\n    if len(set(names)) != len(names):\n        st.error(\"分離対象の名前が重複しています。\", icon=\"🚨\")\n\n    n1 = sum(1 for v in tiers.values() if v == 1)\n    n2 = sum(1 for v in tiers.values() if v == 2)\n    n3 = sum(1 for v in tiers.values() if v == 3)\n    a, b, c = st.columns(3)\n    a.metric(\"対象成分（Tier 1）\", n1)\n    b.metric(\"追跡夾雑（Tier 2）\", n2,\n             help=\"目的成分の最大面積の 1/100 以上、または目的成分の \"\n                  \"±0.2 min 以内にいるもの\")\n    c.metric(\"対象外（Tier 3）\", n3)\n\n    if not targets:\n        st.warning(\"分離対象がまだ選ばれていません。少なくとも 2 つ選んでください。\",\n                   icon=\"⚠️\")\n    elif len(targets) < 2:\n        st.warning(\"分離対象が 1 つだけです。分離度は成分どうしの間隔なので、\"\n                   \"2 つ以上ないと評価できません。\", icon=\"⚠️\")\n    else:\n        thin = [t for t in targets if cov[t] < 4]\n        if thin:\n            st.warning(f\"検出されたラン数が 4 本未満の分離対象があります\"\n                       f\"（{', '.join(thin)}）。4 パラメータを決めるには\"\n                       \"最低 4 点必要です。\", icon=\"⚠️\")\n\n\ndef _target_names() -> dict:\n    \"\"\"ピーク番号 → ユーザーがつけた名前。選んでいなければ空。\"\"\"\n    sel = st.session_state.get(\"peak_targets\")\n    if sel is None:\n        return {}\n    return {r[\"ピーク\"]: (str(r[\"名前\"]).strip() or str(r[\"ピーク\"]))\n            for _, r in sel.iterrows()}\n\n\n# 機械が付けるフラグ → 人に見せる言葉と、何をすればいいか。\n# もとのフラグ名（「僅差」「margin」など）は中身を知らないと意味が取れないので、\n# ここで日本語の説明に置き換えます。\nFLAG_TEXT = {\n    \"僅差\": (\"2 番手とほぼ同点\", \"この前後をクロマトグラムで見る\"),\n    \"低類似度\": (\"スペクトルが合わない\", \"別の成分を拾っているかも\"),\n    \"面積不一致\": (\"面積が 3 倍以上ちがう\", \"隣と重なって削られたか、別のピーク\"),\n    \"純度低\": (\"ピークが純粋でない\", \"夾雑と重なっている。面積と幅は当てにならない\"),\n    \"幅が谷どまり\": (\"隣とくっついている\", \"半値幅が測れていない。幅の計算には不向き\"),\n    \"順序入替の疑い\": (\"酷似なピークが余っている\", \"そちらが正解でないか見比べる\"),\n    \"順序入替\": (\"溶出順が入れ替わった\", \"同族体の取り違えでないか確かめる\"),\n    \"未検出\": (\"そのランで見つからなかった\", \"感度を上げるか、重なりを疑う\"),\n}\n\nSWAP_NOTE = \"\"\"\n\nこのツールは**溶出順の入れ替わりを許して**対応づけます（温度や勾配時間を\n振れば順序は実際に変わるため）。そのぶん、**スペクトルが酷似な同族体を\n取り違える**可能性がここに集まります。\n\n「数値」の「不採用候補の tR」も併せて確認してください。\n機械が採らなかった、ほぼ同じスペクトルのピークです。そちらが正解なら、\n面積か保持時間の手がかりが効いていません。\n\"\"\"\n\n\ndef _review(rep, review) -> None:\n    \"\"\"目で確かめるべき対応だけを、平たい言葉で出す。\"\"\"\n    total = sum(len(rep.assignments[rid].matches) for rid in rep.runs)\n    st.subheader(\"要確認の対応\",\n                 help=\"機械が「決めきれなかった」対応だけを集めています。\"\n                      \"ここに出ていない対応は確かめなくて構いません。\")\n    # 「そのランで見つからなかっただけ」は取り違えの危険がないので分けます。\n    # 混ぜると、本当に見るべき数件が数十件の中に埋もれます。\n    missing = [m for m in review if set(m.flags) == {\"未検出\"}]\n    attention = [m for m in review if set(m.flags) != {\"未検出\"}]\n\n    if not attention:\n        st.success(f\"{total} 件の対応のうち、確かめるべきものはありません。\",\n                   icon=\"✅\")\n    else:\n        st.caption(f\"{total} 件の対応のうち **{len(attention)} 件**。\"\n                   \"危ない順に並んでいます。\")\n        rows = []\n        for m in attention:\n            reasons = [FLAG_TEXT.get(f, (f, \"\"))[0] for f in m.flags]\n            todo = [FLAG_TEXT[f][1] for f in m.flags if f in FLAG_TEXT]\n            rows.append({\n                \"成分\": m.label, \"ラン\": m.run_id,\n                \"tR [min]\": round(m.tR, 3) if m.found else None,\n                \"所見\": \"・\".join(reasons) or \"決めきれなかった\",\n                \"対応\": todo[0] if todo else \"\",\n            })\n        st.dataframe(\n            pd.DataFrame(rows), width=\"stretch\", hide_index=True,\n            column_config={\n                \"所見\": st.column_config.TextColumn(width=\"medium\"),\n                \"対応\": st.column_config.TextColumn(width=\"medium\"),\n            })\n\n    if missing:\n        runs_hit = sorted({m.run_id for m in missing})\n        with st.expander(f\"未検出の対応　{len(missing)} 件\"):\n            st.caption(\n                \"取り違えではなく、単にそのランでピークが出なかった\"\n                \"（または隣と融合した）ものです。ラン数が足りない成分は\"\n                \"モデル推定に渡りません。減らすなら検出感度を上げてください。\"\n                f\"　該当ラン: {', '.join(runs_hit)}\")\n            st.dataframe(pd.DataFrame(\n                [{\"成分\": m.label, \"ラン\": m.run_id} for m in missing]),\n                width=\"stretch\", hide_index=True)\n\n    with st.expander(\"数値\"):\n        st.caption(\"margin は 2 番手の候補とのコスト差。小さいほど僅差で、\"\n                   \"「機械には決めきれなかった」ということです。\")\n        st.dataframe(pd.DataFrame([\n            {\"成分\": m.label, \"ラン\": m.run_id,\n             \"tR\": round(m.tR, 3) if m.found else None,\n             \"類似度\": round(m.similarity, 4) if np.isfinite(m.similarity) else None,\n             \"面積比\": round(m.area_ratio, 2) if m.found else None,\n             \"予測との差\": round(m.dt, 3) if m.found else None,\n             \"margin\": round(m.margin, 2) if m.found else None,\n             \"不採用候補の tR\": (round(m.candidate_tR, 3)\n                          if m.candidate_peak is not None else None),\n             \"フラグ\": \", \".join(m.flags)}\n            for m in review\n        ]), width=\"stretch\", hide_index=True)\n\n    if any(m.candidate_peak is not None for m in review):\n        st.info(\"**溶出順の入れ替わり**が見つかりました。\" + SWAP_NOTE, icon=\"🔀\")\n\n\nMATRIX_HELP = \"\"\"\n帰属の結果そのものです。行が成分、列がラン。灰色の `None` は\n「そのランでは見つからなかった」。\n\n| タブ | 中身 | 見どころ |\n|---|---|---|\n| 保持時間 | 実測 tR [min] | この列がそのまま回帰①の入力になります |\n| 面積 | ベースラインを引いた台形積分 | ラン間で大きく動く成分は、夾雑と重なっている疑い |\n| コサイン類似度 | 基準ランのスペクトルとの一致度 | 1.0 が完全一致。低い所が帰属の弱点 |\n| 一致スコア | 3 つの手がかりを足した「ずれの合計」 | 0 が完全一致。大きい所が怪しい |\n| 半値幅 | 実測 w½ [min] | 回帰②（分散モデル）の入力になる予定の値 |\n\n「一覧を CSV 保存」で、これらとスコアの内訳をまとめて縦持ちで\n書き出せます。\n\"\"\"\n\ndef _weights_used() -> MatchWeights:\n    \"\"\"その帰属を出したときの重み。無ければ既定値（表示用の保険）。\"\"\"\n    w = st.session_state.get(\"assign_w\")\n    return w if isinstance(w, MatchWeights) else MatchWeights(**DEFAULT_WEIGHTS)\n\n\ndef _score_tab(rep, cov, w) -> None:\n    st.caption(\n        \"3 つの手がかり（スペクトル・面積・保持時間）のずれを足した合計です。\"\n        \"**0 が完全一致で、小さいほど確か**。1 つの手がかりが許容幅ぶん\"\n        \"ずれるとおよそ 1 増えます（基準ラン自身は 0）。\")\n    st.dataframe(\n        _matrix_df(rep, \"cost\", cov), width=\"stretch\", hide_index=True,\n        column_config={rid: st.column_config.NumberColumn(format=\"%.2f\")\n                       for rid in rep.runs})\n    with st.expander(\"内訳（何がどれだけ効いたか）\", expanded=False):\n        st.markdown(\n            f\"スコア = **{w.w_spectrum:g}**·(1−類似度)/{w.spectrum_tol:g} + \"\n            f\"**{w.w_area:g}**·|ln(面積比)|/ln({w.area_tol:g}) + \"\n            f\"**{w.w_time:g}**·|予測との差|/{w.time_tol_min:g} min\")\n        st.caption(\n            \"スコアの大きい順。**スペクトル・面積・保持時間**の 3 列が\"\n            \"それぞれの寄与で、足すとスコアになります。ひとつだけ突出して\"\n            \"いれば、その手がかりに逆らって対応をつけたということです。\"\n            \"**次点との差**は、次点の候補とのスコア差。小さいほど\"\n            \"「機械には決めきれなかった」対応で、0.5 未満は要確認に回ります\"\n            f\"（候補が実質 1 つしかない場合は {MARGIN_CAP:.0f} 止まり）。\")\n        st.dataframe(\n            _score_df(rep, w), width=\"stretch\", hide_index=True,\n            column_config={\n                c: st.column_config.NumberColumn(format=\"%.2f\")\n                for c in (\"スコア\", \"スペクトル\", \"面積\", \"保持時間\",\n                          \"次点との差\")})\n\n\ndef _score_df(rep, w) -> pd.DataFrame:\n    \"\"\"対応 1 件を 1 行にして、スコアを 3 つの手がかりに分解する。\"\"\"\n    names = _target_names()\n    rows = []\n    for rid in rep.runs:\n        for m in rep.assignments[rid].matches:\n            if not m.found:\n                continue\n            cs, ca, ct = cost_terms(m.similarity, m.area_ratio, m.dt, w)\n            rows.append({\n                \"成分\": names.get(m.label, m.label), \"ラン\": rid,\n                \"スコア\": m.cost,\n                \"スペクトル\": cs, \"面積\": ca, \"保持時間\": ct,\n                \"次点との差\": m.margin,\n                \"フラグ\": \"・\".join(m.flags),\n            })\n    df = pd.DataFrame(rows)\n    if df.empty:\n        return df\n    return df.sort_values(\"スコア\", ascending=False).reset_index(drop=True)\n\n\ndef _tiers(rep) -> dict:\n    \"\"\"成分 → Tier。**出どころは「7. 対象成分の選択」だけ**です。\n\n    まだ選んでいなければ空を返します（帰属した時点では、どれが目的成分かは\n    決まっていません）。ここを帰属時の tiers と二重持ちにしていたころは、\n    一覧の Tier 列が選択を無視して 1 のまま出ていました。\n\n    session_state に置いた結果を読むのではなく、**毎回選択から計算し直します**。\n    Streamlit は画面を上から下へ描くので、7 で選んだ結果を session_state 経由で\n    受け取ると、その上にある 6 の一覧には次の run まで届きません\n    （選んだのに Tier 列が出ない、1 つ前の選択が出る、という形でずれます）。\n    \"\"\"\n    sel = st.session_state.get(\"peak_targets\")\n    tb = (st.session_state.get(\"ptables\") or {}).get(rep.reference)\n    if sel is None or tb is None or \"分離対象\" not in sel.columns:\n        return {}\n    targets = [r[\"ピーク\"] for _, r in sel.iterrows() if bool(r[\"分離対象\"])]\n    return tier_from_area(tb, targets) if targets else {}\n\n\ndef _matrix_df(rep, field_name, cov) -> pd.DataFrame:\n    mat = rep.value_matrix(field_name)\n    tiers = _tiers(rep)\n    rows = []\n    for lab in rep.labels:\n        row = {\"成分\": lab}\n        if tiers:\n            row[\"Tier\"] = int(tiers.get(lab, 3))\n        for rid in rep.runs:\n            row[rid] = mat[lab].get(rid)\n        row[\"検出ラン数\"] = cov[lab]\n        rows.append(row)\n    return pd.DataFrame(rows)\n\n\ndef _long_df(rep, w) -> pd.DataFrame:\n    \"\"\"成分 × ラン を 1 行にした縦持ちの表（CSV 用）。\n\n    実測値（tR・面積・半値幅）だけでなく、その対応がどういう根拠で\n    ついたか（3 つの手がかりとスコアの内訳）も一緒に出します。\n    あとから「なぜこの帰属になったか」を追えるようにするためです。\n    \"\"\"\n    names = _target_names()\n    tiers = _tiers(rep)\n    rows = []\n    for lab in rep.labels:\n        for rid in rep.runs:\n            m = rep.assignments[rid].by_label(lab)\n            if m is None or not m.found:\n                continue\n            cs, ca, ct = cost_terms(m.similarity, m.area_ratio, m.dt, w)\n            rows.append({\n                \"component\": names.get(m.label, m.label), \"peak\": m.label,\n                \"run_id\": rid, \"tier\": int(tiers.get(m.label, 0)),\n                \"tR_min\": m.tR, \"area\": m.area,\n                \"similarity\": m.similarity, \"width_half_min\": m.width_half,\n                \"area_ratio\": m.area_ratio, \"dt_min\": m.dt,\n                \"score\": m.cost, \"score_spectrum\": cs, \"score_area\": ca,\n                \"score_time\": ct, \"margin\": m.margin,\n                \"flags\": \"|\".join(m.flags),\n            })\n    return pd.DataFrame(rows)\n\n\n# 渡す条件は固定です。\n# - 4 本: 保持 4 パラメータ（log k_w0, α, S0, β）を決めるのに要る最低のデータ点数。\n#   これを下げると「決まらないパラメータ」を作ることになります。\n# - Tier 1 と 2: 分離度の計算に入る成分。Tier 3 は計算から外すと決めたもの。\nMIN_RUNS = 4\nKEEP_TIERS = (1, 2)\n\n\ndef _handoff(rep) -> None:\n    st.header(\"8. データ受け渡し\")\n\n    # 7 で選んだ分離対象と名前を反映する（未選択なら全部 Tier 1 扱い）\n    names = _target_names()\n    over = _tiers(rep)\n\n    obs, _ = rep.to_observations(min_runs=MIN_RUNS)\n    tiers = {k: int(over.get(k, 1)) for k in obs}\n    obs = {k: v for k, v in obs.items() if tiers[k] in KEEP_TIERS}\n    st.caption(\n        f\"**{MIN_RUNS} 本以上のランで見つかった Tier 1・2 の成分**を渡します\"\n        f\"（{MIN_RUNS} 本は 4 パラメータを決めるのに要る最低のデータ点数）。\")\n    if not obs:\n        st.warning(f\"渡せる成分がありません。{MIN_RUNS} 本以上で見つかった \"\n                   \"Tier 1・2 の成分がありませんでした。\"\n                   \"「7. 対象成分の選択」で検出ラン数の多いピークを選び直すか、\"\n                   \"検出感度を上げてみてください。\")\n        return\n\n    def nm(lab):\n        return names.get(lab, lab)\n\n    wide = pd.DataFrame([\n        {\"component\": nm(lab), \"tier\": tiers[lab],\n         **{rid: obs[lab].get(rid) for rid in rep.runs}}\n        for lab in obs\n    ])\n    st.dataframe(wide, width=\"stretch\", hide_index=True)\n\n    long = pd.DataFrame([\n        {\"component\": nm(lab), \"tier\": tiers[lab], \"run_id\": rid, \"tR_min\": v}\n        for lab, row in obs.items() for rid, v in row.items()\n    ])\n    wmat = rep.value_matrix(\"width_half\")\n    bad = _unusable_widths(rep, obs)\n    if bad:\n        st.caption(\n            f\"半値幅のうち **{len(bad)} 点**は、隣とくっついている（谷どまり）か\"\n            \"純度が低いため、幅の値として使えません。印を付けて渡すので、\"\n            \"回帰②（ピーク幅）はその点を外して当てはめます。\",\n            help=\"くっついたピークの半値幅は本来より太く出ます。混ぜたまま\"\n                 \"当てはめると N を小さく見積もり（合成データで 21,000 → \"\n                 \"18,300）、以降の分離度予測が悲観的にずれます。\")\n\n    c1, c2 = st.columns(2)\n    with c1:\n        download_df(long, \"保持時間を CSV 保存\", \"observations.csv\")\n    with c2:\n        wlong = pd.DataFrame([\n            {\"component\": nm(lab), \"run_id\": rid, \"width_half_min\": v,\n             \"usable\": (rid, lab) not in bad}\n            for lab in obs for rid, v in wmat[lab].items()\n        ])\n        download_df(wlong, \"半値幅を CSV 保存\", \"widths.csv\")\n\n    if st.button(f\"この {len(obs)} 成分を確定\",\n                 type=\"primary\"):\n        st.session_state[\"obs_df\"] = wide\n        st.session_state[\"width_obs\"] = {\n            rid: {nm(lab): wmat[lab].get(rid) for lab in obs}\n            for rid in rep.runs\n        }\n        # 幅として使えない点は「除外リスト」で一緒に渡します。値そのものは\n        # 残しておく（画面で見比べたいことがあるので）。\n        st.session_state[\"width_exclude\"] = [(rid, nm(lab))\n                                             for rid, lab in bad]\n        st.success(\n            f\"{len(obs)} 成分 × 最大 {len(rep.runs)} ラン を送りました。\"\n            f\"半値幅も一緒に送ってあります（うち {len(bad)} 点は幅として\"\n            \"使えない印つき）。\"\n        )\n\n\n# 半値幅が信用できないフラグ。どちらも「隣のピークと重なっていて、測った幅が\n# その成分のものになっていない」ことを意味します。\nWIDTH_KILLERS = (\"幅が谷どまり\", \"純度低\")\n\n\ndef _unusable_widths(rep, obs) -> list[tuple[str, str]]:\n    \"\"\"(run_id, ピーク) のうち、半値幅を回帰② に使ってはいけないもの。\"\"\"\n    out = []\n    for rid in rep.runs:\n        for m in rep.assignments[rid].matches:\n            if m.found and m.label in obs and set(m.flags) & set(WIDTH_KILLERS):\n                out.append((rid, m.label))\n    return out\n", "app/sections/design.py": "\"\"\"実験計画（実験計画）\n\n保持 4 パラメータと分散 3 パラメータを当てるために、どの条件で何本流すかを決める\nページです。設計の骨格は次の 3 つで、**それぞれ担当が違います**。\n\nグラジエント時間の水準\n    保持側では b（＝勾配の急さ）を、幅側では kE を動かします。kE が動くと\n    σ_col ∝ (1+kE) と σ_ext（kE に依らない）が別々に見えるので、**N と V_ext を\n    分けているのは流速ではなくここ**です。\nカラム温度の水準\n    α と β（保持の温度依存）を決めます。\n流速の水準\n    C（流速を上げたときの N の落ち方）**だけ**を決めます。\n\n保持については流速は独立な因子になりません。b = t0·S·ΔΦ/tG で t0 = Vm/F なので、\nb はグラジエント容量 tG×F だけで決まり、tD/t0 = Vd/Vm は流速に依りません。実際に\ntR×F を並べると流速を変えても一致します。したがって 3 因子の総当たりは\n情報を増やさずにラン数だけ増やすので、ここでは\n**（グラジエント時間 × カラム温度）の格子 ＋ 流速違いのラン**という非対称な形にしています。\n\n流速違いのランはグラジエント容量を基準ランに合わせて取ります。こうすると保持については\n完全な繰り返しになり、測定の標準偏差をそのまま読めます（モデルが悪いのか\n測定が荒いのかを、あとで切り分けられる）。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom lcmd import Run\nfrom lcmd.doe import build_runs, total_runtime\nfrom lcmd.hardware import pressure_profile\nfrom lcmd.plots import plot_design_map\n\nfrom app.common import _num, download_df, show, to_psi\n\n# 想定する S の代表値。グラジエント時間の推奨値を出すためだけに使う仮置きです\n# （実際の S は回帰① で決まります）。小分子・水/ACN でおよそ 4-6。\nS_ASSUMED = 5.0\n\n# 推奨する中心の急さ。LSS では b ≈ 0.1-0.3 が分離度の良い範囲です。\nB_TARGET = 0.15\n\nTG_HELP = \"\"\"\nグラジエント時間の水準。**保持と幅の両方**がここに乗ります。\n\n- 保持側 … b = t0·S·ΔΦ/tG を動かして log k_w と S を分ける\n- 幅側 … kE を動かして N と V_ext を分ける（流速ではこれはできません）\n\n推奨値は b ≈ 0.15 になるグラジエント時間を中心に、比で上下に振ったものです\n（S = 5 と仮置き）。3 水準あると log k が Φ に直線かどうかも見えます。\n\"\"\"\n\nT_HELP = \"\"\"\nカラム温度の水準。α と β（log k_w と S の温度依存）を決めます。\n\n3 水準にすると温度の直線性も確認できますが、van 't Hoff の性質上ここは\nほぼ直線なので、ラン数を削るならまずここです（2 水準でも α・β は出ます。\nただし自由度 0 なので、おかしいランがあっても気づけません）。\n\"\"\"\n\nFLOW_HELP = \"\"\"\n流速の水準。**C（流速を上げたときに N がどれだけ落ちるか）だけ**を決めます。\n\nグラジエント容量（グラジエント時間 × 流速）を基準ランに合わせてあるので、保持については基準ランの\n完全な繰り返しになります。実測 tR がそろわなければ、それはモデルではなく\n測定の標準偏差です。\n\n流速を振ったのに C を固定して当てはめると、そのズレが V_ext に流れ込んで\n装置分散を過小評価します（合成データで 2.40 → 1.64 µL）。回帰② では\nN・C・V_ext を必ず同時に推定してください。\n\"\"\"\n\nMAP_HELP = \"\"\"\n同じ設計を 2 つの座標系で描いています。保持と幅では「効く軸」が違うためです。\n\n**左（保持）** — 横軸はグラジエント時間ではなく**グラジエント容量（グラジエント時間 × 流速）**です。\n保持の情報はグラジエント容量だけで決まり、流速を変えても増えません。この座標だと\n流速違いのランが中心ランに重なるので、「保持については繰り返しである」ことが\n目で見えます。3×3 の並びは面心中心複合計画（CCD）と同じ配置です。\n\n**右（幅）** — 横に振らないと C（流速を上げたときに N が落ちる量）が決まらず、\n縦に振らないと kE が動かないので N と V_ext が分かれません。\n\"\"\"\n\n\ndef _recommended_tG(system, flow: float, dphi: float) -> float:\n    \"\"\"b ≈ B_TARGET になるグラジエント時間[min]。カラムと流速から決まる。\"\"\"\n    t0 = system.t0(flow)\n    return float(t0 * S_ASSUMED * dphi / B_TARGET)\n\n\ndef _runs_df(runs: list[Run], system, eq_volumes: float) -> pd.DataFrame:\n    rt = total_runtime(runs, system, eq_volumes)\n    rows = []\n    for r, t in zip(runs, rt[\"rows\"]):\n        g, m = r.method.gradient, r.method\n        p = pressure_profile(system, m)\n        rows.append({\n            \"run_id\": r.run_id,\n            \"tG_min\": g.duration,\n            \"T_C\": m.temperature_C,\n            \"flow_ml_min\": m.flow_ml_min,\n            \"phi0_pct\": g.phis[0] * 100.0,\n            \"phi1_pct\": g.phis[-1] * 100.0,\n            \"グラジエント容量_mL\": g.duration * m.flow_ml_min,\n            \"分析時間_min\": t[\"run_min\"] + t[\"eq_min\"],\n            \"最大圧_psi\": to_psi(p[\"max_bar\"]),\n            \"上限比\": p[\"fraction_of_limit\"],\n        })\n    return pd.DataFrame(rows)\n\n\ndef render(system, flow, temp, rs_target) -> None:\n    ss = st.session_state\n    st.title(\"実験計画\")\n\n    # ------------------------------------------------------------------\n    # 入力\n    # ------------------------------------------------------------------\n    st.subheader(\"組成範囲\")\n    a, b, c = st.columns(3)\n    with a:\n        p0 = _num(\"開始 %B\", 0.0, 100.0, 5.0, 1.0, \"dsg_p0\")\n    with b:\n        p1 = _num(\"終了 %B\", 0.0, 100.0, 95.0, 1.0, \"dsg_p1\")\n    with c:\n        eq_vol = _num(\n            \"平衡化 [カラム容積]\", 0.0, 40.0, 10.0, 1.0, \"dsg_eq\",\n            help=\"グラジエントの後に初期組成へ戻して流す量。10 カラム容積が目安。\"\n                 \"足りないと次の注入で保持時間がずれます。\")\n    if p1 <= p0:\n        st.error(\"終了 %B は開始 %B より大きくしてください。\")\n        return\n    dphi = (p1 - p0) / 100.0\n\n    st.subheader(\"グラジエント時間の水準\", help=TG_HELP)\n    rec = _recommended_tG(system, flow, dphi)\n    a, b = st.columns(2)\n    with a:\n        tg_mid = _num(\"中心のグラジエント時間 [min]\", 1.0, 600.0, round(rec, 1), 1.0,\n                      \"dsg_tg_mid\",\n                      help=f\"この装置・カラム・流速 {flow:.2f} mL/min での推奨は \"\n                           f\"{rec:.1f} min（b ≈ {B_TARGET}、S = {S_ASSUMED} と仮置き）。\")\n    with b:\n        ratio = _num(\"水準の比\", 1.2, 6.0, 2.0, 0.1, \"dsg_ratio\",\n                     help=\"中心の何倍・何分の一まで振るか。2.0 なら中心の 0.5 倍と \"\n                          \"2 倍。広いほど b の範囲が広がり、log k の直線性が見えます。\")\n    tG_levels = [tg_mid / ratio, tg_mid, tg_mid * ratio]\n    st.caption(\"グラジエント時間 \" + \" / \".join(f\"{t:.1f}\" for t in tG_levels) + \" min\"\n               + \"　（b ≈ \" + \" / \".join(\n                   f\"{system.t0(flow) * S_ASSUMED * dphi / t:.2f}\"\n                   for t in tG_levels) + \"）\")\n\n    st.subheader(\"カラム温度の水準\", help=T_HELP)\n    a, b, c = st.columns(3)\n    with a:\n        n_temp = st.radio(\"水準数\", [2, 3], index=1, horizontal=True,\n                          key=\"dsg_ntemp\")\n    with b:\n        t_lo = _num(\"最低のカラム温度 [℃]\", 10.0, 90.0, 30.0, 1.0, \"dsg_tlo\")\n    with c:\n        t_hi = _num(\"最高のカラム温度 [℃]\", 10.0, 90.0, 60.0, 1.0, \"dsg_thi\")\n    if t_hi <= t_lo:\n        st.error(\"最高温度は最低温度より高くしてください。\")\n        return\n    T_levels = list(np.linspace(t_lo, t_hi, int(n_temp)))\n    T_ref = float(np.mean(T_levels))\n\n    st.subheader(\"流速の水準\", help=FLOW_HELP)\n    a, b = st.columns(2)\n    with a:\n        f_lo = _num(\"低い流速 [mL/min]\", 0.05, 3.0, max(0.05, flow / 2), 0.05,\n                    \"dsg_flo\")\n    with b:\n        f_hi = _num(\"高い流速 [mL/min]\", 0.05, 3.0, min(3.0, flow * 2), 0.05,\n                    \"dsg_fhi\")\n\n    # ------------------------------------------------------------------\n    # 設計を組む\n    # ------------------------------------------------------------------\n    core = build_runs(tG_levels, T_levels, p0 / 100.0, p1 / 100.0, flow)\n    volume = tg_mid * flow            # 中心ランのグラジエント容量[mL]\n    arm = [\n        Run.linear(f\"F{f:g}\", p0 / 100.0, p1 / 100.0, volume / f, T_ref, f)\n        for f in (f_lo, f_hi) if f > 0\n    ]\n    runs = core + arm\n    df = _runs_df(runs, system, eq_vol)\n\n    st.subheader(f\"ラン表　{len(runs)} 本\", help=MAP_HELP)\n    show(plot_design_map(runs))\n    st.dataframe(\n        df.style.format({\n            \"tG_min\": \"{:.1f}\", \"T_C\": \"{:.0f}\", \"flow_ml_min\": \"{:.2f}\",\n            \"phi0_pct\": \"{:.0f}\", \"phi1_pct\": \"{:.0f}\", \"グラジエント容量_mL\": \"{:.1f}\",\n            \"分析時間_min\": \"{:.0f}\", \"最大圧_psi\": \"{:,.0f}\", \"上限比\": \"{:.0%}\",\n        }),\n        width=\"stretch\", hide_index=True,\n    )\n\n    total_h = df[\"分析時間_min\"].sum() / 60.0\n    worst = df.loc[df[\"上限比\"].idxmax()]\n    m = st.columns(3)\n    m[0].metric(\"検出ラン数\", f\"{len(runs)} 本\",\n                help=f\"格子 {len(core)} 本 ＋ 流速違い {len(arm)} 本\")\n    m[1].metric(\"合計分析時間\", f\"{total_h:.1f} h\",\n                help=\"平衡化込み。連続で流したときの目安です。\")\n    m[2].metric(\"最大圧力\", f\"{worst['最大圧_psi']:,.0f} psi\",\n                delta=f\"上限の {worst['上限比']:.0%}\", delta_color=\"off\",\n                help=\"カラムのみの概算（Kozeny–Carman）。実測とは 2-3 割ずれるので、\"\n                     \"8 割を超えたら余裕を見てください。\")\n\n    if worst[\"上限比\"] > 1.0:\n        st.error(f\"**{worst['run_id']}** が圧力の上限を超えます。\"\n                 f\"高い流速を下げるか、温度を上げてください。\")\n    elif worst[\"上限比\"] > 0.8:\n        st.warning(f\"**{worst['run_id']}** が上限の {worst['上限比']:.0%} です。\"\n                   \"圧力の見積もりは 2-3 割ずれるので余裕を見てください。\")\n\n    # ------------------------------------------------------------------\n    # 確定\n    # ------------------------------------------------------------------\n    st.divider()\n    a, b = st.columns(2)\n    with a:\n        if st.button(\"この計画で確定\", type=\"primary\", width=\"stretch\",\n                     help=\"ラン表を「2. ピーク帰属」へ渡します。\"):\n            ss[\"design_runs\"] = runs\n            ss[\"design_df\"] = df\n            st.success(f\"{len(runs)} 本を確定しました。\")\n    with b:\n        download_df(df, \"ラン表を CSV 保存\", \"model_runs.csv\")\n\n    if ss.get(\"design_runs\"):\n        st.caption(f\"確定済み: {len(ss['design_runs'])} 本\")\n", "app/sections/export_page.py": "\"\"\"頑健性評価・出力（ロバストネス ＋ メソッド出力）\n\n採用したメソッドが**設定誤差と装置差に耐えるか**を確かめ、耐えるなら装置に\n打ち込む表とレポートを出します。\n\nなぜ最後にロバストネスを見るのか\n--------------------------------\nここまでの予測はすべて「設定どおりに流れたら」の話です。実際には %B は\nポンプの精度ぶんずれ、温度はカラムオーブンの精度ぶんずれ、装置を変えれば\nドウェル容量が変わります。**名目の Rs が 2.5 でも、ずれた条件で 1.4 まで\n落ちるメソッドは使えません。**\n\n5 因子 2 水準の完全実施要因（32 条件）で振って、最悪値と主効果を出します。\n主効果が最も大きい因子が、実運用で管理すべき因子です。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport datetime as _dt\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom lcmd import (\n    Perturbation, critical_n_req, plots, pressure_profile, robustness_doe,\n    simulate,\n)\n\nfrom app.common import download_df, mono, show, to_psi\n\nFACTOR_LABEL = {\"phi\": \"%B の平行移動\", \"slope\": \"勾配の傾き\", \"T\": \"カラム温度\",\n                \"F\": \"流速\", \"tD\": \"ドウェル容量（装置差）\"}\n\n\ndef _method_sig(method) -> tuple:\n    \"\"\"メソッドの中身から作る同一性キー（DoE キャッシュ用）。\"\"\"\n    g = method.gradient\n    return (tuple(round(float(t), 6) for t in g.times),\n            tuple(round(float(p), 6) for p in g.phis),\n            round(float(method.temperature_C), 3),\n            round(float(method.flow_ml_min), 4))\n\nPAGE_HELP = \"\"\"\n採用したメソッドを**意図的にずらして**、それでも目標を満たすかを確かめます。\n満たすなら、装置に打ち込む表とレポートを出します。\n\n振る 5 因子（既定は片側の量）:\n\n| 因子 | 既定 | 何を表すか |\n|---|---|---|\n| %B の平行移動 | ±1 %B | ポンプの組成精度・移動相の作り方 |\n| 勾配の傾き | ±5 % | プログラムの丸め・ポンプの流量精度 |\n| カラム温度 | ±2 ℃ | オーブンの精度・室温の影響 |\n| 流速 | ±3 % | ポンプの流量精度 |\n| ドウェル容量 | ±0.10 min | **装置を変えたときの差**。多段で最も影響が大きい |\n\"\"\"\n\nEFFECT_HELP = \"\"\"\n**主効果** = その因子を − から + へ振ったときの Rs の平均変化。絶対値が\n大きい因子ほど、実運用で厳しく管理しないといけません。\n\n- **温度**が大きい → カラムオーブンの温度を実測で確認する\n- **ドウェル容量**が大きい → **他の装置に移すと動きます**。移管前に必ず実測\n- **%B** が大きい → 移動相の調製と脱気を揃える\n\n符号は向きです（+ なら「その因子を上げると Rs が上がる」）。\n\"\"\"\n\nREPORT_HELP = \"\"\"\n記録用の Markdown。分析条件・グラジエント表・予測ピーク一覧・モデルの前提・\n**モデルに入っていないもの**・実測で確認することまで入れています。\n\n予測は予測です。この表を持って実際に流し、ピーク本数と総面積、\nそして半値幅を突き合わせてください。\n\"\"\"\n\n\ndef render(system, flow, temp, rs_target) -> None:\n    st.title(\"頑健性評価・出力\", help=PAGE_HELP)\n    ss = st.session_state\n\n    comps = ss.get(\"comps\")\n    method = ss.get(\"method\")\n    if comps is None or method is None:\n        st.info(\"**「6. メソッド最適化」でメソッドを採用してください。**\\n\\n\"\n                \"採用したメソッドをここで検証して出力します。\", icon=\"📄\")\n        return\n\n    res = simulate(comps, method, system)\n    press = pressure_profile(system, method)\n\n    _robustness(comps, method, system, rs_target)\n    st.divider()\n    _method_table(method, res, press)\n    st.divider()\n    _peaks(res)\n    st.divider()\n    _report(comps, method, system, res, press, rs_target)\n\n\n# ----------------------------------------------------------------------\n# 1. ロバストネス\n# ----------------------------------------------------------------------\ndef _robustness(comps, method, system, rs_target) -> None:\n    st.header(\"1. 頑健性評価\", help=PAGE_HELP)\n    ss = st.session_state\n\n    with st.expander(\"変動幅の設定（既定推奨）\"):\n        a, b, c, d, e = st.columns(5)\n        pert = Perturbation(\n            dphi=a.number_input(\"%B\", 0.0, 0.05, 0.01, 0.005, format=\"%.3f\",\n                                key=\"rb_phi\"),\n            slope_rel=b.number_input(\"傾き\", 0.0, 0.30, 0.05, 0.01,\n                                     key=\"rb_slope\"),\n            dT=c.number_input(\"温度 [℃]\", 0.0, 10.0, 2.0, 0.5, key=\"rb_T\"),\n            dflow_rel=d.number_input(\"流速\", 0.0, 0.20, 0.03, 0.01, key=\"rb_F\"),\n            dtD_min=e.number_input(\"tD [min]\", 0.0, 1.0, 0.10, 0.05,\n                                   key=\"rb_tD\"),\n        )\n        st.caption(\"既定は一般的な UHPLC の設定精度と、装置間のドウェル差の目安です。\")\n\n    # キーはメソッドの**中身**から作ります。id(method) を使うと、別のメソッドを\n    # 採用し直したときに CPython が同じアドレスを再利用して「前のメソッドの\n    # DoE 結果」を平然と出すことがあります（しかも doe は採用時に None に\n    # なるので、そのときは NoneType 参照で落ちる）。\n    key = (pert.dphi, pert.slope_rel, pert.dT, pert.dflow_rel, pert.dtD_min,\n           _method_sig(method))\n    if ss.get(\"doe\") is None or ss.get(\"_doe_key\") != key:\n        with st.spinner(\"32 条件を計算中…\"):\n            ss[\"doe\"] = robustness_doe(comps, method, system, pert=pert)\n            ss[\"_doe_key\"] = key\n    doe = ss[\"doe\"]\n\n    a, b, c, d = st.columns(4)\n    a.metric(\"中心点 Rs\", f\"{doe['Rs_center']:.2f}\")\n    b.metric(\"32 条件の最小\", f\"{doe['Rs_min_over_doe']:.2f}\",\n             delta=f\"{doe['Rs_min_over_doe'] - doe['Rs_center']:+.2f}\",\n             delta_color=\"inverse\",\n             help=\"ここが目標を割るなら、そのメソッドは実運用で落ちます。\")\n    c.metric(\"標準偏差\", f\"± {doe['Rs_std']:.2f}\",\n             help=\"32 条件の標準偏差。\")\n    d.metric(\"目標\", f\"{rs_target:.1f}\")\n\n    # ページ 6 は 1 因子ずつ（OAT）、ここは 5 因子を同時に振ります。悪い方向が\n    # 重なるぶん、ここの最悪値のほうが必ず低く出ます。両方を並べて見せないと\n    # 「さっきと数字が違う」と読まれてしまいます。\n    # ただし比べていいのは、**採用したメソッドがその探索から来たとき**だけ。\n    # リニアを採用したのに探索候補の数字と比べると、別のメソッドの値を\n    # 引き合いに出すことになります（is で同一物か確かめる）。\n    prev_worst = None\n    rep6 = ss.get(\"search\")\n    if rep6 is not None and getattr(rep6, \"ranked\", None):\n        prev_worst = next((c[\"Rs_worst\"] for c in rep6.ranked\n                           if c.get(\"method\") is method), None)\n    if prev_worst is not None and doe[\"Rs_min_over_doe\"] < prev_worst - 1e-9:\n        st.caption(\n            f\"「6. メソッド最適化」では最悪 {prev_worst:.2f} と出ていましたが、\"\n            f\"あちらは**1 因子ずつ**振った値です。ここは 5 因子を同時に振るので、\"\n            f\"悪い方向が重なって {doe['Rs_min_over_doe']:.2f} まで落ちます。\"\n            \"**実運用に近いのはこちら**です。\")\n\n    if not doe[\"all_eluted\"]:\n        st.error(\"ずらすと溶出しきらない成分が出ます。グラジエントの終わりに\"\n                 \"余裕を足してください。\", icon=\"🚨\")\n    elif doe[\"Rs_min_over_doe\"] >= rs_target:\n        st.success(f\"**32 条件すべてで目標を満たします**\"\n                   f\"（最悪 {doe['Rs_min_over_doe']:.2f} ≥ {rs_target:.1f}）。\"\n                   \"このメソッドは設定誤差に耐えます。\", icon=\"✅\")\n    elif doe[\"Rs_center\"] >= rs_target:\n        st.warning(\n            f\"中心では満たしますが、ずらすと **{doe['Rs_min_over_doe']:.2f}** まで\"\n            f\"落ちます（目標 {rs_target:.1f}）。下の主効果で最も影響が大きい因子を\"\n            \"見て、そこを厳しく管理するか、条件を選び直してください。\", icon=\"⚠️\")\n    else:\n        st.error(f\"中心の時点で目標に届いていません\"\n                 f\"（{doe['Rs_center']:.2f} < {rs_target:.1f}）。\", icon=\"🚨\")\n\n    st.subheader(\"主効果\", help=EFFECT_HELP)\n    eff = sorted(doe[\"effects\"].items(), key=lambda kv: -abs(kv[1]))\n    df = pd.DataFrame([{\"因子\": FACTOR_LABEL.get(f, f), \"主効果\": v,\n                        \"効きの大きさ\": abs(v)} for f, v in eff])\n    st.dataframe(\n        df[[\"因子\", \"主効果\"]], width=\"stretch\", hide_index=True,\n        column_config={\"主効果\": st.column_config.NumberColumn(\n            format=\"%.3f\",\n            help=\"− から + へ振ったときの Rs の平均変化\")})\n\n    top, val = eff[0]\n    st.caption(\n        f\"最も影響が大きいのは **{FACTOR_LABEL.get(top, top)}**（Rs が {val:+.3f}）。\"\n        + (\"**ドウェル容量は装置ごとに違います。**別の装置へ移すときは、\"\n           \"移管先で必ず実測してください。\" if top == \"tD\" else\n           \"この因子を実運用でどこまで管理できるかを確認してください。\"))\n\n    with st.expander(\"全 32 条件の結果\"):\n        rows = sorted(doe[\"rows\"], key=lambda r: r[\"Rs_min\"])\n        st.dataframe(pd.DataFrame([{\n            **{FACTOR_LABEL.get(k, k): (\"+\" if r[k] > 0 else \"−\")\n               for k in (\"phi\", \"slope\", \"T\", \"F\", \"tD\")},\n            \"最小 Rs\": r[\"Rs_min\"],\n            \"全成分溶出\": \"✓\" if r[\"all_eluted\"] else \"✗\",\n        } for r in rows]), width=\"stretch\", hide_index=True,\n            column_config={\"最小 Rs\": st.column_config.NumberColumn(\n                format=\"%.3f\")})\n        st.caption(\"悪い順。上のほうの符号の組み合わせが「最も危険な組み合わせ」です。\")\n\n\n# ----------------------------------------------------------------------\n# 2. メソッド表\n# ----------------------------------------------------------------------\ndef _method_table(method, res, press) -> None:\n    st.header(\"2. メソッド表\")\n    g = method.gradient\n\n    a, b, c = st.columns(3)\n    a.metric(\"カラム温度\", f\"{method.temperature_C:.1f} ℃\")\n    b.metric(\"流速\", f\"{method.flow_ml_min:.2f} mL/min\")\n    c.metric(\"最大圧力（推定）\", f\"{to_psi(press['max_bar']):,.0f} psi\",\n             delta=f\"{press['max_at_pctB']:.0f} %B で\",\n             delta_color=\"off\",\n             help=\"カラムのみの概算（Kozeny–Carman）。配管は含みません。\"\n                  \"実測とは 2-3 割ずれます。\")\n\n    gdf = pd.DataFrame([{\"時刻 [min]\": round(float(t), 2),\n                         \"%B\": round(float(p) * 100, 1)}\n                        for t, p in zip(g.times, g.phis)])\n    st.dataframe(gdf, width=\"stretch\", hide_index=True)\n    download_df(gdf, \"グラジエント表を CSV 保存\", \"gradient_program.csv\")\n\n    st.caption(f\"t0 = {res.t0:.3f} min　tD = {res.tD:.3f} min　\"\n               f\"この流速での N = {res.plates:,.0f}\")\n    mono(g.table())\n\n\n# ----------------------------------------------------------------------\n# 3. 予測クロマトグラム\n# ----------------------------------------------------------------------\nPROFILE_HELP = \"\"\"\n背景が**検出器で見える溶媒組成**、手前が予測されるピークです。\nセグメント化したメソッドでは、緩勾配区間にピークが乗り、急勾配区間が\n空いていることを確認してください。\n\n背景はプログラムそのものではなく、tD ＋ t0 だけ遅れて検出器に届く組成です\n（プログラムを描くとピーク位置と 1 分ほどずれて見えます）。\n\"\"\"\n\n\ndef _segments():\n    \"\"\"採用条件がセグメント化由来なら、その緩勾配区間と急勾配区間を図に重ねる。\"\"\"\n    ss = st.session_state\n    method = ss.get(\"method\")\n    for p in (ss.get(\"segments\") or []):\n        if (method is not None\n                and len(p.gradient.times) == len(method.gradient.times)\n                and np.allclose(p.gradient.times, method.gradient.times)):\n            return p.windows, p.zones\n    return None, None\n\n\ndef _peaks(res) -> None:\n    st.header(\"3. 予測クロマトグラム\")\n    st.caption(\"ガウシアンで合成した予測です。**実測とピーク本数・総面積を\"\n               \"突き合わせてください**（併合しているピークがないか）。\",\n               help=PROFILE_HELP)\n    _win, _zone = _segments()\n    show(plots.plot_method_profile(\n        res, windows=_win, zones=_zone,\n        title=\"Method profile: %B and predicted peaks\"))\n\n    df = pd.DataFrame([{\n        \"順\": n, \"成分\": res.names[i], \"Tier\": int(res.tier[i]),\n        \"tR [min]\": float(res.tR[i]),\n        \"Φe [%B]\": float(res.phi_e[i]) * 100,\n        \"kE\": float(res.kE[i]), \"G\": float(res.G[i]),\n        \"半値幅 [min]\": float(res.width_half_min[i]),\n    } for n, i in enumerate(res.order(), 1) if res.eluted[i]])\n    st.dataframe(df, width=\"stretch\", hide_index=True, column_config={\n        c: st.column_config.NumberColumn(format=\"%.3f\")\n        for c in (\"tR [min]\", \"Φe [%B]\", \"kE\", \"G\", \"半値幅 [min]\")})\n    download_df(df, \"予測ピーク表を CSV 保存\", \"predicted_peaks.csv\")\n\n\n# ----------------------------------------------------------------------\n# 4. レポート\n# ----------------------------------------------------------------------\ndef _report(comps, method, system, res, press, rs_target) -> None:\n    st.header(\"4. レポート\", help=REPORT_HELP)\n    md = _markdown(comps, method, system, res, press, rs_target,\n                   calib=_calibration_note(), doe=st.session_state.get(\"doe\"))\n    st.download_button(\"Markdown 保存\", md, file_name=\"lc_method_report.md\",\n                       mime=\"text/markdown\", type=\"primary\")\n    with st.expander(\"本文\"):\n        st.markdown(md)\n\n\ndef _calibration_note() -> list[str]:\n    \"\"\"このメソッドがどこまで実測に裏づけられているかを、正直に書く。\"\"\"\n    ss = st.session_state\n    fit, wfit = ss.get(\"fit\"), ss.get(\"wfit\")\n    out = []\n    if fit is not None:\n        rms = float(np.mean([f.rms for f in fit.fits])) * 60\n        out.append(f\"- 保持モデル（回帰①）: {len(fit.fits)} 成分 × \"\n                   f\"{len(fit.runs)} ラン、残差 RMS {rms:.2f} 秒\")\n    else:\n        out.append(\"- 保持モデル: **実測から当てはめていません**（サンプル値）\")\n    if wfit is not None:\n        out.append(f\"- ピーク幅（回帰②）: N = {wfit.plates:,.0f}、\"\n                   f\"C = {wfit.C:.4f}、装置分散 = {wfit.sigma_ext_ul:.2f} µL、\"\n                   f\"実測とのずれ {wfit.rms_percent:.1f}%\")\n        if wfit.fixed:\n            out.append(f\"  - {', '.join(wfit.fixed)} は情報が足りず固定\")\n    else:\n        out.append(\"- ピーク幅: **未較正**（カタログ値の N を使用）。\"\n                   \"Rs の絶対値には ±1 割程度の不確かさがあります\")\n    return out\n\n\ndef _markdown(c, method, system, res, press, rs_target,\n              calib=None, doe=None) -> str:\n    \"\"\"レポート本文を組み立てる（純粋関数）。\n\n    session_state を直接読まないのは、**読める場所でしか正しく動かない関数**に\n    しないためです。以前ここで `st.session_state` を見ていたときは、\n    テストから呼ぶと較正済みでも「未較正」と書かれていました。\n    \"\"\"\n    g, col = method.gradient, system.column\n    now = _dt.datetime.now().strftime(\"%Y-%m-%d %H:%M\")\n\n    lines = [\n        \"# LC メソッド（予測）\", \"\",\n        f\"作成: {now}　/　`lc-method-dev`\", \"\",\n        \"## 分析条件\", \"\",\n        f\"- カラム: {col.length_mm:.0f} × {col.id_mm:.1f} mm, \"\n        f\"{col.particle_um:.1f} µm（N = {col.plates:,.0f}）\",\n        \"- 移動相: 水 / アセトニトリル\",\n        f\"- カラム温度: {method.temperature_C:.1f} ℃\",\n        f\"- 流速: {method.flow_ml_min:.2f} mL/min\",\n        f\"- t0 = {res.t0:.3f} min、tD = {res.tD:.3f} min、\"\n        f\"この流速での N = {res.plates:,.0f}\",\n        \"\", \"### グラジエント\", \"\", \"| 時刻 [min] | %B |\", \"|---:|---:|\",\n    ]\n    lines += [f\"| {t:.2f} | {p * 100:.1f} |\" for t, p in zip(g.times, g.phis)]\n    lines += [\"\", \"```\", g.table(), \"```\", \"\",\n              \"## 予測される分離\", \"\",\n              f\"- 最小 Rs: **{res.min_rs():.2f}**（目標 {rs_target}）\"]\n\n    info = critical_n_req(res, c, float(g.phis[-1] - g.phis[0]), g.duration,\n                          rs_target)\n    if info:\n        lines += [\n            f\"- 臨界ペア: **{info['first']} / {info['second']}**\"\n            f\"（Δ tR = {info['delta_tR']:.3f} min）\",\n            f\"- 必要 N: 教科書式 {info['N_req']:,.0f} / 直接逆算 \"\n            f\"{info['N_req_direct']:,.0f}　vs　この流速での N = {res.plates:,.0f}\",\n        ]\n    lines += [\n        f\"- 分析時間: {float(np.nanmax(res.tR)):.1f} min\",\n        f\"- 最大圧力（推定）: {to_psi(press['max_bar']):,.0f} psi @ \"\n        f\"{press['max_at_pctB']:.0f} %B（装置上限の \"\n        f\"{press['fraction_of_limit'] * 100:.0f}%）\",\n    ]\n\n    if doe:\n        p = doe[\"perturbation\"]\n        eff = sorted(doe[\"effects\"].items(), key=lambda kv: -abs(kv[1]))\n        lines += [\n            \"\", \"### 設定誤差への耐性（5 因子 2 水準・32 条件）\", \"\",\n            f\"- 中心 Rs {doe['Rs_center']:.2f} / 最悪 \"\n            f\"**{doe['Rs_min_over_doe']:.2f}** / 平均 {doe['Rs_mean']:.2f} \"\n            f\"± {doe['Rs_std']:.2f}\",\n            f\"- 振れ幅: %B ±{p.dphi * 100:.1f}、傾き ±{p.slope_rel * 100:.0f}%、\"\n            f\"温度 ±{p.dT:.1f} ℃、流速 ±{p.dflow_rel * 100:.0f}%、\"\n            f\"tD ±{p.dtD_min:.2f} min\",\n            \"\", \"| 因子 | 主効果 |\", \"|---|---:|\",\n        ]\n        lines += [f\"| {FACTOR_LABEL.get(f, f)} | {v:+.3f} |\" for f, v in eff]\n\n    lines += [\"\", \"### ピーク一覧\", \"\", \"```\", res.table(), \"```\", \"\",\n              \"## このメソッドの裏づけ\", \"\"]\n    lines += calib or [\"- （較正の記録なし）\"]\n    lines += [\n        \"\", \"## モデルと前提\", \"\",\n        \"```\",\n        \"log k(Φ, T) = (log k_w0 + α·ΔT) − (S0 + β·ΔT)·Φ\",\n        f\"ΔT = T − {c.T_ref:.1f} ℃\",\n        \"```\", \"\",\n        \"保持時間は数値積分（中点法、刻み t0/100）。カラム内のグラジエント界面移動 \"\n        \"`Φ_local(z,t) = Φ_prog(t − tD − z·t0)` を含みます。\",\n        \"ピーク幅は `σ_col = t0(1+kE)·G/√N`、`σ_tot² = σ_col² + σ_ext²`、\"\n        \"G は Poppe のバンド圧縮係数。\", \"\",\n        \"### モデルに入っていないもの\", \"\",\n        \"- オンカラムでの分解・異性化（総面積では出ないので面積「比」で監視）\",\n        \"- 光や熱による試料の変化\",\n        \"- 摩擦熱の径方向勾配（非対称化・肩は実測でしか分からない）\",\n        \"- 解離性成分と pH（中性・非解離を前提）\",\n        \"- 注入溶媒によるオンカラム濃縮\",\n        \"- Tier 3（追跡できなかった夾雑）\", \"\",\n        \"### 実測で確認すること\", \"\",\n        \"- リニア条件と採用条件でピーク本数・総面積を突き合わせ、併合がないか\",\n        \"- tD の異なる装置 2 台での実測（多段グラジエントの本質的検証項目）\",\n        \"- 再平衡時間（初回注入と定常注入で tR が一致するまで）\",\n        \"- 半値幅の実測と予測 σ の突き合わせ\", \"\",\n        \"## 成分パラメータ\", \"\", \"```\", c.table(), \"```\",\n    ]\n    return \"\\n\".join(lines)\n", "app/sections/fit_page.py": "\"\"\"保持モデル推定（回帰①）\n\nページ 2 で帰属した「成分 × ラン の保持時間」から、成分ごとに 4 つの\nパラメータ (log k_w0, α, S0, β) を決めます。これが決まると、**流していない\n条件の保持時間を計算で出せる**ようになり、以降のページはすべてこの 4 つの上に\n乗ります。\n\n入力欄はありません\n------------------\n必要なもの（実測 tR・ラン条件・装置）はすべて前のページとホームから来るので、\n開いた時点で当てはめは終わっています。全ランが素のリニア勾配なら解析解で\n解けるため、11 本 × 14 成分で 0.4 秒ほど。ボタンを押させる理由がありません。\n\n温度の基準点 T_ref も自動（実験温度の平均）です。ここを 0 ℃ にすると\nlog k_w0 が「0 ℃ に外挿した値」になって α と強く相関し、フィットが不安定に\nなります。設定項目にする意味がないので出していません。\n\n残差は帰属の検算になる\n----------------------\nこのページの主眼はパラメータより **残差** です。1 本のランだけ\n大きく外れる成分は、モデルが悪いのではなく **そのランで別のピークを拾って\nいる**疑いが濃い。全ランで揃って曲がっているならモデル不足。この 2 つは\n残差の並び方で区別できるので、機械に名指しさせます。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom lcmd import fit_components, plots, simulate\n\nfrom app.common import cond_df_to_runs, download_df, mono, set_comps, show\n\n# 残差をどこから「気にする」か。ピーク幅に対する比で決めます。\n# Rs は「tR の差 ÷ 幅」なので、tR のずれが半値幅の 1/10 なら Rs への影響は\n# 数 % に収まります。絶対値で 0.1 min のような固定値にすると、細いピークでは\n# 緩すぎ、太いピークでは厳しすぎます。\nRESIDUAL_FRAC = 0.10\n# 測定そのものの標準偏差（注入間の再現性）。これより細かい残差は追いません。\nRESIDUAL_FLOOR_MIN = 0.005\n# 「1 本だけ外れている」と判定する倍率（他のランの中央値に対して）\nSPIKE_RATIO = 3.0\n\ndef _sec(minutes: float) -> str:\n    \"\"\"分 → 「◯◯ 秒」。合成データだと 0.04 秒のような値になるので、\n    小さいときは桁を増やします（0.1 秒未満を「0.0 秒」と出さない）。\"\"\"\n    s = float(minutes) * 60.0\n    return f\"{s:.2f} 秒\" if abs(s) < 1.0 else f\"{s:.1f} 秒\"\n\n\nPAGE_HELP = \"\"\"\n帰属した保持時間から、成分ごとの保持パラメータを決めます（図の**回帰①**）。\n\n$$\\\\log k(\\\\Phi, T) = (\\\\log k_{w0} + \\\\alpha \\\\Delta T) - (S_0 + \\\\beta \\\\Delta T)\\\\Phi$$\n\n| 記号 | 意味 |\n|---|---|\n| log k_w0 | 水 100% に外挿した保持の強さ。「どれだけ固定相を好むか」 |\n| S0 | 有機溶媒を 1 増やすと log k がどれだけ下がるか。「剥がれやすさ」 |\n| α, β | それぞれの温度係数（1 ℃ あたり） |\n\n**入力欄はありません。** 実測 tR は「2. ピーク帰属」から、ラン条件は同ページの\n条件表から、装置とカラムはホームから来ます。開いた時点で計算は終わっています。\n\"\"\"\n\nRESIDUAL_HELP = \"\"\"\n残差 = 予測 − 実測。**このページで最も見るべき所**です。\n\n- **1 本のランだけ外れる** … モデルではなく**帰属の取り違え**を疑ってください。\n  そのランで別のピークを拾っている可能性が高い\n- **全ランで揃って曲がる** … モデル不足（log k が Φ に対して直線でない）か、\n  条件表の値が実際と違う\n\n「気にする」しきい値は、その成分の**半値幅の 1 割**（下限 0.3 秒）に置いています。\nRs は「tR の差 ÷ 幅」なので、幅の 1 割のずれなら Rs への影響は数 % で済みます。\n半値幅は回帰② がまだなら既定の N で計算した暫定値です。\n\"\"\"\n\nBETA_HELP = \"\"\"\nβ は「温度を 1 ℃ 上げたときに S がどれだけ変わるか」。**成分ごとに β が違えば、\n温度を変えると溶出順や間隔が変わる**＝温度が独立した選択性の因子になります。\n\n逆に β が揃っていると、温度を変えても全部が一斉に動くだけで、重なったピークは\n重なったままです。同族列（6-, 10-）や幾何異性体はここが揃うので、**温度では\n解けません**。その場合に残る手は理論段数 N と k* の管理だけです。\n\n広がり ÷ 標準誤差が 3 を超えていれば「ばらついている」と見ます。\n\"\"\"\n\nPAIR_HELP = \"\"\"\n成分どうしの β の差が、その 2 成分の**標準誤差の 2 倍**に届かないペアです。\nこのペアは温度を振っても間隔が変わらないので、**温度では分けられません**。\n\nここに目的成分どうしのペアが並ぶようなら、温度の水準を増やすより、\n勾配を緩くする・カラムを伸ばす・移動相を変えるほうが早いということです。\n\"\"\"\n\n\ndef render(system, flow, temp, rs_target) -> None:\n    st.title(\"保持モデル推定\", help=PAGE_HELP)\n\n    got = _inputs()\n    if got is None:\n        return\n    obs, tiers, runs = got\n\n    rep = _fit(obs, tiers, runs, system)\n    if rep is None:\n        return\n\n    _summary(rep, runs)\n    st.divider()\n    _residuals(rep, system)\n    st.divider()\n    _params(rep)\n    st.divider()\n    _temperature(rep, obs, tiers, runs, system)\n    st.divider()\n    _handoff(rep)\n\n\n# ----------------------------------------------------------------------\n# 入口（前のページとホームから受け取るだけ）\n# ----------------------------------------------------------------------\ndef _inputs():\n    \"\"\"(observations, tiers, runs) を組む。足りなければ案内して None。\"\"\"\n    ss = st.session_state\n    obs_df = ss.get(\"obs_df\")\n    if obs_df is None or not len(obs_df):\n        st.info(\n            \"**「2. ピーク帰属」の「この成分を確定」を先に押してください。**\\n\\n\"\n            \"そこで渡した「成分 × ラン の保持時間」がこのページの入力です。\",\n            icon=\"📄\")\n        return None\n\n    try:\n        runs = cond_df_to_runs(ss.get(\"pda_cond\"))\n    except KeyError as e:  # noqa: BLE001\n        st.error(f\"ラン条件を読めませんでした: {e}\")\n        return None\n    if not runs:\n        st.error(\"ラン条件がありません。「2. ピーク帰属」の条件表を確認してください。\")\n        return None\n\n    by_id = {r.run_id: r for r in runs}\n    cols = [c for c in obs_df.columns if c in by_id]\n    if not cols:\n        st.error(\"保持時間の表とラン条件の名前が噛み合っていません。\"\n                 \"「2. ピーク帰属」の条件表を確認してください。\")\n        return None\n\n    obs, tiers = {}, {}\n    for _, row in obs_df.iterrows():\n        name = str(row[\"component\"]).strip()\n        if not name:\n            continue\n        vals = {c: float(row[c]) for c in cols\n                if pd.notna(row[c]) and float(row[c]) > 0}\n        if not vals:\n            continue\n        obs[name] = vals\n        tiers[name] = int(row.get(\"tier\", 1) or 1)\n\n    # 実際に使うランだけに絞る（読み込んだが帰属できなかったランを持ち回らない）\n    used = sorted({rid for v in obs.values() for rid in v},\n                  key=[r.run_id for r in runs].index)\n    return obs, tiers, [by_id[r] for r in used]\n\n\n@st.cache_data(show_spinner=False, max_entries=4)\ndef _fit_cached(_obs, _tiers, _runs, _system, sig: str):\n    \"\"\"フィット本体。`sig` が同じなら計算し直しません。\n\n    Run も System もハッシュできない（dataclass に numpy が入る）ので、\n    引数は `_` 付きでハッシュ対象から外し、代わりに中身から作った文字列 `sig`\n    をキーにしています。sig の作り方を間違えると**古い結果が出続ける**ので、\n    tR・条件・装置の全部を入れること。\n    \"\"\"\n    return fit_components(_obs, _runs, _system, tiers=_tiers)\n\n\ndef _signature(obs, tiers, runs, system) -> str:\n    \"\"\"入力が 1 つでも変わったら別物になる文字列。\"\"\"\n    parts = [f\"{n}:{tiers.get(n)}:\" + \",\".join(f\"{k}={v:.6f}\"\n                                               for k, v in sorted(row.items()))\n             for n, row in sorted(obs.items())]\n    for r in runs:\n        g, m = r.method.gradient, r.method\n        parts.append(f\"{r.run_id}|{g.duration:.4f}|{g.phis[0]:.4f}|\"\n                     f\"{g.phis[-1]:.4f}|{m.temperature_C:.3f}|{m.flow_ml_min:.4f}\")\n    c = system.column\n    parts.append(f\"{c.length_mm}|{c.id_mm}|{c.porosity}|{c.plates}|\"\n                 f\"{system.dwell_volume_ml}\")\n    return \"\\n\".join(parts)\n\n\ndef _fit(obs, tiers, runs, system):\n    with st.spinner(\"当てはめています…\"):\n        try:\n            rep = _fit_cached(obs, tiers, runs, system,\n                              _signature(obs, tiers, runs, system))\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"当てはめに失敗しました: {e}\")\n            return None\n    st.session_state[\"fit\"] = rep\n    return rep\n\n\n# ----------------------------------------------------------------------\n# 1. 結果のサマリ\n# ----------------------------------------------------------------------\ndef _summary(rep, runs) -> None:\n    st.header(\"1. 適合度\")\n\n    rms = float(np.mean([f.rms for f in rep.fits]))\n    worst = max(rep.fits, key=lambda f: f.max_abs_residual)\n    dof = min(f.dof for f in rep.fits)\n\n    a, b, c, d = st.columns(4)\n    a.metric(\"成分\", len(rep.fits), help=\"ページ 2 から渡ってきた成分の数\")\n    b.metric(\"平均残差\", _sec(rms),\n             help=\"全成分・全ランの残差の RMS。測定の再現性（0.1-0.5 秒）に\"\n                  \"近ければ、モデルはデータを説明しきっています。\")\n    c.metric(\"最大残差\", _sec(worst.max_abs_residual),\n             delta=worst.name, delta_color=\"off\",\n             help=\"最も外れている成分。下の「残差」で中身を見てください。\")\n    d.metric(\"自由度\", dof,\n             help=\"ラン数 − パラメータ数（4）。0 だと「当てはまって当たり前」\"\n                  \"なので、当てはまりの良さがモデルの正しさの証拠になりません。\")\n\n    if dof <= 0:\n        st.warning(\n            f\"自由度が {dof} です。4 パラメータに対してランが足りないので、\"\n            \"残差が小さくてもモデルが正しい証拠になりません\"\n            \"（点を通るだけの当てはめです）。\", icon=\"⚠️\")\n    for n in rep.notes:\n        st.caption(f\"ℹ️ {n}\")\n\n    bad = [f.name for f in rep.fits if not f.converged]\n    if bad:\n        st.error(f\"収束しなかった成分があります: {', '.join(bad)}。\"\n                 \"この成分のパラメータは使わないでください。\", icon=\"🚨\")\n\n    st.caption(\n        f\"T_ref = {rep.components.T_ref:.1f} ℃（実験温度の平均）　|　\"\n        f\"当てはめ = {'解析解' if rep.engine == 'analytic' else '数値積分'}　|　\"\n        f\"ラン {len(runs)} 本\",\n        help=\"T_ref は温度の基準点です。log k_w0 と α の相関を小さくするために\"\n             \"実験温度の中心に置きます（モデルとしては等価）。\")\n\n\n# ----------------------------------------------------------------------\n# 2. 残差\n# ----------------------------------------------------------------------\ndef _tolerances(rep, system) -> dict:\n    \"\"\"成分ごとの「このくらいなら気にしない」残差 [min]。\n\n    その成分の半値幅の 1 割。幅は当てはめたモデルから予測します\n    （回帰② がまだなら既定の N による暫定値）。\n    \"\"\"\n    widths: dict[str, list[float]] = {}\n    for r in rep.runs:\n        try:\n            res = simulate(rep.components, r.method, system)\n        except Exception:  # noqa: BLE001\n            continue\n        for n, w, ok in zip(res.names, res.width_half_min, res.eluted):\n            if ok and np.isfinite(w):\n                widths.setdefault(n, []).append(float(w))\n    return {f.name: max(RESIDUAL_FRAC * float(np.median(widths[f.name])),\n                        RESIDUAL_FLOOR_MIN)\n            if widths.get(f.name) else RESIDUAL_FLOOR_MIN\n            for f in rep.fits}\n\n\ndef _diagnose(f, tol: float) -> tuple[str, str]:\n    \"\"\"(所見, 対応)。問題なければ (\"\", \"\")。\"\"\"\n    r = np.abs(f.residuals)\n    if not r.size:\n        return \"\", \"\"\n    k = int(np.argmax(r))\n    others = np.delete(r, k)\n    med = float(np.median(others)) if others.size else 0.0\n\n    if not f.converged:\n        return \"当てはめが収束しなかった\", \"このパラメータは使わない\"\n    if r[k] <= tol:\n        return \"\", \"\"\n    if med > 0 and r[k] > SPIKE_RATIO * med:\n        return (f\"{f.run_ids[k]} だけ外れている\",\n                \"そのランの帰属を疑う（別のピークを拾っていないか）\")\n    if med > tol:\n        return \"全ランで合っていない\", \"条件表の値と、log k の直線性を疑う\"\n    return \"少し外れている\", \"帰属とラン条件をひととおり確認する\"\n\n\ndef _bad_run(rep, flagged) -> tuple[str, int] | None:\n    \"\"\"外れている成分が「同じランで・同じ向きに」偏っていないか。\n\n    偏っていれば犯人は帰属ではなく**そのランの条件表**です（tG や温度を\n    実際とは違う値で登録している）。成分ごとに見ていると全部「帰属を疑え」に\n    なってしまい、いくら帰属を見直しても直りません。\n    \"\"\"\n    if len(flagged) < 3:\n        return None\n    votes: dict[tuple[str, int], int] = {}\n    for f, _why, _todo in flagged:\n        k = int(np.argmax(np.abs(f.residuals)))\n        key = (f.run_ids[k], int(np.sign(f.residuals[k])))\n        votes[key] = votes.get(key, 0) + 1\n    (rid, _sign), n = max(votes.items(), key=lambda kv: kv[1])\n    return (rid, n) if n >= max(3, 0.5 * len(flagged)) else None\n\n\ndef _residuals(rep, system) -> None:\n    st.header(\"2. 残差\", help=RESIDUAL_HELP)\n    tol = _tolerances(rep, system)\n\n    rows, flagged = [], []\n    for f in rep.fits:\n        why, todo = _diagnose(f, tol[f.name])\n        k = int(np.argmax(np.abs(f.residuals))) if len(f.residuals) else 0\n        rows.append({\n            \"成分\": f.name, \"Tier\": f.tier, \"データ点数\": len(f.tR_obs),\n            \"RMS [秒]\": f.rms * 60,\n            \"最大残差 [秒]\": f.max_abs_residual * 60,\n            \"該当ラン\": f.run_ids[k] if len(f.run_ids) else \"\",\n            \"許容値 [秒]\": tol[f.name] * 60,\n            \"所見\": why,\n        })\n        if why:\n            flagged.append((f, why, todo))\n\n    if not flagged:\n        st.success(f\"{len(rep.fits)} 成分すべて、残差は許容の内側です。\"\n                   \"帰属もモデルも問題ありません。\", icon=\"✅\")\n    else:\n        culprit = _bad_run(rep, flagged)\n        if culprit:\n            rid, n = culprit\n            st.error(\n                f\"外れている {len(flagged)} 成分のうち **{n} 成分**が、\"\n                f\"**{rid} で同じ向きに**ずれています。個々の帰属ではなく、\"\n                f\"**{rid} の条件（tG・温度・流速）が実際と違う**可能性が\"\n                \"高いです。「2. ピーク帰属」の条件表を確認してください。\",\n                icon=\"🚨\")\n        else:\n            st.warning(f\"**{len(flagged)} 成分**が許容を超えています。\"\n                       \"多くの場合はモデルではなく帰属の問題です。\", icon=\"⚠️\")\n        st.dataframe(pd.DataFrame([\n            {\"成分\": f.name, \"所見\": why, \"対応\": todo,\n             \"最大残差 [秒]\": round(f.max_abs_residual * 60, 2)}\n            for f, why, todo in flagged\n        ]), width=\"stretch\", hide_index=True,\n            column_config={\"対応\": st.column_config.TextColumn(width=\"medium\")})\n\n    st.dataframe(\n        pd.DataFrame(rows), width=\"stretch\", hide_index=True,\n        column_config={c: st.column_config.NumberColumn(format=\"%.2f\")\n                       for c in (\"RMS [秒]\", \"最大残差 [秒]\", \"許容値 [秒]\")})\n\n    st.subheader(\"残差プロット\",\n                 help=\"横軸は実測 tR、縦軸は 予測 − 実測。**点が 0 の線の周りに\"\n                      \"ばらついていれば良好**です。弓なりに曲がっていれば \"\n                      \"log k が Φ に対して直線でない合図。1 点だけ飛んでいる\"\n                      \"ものは、その成分のそのランの帰属を疑ってください。\")\n    show(plots.plot_residuals(rep))\n\n    with st.expander(\"ラン別の残差を数値\"):\n        st.caption(\"residual = 予測 − 実測 [min]。同じ列（＝同じラン）で\"\n                   \"全成分が同じ向きにずれていたら、そのランの条件表の値\"\n                   \"（tG・温度・流速）が実際と違う可能性があります。\")\n        mono(rep.residual_table())\n\n\n# ----------------------------------------------------------------------\n# 3. パラメータ\n# ----------------------------------------------------------------------\ndef _params(rep) -> None:\n    st.header(\"3. 保持パラメータ\")\n\n    df = pd.DataFrame([{\n        \"成分\": f.name, \"Tier\": f.tier,\n        \"log k_w0\": f.params[0], \"± SE\": f.stderr[0],\n        \"S0\": f.params[2], \"± SE \": f.stderr[2],\n        \"α\": f.params[1], \"± SE  \": f.stderr[1],\n        \"β\": f.params[3], \"± SE   \": f.stderr[3],\n    } for f in rep.fits])\n    st.dataframe(\n        df, width=\"stretch\", hide_index=True,\n        column_config={c: st.column_config.NumberColumn(\n            format=\"%.4f\" if \"SE\" in c or c in (\"α\", \"β\") else \"%.3f\")\n            for c in df.columns if c not in (\"成分\", \"Tier\")})\n    st.caption(\n        \"SE = 標準誤差。**値が SE の 2 倍に届かない項は 0 と区別できていません**\"\n        \"（その項は決まっていない、ということ）。\",\n        help=\"標準誤差はヤコビアンからの近似です。ランを増やす／水準を広げると\"\n             \"小さくなります。α と β が決まらない場合は温度の水準が足りません。\")\n\n    out = df.copy()\n    out.columns = [\"component\", \"tier\", \"logkw0\", \"logkw0_se\", \"S0\", \"S0_se\",\n                   \"alpha\", \"alpha_se\", \"beta\", \"beta_se\"]\n    out[\"T_ref\"] = rep.components.T_ref\n    download_df(out, \"パラメータを CSV 保存\", \"parameters.csv\",\n                help=\"このモデルの中身そのものです。装置を変えずに再現したい\"\n                     \"ときは、これと設定 JSON があれば足ります。\")\n\n\n# ----------------------------------------------------------------------\n# 4. 温度依存性\n# ----------------------------------------------------------------------\ndef _temperature(rep, obs, tiers, runs, system) -> None:\n    st.header(\"4. 温度依存性\", help=BETA_HELP)\n\n    n_temp = len({round(r.method.temperature_C, 3) for r in runs})\n    if n_temp < 2:\n        st.info(\"温度が 1 水準しかないので、α と β は決まりません。\", icon=\"ℹ️\")\n        return\n\n    bs = rep.beta_spread()\n    a, b, c = st.columns(3)\n    a.metric(\"β の範囲\", f\"{bs['beta'].min():.4f} … {bs['beta'].max():.4f}\")\n    b.metric(\"広がり ÷ 標準誤差\", f\"{bs['spread_over_stderr']:.1f}\",\n             help=\"3 を超えていれば、成分間の差は測定の標準偏差では説明できません。\")\n    c.metric(\"β が 0 と区別できる成分\", f\"{bs['n_significant']} / {len(rep.fits)}\")\n\n    if bs[\"spread_over_stderr\"] > 3:\n        st.success(\"β は成分間でばらついています。**温度は選択性の因子として\"\n                   \"使えます**（ただし個別のペアは下の表で確認）。\", icon=\"✅\")\n    else:\n        st.info(\"β は揃っています。温度を変えても全成分が一斉に動くだけなので、\"\n                \"**温度は固定してよい**＝次からランを減らせます。\", icon=\"ℹ️\")\n\n    # 温度項を入れた価値。解析解なら一瞬なので、ボタンにせず自動で比べます。\n    rms4 = float(np.mean([f.rms for f in rep.fits]))\n    rms2 = _fit_2param(obs, tiers, runs, system)\n    if rms2 is not None:\n        ratio = rms2 / rms4 if rms4 > 0 else np.inf\n        st.caption(\n            f\"温度項を外して 2 パラメータで当てはめると、平均残差は \"\n            f\"{_sec(rms4)} → **{_sec(rms2)}**\"\n            + (f\"（{ratio:.0f} 倍悪化）。温度項は必要です。\" if ratio >= 2\n               else \"。温度項の寄与は小さいです。\"),\n            help=\"温度を振ったランを流す価値があったかの答え合わせです。\"\n                 \"次に同じ試料を扱うときの設計（ページ 1）に反映してください。\")\n\n    st.subheader(\"温度で分離できないペア\", help=PAIR_HELP)\n    pairs = _flat_pairs(rep)\n    if not pairs:\n        st.success(\"目的成分どうしで β が重なるペアはありません。\", icon=\"✅\")\n    else:\n        st.dataframe(pd.DataFrame(pairs), width=\"stretch\", hide_index=True,\n                     column_config={\n                         \"β の差\": st.column_config.NumberColumn(format=\"%.5f\"),\n                         \"標準誤差\": st.column_config.NumberColumn(format=\"%.5f\")})\n        st.caption(\"このペアは温度を振っても間隔が変わりません。\"\n                   \"勾配を緩くする・カラムを伸ばす・移動相を変えるほうが早いです。\")\n\n\n@st.cache_data(show_spinner=False, max_entries=4)\ndef _fit_2param_cached(_obs, _tiers, _runs, _system, sig: str):\n    \"\"\"温度項を外したときの平均 RMS [min]。温度を振る価値の答え合わせ用。\"\"\"\n    rep = fit_components(_obs, _runs, _system, tiers=_tiers,\n                         temperature_dependent=False, verify_engine=False)\n    return float(np.mean([f.rms for f in rep.fits]))\n\n\ndef _fit_2param(obs, tiers, runs, system):\n    try:\n        return _fit_2param_cached(obs, tiers, runs, system,\n                                  _signature(obs, tiers, runs, system))\n    except Exception:  # noqa: BLE001\n        return None\n\n\ndef _flat_pairs(rep, n_sigma: float = 2.0, limit: int = 12) -> list[dict]:\n    \"\"\"β の差が標準誤差の 2 倍に届かないペア（Tier 1 どうしだけ）。\"\"\"\n    fits = [f for f in rep.fits if f.tier == 1] or rep.fits\n    out = []\n    for i, f1 in enumerate(fits):\n        for f2 in fits[i + 1:]:\n            d = abs(float(f1.params[3] - f2.params[3]))\n            se = max(float(f1.stderr[3]), float(f2.stderr[3]))\n            if not np.isfinite(se) or se <= 0 or d >= n_sigma * se:\n                continue\n            out.append({\"成分 A\": f1.name, \"成分 B\": f2.name,\n                        \"β の差\": d, \"標準誤差\": se})\n    out.sort(key=lambda r: r[\"β の差\"])\n    return out[:limit]\n\n\n# ----------------------------------------------------------------------\n# 5. 確定\n# ----------------------------------------------------------------------\ndef _handoff(rep) -> None:\n    st.header(\"5. モデルの確定\")\n    ss = st.session_state\n\n    st.caption(\"確定すると、以降のページ（条件探索・分離度の予測）がこのモデルを\"\n               \"使います。ホームの図の青い系統が「実測で較正済み」になります。\")\n    if st.button(f\"この {len(rep.fits)} 成分のモデルを確定\", type=\"primary\"):\n        set_comps(rep.components, f\"モデル推定（{len(rep.runs)} ラン）\")\n        st.success(\"確定しました。\")\n\n    cur = ss.get(\"comps\")\n    if cur is not None:\n        st.caption(f\"いま入っているモデル: {len(cur)} 成分　\"\n                   f\"{ss.get('comps_source', '')}\")\n        st.caption(\n            \"**次は回帰②（ピーク幅）です。** いまの分離度予測はピーク幅の分母に\"\n            \"既定の N を使っているので、Rs の絶対値には ±1 割の不確かさが\"\n            \"残っています。ページ 2 から半値幅も渡してあるので、そこから \"\n            \"N・C・V_ext を決めれば絶対値も信用できるようになります。\")\n", "app/sections/home.py": "\"\"\"ホーム: 計算の流れ・進み具合・基準設定・プロジェクトの保存\n\n画面には結果と操作だけを置き、説明は ``help=`` のツールチップ（? に\nカーソルを合わせると出る）に寄せています。読み物は README にあります。\n\nこのページだけが装置・カラムの設定ウィジェットを持ちます。値の実体は\n``st.session_state[\"cfg\"]`` にあり、他のページは ``build_system()`` 経由で\n読むだけです（詳しくは :func:`app.common.settings_editor`）。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport os\n\nimport streamlit as st\n\nfrom app.common import (\n    COLUMN_PRESETS, CUSTOM, INSTRUMENT_PRESETS, _settings_load, build_system,\n    comps, settings_download, settings_editor, settings_payload,\n)\n\n# ----------------------------------------------------------------------\n# 全体図\n# ----------------------------------------------------------------------\nSVG_PATH = os.path.join(\n    os.path.dirname(os.path.dirname(os.path.abspath(__file__))),\n    \"assets\", \"pipeline.svg\",\n)\n\n# 3 状態の見た目。「暫定」を独立の状態にしているのは、幅の較正が済んでいなく\n# ても Rs は既定値 N で計算できてしまうからです。2 値にすると「仮定値ベースの\n# 予測」と「実測で較正済みの予測」が画面上で見分けられなくなります。\n#\n# 暫定は未着手と較正済みの中間に置きます。ここを濃くしすぎると、まだ何も\n# していない段階で幅の系統（橙）だけが浮き上がり、そこだけ進捗しているよう\n# ように見えてしまいます。\nSTATE_OPACITY = {\"todo\": 0.55, \"prov\": 0.75, \"done\": 1.0}\n\nFIG_HELP = \"\"\"\nこのツールが何をしているかの全体図です。要点は 3 つ。\n\n1. **回帰が 2 本ある** — 保持時間から 4 パラメータ（青）、半値幅から\n   分散パラメータ（橙）。別々に当てはめて、最後に Rs で合流します\n2. **回帰② は回帰① の後にしかできない** — 幅の式に入る kE（溶出時の\n   保持係数）と G（バンド圧縮係数）は実測できず、保持モデルからしか\n   出せないためです（図の破線）\n3. **分母を外すと最適条件の「余裕」を読み違える** — Rs ∝ √N なので、\n   N が 2 割ずれると Rs が 1 割ずれます\n\"\"\"\n\nSTATE_HELP = \"\"\"\n図の濃さが、いまどこまで実測で裏づけが取れているかを表します。\n\n- **薄い** … まだ何も入っていない\n- **点線** … 既定値（カタログ値・相場値）で暫定的に動いている\n- **濃い実線** … 実測データで較正済み\n\n点線のまま先に進んでも計算はできますが、その予測は仮定値の上に\n乗っていることを忘れないでください。\n\"\"\"\n\n\ndef _stages() -> dict[str, str]:\n    \"\"\"図の各ブロックの状態を、いま持っているデータから決める。\"\"\"\n    ss = st.session_state\n    has_obs = ss.get(\"assign\") is not None or ss.get(\"obs_df\") is not None\n    has_ret = comps() is not None\n    # 幅の系統は 3 状態。保持モデルが無いうちは kE・G が出せず式自体が回らない\n    # ので「未着手」、回っていても N がカタログ値のままなら「暫定」、回帰② で\n    # 実測に合わせて初めて「較正済み」。ここを 2 値にすると、仮定値ベースの\n    # 予測と実測較正済みの予測が画面上で見分けられなくなります。\n    has_wid = ss.get(\"wfit\") is not None\n    wid = \"done\" if (has_ret and has_wid) else (\"prov\" if has_ret else \"todo\")\n    return {\n        \"s-runs\": \"done\" if ss.get(\"design_runs\") is not None else \"todo\",\n        \"s-data\": \"done\" if has_obs else \"todo\",\n        \"s-ret\": \"done\" if has_ret else \"todo\",\n        \"s-wid\": wid,\n        \"s-out\": wid,\n    }\n\n\ndef _foreground() -> str:\n    \"\"\"文字と矢印の色。\n\n    SVG は ``st.image`` 経由で ``<img>`` として描かれます。画像は独立した文書\n    として扱われるので、ページの文字色を ``currentColor`` で継承できません。\n    そこでテーマを見て色を焼き込みます（``st.markdown`` に生の SVG を渡す手も\n    ありますが、Streamlit のサニタイザが rect や text を落とすので使えません）。\n    \"\"\"\n    # アプリのstyle.cssは白背景に固定している。OSのダーク設定を使うと\n    # 白い文字を画像に焼き込み、白背景で読めなくなる。\n    return \"#31333F\"\n\n\ndef _figure(states: dict[str, str]) -> bool:\n    \"\"\"全体図を描く。SVG が見つからなければ False を返す（致命傷にしない）。\"\"\"\n    try:\n        with open(SVG_PATH, encoding=\"utf-8\") as fh:\n            svg = fh.read()\n    except OSError:\n        return False\n\n    rules = []\n    for cls, state in states.items():\n        rules.append(f\"#lcpipe .{cls}{{opacity:{STATE_OPACITY[state]}}}\")\n        if state == \"prov\":\n            rules.append(f\"#lcpipe .{cls} rect{{stroke-dasharray:6 5}}\")\n    # 既存の <style> の末尾に足す。あとに書いたルールが勝つので上書きになる。\n    svg = svg.replace(\"<\/style>\", \"\\n\".join(rules) + \"<\/style>\", 1)\n    svg = svg.replace(\"currentColor\", _foreground())\n    st.image(svg, width=\"stretch\")\n    return True\n\n\n# ----------------------------------------------------------------------\n# 基準の装置とカラム\n# ----------------------------------------------------------------------\ndef _preset_label(key: str, presets: dict, cfg: dict, short: bool = False) -> str:\n    \"\"\"プリセット名。中身を手で変えていたら「変更あり」を付ける。\n\n    選択中のプリセット名をそのまま出すと、長さを 150 mm に直したあとも\n    「2.1 × 100 mm」と名乗り続けてしまいます（要約行が実際の設定と食い違う）。\n    セレクトボックスの値を代わりに書き換えることはできません\n    （ウィジェット生成後の代入は Streamlit が例外にするため）。\n    \"\"\"\n    name = cfg.get(key, CUSTOM)\n    values = presets.get(name)\n    if not values:\n        return CUSTOM\n    same = all(abs(float(cfg.get(k, v)) - float(v)) < 1e-9\n               for k, v in values.items())\n    if short:\n        # プリセット名は「ACQUITY BEH C18␣␣2.1 × 100 mm, 1.7 µm」の形。\n        # 寸法は実際の設定値を別に並べるので、ここでは製品名だけにする。\n        name = name.split(\"  \")[0]\n    return name if same else f\"{name}（変更あり）\"\n\n\n# ----------------------------------------------------------------------\nSETTINGS_HELP = \"\"\"\n以降の予測はすべてこの値の上に乗ります。プリセットはカタログ値の目安なので、\n**実測値に置き換えてください**（空隙率は t0 の実測から、N と装置分散は\n標準品の実測から）。\n\n- t0 = 空隙容量 ÷ 流速。ピークが最も早く出られる時刻\n- tD = ドウェル容量 ÷ 流速。組成を変えてからカラム入口に届くまでの遅れ\n- σ_ext = 配管・セル・注入による幅の増加\n\n画面上の組成はすべて %B（0-100）、計算の中身は分率（0-1）で統一しています。\n\"\"\"\n\nPROJECT_HELP = \"\"\"\nこのアプリはブラウザの中だけで動くので、**タブを閉じると状態は消えます**。\nモデル構築ランを流して当てはめたモデルを失わないよう、区切りごとに保存してください。\n\"\"\"\n\nLIMITS_HELP = \"\"\"\nモデルに入っていないもの（実測で押さえる必要があるもの）。\n\n- **オンカラム反応**（分解・脱水・異性化）。総面積では検出できないので\n  成分どうしの面積「比」で監視する\n- **光や熱による変化**。試料の取り扱い条件を統一する\n- **摩擦熱の径方向勾配**。流速を上げて非対称化・肩が出たらこれ。\n  モデルは対称ガウシアンしか出さない\n- **解離性の成分と pH**。本モデルは中性・非解離を前提にしています\n- **注入溶媒の影響**。オンカラム濃縮が働くかは入っていない\n- **N の成分依存**。全成分共通の 1 値として扱う\n- **圧力**。Kozeny–Carman の概算（カラムのみ）。実測とは 2-3 割ずれる\n\"\"\"\n\n\ndef render(system, flow, temp, rs_target) -> None:\n    ss = st.session_state\n    st.title(\"LC メソッド開発支援\")\n\n    # 表示順と実行順を分ける。設定の読み込み（file_uploader）は設定ウィジェット\n    # より先に「実行」される必要がある一方、画面では下に置きたいためです。\n    slot_fig = st.container()\n    slot_set = st.container()\n    slot_proj = st.container()\n\n    # --- ③ プロジェクト（実行は先、表示は最後）------------------------\n    with slot_proj:\n        st.subheader(\"プロジェクト\", help=PROJECT_HELP)\n        c_save, c_load, c_demo = st.columns(3)\n    _settings_load(c_load)\n\n    # --- ② 基準の装置とカラム ----------------------------------------\n    with slot_set:\n        st.subheader(\"基準の装置とカラム\", help=SETTINGS_HELP)\n        with st.expander(\"設定を変更\", expanded=comps() is None):\n            settings_editor()\n\n    # 設定ウィジェットが cfg を更新した「あと」に組み直す\n    system = build_system()\n    cfg = ss[\"cfg\"]\n    flow, temp, rs_target = cfg[\"flow\"], cfg[\"temp\"], cfg[\"rs_target\"]\n\n    with slot_set:\n        col = system.column\n        st.caption(\n            f\"**{_preset_label('preset_column', COLUMN_PRESETS, cfg, short=True)}**　\"\n            f\"{col.id_mm:.1f} × {col.length_mm:.0f} mm, {col.particle_um:.1f} µm\"\n            f\"　|　**{_preset_label('preset_instrument', INSTRUMENT_PRESETS, cfg)}**　\"\n            f\"dwell {system.dwell_volume_ml * 1000:.0f} µL\"\n            f\"　|　{temp:.0f} ℃　{flow:.2f} mL/min　目標 Rs {rs_target:.1f}\"\n        )\n        m = st.columns(4)\n        m[0].metric(\"t0\", f\"{system.t0(flow):.3f} min\",\n                    help=\"ボイド時間。保持されない成分が出る時刻\")\n        m[1].metric(\"tD\", f\"{system.tD(flow):.3f} min\",\n                    help=\"ドウェル時間。組成変化がカラムに届くまでの遅れ\")\n        m[2].metric(\"N\", f\"{system.plates_at(flow):,.0f}\",\n                    help=\"この流速での理論段数\")\n        m[3].metric(\"σ_ext\", f\"{system.sigma_ext_at(flow) * 60:.2f} 秒\",\n                    help=\"配管・セル・注入による幅の増加。\"\n                         \"容積で入れている場合は流速で変わります。\")\n\n    # --- ① 全体図 -----------------------------------------------------\n    states = _stages()\n    with slot_fig:\n        st.subheader(\"計算の流れ\", help=FIG_HELP)\n        if not _figure(states):\n            st.caption(\"（全体図の SVG が見つかりませんでした）\")\n        st.caption(\n            \"薄い＝未着手　／　点線＝既定値で暫定　／　濃い実線＝実測で較正済み\",\n            help=STATE_HELP,\n        )\n        if states[\"s-out\"] == \"prov\":\n            st.info(\n                \"いまの分離度予測は、ピーク幅の分母に**既定値**を使っています\"\n                \"（回帰② が未実施）。条件の優劣やRsの値は、幅モデルの\"\n                \"仮定によって変わります。実測幅で較正して確認してください。\"\n                \"**「4. 分散モデル推定」**で実測に合わせられます。\",\n                icon=\"ℹ️\",\n            )\n        elif states[\"s-out\"] == \"done\":\n            w = ss[\"wfit\"]\n            st.success(\n                f\"保持もピーク幅も実測で較正済みです\"\n                f\"（N = {w.plates:,.0f}、装置分散 = {w.sigma_ext_ul:.2f} µL、\"\n                f\"実測とのずれ {w.rms_percent:.1f}%）。\"\n                \"分離度の絶対値で判定して構いません。\", icon=\"✅\")\n\n    # --- ③ プロジェクト（表示の中身）----------------------------------\n    with c_save:\n        settings_download(system, flow, temp, rs_target)\n        st.download_button(\n            \"作業内容を保存\",\n            json.dumps(_project_payload(system, flow, temp, rs_target),\n                       ensure_ascii=False, indent=2),\n            file_name=\"lc_project.json\", mime=\"application/json\",\n            width=\"stretch\",\n            help=\"設定に加えて、保持パラメータの控えも入れます。\"\n                 \"**読み戻せるのはいまのところ設定だけ**です\"\n                 \"（成分パラメータの復元はモデル推定のページと一緒に作ります）。\",\n        )\n    with c_demo:\n        if st.button(\"サンプルデータ読み込み\", width=\"stretch\",\n                     help=\"14 成分のサンプル。実測なしで全ページを試せます。\"):\n            # examples はリポジトリ直下の名前空間パッケージ。streamlit_app.py が\n            # ルートを sys.path に入れているのでこの形で通ります。\n            from examples.demo_case import true_components\n            from app.common import set_comps\n            set_comps(true_components(), \"サンプルデータ（実測ではありません）\")\n            st.rerun()\n        c = comps()\n        if c is not None:\n            st.caption(f\"{len(c)} 成分　{ss.get('comps_source', '')}\")\n\n    st.divider()\n    st.caption(\"**モデルに入っていないもの**\", help=LIMITS_HELP)\n\n\ndef _project_payload(system, flow, temp, rs_target) -> dict:\n    \"\"\"設定 ＋ 成分パラメータ。\"\"\"\n    payload = settings_payload(system, flow, temp, rs_target)\n    c = comps()\n    if c is not None:\n        payload[\"components\"] = {\n            \"T_ref\": float(c.T_ref),\n            \"names\": list(c.names),\n            \"tier\": [int(x) for x in c.tier],\n            \"logkw0\": [float(x) for x in c.logkw0],\n            \"alpha\": [float(x) for x in c.alpha],\n            \"S0\": [float(x) for x in c.S0],\n            \"beta\": [float(x) for x in c.beta],\n        }\n    return payload\n", "app/sections/map_page.py": "\"\"\"デザインスペース探索（グラジエント時間 × 温度 のデザインスペース）\n\nここからは「モデルを作る」から「**モデルを使う**」に変わります。当てはめた\nモデルで、まだ流していない条件の分離度を計算し、等高線図にして見ます。\n\n**デザインスペース** = その中で操作すれば目標の品質（ここでは Rs）が保たれる、\nと裏づけのある条件の範囲のこと（ICH Q8 の言葉）。このページは目標 Rs の\n等高線でその範囲を描き、中から最短の条件を薦めます。\n\n最も Rs が高い条件は薦めません\n----------------------------------\nグラジエントを緩くすれば Rs は上がり続けるので、「最大 Rs の点」は\nたいてい**図の端＝最も長いラン**になります。それを薦めるのは\n「時間をかければ分かれます」と言っているのと同じで、助けになりません。\n\nこのページが薦めるのは **目標 Rs を満たす中で最短の条件**です。\nデモのデータでは、最大 Rs の条件（61 分）に対して 27 分で同じ目標を満たせます。\n\nしかも「速い」だけでは足りません。分離度は成分の溶出順が入れ替わる所で\n急に落ち込むので、尖った頂点を選ぶと設定が少しずれただけで谷に落ちます。\nそこで**近傍を含めて最も悪いときでも目標を満たす**点だけを候補にします\n（`ResolutionMap.robust_rs`）。デザインスペースを「点」ではなく「広がり」で\n捉える、というのがこの扱いです。\n\n実測した範囲の外は外挿です\n--------------------------\nモデルはモデル構築ランを流した範囲でしか裏づけがありません。図には実測した\nグラジエント時間・温度の範囲を破線で描き、その外に出た推奨には\nはっきり警告を出します。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom lcmd import (\n    Gradient, Method, critical_n_req, diagnose_infeasible, plots,\n    resolution_map, simulate,\n)\n\nfrom app.common import busy_button, cond_df_to_runs, download_df, show\n\n# 格子の細かさ。25 × 15 = 375 点で約 10 秒（成分 13・デモ機）。\n# ここを設定項目にすると「粗くして速く」を選びたくなりますが、粗い格子は\n# 尖った谷を飛ばして「平らに見える」ので、危険な方向に間違えます。\nN_TG, N_T = 25, 15\n\n# 近傍の半径（マス）。1 なら周囲 8 マスを含めた最悪値で評価します。\nROBUST_RADIUS = 1\n\nPAGE_HELP = \"\"\"\n当てはめたモデルで、**流していない条件の分離度**を計算して等高線図にします。\n\n- 色 … その条件での**最小 Rs**（最も近接したペアの分離度）\n- 太い黒線 … 目標 Rs の等高線。**この線より内側がデザインスペース**\n- 斜線 … 理論段数が足りず、**原理的に目標へ届かない**領域\n- 破線の枠 … モデル構築ランで実測した範囲。**外は外挿**\n\n薦めるのは最大 Rs の点ではなく、**目標を満たす中で最短の条件**です。\nグラジエントを緩くすれば Rs は上がり続けるので、最大点はいつも\n「最も長いラン」になってしまい、判断の役に立ちません。\n\"\"\"\n\nSPACE_HELP = \"\"\"\n**デザインスペース**は「その中で動かすかぎり目標の品質が保たれる」と\n裏づけのある条件の範囲です（ICH Q8）。ここでは目標 Rs の等高線の内側、\nかつ理論段数が足りている領域がそれにあたります。\n\n薦める点は、その中で**最短の**条件。しかも周囲 8 マスまで含めて\n目標を割らない点だけを候補にしているので、設定が少しずれても端から\n落ちません。\n\"\"\"\n\nRANGE_HELP = \"\"\"\n探す範囲。既定値はモデル構築ランの範囲から決めています。\n\n**広げすぎないでください。** モデルが裏づけられているのは実測した範囲だけで、\nその外は外挿です。特に温度は、実測範囲を大きく外れると α・β の直線性が\n崩れます（van 't Hoff プロットは広い範囲では曲がります）。\n\"\"\"\n\nPICK_HELP = \"\"\"\n**近傍最小 Rs** … その点と周囲 8 マスの中で最も低い Rs。尖った頂点は\nここが下がるので候補から外れます。設定が少しずれても大丈夫か、の指標です。\n\n**臨界ペア** … その条件で最も近い 2 成分。条件を変えても同じペアが\n出続けるなら、そのペアが律速です（温度で解けないペアなら、ページ 3 の\n「温度で分離できないペア」に出ているはず）。\n\"\"\"\n\nTRADE_HELP = \"\"\"\n分析時間を延ばすと分離度がどこまで伸びるか。各グラジエント時間について、\n温度を最良の値に選んだときの結果を並べています。\n\n**折れ曲がりを探してください。** そこから先は時間をかけても Rs がほとんど\n伸びません（＝待つだけ損）。目標線と交わる所が「最短でその目標を満たす条件」です。\n\"\"\"\n\n\ndef render(system, flow, temp, rs_target) -> None:\n    st.title(\"デザインスペース探索\", help=PAGE_HELP)\n\n    comps = st.session_state.get(\"comps\")\n    if comps is None:\n        st.info(\"**「3. 保持モデル推定」でモデルを確定してください。**\\n\\n\"\n                \"このページは、当てはめたモデルで未実験の条件を計算します。\",\n                icon=\"📄\")\n        return\n\n    if st.session_state.get(\"wfit\") is None:\n        st.warning(\n            \"ピーク幅がまだ較正されていません（回帰② 未実施）。**条件の優劣は\"\n            \"正しく比べられますが、Rs の絶対値には ±1 割の不確かさ**が乗ります。\"\n            \"目標ぎりぎりの条件を選ぶ前に「4. 分散モデル推定」を済ませてください。\",\n            icon=\"⚠️\")\n\n    measured = _measured_range()\n    grid = _controls(system, flow, rs_target, measured)\n    if grid is None:\n        return\n\n    rmap = st.session_state.get(\"rmap\")\n    if rmap is None:\n        st.info(\"「デザインスペースを計算」を押してください。\")\n        return\n\n    st.divider()\n    _map(rmap, measured, flow)\n    st.divider()\n    _tradeoff(rmap)\n    st.divider()\n    _pick(rmap, measured)\n\n\n# ----------------------------------------------------------------------\n# 実測した範囲\n# ----------------------------------------------------------------------\ndef _measured_range() -> dict | None:\n    \"\"\"モデル構築ランで実際に流した (tG, T) の範囲。\"\"\"\n    try:\n        runs = cond_df_to_runs(st.session_state.get(\"pda_cond\"))\n    except Exception:  # noqa: BLE001\n        runs = []\n    if not runs:\n        runs = st.session_state.get(\"design_runs\") or []\n    if not runs:\n        return None\n    tg = [r.method.gradient.duration for r in runs]\n    T = [r.method.temperature_C for r in runs]\n    return {\"tG\": (float(min(tg)), float(max(tg))),\n            \"T\": (float(min(T)), float(max(T)))}\n\n\ndef _outside(point: dict, measured: dict | None) -> list[str]:\n    \"\"\"推奨点が実測範囲の外に出ている軸を返す。\"\"\"\n    if not measured:\n        return []\n    out = []\n    if not measured[\"tG\"][0] <= point[\"tG\"] <= measured[\"tG\"][1]:\n        out.append(f\"グラジエント時間（実測 {measured['tG'][0]:.0f}–\"\n                   f\"{measured['tG'][1]:.0f} min）\")\n    if not measured[\"T\"][0] <= point[\"T\"] <= measured[\"T\"][1]:\n        out.append(f\"温度（実測 {measured['T'][0]:.0f}–{measured['T'][1]:.0f} ℃）\")\n    return out\n\n\n# ----------------------------------------------------------------------\n# 1. 探索範囲\n# ----------------------------------------------------------------------\ndef _controls(system, flow, rs_target, measured):\n    st.header(\"1. 探索範囲\", help=RANGE_HELP)\n    ss = st.session_state\n\n    g_lo, g_hi = (measured or {}).get(\"tG\", (10.0, 60.0))\n    t_lo, t_hi = (measured or {}).get(\"T\", (30.0, 50.0))\n    if measured:\n        st.caption(\n            f\"モデル構築ランの実測範囲は グラジエント時間 {g_lo:.0f}–{g_hi:.0f} min、\"\n            f\"温度 {t_lo:.0f}–{t_hi:.0f} ℃ です。既定値はその範囲そのもの。\"\n            \"広げるほど外挿になります。\")\n\n    a, b, c, d = st.columns(4)\n    tg0 = a.number_input(\"グラジエント時間 下限 [min]\", 1.0, 600.0,\n                         float(round(g_lo, 1)), 1.0, key=\"map_tg0\")\n    tg1 = b.number_input(\"上限 [min]\", 1.0, 600.0, float(round(g_hi, 1)), 1.0,\n                         key=\"map_tg1\")\n    T0 = c.number_input(\"カラム温度 下限 [℃]\", 10.0, 90.0, float(round(t_lo)),\n                        1.0, key=\"map_t0\")\n    T1 = d.number_input(\"上限 [℃]\", 10.0, 90.0, float(round(t_hi)), 1.0,\n                        key=\"map_t1\")\n\n    a, b = st.columns(2)\n    p0 = a.number_input(\"開始 %B\", 0.0, 100.0, 5.0, 1.0, key=\"map_p0\")\n    p1 = b.number_input(\"終了 %B\", 0.0, 100.0, 95.0, 1.0, key=\"map_p1\")\n\n    if tg1 <= tg0 or T1 <= T0 or p1 <= p0:\n        st.error(\"上限は下限より大きくしてください。\")\n        return None\n\n    st.caption(\n        f\"格子 {N_TG} × {N_T} = {N_TG * N_T} 点　|　流速 {flow:.2f} mL/min　|　\"\n        f\"目標 Rs {rs_target:.1f}　（流速とカラム長は「6. メソッド最適化」で詰めます）\",\n        help=\"格子の細かさは固定です。粗くすると計算は速くなりますが、\"\n             \"溶出順が入れ替わる細い谷を飛び越えて「平らに見える」ため、\"\n             \"危ないほうに間違えます。\")\n\n    clicked, slot = busy_button(\n        \"デザインスペースを計算\",\n        help=f\"{N_TG * N_T} 点を計算します。10 秒ほど。\")\n    if clicked:\n        bar = slot.progress(0.0, text=f\"計算中… 0/{N_TG * N_T}\")\n        tG = np.geomspace(tg0, tg1, N_TG)\n        T = np.linspace(T0, T1, N_T)\n        rmap = resolution_map(\n            ss[\"comps\"], system, tG, T, p0 / 100.0, p1 / 100.0, flow,\n            rs_target=rs_target,\n            progress=lambda done, total: bar.progress(\n                done / total, text=f\"計算中… {done}/{total}\"))\n        ss[\"rmap\"] = rmap\n        ss[\"ref_point\"] = None\n        # 「4. 条件の選択」の選択も新しい結果の推奨条件に戻す。widget の\n        # 値はページを描き直しても生き残るので、消さないと**前の計算で**\n        # 選んだ tG・温度が新しい結果でも選ばれ続けます（範囲や目標を変えて\n        # 求め直したのに、古い選択のまま「基準にする」を押せてしまう）。\n        ss.pop(\"map_pick_tg\", None)\n        ss.pop(\"map_pick_t\", None)\n        st.rerun()\n    return True\n\n\n# ----------------------------------------------------------------------\n# 2. デザインスペース\n# ----------------------------------------------------------------------\ndef _candidates(rmap):\n    \"\"\"目標を満たす格子点（近傍最小で判定）。\"\"\"\n    rr = rmap.robust_rs(ROBUST_RADIUS)\n    return (rr >= rmap.rs_target) & rmap.feasible_direct, rr\n\n\ndef _fastest(rmap):\n    \"\"\"目標を満たす中で最短の点。無ければ None。\"\"\"\n    ok, rr = _candidates(rmap)\n    if not ok.any():\n        return None\n    rt = np.where(ok, rmap.runtime, np.inf)\n    idx = np.unravel_index(np.argmin(rt), rt.shape)\n    point = rmap.point(idx)\n    point[\"Rs_neighbourhood_min\"] = float(rr[idx])\n    return point\n\n\ndef _map(rmap, measured, flow) -> None:\n    st.header(\"2. デザインスペース\", help=SPACE_HELP)\n    best = _fastest(rmap)\n    ok, _rr = _candidates(rmap)\n\n    if best is None:\n        st.error(\n            f\"**この範囲では目標 Rs {rmap.rs_target:.1f} に届きません。**\"\n            f\"（{ok.size} 点すべて不合格）\", icon=\"🚨\")\n        _rescue(rmap, flow)\n    else:\n        peak = rmap.plateau(ROBUST_RADIUS)\n        a, b, c, d = st.columns(4)\n        a.metric(\"推奨条件\", f\"tG {best['tG']:.1f} min\",\n                 help=\"目標を満たす中で最短の条件です。\")\n        b.metric(\"カラム温度\", f\"{best['T']:.0f} ℃\")\n        c.metric(\"最小 Rs\", f\"{best['Rs_min']:.2f}\",\n                 delta=f\"近傍最小 {best['Rs_neighbourhood_min']:.2f}\",\n                 delta_color=\"off\", help=PICK_HELP)\n        d.metric(\"分析時間\", f\"{best['runtime']:.0f} 分\",\n                 delta=f\"最大 Rs の条件より {peak['runtime'] - best['runtime']:+.0f} 分\",\n                 delta_color=\"inverse\",\n
