e int(apex[k + 1])\n        thr = max(2.0 * noise, floor_fraction * float(y[a]))\n\n        # --- 左 ---\n        i0 = left_lim + int(np.argmin(y[left_lim:a + 1]))     # 谷\n        below = np.nonzero(y[i0:a + 1] <= thr)[0]             # 高さ\n        if below.size:\n            i0 = i0 + int(below[-1])\n        i0 = max(i0, _slope_stop(grad, i0, a, -1, slope_fraction))\n\n        # --- 右 ---\n        i1 = a + int(np.argmin(y[a:right_lim + 1]))\n        below = np.nonzero(y[a:i1 + 1] <= thr)[0]\n        if below.size:\n            i1 = a + int(below[0])\n        i1 = min(i1, _slope_stop(grad, a, i1, +1, slope_fraction))\n\n        starts.append(max(0, min(i0, a - 1)))\n        ends.append(min(n - 1, max(i1, a + 1)))\n    return np.array(starts), np.array(ends)\n\n\ndef _slope_stop(grad, lo, hi, direction, slope_fraction):\n    \"\"\"変曲点から外へ歩いて、傾きが十分寝た所を返す。\"\"\"\n    if hi - lo < 3:\n        return lo if direction < 0 else hi\n    g = np.abs(grad[lo:hi + 1])\n    gmax = float(g.max())\n    if gmax <= 0:\n        return lo if direction < 0 else hi\n    thr = slope_fraction * gmax\n    k = int(np.argmax(g))                 # 変曲点（最大傾き）\n    if direction < 0:\n        i = lo + k\n        while i > lo and abs(grad[i]) > thr:\n            i -= 1\n        return i\n    i = lo + k\n    while i < hi and abs(grad[i]) > thr:\n        i += 1\n    return i\n\n\ndef _cross(t, y, i_from, i_to, level):\n    \"\"\"i_from から i_to へ向かって、y が level を横切る時刻（線形内挿）。\n\n    横切らなければ NaN。\n    \"\"\"\n    step = 1 if i_to > i_from else -1\n    for i in range(i_from, i_to, step):\n        j = i + step\n        if (y[i] - level) * (y[j] - level) <= 0 and y[i] != y[j]:\n            f = (level - y[i]) / (y[j] - y[i])\n            return t[i] + f * (t[j] - t[i])\n    return np.nan\n\n\ndef _width_half(t, y, apex, i0, i1, height):\n    \"\"\"半値幅。谷にぶつかって測れなければ (推定値, False) を返す。\"\"\"\n    half = height / 2.0\n    tl = _cross(t, y, apex, i0, half)\n    tr = _cross(t, y, apex, i1, half)\n    if np.isfinite(tl) and np.isfinite(tr):\n        return float(tr - tl), True\n    # 片側しか測れないときは対称と仮定して 2 倍する\n    if np.isfinite(tl):\n        return float(2.0 * (t[apex] - tl)), False\n    if np.isfinite(tr):\n        return float(2.0 * (tr - t[apex])), False\n    return float(t[i1] - t[i0]) / 2.0, False\n\n\ndef _sigma_moment(t, y):\n    \"\"\"2 次モーメントからの σ。テーリングも含めた「本当の幅」。\n\n    半値幅と大きく違うときはピークが歪んでいます。\n    \"\"\"\n    w = np.clip(y, 0.0, None)\n    s = float(np.sum(w))\n    if s <= 0:\n        return float(\"nan\")\n    m = float(np.sum(w * t) / s)\n    var = float(np.sum(w * (t - m) ** 2) / s)\n    return float(np.sqrt(max(var, 0.0)))\n\n\ndef _asymmetry(t, y, apex, i0, i1, height):\n    \"\"\"10% 高さでの非対称度 As = b/a（USP のテーリング係数に近い指標）。\"\"\"\n    lvl = 0.1 * height\n    tl = _cross(t, y, apex, i0, lvl)\n    tr = _cross(t, y, apex, i1, lvl)\n    if not (np.isfinite(tl) and np.isfinite(tr)):\n        return float(\"nan\")\n    a = t[apex] - tl\n    b = tr - t[apex]\n    return float(b / a) if a > 0 else float(\"nan\")\n\n\n# ----------------------------------------------------------------------\n# 内部: スペクトル\n# ----------------------------------------------------------------------\ndef _spectrum_axis(pda: PDAData, rng):\n    if not pda.is_3d:\n        return np.array([np.nan]), np.array([0])\n    wl = pda.wavelengths\n    sel = np.nonzero((wl >= rng[0]) & (wl <= rng[1]))[0]\n    if sel.size < 3:\n        sel = np.arange(wl.size)\n    return wl[sel], sel\n\n\ndef normalize_spectrum(s: np.ndarray) -> np.ndarray:\n    \"\"\"長さ 1 のベクトルにする（形だけを比べたいので大きさを捨てる）。\"\"\"\n    s = np.asarray(s, dtype=float)\n    n = float(np.linalg.norm(s))\n    return s / n if n > 0 else s\n\n\ndef spectral_similarity(a: np.ndarray, b: np.ndarray) -> float:\n    \"\"\"2 つのスペクトルの一致度（0-1）。\n\n    規格化したベクトルの内積（コサイン類似度）です。1 が完全一致。\n    同族体（6- と analyte-B2）は 0.999 を超えることもあるので、\n    スペクトルだけでは区別できません。だから面積と保持時間も併せて使います。\n    \"\"\"\n    a, b = normalize_spectrum(a), normalize_spectrum(b)\n    if a.size != b.size or a.size == 0:\n        return 0.0\n    return float(np.clip(np.dot(a, b), -1.0, 1.0))\n\n\ndef _peak_spectrum(spec_all, wl, apex, i0, i1, ys, noise):\n    \"\"\"頂点のスペクトル（ベースライン差し引き・規格化）と λmax と純度。\"\"\"\n    edge = max(1, (i1 - i0) // 20)\n    bl = 0.5 * (spec_all[max(i0 - edge, 0):i0 + 1].mean(axis=0)\n                + spec_all[i1:min(i1 + edge + 1, spec_all.shape[0])].mean(axis=0))\n    top = spec_all[apex] - bl\n    s = normalize_spectrum(top)\n    lmax = float(wl[int(np.argmax(top))]) if wl.size and np.isfinite(wl[0]) else float(\"nan\")\n\n    # 純度: 上り 50% と下り 50% の点のスペクトルを頂点と比べる\n    purity = 1.0\n    half = ys[apex] / 2.0\n    for lo, hi in ((i0, apex), (apex, i1)):\n        seg = ys[lo:hi + 1]\n        if seg.size < 3:\n            continue\n        j = lo + int(np.argmin(np.abs(seg - half)))\n        if ys[j] < 4.0 * noise:      # 小さすぎる所のスペクトルはノイズなので見ない\n            continue\n        other = spec_all[j] - bl\n        purity = min(purity, spectral_similarity(top, other))\n    return s, lmax, float(purity)\n\n\n# ----------------------------------------------------------------------\n# 波長グリッドをそろえる\n# ----------------------------------------------------------------------\ndef resample_spectrum(spectrum: np.ndarray, src_wl: np.ndarray,\n                      dst_wl: np.ndarray) -> np.ndarray:\n    \"\"\"別のランと波長軸が違うとき、共通の軸に載せ替える。\n\n    同じ装置・同じ書き出し設定なら普通は同じ軸ですが、機差や設定違いの\n    ファイルを混ぜても比較できるようにしておきます。\n    \"\"\"\n    if src_wl.size == dst_wl.size and np.allclose(src_wl, dst_wl):\n        return spectrum\n    return normalize_spectrum(np.interp(dst_wl, src_wl, spectrum))\n", "lcmd/plots.py": "\"\"\"作図（matplotlib）\n\n計算ロジックとは完全に分離してあります。このファイルを import しなければ\nmatplotlib は読み込まれないので、サーバやブラウザ配布向けに計算部分だけを\n切り出すことができます。\n\nラベルはすべて英語です。matplotlib の既定フォントに日本語が無く、\n日本語を入れると豆腐（□□□）になるためです。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nimport matplotlib\nmatplotlib.use(\"Agg\")  # 画面のない環境でも動くように\nimport matplotlib.pyplot as plt\nfrom matplotlib.lines import Line2D\nfrom matplotlib.patches import Patch, Rectangle\nfrom matplotlib.patheffects import withStroke\n\n# 濃い所でも薄い所でも見える線にするためのふちどり\n_HALO = [withStroke(linewidth=3.0, foreground=\"white\")]\n\nfrom .design import ResolutionMap\nfrom .optimize import SearchReport\nfrom .simulate import SimResult, chromatogram, last_elution\n\n# ざっくり色分け（Tier ごと）\nTIER_COLORS = {1: \"#1f77b4\", 2: \"#ff7f0e\", 3: \"#bbbbbb\"}\n\n\ndef _levels(z, n=24):\n    \"\"\"等高線のレベル。全部同じ値でも matplotlib が落ちないようにする。\"\"\"\n    lo, hi = float(np.nanmin(z)), float(np.nanmax(z))\n    if not np.isfinite(lo) or not np.isfinite(hi) or hi - lo < 1e-12:\n        span = max(abs(hi), 1.0) * 0.05\n        lo, hi = lo - span, hi + span\n    return np.linspace(lo, hi, n)\n\n\ndef _save(fig, path):\n    \"\"\"path があれば保存してパスを返す。無ければ Figure をそのまま返す。\n\n    Figure を返すのは Streamlit（st.pyplot）や Jupyter で使うためです。\n    その場合、figure を閉じるのは呼び出し側の責任になります。\n    \"\"\"\n    if path:\n        fig.savefig(path, dpi=150, bbox_inches=\"tight\")\n        plt.close(fig)\n        return path\n    return fig\n\n\n# ----------------------------------------------------------------------\n# 3. (tG, T) 分離度マップ ＋ N_req 実現可能領域\n# ----------------------------------------------------------------------\ndef plot_resolution_map(rmap: ResolutionMap, path=None, mark=None,\n                        measured=None, title=\"Resolution map (tG x T)\"):\n    \"\"\"分離度の等高線に、N_req <= N_available の領域を重ねる。\n\n    - 色つきの等高線 = 最小 Rs\n    - 斜線ハッチ = N_req > N（＝目標 Rs に原理的に届かない領域）\n    - 太い黒線 = Rs = 目標値 の等高線\n    - 白い破線の枠 = モデル用ランで**実測した範囲**（measured を渡したとき）\n\n    measured : dict, optional\n        ``{\"tG\": (lo, hi), \"T\": (lo, hi)}``。この枠の外はモデルの外挿です。\n        枠を描かないと、地図のどこまでが実測に裏づけられているのか\n        画面から判断できません。\n    \"\"\"\n    fig, ax = plt.subplots(figsize=(8.0, 5.4))\n    X, Y = np.meshgrid(rmap.tG, rmap.T)\n\n    levels = _levels(rmap.rs_min, 24)\n    cf = ax.contourf(X, Y, rmap.rs_min, levels=levels, cmap=\"viridis\")\n    cs = ax.contour(X, Y, rmap.rs_min, levels=levels[::6], colors=\"white\",\n                    linewidths=0.6, alpha=0.65)\n    ax.clabel(cs, fmt=\"%.1f\", fontsize=7)\n\n    # 目標 Rs の等高線\n    if float(np.nanmin(rmap.rs_min)) < rmap.rs_target < float(np.nanmax(rmap.rs_min)):\n        ax.contour(X, Y, rmap.rs_min, levels=[rmap.rs_target],\n                   colors=\"k\", linewidths=2.0)\n\n    # N_req が足りない領域。教科書式は赤線、直接逆算はハッチで示す\n    infeasible = (~rmap.feasible).astype(float)\n    if 0 < infeasible.sum() < infeasible.size:\n        ax.contour(X, Y, infeasible, levels=[0.5], colors=\"red\", linewidths=1.6)\n    infeasible_d = (~rmap.feasible_direct).astype(float)\n    if infeasible_d.any():\n        ax.contourf(X, Y, infeasible_d, levels=[0.5, 1.5], colors=\"none\",\n                    hatches=[\"xxx\"], alpha=0.0)\n\n    if measured:\n        # 黒破線 ＋ 白いふちどり。地図の濃い所でも薄い所でも見え、凡例\n        # （白背景）でも消えません。白一色にすると凡例で見えなくなります。\n        (g0, g1), (t0_, t1_) = measured[\"tG\"], measured[\"T\"]\n        ax.add_patch(Rectangle((g0, t0_), g1 - g0, t1_ - t0_, fill=False,\n                               edgecolor=\"k\", lw=1.3, ls=\"--\", zorder=4,\n                               path_effects=_HALO))\n\n    if mark:\n        # 推奨点は範囲の端に来がちです（グラジエントを緩くすれば Rs は上がり\n        # 続けるので、良い条件は端に寄る）。端で注記が枠の外へ出ないよう、\n        # 中心から見た向きに応じて内側へ振ります。星自体は clip_on=False で\n        # 半分に欠けないようにします。\n        ax.plot(mark[\"tG\"], mark[\"T\"], marker=\"*\", ms=20, color=\"red\",\n                mec=\"white\", mew=1.2, zorder=5, clip_on=False)\n        (x0, x1), (y0, y1) = ax.get_xlim(), ax.get_ylim()\n        right = mark[\"tG\"] > 0.5 * (x0 + x1)\n        top = mark[\"T\"] > 0.5 * (y0 + y1)\n        ax.annotate(f\"Rs={mark['Rs_min']:.2f}\", (mark[\"tG\"], mark[\"T\"]),\n                    textcoords=\"offset points\",\n                    xytext=(-12 if right else 12, -20 if top else 12),\n                    ha=\"right\" if right else \"left\",\n                    va=\"top\" if top else \"bottom\",\n                    color=\"red\", fontweight=\"bold\", zorder=6)\n\n    fig.colorbar(cf, ax=ax, label=\"minimum Rs\")\n    ax.set_xlabel(\"gradient time tG / min\")\n    ax.set_ylabel(\"column temperature / degC\")\n    ax.set_title(title)\n\n    handles = [\n        Line2D([], [], color=\"k\", lw=2, label=f\"Rs = {rmap.rs_target} (target)\"),\n        Line2D([], [], color=\"red\", lw=1.6,\n               label=f\"N_req = N ({rmap.n_available:,.0f}), textbook formula\"),\n        Patch(facecolor=\"none\", edgecolor=\"k\", hatch=\"xxx\",\n              label=\"N_req > N (direct from sigma) = infeasible\"),\n    ]\n    if measured:\n        handles.append(Line2D([], [], color=\"k\", lw=1.3, ls=\"--\",\n                              path_effects=_HALO,\n                              label=\"measured range (outside = extrapolation)\"))\n    # 凡例は枠の外（下）に置きます。中に置くと地図の一角を隠すうえ、推奨点の\n    # 星が端に寄ったときに必ずぶつかります（良い条件は端に寄りがちなので）。\n    ax.legend(handles=handles, loc=\"upper left\", bbox_to_anchor=(0.0, -0.12),\n              ncol=2, fontsize=8, frameon=False)\n    fig.tight_layout()\n    return _save(fig, path)\n\n\n# ----------------------------------------------------------------------\n# 4. 多段探索の結果マップ\n# ----------------------------------------------------------------------\ndef plot_search_map(report: SearchReport, path=None,\n                    title=\"Two-segment search: minimum Rs\"):\n    \"\"\"変曲点の (時刻 × %B) 平面での Rs 等高線。制約で落ちた所は灰色。\"\"\"\n    fig, ax = plt.subplots(figsize=(7.6, 5.2))\n    X, Y = np.meshgrid(report.t_mid_values, report.phi_mid_values * 100.0)\n    Z = report.grid_rs\n\n    ax.set_facecolor(\"#dddddd\")\n    valid = np.isfinite(Z)\n    if valid.any():\n        levels = _levels(Z[valid], 18)\n        cf = ax.contourf(X, Y, np.ma.masked_invalid(Z), levels=levels, cmap=\"magma\")\n        fig.colorbar(cf, ax=ax, label=\"minimum Rs\")\n\n    for i, c in enumerate(report.ranked[:5]):\n        ax.plot(c[\"t_mid\"], c[\"phi_mid\"] * 100, marker=\"o\", ms=8,\n                mfc=\"none\", mec=\"cyan\", mew=2)\n        ax.annotate(str(i + 1), (c[\"t_mid\"], c[\"phi_mid\"] * 100),\n                    color=\"cyan\", fontweight=\"bold\",\n                    textcoords=\"offset points\", xytext=(8, 4))\n    if report.best:\n        b = report.best\n        ax.plot(b[\"t_mid\"], b[\"phi_mid\"] * 100, marker=\"*\", ms=20,\n                color=\"white\", mec=\"k\", mew=1.0, zorder=5)\n\n    ax.set_xlabel(\"inflection time / min (program time)\")\n    ax.set_ylabel(\"inflection composition / %B\")\n    ax.set_title(title + \"   (grey = rejected by constraints)\")\n    return _save(fig, path)\n\n\n# ----------------------------------------------------------------------\n# 5. 溶出順序の braid 図\n# ----------------------------------------------------------------------\ndef plot_braid(result_a: SimResult, result_b: SimResult, path=None,\n               labels=(\"reference\", \"optimised\"), tiers=(1, 2),\n               title=\"Elution order braid\"):\n    \"\"\"2 条件の溶出順序を並べ、線で結んで入れ替わりを可視化する。\n\n    線が交差している = その 2 成分の順序が入れ替わった。\n    赤い線が交差した組。溶出順が変わると「ピークの取り違え」が起きるので、\n    最適条件を採用する前に必ずここを見ます。\n    \"\"\"\n    def ordered(res):\n        keep = np.isin(res.tier, np.atleast_1d(tiers)) & res.eluted\n        idx = [i for i in res.order() if keep[i]]\n        return idx\n\n    ia, ib = ordered(result_a), ordered(result_b)\n    common = [n for n in [result_a.names[i] for i in ia]\n              if n in [result_b.names[j] for j in ib]]\n    rank_a = {result_a.names[i]: r for r, i in enumerate(ia)}\n    rank_b = {result_b.names[j]: r for r, j in enumerate(ib)}\n\n    n = len(common)\n    fig, ax = plt.subplots(figsize=(8.6, max(4.0, 0.42 * n + 1.4)))\n\n    swapped = set()\n    for u in range(len(common)):\n        for v in range(u + 1, len(common)):\n            a, b = common[u], common[v]\n            if (rank_a[a] - rank_a[b]) * (rank_b[a] - rank_b[b]) < 0:\n                swapped.add(a)\n                swapped.add(b)\n\n    for name in common:\n        ya, yb = rank_a[name], rank_b[name]\n        color = \"#d62728\" if name in swapped else \"#7f7f7f\"\n        lw = 2.2 if name in swapped else 1.0\n        # 3 次ベジエ風の滑らかな接続\n        t = np.linspace(0, 1, 60)\n        s = 3 * t**2 - 2 * t**3\n        ax.plot(t, ya + (yb - ya) * s, color=color, lw=lw,\n                alpha=0.95 if name in swapped else 0.55, zorder=3 if name in swapped else 2)\n\n    for name in common:\n        i = result_a.names.index(name)\n        j = result_b.names.index(name)\n        c = TIER_COLORS.get(int(result_a.tier[i]), \"#333333\")\n        ax.plot(0, rank_a[name], \"o\", color=c, ms=7, zorder=4)\n        ax.plot(1, rank_b[name], \"o\", color=c, ms=7, zorder=4)\n        ax.text(-0.03, rank_a[name],\n                f\"{name}  ({result_a.tR[i]:.2f})\", ha=\"right\", va=\"center\", fontsize=8)\n        ax.text(1.03, rank_b[name],\n                f\"({result_b.tR[j]:.2f})  {name}\", ha=\"left\", va=\"center\", fontsize=8)\n\n    ax.set_xlim(-0.62, 1.62)\n    ax.set_ylim(n - 0.4, -0.6)\n    ax.set_xticks([0, 1])\n    ax.set_xticklabels(list(labels))\n    ax.set_yticks([])\n    for sp in (\"top\", \"right\", \"left\"):\n        ax.spines[sp].set_visible(False)\n    n_sw = len(swapped)\n    ax.set_title(f\"{title}   ({n_sw} component(s) changed order)\"\n                 if n_sw else f\"{title}   (elution order preserved)\")\n    ax.legend(handles=[\n        Line2D([], [], color=\"#d62728\", lw=2.2, label=\"order changed\"),\n        Line2D([], [], color=\"#7f7f7f\", lw=1.0, label=\"order preserved\"),\n        Line2D([], [], marker=\"o\", ls=\"\", color=TIER_COLORS[1], label=\"Tier 1 (target)\"),\n        Line2D([], [], marker=\"o\", ls=\"\", color=TIER_COLORS[2], label=\"Tier 2 (tracked)\"),\n    ], loc=\"lower center\", bbox_to_anchor=(0.5, -0.16), ncol=4, fontsize=8,\n        frameon=False)\n    return _save(fig, path)\n\n\n# ----------------------------------------------------------------------\n# 補助: クロマトグラム / Φe 分布 / グラジエントプロファイル\n# ----------------------------------------------------------------------\ndef plot_chromatogram(result: SimResult, path=None, areas=None, tiers=(1, 2, 3),\n                      label_tiers=(1,), title=\"Predicted chromatogram\",\n                      show_gradient=True):\n    \"\"\"予測クロマトグラム（ガウシアン合成）。グラジエントを重ね描き。\"\"\"\n    keep = np.isin(result.tier, np.atleast_1d(tiers)) & result.eluted\n    last = last_elution(result, tiers)\n    hi = (last + 1.5) if np.isfinite(last) else max(\n        result.method.gradient.duration, 1.0)\n    t, sig = chromatogram(result, areas=areas, tiers=tiers, t_range=(0.0, hi))\n    fig, ax = plt.subplots(figsize=(10.5, 5.0))\n    ax.plot(t, sig, color=\"#1f2933\", lw=1.0)\n    ax.fill_between(t, 0, sig, color=\"#1f2933\", alpha=0.08)\n\n    top = float(sig.max())\n    if top <= 0:\n        ax.text(0.5, 0.5, \"no peak eluted in this run\",\n                transform=ax.transAxes, ha=\"center\", va=\"center\",\n                fontsize=13, color=\"#d62728\")\n        top = 1.0\n    ax.set_ylim(0, top * 1.55)\n    for i in range(len(result.names)):\n        if not keep[i]:\n            continue\n        c = TIER_COLORS.get(int(result.tier[i]), \"#999999\")\n        apex = float(np.interp(result.tR[i], t, sig))\n        if result.tier[i] in np.atleast_1d(label_tiers):\n            ax.annotate(result.names[i], (result.tR[i], apex),\n                        rotation=90, fontsize=7.5, color=c,\n                        textcoords=\"offset points\", xytext=(0, 5),\n                        ha=\"center\", va=\"bottom\")\n        else:\n            ax.annotate(result.names[i], (result.tR[i], apex),\n                        rotation=90, fontsize=6.5, color=c, alpha=0.8,\n                        textcoords=\"offset points\", xytext=(0, 4),\n                        ha=\"center\", va=\"bottom\")\n\n    ax.set_xlabel(\"time / min\")\n    ax.set_ylabel(\"signal (arbitrary)\")\n    ax.set_xlim(0, hi)\n    ax.set_title(title)\n\n    if show_gradient:\n        ax2 = ax.twinx()\n        g = result.method.gradient\n        tt = np.linspace(0.0, hi, 800)\n        # 検出器で見える組成 = プログラム時刻 + tD + t0 だけ遅れて現れる\n        ax2.plot(tt, g.phi(tt - result.tD - result.t0) * 100, color=\"#2ca02c\",\n                 lw=1.4, ls=\"--\", alpha=0.85)\n        ax2.set_ylabel(\"%B at detector\", color=\"#2ca02c\")\n        ax2.tick_params(axis=\"y\", colors=\"#2ca02c\")\n        ax2.set_ylim(0, 100)\n    return _save(fig, path)\n\n\ndef plot_method_profile(result: SimResult, path=None, windows=None,\n                        tiers=(1, 2, 3), label_tiers=(1, 2), areas=None,\n                        zones=None,\n                        title=\"Method profile: %B and predicted peaks\"):\n    \"\"\"**溶媒比を背景に、予測されるピークを重ねた図。**\n\n    セグメント化が効いているかは、この 1 枚で分かります。緩勾配区間にピークが\n    乗っていて、急勾配区間が空っぽなら狙いどおり。急勾配区間の途中にピークが\n    あれば、そこは時間軸で詰まって分離が落ちています。\n\n    windows : list[(lo, hi)], optional\n        緩勾配区間（溶出させたい組成の帯、分率）。薄く塗ります。\n    zones : list[(lo, hi)] or list[(lo, hi, slope)], optional\n        **急勾配区間**（分率）。ここを飛ばしている、と分かるように塗ります。\n        ピークが入り込んでいれば一目で分かります。\n\n    背景の %B は**検出器で見える組成**です（プログラムより tD + t0 だけ遅れて\n    届く）。プログラムそのものを描くと、ピークの位置と 1 分ほどずれて見えます。\n    \"\"\"\n    keep = np.isin(result.tier, np.atleast_1d(tiers)) & result.eluted\n    last = last_elution(result, tiers)\n    hi_t = (last + 1.0) if np.isfinite(last) else max(\n        result.method.gradient.duration, 1.0)\n    t, sig = chromatogram(result, areas=areas, tiers=tiers, t_range=(0.0, hi_t))\n\n    fig, ax_b = plt.subplots(figsize=(10.5, 5.0))\n    g = result.method.gradient\n    tt = np.linspace(0.0, hi_t, 1200)\n    phi_seen = g.phi(tt - result.tD - result.t0) * 100.0\n\n    # 背景 = 溶媒比。塗りで「地面」にして、ピークを前に置く\n    ax_b.fill_between(tt, 0, phi_seen, color=\"#4C78A8\", alpha=0.13, lw=0)\n    ax_b.plot(tt, phi_seen, color=\"#4C78A8\", lw=1.3)\n    ax_b.set_ylabel(\"%B at detector\", color=\"#3A5E86\")\n    ax_b.tick_params(axis=\"y\", colors=\"#3A5E86\")\n    ax_b.set_ylim(0, 100)\n    ax_b.set_xlim(0, hi_t)\n    ax_b.set_xlabel(\"time / min\")\n    ax_b.grid(alpha=0.18)\n\n    # 緩勾配区間（溶出させたい帯）を横帯で示す\n    for lo, hi in (windows or []):\n        ax_b.axhspan(lo * 100.0, hi * 100.0, color=\"#4C78A8\", alpha=0.10, lw=0)\n    # 急勾配区間は「その組成が検出器を通っている時間」を縦帯で示す。組成軸の\n    # 横帯にすると図の全幅に伸びてピークと重なり、どの時間帯を飛ばしているのか\n    # 読み取れない。\n    for z in (zones or []):\n        t_lo = float(np.interp(z[0] * 100.0, phi_seen, tt))\n        t_hi = float(np.interp(z[1] * 100.0, phi_seen, tt))\n        ax_b.axvspan(t_lo, t_hi, color=\"#B45309\", alpha=0.12, lw=0)\n    if zones:\n        ax_b.legend(handles=[Patch(facecolor=\"#B45309\", alpha=0.12,\n                                   label=\"fast segment\")],\n                    loc=\"upper left\", fontsize=8, frameon=False)\n\n    ax = ax_b.twinx()\n    top = float(sig.max()) or 1.0\n    ax.plot(t, sig, color=\"#1f2933\", lw=1.1)\n    ax.fill_between(t, 0, sig, color=\"#1f2933\", alpha=0.10)\n    ax.set_ylim(0, top * 1.6)\n    ax.set_ylabel(\"signal (arbitrary)\")\n    ax.set_yticks([])\n\n    for i in range(len(result.names)):\n        if not keep[i]:\n            continue\n        c = TIER_COLORS.get(int(result.tier[i]), \"#999999\")\n        apex = float(np.interp(result.tR[i], t, sig))\n        ax.plot([result.tR[i]], [apex], marker=\"v\", ms=4, color=c)\n        if result.tier[i] in np.atleast_1d(label_tiers):\n            ax.annotate(result.names[i], (result.tR[i], apex), rotation=90,\n                        fontsize=7, color=c, textcoords=\"offset points\",\n                        xytext=(0, 7), ha=\"center\", va=\"bottom\")\n    ax_b.set_title(title)\n    ax_b.set_zorder(0)\n    ax.set_zorder(1)\n    ax.patch.set_visible(False)\n    fig.tight_layout()\n    return _save(fig, path)\n\n\ndef plot_phie_distribution(result: SimResult, path=None, bins=25,\n                           title=\"Elution composition (Phi_e) distribution\"):\n    \"\"\"溶出組成 Φe の分布図。\n\n    どの組成帯にピークが密集しているか＝どこを緩くすべきか、\n    どこが空白か＝どこを急峻にできるか、が見えます。\n    \"\"\"\n    fig, (ax1, ax2) = plt.subplots(2, 1, figsize=(8.6, 6.0), sharex=True,\n                                   gridspec_kw={\"height_ratios\": [1, 1.5]})\n    ok = result.eluted\n    phie = result.phi_e[ok] * 100.0\n    tiers = result.tier[ok]\n\n    ax1.hist([phie[tiers == 1], phie[tiers == 2], phie[tiers == 3]],\n             bins=bins, stacked=True,\n             color=[TIER_COLORS[1], TIER_COLORS[2], TIER_COLORS[3]],\n             label=[\"Tier 1 target\", \"Tier 2 tracked\", \"Tier 3 untracked\"])\n    ax1.set_ylabel(\"peak count\")\n    ax1.legend(fontsize=8)\n    ax1.set_title(title)\n\n    for i in np.flatnonzero(ok):\n        c = TIER_COLORS.get(int(result.tier[i]), \"#999999\")\n        ax2.plot(result.phi_e[i] * 100, result.tR[i], \"o\", color=c, ms=6)\n        if result.tier[i] == 1:\n            ax2.annotate(result.names[i], (result.phi_e[i] * 100, result.tR[i]),\n                         fontsize=7, textcoords=\"offset points\", xytext=(6, -3))\n    ax2.set_xlabel(\"elution composition Phi_e / %B\")\n    ax2.set_ylabel(\"tR / min\")\n    ax2.grid(alpha=0.25)\n    return _save(fig, path)\n\n\ndef plot_gradient(gradients: dict, path=None, title=\"Gradient profiles\"):\n    \"\"\"複数のグラジエントプロファイルを重ねて描く。\"\"\"\n    fig, ax = plt.subplots(figsize=(7.6, 4.0))\n    for label, g in gradients.items():\n        t = np.linspace(g.times[0], g.times[-1], 400)\n        line, = ax.plot(t, g.phi(t) * 100, lw=1.8, label=label)\n        ax.plot(g.times, g.phis * 100, \"o\", ms=5, color=line.get_color())\n    ax.set_xlabel(\"program time / min\")\n    ax.set_ylabel(\"%B\")\n    ax.grid(alpha=0.25)\n    ax.legend(fontsize=9)\n    ax.set_title(title)\n    return _save(fig, path)\n\n\ndef plot_flow_scan(rows: list[dict], path=None, limit_fraction=0.80,\n                   title=\"Flow scan at constant tG x F\"):\n    \"\"\"流速スキャン。Rs の平坦部が終わる屈曲点を目で探す。\"\"\"\n    fig, ax = plt.subplots(figsize=(7.6, 4.4))\n    F = [r[\"flow\"] for r in rows]\n    ax.plot(F, [r[\"Rs_min\"] for r in rows], \"o-\", color=\"#1f77b4\", lw=2,\n            label=\"minimum Rs\")\n    ax.set_xlabel(\"flow rate / mL/min\")\n    ax.set_ylabel(\"minimum Rs\", color=\"#1f77b4\")\n    ax.grid(alpha=0.25)\n\n    ax2 = ax.twinx()\n    frac = [r[\"pressure_fraction\"] * 100 for r in rows]\n    ax2.plot(F, frac, \"s--\", color=\"#d62728\", label=\"pressure / limit\")\n    ax2.axhline(limit_fraction * 100, color=\"#d62728\", ls=\":\", lw=1)\n    ax2.set_ylabel(\"max pressure / instrument limit  %\", color=\"#d62728\")\n    ax2.tick_params(axis=\"y\", colors=\"#d62728\")\n    ax.set_title(title)\n    return _save(fig, path)\n\n\ndef plot_residuals(report, path=None, title=\"Fit residuals\"):\n    \"\"\"フィット残差。系統的な曲がりが出ていないかを見る。\"\"\"\n    fig, ax = plt.subplots(figsize=(8.0, 4.4))\n    for f in report.fits:\n        ax.plot(f.tR_obs, f.residuals * 1000, \"o\", ms=5, label=f.name)\n    ax.axhline(0, color=\"k\", lw=0.8)\n    ax.set_xlabel(\"observed tR / min\")\n    ax.set_ylabel(\"residual (pred - obs) / ms\")\n    ax.grid(alpha=0.25)\n    ax.set_title(title)\n    if len(report.fits) <= 12:\n        ax.legend(fontsize=7, ncol=2)\n    return _save(fig, path)\n\n\n# ----------------------------------------------------------------------\n# 実測クロマトグラム: ピーク検出と帰属\n# ----------------------------------------------------------------------\ndef plot_peaks(table, path=None, t_range=None, ylim=None, annotate=True,\n               show_baseline=False, title=None):\n    \"\"\"検出したピークを塗り分けて表示する（検出条件の確認用）。\n\n    塗った範囲がそのまま積分範囲です。裾を巻き込みすぎていないか、\n    逆に切りすぎていないかは、ここを見るのがいちばん早い。\n    \"\"\"\n    fig, ax = plt.subplots(figsize=(11.0, 4.2))\n    t, y = table.times, table.signal\n    m = np.ones(t.size, dtype=bool)\n    if t_range:\n        lo = t[0] if t_range[0] is None else t_range[0]\n        hi = t[-1] if t_range[1] is None else t_range[1]\n        m = (t >= lo) & (t <= hi)\n    ax.plot(t[m], y[m], lw=0.7, color=\"#222222\")\n    if show_baseline:\n        ax.plot(t[m], table.baseline[m] - table.baseline[m], lw=0.6, color=\"#888888\")\n\n    ymax = float(np.max(y[m])) if m.any() else 1.0\n    for p in table.peaks:\n        if not (t[m][0] <= p.tR <= t[m][-1]):\n            continue\n        w = (t >= p.t_start) & (t <= p.t_end)\n        colour = TIER_COLORS.get(1) if p.label.startswith(\"P\") else \"#2ca02c\"\n        ax.fill_between(t[w], 0, y[w], color=colour, alpha=0.35, lw=0)\n        if annotate:\n            ax.annotate(p.label, (p.tR, p.height), fontsize=6.5, rotation=90,\n                        ha=\"center\", va=\"bottom\",\n                        color=\"#b22222\" if p.needs_check else \"#333333\")\n    ax.set_xlim(t[m][0], t[m][-1])\n    ax.set_ylim(0 if ylim is None else ylim[0],\n                ymax * 1.15 if ylim is None else ylim[1])\n    ax.set_xlabel(\"time / min\")\n    ax.set_ylabel(f\"absorbance @ {table.detection_wavelength:.0f} nm / AU\")\n    ax.set_title(title or f\"{table.name}: {len(table.peaks)} peaks \"\n                          f\"(noise {table.noise:.1e} AU)\")\n    ax.grid(alpha=0.2)\n    return _save(fig, path)\n\n\ndef plot_assignment(report, path=None, tiers=None, log_y=False,\n                    title=\"Peak assignment across runs\"):\n    \"\"\"ラン間の帰属を 1 枚で見る。\n\n    横軸がラン、縦軸が保持時間。同じ成分を線で結んであります。\n    線が交差していれば溶出順が入れ替わったということ。\n    ○ が抜けている所はそのランで見つからなかったピークです。\n    \"\"\"\n    fig, ax = plt.subplots(figsize=(10.0, 6.4))\n    x = np.arange(len(report.runs))\n    mat = report.value_matrix(\"tR\")\n    cmap = plt.get_cmap(\"turbo\")\n    n = max(len(report.labels), 1)\n\n    for k, lab in enumerate(report.labels):\n        tier = int(report.tiers.get(lab, 1))\n        if tiers is not None and tier not in np.atleast_1d(tiers):\n            continue\n        row = mat[lab]\n        # 見つからなかったランは NaN にして線を切る。詰めて繋ぐと、\n        # 抜けを跨いだ直線が「順序が入れ替わった」ように見えてしまう。\n        ys = np.array([row.get(r, np.nan) for r in report.runs], dtype=float)\n        if not np.isfinite(ys).any():\n            continue\n        colour = cmap(k / n)\n        ax.plot(x, ys, \"-o\", ms=4, lw=1.4, color=colour,\n                alpha=0.9 if tier <= 2 else 0.4)\n        # 名前は「いちばん分離のよい（＝手本の）ラン」側に、左へ出す。\n        first = int(np.flatnonzero(np.isfinite(ys))[0])\n        ax.annotate(lab, (first, ys[first]), fontsize=7, color=colour,\n                    xytext=(-6, 0), textcoords=\"offset points\",\n                    va=\"center\", ha=\"right\")\n\n    ax.set_xticks(x)\n    ax.set_xticklabels(report.runs, rotation=30, ha=\"right\", fontsize=8)\n    ax.set_ylabel(\"retention time / min\")\n    if log_y:\n        ax.set_yscale(\"log\")\n    ax.grid(alpha=0.25)\n    ax.set_title(title)\n    ax.set_xlim(-1.6, len(report.runs) - 0.6)\n    return _save(fig, path)\n\n\ndef plot_label_spectra(report, tables, label, path=None):\n    \"\"\"同じ帰属をつけたピークのスペクトルを重ねて描く。\n\n    帰属が正しければ、全ランのスペクトルがぴたりと重なります。\n    1 本だけ形が違えば、そのランの帰属を疑ってください。\n    \"\"\"\n    fig, ax = plt.subplots(figsize=(7.5, 4.2))\n    drawn = 0\n    for rid in report.runs:\n        m = report.assignments[rid].by_label(label)\n        if m is None or not m.found:\n            continue\n        tb = tables[rid]\n        ax.plot(tb.wavelengths, tb.peaks[m.peak].spectrum, lw=1.3,\n                label=f\"{rid}  (sim {m.similarity:.4f})\")\n        drawn += 1\n    if drawn == 0:\n        ax.text(0.5, 0.5, f\"'{label}' was not found in any run\",\n                ha=\"center\", va=\"center\", transform=ax.transAxes)\n    ax.set_xlabel(\"wavelength / nm\")\n    ax.set_ylabel(\"normalised absorbance\")\n    ax.set_title(f\"UV spectra of '{label}'\")\n    ax.grid(alpha=0.25)\n    if drawn:\n        ax.legend(fontsize=7)\n    return _save(fig, path)\n\n\ndef plot_overlay(tables, path=None, run_ids=None, t_range=None, offset=True,\n                 title=\"Chromatogram overlay\"):\n    \"\"\"複数ランのクロマトグラムを重ねる／段積みにする。\"\"\"\n    ids = run_ids or list(tables)\n    fig, ax = plt.subplots(figsize=(11.0, 1.6 + 1.5 * len(ids)))\n    step = 0.0\n    for k, rid in enumerate(ids):\n        tb = tables[rid]\n        t, y = tb.times, tb.signal\n        m = np.ones(t.size, dtype=bool)\n        if t_range:\n            lo = t[0] if t_range[0] is None else t_range[0]\n            hi = t[-1] if t_range[1] is None else t_range[1]\n            m = (t >= lo) & (t <= hi)\n        base = step * k if offset else 0.0\n        ax.plot(t[m], y[m] + base, lw=0.7, label=rid)\n        if offset and k == 0:\n            step = float(np.percentile(y[m], 99.5)) * 1.4 or 1.0\n    ax.set_xlabel(\"time / min\")\n    ax.set_ylabel(\"absorbance (offset) / AU\")\n    ax.set_title(title)\n    ax.legend(fontsize=7, ncol=2)\n    ax.grid(alpha=0.2)\n    return _save(fig, path)\n\n\n# ----------------------------------------------------------------------\n# モデル用ランの設計図\n# ----------------------------------------------------------------------\ndef _log_ticks(axis, values):\n    \"\"\"対数軸に実測値だけを目盛りとして出す。\n\n    対数スケールのままだと matplotlib が 6x10^0 のような補助目盛りを勝手に\n    足してきて、こちらが置いた「6.76」と重なって読めなくなります。\n    補助目盛りを消してから、実際の水準だけを並べます。\n    \"\"\"\n    ticks = sorted({round(float(v), 2) for v in values})\n    axis.set_major_locator(matplotlib.ticker.FixedLocator(ticks))\n    axis.set_major_formatter(matplotlib.ticker.FormatStrFormatter(\"%.2f\"))\n    axis.set_minor_locator(matplotlib.ticker.NullLocator())\n    axis.set_minor_formatter(matplotlib.ticker.NullFormatter())\n\n\ndef plot_design_map(runs, path=None, title=None):\n    \"\"\"モデル用ランの設計を 2 枚に分けて描く。\n\n    保持と幅では「効く軸」が違うので、同じ設計を 2 つの座標系で見せます。\n\n    左（保持）\n        横軸を勾配時間ではなく **勾配容量（tG × 流速）** にしてあります。\n        b = t0·S·ΔΦ/tG で t0 = Vm/F なので、保持の情報は勾配容量だけで決まり、\n        流速を変えても増えません。この座標で見ると、流速の腕が中心ランに\n        **重なる** ことが目で分かります（＝保持については繰り返し）。\n    右（幅）\n        横に振らないと C（流速を上げたときの N の落ち方）が決まらず、\n        縦に振らないと kE が動かないので N と V_ext が分かれません。\n    \"\"\"\n    vol = np.array([r.method.gradient.duration * r.method.flow_ml_min for r in runs])\n    T = np.array([r.method.temperature_C for r in runs])\n    F = np.array([r.method.flow_ml_min for r in runs])\n\n    # 本数がいちばん多い流速を基準（格子）とみなし、それ以外を腕とする\n    flows, counts = np.unique(F, return_counts=True)\n    f_ref = float(flows[int(np.argmax(counts))])\n    core = F == f_ref\n    arm = ~core\n\n    fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(11.5, 4.4))\n\n    # --- 左: 保持の設計空間 ---------------------------------------------\n    if arm.any():\n        ax1.scatter(vol[arm], T[arm], s=420, facecolors=\"none\",\n                    edgecolors=\"#e0851f\", lw=2.2, zorder=2)\n    ax1.scatter(vol[core], T[core], s=110, color=\"#3b82f6\", zorder=3)\n    ax1.set_xscale(\"log\")\n    _log_ticks(ax1.xaxis, vol[core])\n    ax1.set_xlabel(\"gradient volume  tG x flow / mL\")\n    ax1.set_ylabel(\"temperature / degC\")\n    ax1.set_title(\"Retention model  (3 x 3 = face-centred CCD)\", fontsize=10)\n    ax1.grid(alpha=0.25, ls=\":\")\n    ax1.annotate(\"horizontal:  log k_w and S\", xy=(0.5, -0.20),\n                 xycoords=\"axes fraction\", ha=\"center\", fontsize=8.5,\n                 color=\"#3b82f6\")\n    ax1.annotate(\"vertical:\\nalpha, beta\", xy=(1.03, 0.5),\n                 xycoords=\"axes fraction\", va=\"center\", fontsize=8.5,\n                 color=\"#3b82f6\")\n    if arm.any():\n        ax1.annotate(\"flow arm lands here\\n(same gradient volume\\n= retention replicate)\",\n                     xy=(vol[arm][0], T[arm][0]), xytext=(12, -46),\n                     textcoords=\"offset points\", fontsize=8, color=\"#e0851f\",\n                     arrowprops=dict(arrowstyle=\"->\", color=\"#e0851f\", lw=1.2))\n\n    # --- 右: 幅の設計空間 -----------------------------------------------\n    ax2.scatter(F[core], vol[core], s=110, color=\"#3b82f6\", zorder=3,\n                label=f\"grid ({int(core.sum())} runs)\")\n    if arm.any():\n        ax2.scatter(F[arm], vol[arm], s=140, marker=\"D\", color=\"#e0851f\",\n                    zorder=3, label=f\"flow arm ({int(arm.sum())} runs)\")\n    ax2.set_yscale(\"log\")\n    _log_ticks(ax2.yaxis, vol)\n    ax2.set_xlabel(\"flow / mL/min\")\n    ax2.set_ylabel(\"gradient volume / mL\")\n    ax2.set_title(\"Dispersion model  (N, V_ext, C)\", fontsize=10)\n    ax2.grid(alpha=0.25, ls=\":\")\n    ax2.legend(fontsize=8, loc=\"lower right\")\n    ax2.annotate(\"horizontal:  C only\", xy=(0.5, -0.20), xycoords=\"axes fraction\",\n                 ha=\"center\", fontsize=8.5, color=\"#e0851f\")\n    ax2.annotate(\"vertical:\\nkE, so N and\\nV_ext separate\", xy=(1.03, 0.5),\n                 xycoords=\"axes fraction\", va=\"center\", fontsize=8.5,\n                 color=\"#e0851f\")\n\n    fig.suptitle(title or f\"Model-run design  ({len(runs)} runs)\", fontsize=11)\n    fig.tight_layout(rect=(0, 0.03, 0.93, 0.96))\n    return _save(fig, path)\n", "lcmd/segments.py": "\"\"\"セグメント化グラジエント（誰も溶出しない組成域を急いで通過する）\n\n多段グラジエントの使い道は 2 つあります。\n\n1. **選択性を稼ぐ** — 混んでいる所だけ勾配を緩める\n2. **時間を削る** — **何も溶出しない組成域を急いで通り過ぎる**\n\nこのモジュールの狙いは 2 番です。誰も出てこない組成域をゆっくり登るのは\n待ち時間でしかないので、そこを急勾配区間にして削ります。\n\nただし実際には 1 番も同時に起きます。勾配の急さは**選択性そのもの**を変える\nので（S の違う成分ほど傾きへの応じ方が違う）、組み替えた結果 Rs が**上がる**\nことがあります。このサンプルデータでも、26.0 min / Rs 0.84 のリニアが\n19.3 min / Rs 2.35 になりました。時間も分離も同時に良くなる場合があるので、\n探索は「時間を削る案」と「組み替える案」の両方を候補に出します。\n\n形は自然とセグメント化になります\n------------------------------\n成分が溶出する組成の帯（溶出帯）を緩勾配のまま残し、その間の空白を急勾配に\nするので、折れ目は**空白の入口と出口に 1 つずつ**つきます。空白が n か所\nあれば急勾配区間も n か所で、1 つとは限りません。ただし空白がグラジエントの\n端（初期組成側・最終組成側）に接していると、その側の折れ目はプログラムの\n開始／終了そのものなので数えません（＝変曲点は奇数にもなります）::\n\n    %B ^                                   ______ 急\n       |                             _____/\n       |                       ~~~~~/  ← 溶出帯（ここで溶出する）\n       |                  ____/\n       |            ~~~~~/  ← 溶出帯\n       |      _____/  ← 急勾配区間（誰も出てこない）\n       +-------------------------------------> time\n\n急勾配区間はタダではありません\n------------------------------\n「誰も出てこないのだから急いでよい」——直感はそうですが、**そこを急ぐと、\nその後に出てくる全ピークの分離が落ちます**。急勾配区間では 2 成分の移動速度の\n差が縮むので、溶出組成の差 ΔΦe が小さくなるためです。実測（このモデルの\nサンプルデータ）では、47-52 %B の 5 %B を 4 倍速で通過させると、74 %B で\n出る臨界ペアの ΔΦe が 0.56 → 0.38 %B、Rs が 1.58 → 1.09 まで落ちました。\n分析時間は 1 分縮みます。**時間と分離の取引**であって、ただの節約ではありません。\n\n裏を返すと、**最後の対象ピークより後ろの組成域だけはほぼタダ**です（後ろに\n失うものが無いので）。探索はここを最優先で取りに行きます。\n\n探索のしかた（1 区間ずつ、分離度を見ながら）\n--------------------------------------------\n急勾配にしてよいかは**組成域ごとに事情が違います**。全体に効く「余裕」の\nような 1 つのつまみで決めると、空けたい所を空けるために他所まで詰めてしまい、\n臨界ペアが割を食います。そこでこのモジュールは区間ごとに判断します:\n\n1. 各成分の**溶出組成 Φe** を中心に、**そのピーク自身の幅**から決めた帯を張る\n   （帯の半幅 ＝ 半値幅の数倍 ＋ 設定誤差ぶんの下限）。重なる帯は繋げる\n2. 帯と帯の**空白**が急勾配区間の候補。1 つずつ単独で試して\n   「**何分縮むか / Rs をいくら払うか**」を測り、割のよい順に並べる\n3. その順に採用していく。倍率は二分探索で、**最小 Rs が下限を割らない範囲で\n   最も急な値**を選ぶ。判定は毎回そのグラジエントを数値積分した結果で行う\n4. 急勾配にすると溶出位置が動くので、帯を引き直してもう 1 巡する\n\n分離度は「途中で作った近似」ではなく**毎回そのグラジエントを計算した実測値**\nで判定するので、採用された区間は必ず下限を守っています。摂動（1 因子ずつ\n振る）まで見た最悪 Rs は各案について**報告するだけ**で、どこまで落とすかは\n下限を数段階振った候補を並べて選ばせます。\n\n1 つずつ足す経路では届かない形もあります（途中が下限を割ると通れないため）。\nそこで「**空白を全部まとめて同じ倍率で急勾配にする**」案も別に作り、\n同じ土俵で並べます（`uniform_plans`）。最後に、その中でいちばん良かった案を\n出発点にもう一度貪欲法をかけます。\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\n\nfrom .gradient import Gradient\nfrom .hardware import Method, System, max_flow, pressure_profile\nfrom .model import ComponentSet\nfrom .optimize import Perturbation, robust_evaluation\nfrom .simulate import simulate\n\n# 急勾配区間の上限 [%B/min]。実機のポンプとモデルの前提から、これ以上は非現実的。\nMAX_SLOPE_PCTB = 20.0\n# これより狭い空白は急勾配にしない [%B]。節約が小さいわりに変曲点が増えて、\n# 装置間でメソッドが再現しにくくなる。\nMIN_GAP_PCTB = 1.5\n# 試す倍率。急な方から順に試して、通った時点で採用する。\nSPEEDUP_LADDER = (8.0, 6.0, 4.0, 3.0, 2.0, 1.5)\n# 「全部まとめて急勾配」案で、溶出帯に足してみる余裕 [%B]。広いほど安全側。\nEXTRA_MARGINS = (0.0, 1.0, 2.0, 3.0)\n# 探索中の数値積分の刻み（t0 に対する比）。最終評価より粗くします。\n# 0.02 と 0.005 で Rs は小数第 4 位まで一致し、速度は 4 倍違います。\nSEARCH_DT_FRAC = 0.02\n\n# 溶出帯の半幅 ＝ WIDTH_FACTOR × 半値幅（Φ 換算） ＋ FLOOR_PCTB\n# 半値幅の 2 倍あればピーク本体（±2σ 強）が収まります。下限 0.5 %B は\n# ドウェル差 0.1 min × 4 %B/min ≒ 0.4 %B という設定誤差ぶんの保険です。\nWIDTH_FACTOR = 2.0\nFLOOR_PCTB = 0.5\n\n\n# ----------------------------------------------------------------------\n# グラジエントの部品\n# ----------------------------------------------------------------------\ndef ramp_slope(g: Gradient) -> float:\n    \"\"\"グラジエントの主たる傾き [分率/min]。\n\n    いちばん多くの組成を稼いでいる区間の傾きを返します。初期ホールドを\n    含めて「(Φ幅)/(全時間)」で割ると、ホールドのぶんだけ傾きを小さく\n    見積もってしまうので、区間ごとに見ます。\n    \"\"\"\n    dphi = np.diff(g.phis)\n    dt = np.diff(g.times)\n    if not np.any(dphi > 0):\n        raise ValueError(\"上昇する区間がありません。\")\n    i = int(np.argmax(np.where(dphi > 0, dphi, -np.inf)))\n    return float(dphi[i] / dt[i])\n\n\ndef initial_hold(g: Gradient) -> float:\n    \"\"\"初期組成で保持している時間 [min]（無ければ 0）。\"\"\"\n    for t, p in zip(g.times[1:], g.phis[1:]):\n        if abs(p - g.phis[0]) > 1e-12:\n            break\n        return float(t - g.times[0])\n    return 0.0\n\n\ndef merge_bands(bands) -> list[tuple[float, float]]:\n    \"\"\"重なる帯を繋げて、昇順の互いに素な区間にする。\"\"\"\n    bands = sorted((float(a), float(b)) for a, b in bands if b > a)\n    if not bands:\n        return []\n    out = [list(bands[0])]\n    for lo, hi in bands[1:]:\n        if lo <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], hi)\n        else:\n            out.append([lo, hi])\n    return [(a, b) for a, b in out]\n\n\ndef complement(spans, lo: float, hi: float,\n               min_width: float = 0.0) -> list[tuple[float, float]]:\n    \"\"\"[lo, hi] から spans を差し引いた区間（＝空白）。\"\"\"\n    out, cur = [], lo\n    for a, b in merge_bands(spans):\n        if a > cur:\n            out.append((cur, min(a, hi)))\n        cur = max(cur, b)\n        if cur >= hi:\n            break\n    if cur < hi:\n        out.append((cur, hi))\n    return [(a, b) for a, b in out if a < b and (b - a) >= min_width]\n\n\ndef elution_bands(result, tiers=(1, 2), width_factor: float = WIDTH_FACTOR,\n                  floor_pctB: float = FLOOR_PCTB,\n                  names=None) -> list[tuple[float, float]]:\n    \"\"\"成分が溶出する組成の帯（分率、昇順、重なりは結合済み）。\n\n    帯の半幅は**そのピーク自身の幅**から決めます。半値幅 [min] にその時点の\n    傾き [分率/min] を掛ければ、ピークが組成軸でどれだけの幅を占めるかが\n    出ます。幅の広いピークほど広い帯が要る、という当たり前の関係です。\n    \"\"\"\n    keep = np.isin(result.tier, np.atleast_1d(tiers)) & result.eluted\n    if names is not None:\n        keep &= np.isin(np.asarray(result.names, dtype=object),\n                        np.asarray(list(names), dtype=object))\n    if not np.any(keep):\n        return []\n    g = result.method.gradient\n    # ピークがカラムを出るときにポンプが送っていた組成の傾き\n    slope = np.abs(g.dphi_dt(result.tR - result.tD - result.t0))\n    half = width_factor * result.width_half_min * slope + floor_pctB / 100.0\n    return merge_bands([(float(p - h), float(p + h))\n                        for p, h in zip(result.phi_e[keep], half[keep])])\n\n\ndef build_segments(phi0: float, phi1: float, slope_slow: float, zones,\n                   hold_initial: float = 0.0) -> Gradient:\n    \"\"\"急勾配区間 `zones` を差し込んだグラジエントを組む。\n\n    Parameters\n    ----------\n    slope_slow : float\n        既定の傾き [分率/min]。ふつうは元のリニアの傾きをそのまま使います\n        （溶出帯の中は今までどおり ＝ 分離はそのまま、という考え方）。\n    zones : list[(lo, hi, slope)]\n        急勾配にする組成域と、その傾き [分率/min]。重なっていないこと。\n    \"\"\"\n    if not (phi1 > phi0):\n        raise ValueError(\"phi1 は phi0 より大きくしてください。\")\n    if slope_slow <= 0:\n        raise ValueError(\"既定の傾きは正の値にしてください。\")\n\n    zones = sorted((max(lo, phi0), min(hi, phi1), s) for lo, hi, s in zones\n                   if min(hi, phi1) > max(lo, phi0))\n    edges = sorted({phi0, phi1}\n                   | {x for lo, hi, _ in zones for x in (lo, hi)\n                      if phi0 < x < phi1})\n\n    times, phis = [0.0], [phi0]\n    if hold_initial > 0:\n        times.append(hold_initial)\n        phis.append(phi0)\n    t = times[-1]\n    for a, b in zip(edges[:-1], edges[1:]):\n        mid = 0.5 * (a + b)\n        slope = slope_slow\n        for lo, hi, s in zones:\n            if lo <= mid <= hi:\n                slope = s\n                break\n        t += (b - a) / slope\n        times.append(t)\n        phis.append(b)\n    return Gradient(times=np.asarray(times), phis=np.asarray(phis))\n\n\n# ----------------------------------------------------------------------\n# 結果の入れ物\n# ----------------------------------------------------------------------\n@dataclass(eq=False)   # numpy を含むので既定の __eq__ は使えない（同一性で比較）\nclass SegmentPlan:\n    \"\"\"組み上がったセグメント化グラジエントと、その評価。\"\"\"\n\n    gradient: Gradient\n    zones: list[tuple[float, float, float]]   # 急勾配区間 (lo, hi, 傾き)\n    windows: list[tuple[float, float]]        # 緩勾配区間（＝溶出帯）[分率]\n    slope_slow: float\n    rs_floor: float          # 探索で守らせた最小 Rs（課していなければ NaN）\n    Rs_nominal: float = float(\"nan\")\n    Rs_worst: float = float(\"nan\")\n    worst_label: str = \"\"\n    runtime: float = float(\"nan\")\n    runtime_linear: float = float(\"nan\")\n    Rs_linear: float = float(\"nan\")\n    all_eluted: bool = True\n    n_inside: int = 0            # 緩勾配区間で溶出した成分の数\n    n_tracked: int = 0\n    pressure_bar: float = float(\"nan\")     # 最大圧力\n    pressure_fraction: float = float(\"nan\")  # 上限に対する比\n    flow_ml_min: float = float(\"nan\")      # 使った流速（上限まで上げた場合の値）\n    result: object = None\n\n    @property\n    def n_terraces(self) -> int:\n        \"\"\"緩勾配区間（溶出帯）の数。\"\"\"\n        return len(self.windows)\n\n    @property\n    def n_zones(self) -> int:\n        return len(self.zones)\n\n    @property\n    def n_segments(self) -> int:\n        \"\"\"グラジエントプログラムの区間数（初期ホールドを除く）。\"\"\"\n        n = len(self.gradient.times) - 1\n        if abs(self.gradient.phis[1] - self.gradient.phis[0]) < 1e-12:\n            n -= 1                                  # 初期ホールドは区間に数えない\n        return max(n, 1)\n\n    @property\n    def n_inflections(self) -> int:\n        \"\"\"変曲点（傾きが変わる点）の数 ＝ 区間数 − 1。\n\n        急勾配区間は入口と出口で折れるので原則 2 つずつ増えますが、区間が\n        グラジエントの端に接していると、その側の折れ目はプログラムの開始／終了\n        そのものなので数えません（＝奇数になることがあります）。\n        \"\"\"\n        return self.n_segments - 1\n\n    @property\n    def covered(self) -> bool:\n        \"\"\"追跡している成分が全部、緩勾配区間の中で溶出しているか。\n\n        急勾配区間の途中で出るピークは隣と時間的に詰まるので分離が落ちます。\n        判定は**実際に組み上がったグラジエントの緩勾配区間**に対して行います。\n        \"\"\"\n        return self.n_tracked > 0 and self.n_inside == self.n_tracked\n\n    @property\n    def max_speedup(self) -> float:\n        \"\"\"いちばん急な区間が既定の傾きの何倍か。\"\"\"\n        if not self.zones:\n            return 1.0\n        return max(s for _lo, _hi, s in self.zones) / self.slope_slow\n\n    @property\n    def saved_min(self) -> float:\n        return float(self.runtime_linear - self.runtime)\n\n    @property\n    def saved_frac(self) -> float:\n        return (self.saved_min / self.runtime_linear\n                if self.runtime_linear > 0 else 0.0)\n\n    def zone_table(self) -> list[dict]:\n        \"\"\"急勾配区間の一覧（表示用）。\"\"\"\n        return [{\n            \"from_pctB\": lo * 100.0,\n            \"to_pctB\": hi * 100.0,\n            \"slope_pctB_min\": s * 100.0,\n            \"speedup\": s / self.slope_slow,\n            \"saved_min\": (hi - lo) * (1.0 / self.slope_slow - 1.0 / s),\n        } for lo, hi, s in self.zones]\n\n\n# ----------------------------------------------------------------------\n# 探索\n# ----------------------------------------------------------------------\ndef _trim(zones, bands, min_width: float):\n    \"\"\"溶出帯に食い込んだ急勾配区間を削る（帯に掛かった部分だけ諦める）。\"\"\"\n    out = []\n    for lo, hi, s in zones:\n        for a, b in complement(bands, lo, hi, min_width):\n            out.append((a, b, s))\n    return out\n\n\ndef _evaluate(comps, gradient, base: Method, system, tiers, dt_frac):\n    method = Method(gradient, base.temperature_C, base.flow_ml_min)\n    return method, simulate(comps, method, system, dt_frac=dt_frac)\n\n\ndef _largest_ok(steps, test):\n    \"\"\"候補の最大値から試す。多段勾配のRsに単調性を仮定しない。\"\"\"\n    for step in sorted(steps, reverse=True):\n        got = test(step)\n        if got is not None:\n            return got\n    return None\n\n\ndef probe_gaps(comps: ComponentSet, base: Method, system: System, bands, *,\n               tiers=(1, 2), speedup: float = 4.0,\n               min_gap_pctB: float = MIN_GAP_PCTB, dt_frac: float = 0.01,\n               progress=None) -> list[dict]:\n    \"\"\"空白ごとに「単独で急勾配にしたら何分縮んで、Rs をいくら払うか」を測る。\n\n    急勾配区間はその後の全ピークの分離を削るので、**割のよい所から**使わないと\n    予算（落としてよい Rs）を無駄遣いします。その順位付けのための下見です。\n    \"\"\"\n    g0 = base.gradient\n    phi0, phi1 = float(g0.phis[0]), float(g0.phis[-1])\n    slope_slow, hold = ramp_slope(g0), initial_hold(g0)\n    slope = min(slope_slow * speedup, MAX_SLOPE_PCTB / 100.0)\n\n    dt = max(dt_frac, SEARCH_DT_FRAC)\n    base_res = simulate(comps, base, system, dt_frac=dt)\n    rs0, run0 = base_res.min_rs(tiers), float(np.nanmax(base_res.tR))\n\n    gaps = complement(bands, phi0, phi1, min_gap_pctB / 100.0)\n    out = []\n    for k, (lo, hi) in enumerate(gaps):\n        g = build_segments(phi0, phi1, slope_slow, [(lo, hi, slope)], hold)\n        _m, res = _evaluate(comps, g, base, system, tiers, dt)\n        if progress is not None:\n            progress(k + 1, len(gaps))\n        saved = run0 - float(np.nanmax(res.tR))\n        cost = max(rs0 - res.min_rs(tiers), 0.0)\n        out.append({\"lo\": lo, \"hi\": hi, \"saved_min\": saved, \"rs_cost\": cost,\n                    \"value\": saved / (cost + 1e-3)})\n    out.sort(key=lambda d: -d[\"value\"])\n    return out\n\n\ndef optimize_segments(comps: ComponentSet, base: Method, system: System, *,\n                      rs_floor: float, tiers=(1, 2),\n                      ladder=SPEEDUP_LADDER, width_factor: float = WIDTH_FACTOR,\n                      floor_pctB: float = FLOOR_PCTB,\n                      min_gap_pctB: float = MIN_GAP_PCTB, passes: int = 2,\n                      bands=None, probe=None, seed_zones=(),\n                      pert: Perturbation | None = None,\n                      dt_frac: float = 0.01, progress=None) -> SegmentPlan:\n    \"\"\"空白の組成域を 1 つずつ急勾配にしていく（分離度が下限を割らない範囲で）。\n\n    `rs_floor` を割らないことだけが制約です。基準のリニアより Rs を落とさない\n    ようにしたければ基準の Rs を、目標まで使い切ってよければ目標 Rs を渡します。\n\n    `bands` / `probe` は使い回し用（下限を変えて何本か引くときに、帯と下見を\n    毎回やり直さずに済みます）。`seed_zones` には**より厳しい下限で通った\n    急勾配区間**を渡します。厳しい方で通ったものは緩い方でも必ず通るので、\n    そこから足していけば「下限をゆるめたのに遅くなった」が起きません。\n    \"\"\"\n    g0 = base.gradient\n    phi0, phi1 = float(g0.phis[0]), float(g0.phis[-1])\n    slope_slow = ramp_slope(g0)\n    hold = initial_hold(g0)\n    min_gap = min_gap_pctB / 100.0\n    cap = MAX_SLOPE_PCTB / 100.0\n\n    search_dt = max(dt_frac, SEARCH_DT_FRAC)\n    base_res = simulate(comps, base, system, dt_frac=dt_frac)\n    if bands is None:\n        bands = elution_bands(base_res, tiers, width_factor, floor_pctB)\n    if probe is None:\n        probe = probe_gaps(comps, base, system, bands, tiers=tiers,\n                           min_gap_pctB=min_gap_pctB, dt_frac=dt_frac)\n    rank = {(round(d[\"lo\"], 6), round(d[\"hi\"], 6)): i\n            for i, d in enumerate(probe)}\n\n    zones: list[tuple[float, float, float]] = sorted(seed_zones)\n    res = base_res\n    steps = sorted(sp for sp in ladder if sp > 1.0)\n    done, total = 0, max(passes, 1) * max(len(probe), 1) * 3   # 進捗の目安\n\n    for _pass in range(max(passes, 1)):\n        if not (_pass == 0 and seed_zones):\n            # 引き継いだ区間は削らない。より厳しい下限で通っているので、\n            # そのまま残せば「ゆるめたのに遅くなる」ことが起きません。\n            zones = _trim(zones, bands, min_gap)\n        if _pass == 0 and seed_zones:\n            # 引き継いだ区間は、ゆるくなった下限のぶんだけ急にできるかもしれない\n            for i in range(len(zones)):\n                lo, hi, s = zones[i]\n                higher = [sp for sp in steps if slope_slow * sp > s + 1e-12]\n\n                def up(sp, i=i, lo=lo, hi=hi):\n                    trial = sorted(zones[:i] + zones[i + 1:]\n                                   + [(lo, hi, min(slope_slow * sp, cap))])\n                    g = build_segments(phi0, phi1, slope_slow, trial, hold)\n                    _m, r = _evaluate(comps, g, base, system, tiers,\n                                      search_dt)\n                    if r.all_eluted(tiers) and r.min_rs(tiers) >= rs_floor:\n                        return trial, r\n                    return None\n\n                got = _largest_ok(higher, up)\n                if got is not None:\n                    zones, res = got\n        taken = [(lo, hi) for lo, hi, _s in zones]\n        gaps = complement(bands + taken, phi0, phi1, min_gap)\n        # 下見で測った「割のよさ」の順。下見に無い空白（帯を引き直して現れた\n        # もの）は後回しにする。\n        gaps.sort(key=lambda w: rank.get((round(w[0], 6), round(w[1], 6)),\n                                         len(probe)))\n        for lo, hi in gaps:\n            def test(sp, lo=lo, hi=hi):\n                nonlocal done\n                slope = min(slope_slow * sp, cap)\n                if slope <= slope_slow * 1.05:      # 速くならない\n                    return None\n                trial = sorted(zones + [(lo, hi, slope)])\n                g = build_segments(phi0, phi1, slope_slow, trial, hold)\n                _m, trial_res = _evaluate(comps, g, base, system, tiers,\n                                          search_dt)\n                done += 1\n                if progress is not None:\n                    progress(min(done, total), total)\n                if (trial_res.all_eluted(tiers)\n                        and trial_res.min_rs(tiers) >= rs_floor):\n                    return trial, trial_res\n                return None\n\n            got = _largest_ok(steps, test)\n            if got is not None:\n                zones, res = got\n        # 急勾配にすると溶出位置が動く。新しい位置で帯を引き直してもう 1 巡。\n        bands = elution_bands(res, tiers, width_factor, floor_pctB)\n    # 最後に引き直した帯に食い込んでいる区間を削り、Rsは再計算する。\n    zones = _trim(zones, bands, min_gap)\n\n    plan = _finish(comps, base, system, zones, rs_floor=rs_floor, tiers=tiers,\n                   width_factor=width_factor, floor_pctB=floor_pctB,\n                   min_gap=min_gap, pert=pert, dt_frac=dt_frac,\n                   base_res=base_res)\n    # 区間を削ったり傾きを変えたりしても、Rs・最終溶出が単調に変わるとは限らない。\n    # 引継ぎ元そのものを最終精度で評価し、実行可能なら速い方を残す。\n    fallback = _finish(comps, base, system, seed_zones, rs_floor=rs_floor, tiers=tiers,\n                       width_factor=width_factor, floor_pctB=floor_pctB,\n                       min_gap=min_gap, pert=pert, dt_frac=dt_frac,\n                       base_res=base_res)\n    valid = [p for p in (plan, fallback)\n             if p.all_eluted and p.covered and p.Rs_nominal >= rs_floor]\n    return min(valid, key=lambda p: p.runtime) if valid else fallback\n\n\ndef _finish(comps, base: Method, system: System, zones, *, rs_floor, tiers,\n            width_factor, floor_pctB, min_gap, pert, dt_frac,\n            base_res=None) -> SegmentPlan:\n    \"\"\"急勾配区間の並びを受け取って、仕上げてから評価する。\n\n    仕上げ ＝ 急勾配区間に入り込んでしまったピークがあれば、その区間を削る。\n    最大4回で打ち切り、最後に実際に評価した勾配と区間を返す。\n    区間の削除に対するRsの単調性は仮定せず、計算結果で判定する。\n    \"\"\"\n    g0 = base.gradient\n    phi0, phi1 = float(g0.phis[0]), float(g0.phis[-1])\n    slope_slow, hold = ramp_slope(g0), initial_hold(g0)\n    if base_res is None:\n        base_res = simulate(comps, base, system, dt_frac=dt_frac)\n\n    for _ in range(4):\n        g = build_segments(phi0, phi1, slope_slow, zones, hold)\n        method, res = _evaluate(comps, g, base, system, tiers, dt_frac)\n        windows = complement([(lo, hi) for lo, hi, _s in zones], phi0, phi1)\n        keep_mask = np.isin(res.tier, np.atleast_1d(tiers)) & res.eluted\n        phie = np.asarray(res.phi_e, dtype=float)[keep_mask]\n        inside = sum(any(lo <= x <= hi for lo, hi in windows) for x in phie)\n        if inside == phie.size or not zones or _ == 3:\n            break\n        trimmed = _trim(zones, elution_bands(res, tiers, width_factor,\n                                             floor_pctB), min_gap)\n        if trimmed == zones:\n            break\n        zones = trimmed\n\n    # 摂動（1 因子ずつ振る）まで見た最悪 Rs は、ここでは**報告するだけ**。\n    # 「どこまで分離を落としてよいか」は候補を並べて比べる側の仕事です。\n    # 名目の Rs は最終条件を細かい刻みで積分した結果から取り、摂動側は\n    # 粗い刻みで回します（Rs は小数第 4 位まで一致するので影響しません）。\n    if pert is None:\n        pert = Perturbation()\n    rb = robust_evaluation(comps, method, system, pert=pert, tiers=tiers,\n                           dt_frac=max(dt_frac, SEARCH_DT_FRAC))\n    return SegmentPlan(\n        gradient=res.method.gradient, zones=zones, windows=windows,\n        slope_slow=slope_slow, rs_floor=rs_floor,\n        Rs_nominal=res.min_rs(tiers), Rs_worst=rb[\"Rs_worst\"],\n        worst_label=rb[\"worst_label\"], runtime=float(np.nanmax(res.tR)),\n        runtime_linear=float(np.nanmax(base_res.tR)),\n        Rs_linear=base_res.min_rs(tiers),\n        all_eluted=bool(res.all_eluted(tiers) and rb[\"all_eluted\"]),\n        n_inside=int(inside), n_tracked=int(phie.size), result=res,\n    )\n\n\ndef uniform_plans(comps: ComponentSet, base: Method, system: System, bands, *,\n                  tiers=(1, 2), speedups=SPEEDUP_LADDER,\n                  extras=EXTRA_MARGINS, width_factor: float = WIDTH_FACTOR,\n                  floor_pctB: float = FLOOR_PCTB,\n                  min_gap_pctB: float = MIN_GAP_PCTB, keep: int = 3,\n                  pert: Perturbation | None = None,\n                  dt_frac: float = 0.01) -> list[SegmentPlan]:\n    \"\"\"**空白を全部まとめて**同じ倍率で急勾配にした案。\n\n    1 区間ずつ足していく貪欲法では届かない形です。急勾配は選択性そのものを\n    変える（S の違う成分の溶出順・間隔が動く）ので、**まとめて急にすると\n    かえって分離が良くなる**ことがあり、そこは 1 つずつ足す経路の途中が\n    下限を割るために辿り着けません。全部入りは 1 手で届きます。\n\n    帯に足す余裕 `extras` [%B] × 倍率 `speedups` の格子で振ります。余裕を\n    広げると急勾配区間は短く・少なくなり、溶出位置がずれても緩勾配区間に\n    留まりやすくなります（＝安全側）。\n\n    まず名目 Rs だけで当たりを付け、時間と Rs の両方で他に負けていない案\n    （パレート最適）を `keep` 本だけ本評価します。\n    \"\"\"\n    g0 = base.gradient\n    phi0, phi1 = float(g0.phis[0]), float(g0.phis[-1])\n    slope_slow, hold = ramp_slope(g0), initial_hold(g0)\n    base_res = simulate(comps, base, system, dt_frac=dt_frac)\n    rough_dt = max(dt_frac, SEARCH_DT_FRAC)\n\n    rough = []\n    for extra in sorted({max(e, 0.0) for e in extras}):\n        wide = merge_bands([(lo - extra / 100.0, hi + extra / 100.0)\n                            for lo, hi in bands])\n        gaps = complement(wide, phi0, phi1, min_gap_pctB / 100.0)\n        if not gaps:\n            continue\n        for sp in sorted({sp for sp in speedups if sp > 1.0}):\n            zones = [(a, b, min(slope_slow * sp, MAX_SLOPE_PCTB / 100.0))\n                     for a, b in gaps]\n            g = build_segments(phi0, phi1, slope_slow, zones, hold)\n            _m, res = _evaluate(comps, g, base, system, tiers, rough_dt)\n            if not res.all_eluted(tiers):\n                continue\n            rough.append((float(np.nanmax(res.tR)), res.min_rs(tiers), zones))\n    if not rough:\n        return []\n\n    # 速くも良くもない案は落とす（両方で負けている＝見る価値がない）\n    front = [r for r in rough\n             if not any(o[0] <= r[0] and o[1] >= r[1] and o is not r\n                        for o in rough)]\n    front.sort(key=lambda r: -r[1])\n    # 全部入りは「下限を守らせて解いた」案ではないので、下限は NaN。\n    return [_finish(comps, base, system, zones, rs_floor=float(\"nan\"),\n                    tiers=tiers,\n                    width_factor=width_factor, floor_pctB=floor_pctB,\n                    min_gap=min_gap_pctB / 100.0, pert=pert, dt_frac=dt_frac,\n                    base_res=base_res)\n            for _t, _rs, zones in front[:keep]]\n\n\ndef rs_floors(rs_linear: float, rs_target: float, n: int = 3) -> tuple[float, ...]:\n    \"\"\"試す Rs 下限。「分離を落とさない」から「目標まで使い切る」まで。\n\n    基準がすでに目標ぎりぎりなら、振っても同じ答えしか出ないので 1 本にします。\n    \"\"\"\n    hi = rs_linear * 0.98\n    lo = max(rs_target, rs_linear * 0.60)\n    if lo >= hi:                       # 基準が目標を下回っている → 落とせる幅で刻む\n        lo = rs_linear * 0.85\n    if n < 2 or hi - lo < 0.03 * max(rs_linear, 1e-9):\n        return (hi,)\n    step = (hi - lo) / (n - 1)\n    return tuple(round(hi - i * step, 4) for i in range(n))\n\n\ndef search_segments(comps: ComponentSet, base: Method, system: System, *,\n                    rs_target: float = 2.0, tiers=(1, 2), n_levels: int = 3,\n                    pert: Perturbation | None = None, dt_frac: float = 0.01,\n                    progress=None, **kw) -> list[SegmentPlan]:\n    \"\"\"「分離をどれだけ残すか」を数段階振って、候補を並べる。\n\n    並び順は「**目標 Rs を満たすものの中で、最も時間が短い**」。満たすものが\n    1 つも無ければ、最悪 Rs の高い順に落とします（時間より先に分離が要るので）。\n    \"\"\"\n    if pert is None:\n        pert = Perturbation()\n    base_res = simulate(comps, base, system, dt_frac=dt_frac)\n    floors = rs_floors(base_res.min_rs(tiers), rs_target, n_levels)\n\n    # 帯と下見は下限によらず同じなので 1 回だけ。以降は使い回す。\n    bands = elution_bands(base_res, tiers,\n                          kw.get(\"width_factor\", WIDTH_FACTOR),\n                          kw.get(\"floor_pctB\", FLOOR_PCTB))\n    n_probe = len(complement(bands, float(base.gradient.phis[0]),\n                             float(base.gradient.phis[-1]),\n                             kw.get(\"min_gap_pctB\", MIN_GAP_PCTB) / 100.0))\n    span = n_probe + len(floors) * max(n_probe, 1) * 3      # 進捗の目安\n\n    def phase(offset, scale):\n        def report(done, total):\n            if progress is not None:\n                progress(min(offset + done * scale / max(total, 1), span), span)\n        return report\n\n    probe = probe_gaps(comps, base, system, bands, tiers=tiers,\n                       min_gap_pctB=kw.get(\"min_gap_pctB\", MIN_GAP_PCTB),\n                       dt_frac=dt_frac, progress=phase(0, n_probe))\n\n    # 下限のきつい順に解いて、通った急勾配区間を次（ゆるい方）に引き継ぐ。\n    # こうすると「ゆるめたのに遅くなる」ことが原理的に起きません。\n    plans, seed = [], ()\n    each = max(n_probe, 1) * 3\n    for k, floor in enumerate(floors):\n        plan = optimize_segments(\n            comps, base, system, rs_floor=floor, tiers=tiers, pert=pert,\n            dt_frac=dt_frac, bands=bands, probe=probe, seed_zones=seed,\n            progress=phase(n_probe + k * each, each), **kw)\n        plans.append(plan)\n        seed = tuple(plan.zones)\n\n    # 全部まとめて急勾配にする案（貪欲法では届かない形）と、\n    # そのいちばん良かった案を出発点にした貪欲法。\n    flat = uniform_plans(comps, base, system, bands, tiers=tiers, pert=pert,\n                         dt_frac=dt_frac,\n                         **{k: v for k, v in kw.items() if k != \"passes\"})\n    plans += flat\n    if flat:\n        top = max(flat, key=lambda p: (p.Rs_worst, -p.runtime))\n        if top.zones:\n            plans.append(optimize_segments(\n                comps, base, system, rs_floor=top.Rs_nominal * 0.98,\n                tiers=tiers, pert=pert, dt_frac=dt_frac, bands=bands,\n                probe=probe, seed_zones=tuple(top.zones), **kw))\n\n    def worst(p):\n        return p.Rs_worst if np.isfinite(p.Rs_worst) else p.Rs_nominal\n\n    # 同じ時間に行き着く案が複数出るので、Rs の高い方だけ残す。さらに\n    # 「他の案より遅くて分離も悪い」案は見る価値がないので落とす（パレート）。\n    plans.sort(key=lambda p: (p.runtime, -worst(p)))\n    uniq = []\n    for p in plans:\n        if not any(abs(p.runtime - q.runtime) < 0.05 for q in uniq):\n            uniq.append(p)\n    uniq = [p for p in uniq\n            if not any(q.runtime <= p.runtime - 0.01\n                       and worst(q) >= worst(p) + 0.005 for q in uniq)]\n\n    ok = [p for p in uniq if p.all_eluted and p.covered\n          and worst(p) >= rs_target]\n    ids = {id(p) for p in ok}\n    rest = [p for p in uniq if id(p) not in ids]\n    if ok:\n        return sorted(ok, key=lambda p: p.runtime) + \\\n            sorted(rest, key=lambda p: -worst(p))\n    return sorted(uniq, key=lambda p: -worst(p))\n\n\n# ----------------------------------------------------------------------\n# 区間ごとに別々の傾きを与える探索\n# ----------------------------------------------------------------------\n# 基準の傾きの何倍を試すか。1 未満も入れてあるのは、基準のリニアが目標 Rs を\n# 満たしていないときに「その区間だけ緩める」必要があるため。\nSLOPE_LADDER = (0.5, 0.7, 0.85, 1.0, 1.25, 1.6, 2.0, 2.5, 3.2, 4.0,\n                5.0, 6.5, 8.0, 10.0, 14.0)\n\n# 隣り合う区間の傾きがこの比の中に収まっていたら 1 つにまとめる。\n# ポンプのプログラムを短く保つため。\nMERGE_RATIO = 1.08\n\n\ndef _regions(bands, phi0: float, phi1: float,\n             min_gap: float) -> list[tuple[float, float, bool]]:\n    \"\"\"組成軸を「溶出帯」と「空白」に分割する。(lo, hi, 溶出帯か)。\"\"\"\n    out = [(lo, hi, True) for lo, hi in bands\n           if min(hi, phi1) > max(lo, phi0)]\n    out += [(lo, hi, False) for lo, hi in complement(bands, phi0, phi1, min_gap)]\n    out = sorted((max(lo, phi0), min(hi, phi1), b) for lo, hi, b in out)\n    return [(lo, hi, b) for lo, hi, b in out if hi - lo > 1e-9]\n\n\ndef _merge_slopes(regions, slopes, ratio: float = MERGE_RATIO):\n    \"\"\"傾きがほぼ同じ隣接区間をまとめる（プログラムの段数を減らす）。\"\"\"\n    reg, sl = [list(regions[0]), ], [slopes[0]]\n    for (lo, hi, b), s in zip(regions[1:], slopes[1:]):\n        prev = sl[-1]\n        if max(s, prev) / min(s, prev) <= ratio:\n            reg[-1][1] = hi                     # 区間を伸ばす\n            reg[-1][2] = reg[-1][2] or b        # どちらかが溶出帯ならそう扱う\n            sl[-1] = min(s, prev)               # 安全側（緩い方）に寄せる\n        else:\n            reg.append([lo, hi, b]); sl.append(s)\n    return [tuple(r) for r in reg], sl\n\n\ndef optimize_slopes(comps: ComponentSet, base: Method, system: System, *,\n                    rs_floor: float, tiers=(1, 2), focus=None, passes: int = 2,\n                    ladder=SLOPE_LADDER, max_slope_pctB: float = MAX_SLOPE_PCTB,\n                    min_gap_pctB: float = MIN_GAP_PCTB,\n                    width_factor: float = WIDTH_FACTOR,\n                    floor_pctB: float = FLOOR_PCTB,\n                    pert: \"Perturbation | None\" = None,\n                    dt_frac: float = SEARCH_DT_FRAC,\n                    pressure_limit: float = 0.90, adjust_flow: bool = False,\n                    progress=None) -> SegmentPlan:\n    \"\"\"**区間ごとに必要なだけの傾き**を与えたグラジエントを組む。\n\n    :func:`search_segments` は「1 つの基準の傾き ＋ 空白を急勾配で飛ばす」\n    という組み方でした。実データで比べてみると、時間短縮の大半は**空白を\n    飛ばすこと**からではなく、**溶出帯ごとに必要なだけの傾きを与えること**\n    から来ます。\n\n    目的成分が 2 群に分かれていて、片方は緩い傾きが要るがもう片方は要らない、\n    という状況では、リニアは**厳しい方の群に全区間を合わせてしまう**。\n    そこで捨てている時間の方が、空白を飛ばして稼げる時間よりずっと大きい\n    （実測例では 23.4 分の短縮のうち 21.5 分がこちら、1.9 分が空白）。\n\n    やり方は座標降下です。区間を 1 つずつ取り上げ、他を固定したまま\n    「Rs が ``rs_floor`` を割らない最も急な傾き」を二分探索で決める。\n    Rs は傾きに対して単調に下がるので二分探索してよい。\n\n    Parameters\n    ----------\n    rs_floor : float\n        守らせる最小 Rs。\n    focus : 成分名の集合, optional\n        与えると「この成分を含むペア」だけを守ります。相手は誰でもよいので、\n        **目的成分と夾雑の重なりも数えます**。tiers で目的成分だけに絞ると\n        相手側まで候補から消え、夾雑との重なりを見落とします。\n    passes : int\n        座標降下を何巡するか。1 巡目で全区間が急になると相互作用で Rs が\n        変わるので、既定は 2 巡。\n    pressure_limit : float\n        圧力上限の何割まで使うか。既定 0.90（1 割の余裕を残す）。\n    adjust_flow : bool\n        True なら、**その温度で圧力上限を超えない最速の流速**に上げてから\n        傾きを最適化します。\n\n    Notes\n    -----\n    圧力はグラジエントの**形では変わりません**。圧力の山は粘度が最大になる\n    組成（水/ACN なら 10-20 %B 付近）で決まり、そこはどんなプログラムでも\n    必ず通るからです。だから ``pressure_limit`` は傾きの探索を縛りません。\n    効くのは ``adjust_flow`` の方で、こちらは分析時間に直接効きます。\n    \"\"\"\n    if pert is None:\n        pert = Perturbation()\n    if adjust_flow:\n        base = base.with_flow(max_flow(system, base, pressure_limit))\n    g0 = base.gradient\n    phi0, phi1 = float(g0.phis[0]), float(g0.phis[-1])\n    base_slope, hold = ramp_slope(g0), initial_hold(g0)\n    base_res = simulate(comps, base, system, dt_frac=dt_frac)\n\n    bands = elution_bands(base_res, tiers, width_factor, floor_pctB,\n                          names=focus)\n    regions = _regions(bands, phi0, phi1, min_gap_pctB / 100.0)\n    if not regions:\n        regions = [(phi0, phi1, True)]\n    slopes = [base_slope] * len(regions)\n    cap = max_slope_pctB / 100.0\n\n    def build(sl):\n        return build_segments(\n            phi0, phi1, base_slope,\n            [(lo, hi, s) for (lo, hi, _b), s in zip(regions, sl)], hold)\n\n    def rs_of(sl):\n        _m, r = _evaluate(comps, build(sl), base, system, tiers, dt_frac)\n        if not r.all_eluted(tiers):\n            return None\n        return float(r.min_rs(tiers, focus))\n\n    def slope_at(x):\n        \"\"\"組成 x を含む区間の傾き（無ければいちばん緩い値）。\"\"\"\n        for (lo, hi, _b), s in zip(regions, slopes):\n            if lo <= x <= hi:\n                return s\n        return min(slopes)\n\n    total, done = passes * max(len(regions), 1), 0\n    for p_i in range(passes):\n        for i in range(len(regions)):\n            def test(mult, i=i):\n                trial = list(slopes)\n                trial[i] = min(base_slope * mult, cap)\n                rs = rs_of(trial)\n                return mult if (rs is not None and rs >= rs_floor) else None\n            got = _largest_ok(ladder, test)\n            if got is not None:\n                slopes[i] = min(base_slope * got, cap)\n            done += 1\n            if progress:\n                progress(done, total)\n\n        # 帯を引き直す。傾きを変えるとピークの溶出組成が動くので、最初の\n        # リニアから作った帯はもう合っていない。ここを怠ると目的成分が\n        # 急勾配区間に入り込んだまま「Rs は足りている」と誤判定する。\n        if p_i < passes - 1:\n            _m, r = _evaluate(comps, build(slopes), base, system, tiers, dt_frac)\n            nb = elution_bands(r, tiers, width_factor, floor_pctB, names=focus)\n            nr = _regions(nb, phi0, phi1, min_gap_pctB / 100.0)\n            if nr:\n                new_slopes = [slope_at(0.5 * (lo + hi)) for lo, hi, _b in nr]\n                # 溶出帯になった区間は緩い側に戻してから次の巡へ\n                new_slopes = [min(s, base_slope) if b else s\n                              for s, (_lo, _hi, b) in zip(new_slopes, nr)]\n                regions, slopes = nr, new_slopes\n                total = passes * max(len(regions), 1)\n\n    # 急勾配区間の中で溶出する目的成分があっても、それ自体は問題では\n    # ありません（急勾配はバンド圧縮も効かせるので、時間差が縮むぶんを\n    # ピーク幅の縮小が上回ることがある）。危ないのは「名目は足りているが\n    # 少しずらすと崩れる」場合なので、判定は下の摂動評価に任せます。\n\n    regions, slopes = _merge_slopes(regions, slopes)\n    g = build_segments(phi0, phi1, base_slope,\n                       [(lo, hi, s) for (lo, hi, _b), s in zip(regions, slopes)],\n                       hold)\n    _method, res = _evaluate(comps, g, base, system, tiers, dt_frac)\n\n    # 溶出帯（緩勾配側）＝ いちばん緩い傾きの区間。急勾配側を zones に入れる。\n    slow = min(slopes)\n    windows = [(lo, hi) for (lo, hi, _b), s in zip(regions, slopes)\n               if s <= slow * MERGE_RATIO]\n    zones = [(lo, hi, s) for (lo, hi, _b), s in zip(regions, slopes)\n             if s > slow * MERGE_RATIO]\n    keep = np.isin(res.tier, np.atleast_1d(tiers)) & res.eluted\n    phie = np.asarray(res.phi_e, dtype=float)[keep]\n    inside = sum(any(lo <= x <= hi for lo, hi in windows) for x in phie)\n\n    rb = robust_evaluation(comps, res.method, system, pert=pert, tiers=tiers,\n                           dt_frac=max(dt_frac, SEARCH_DT_FRAC))\n    # 名目では足りていても、1 因子ずらしただけで崩れる解は使えない。\n    # ただし基準にすべきは rs_floor ではなく**リニアの最悪 Rs**。\n    # rs_floor（名目の下限）を摂動側にも課すと、リニア自身が満たせないので\n    # 際限なく緩んで最後にはリニアに戻ってしまう。\n    rb_lin = robust_evaluation(comps, base, system, pert=pert, tiers=tiers,\n                               dt_frac=max(dt_frac, SEARCH_DT_FRAC))\n    floor_worst = min(rs_floor, float(rb_lin[\"Rs_worst\"]))\n    for _ in range(6):\n        if not np.isfinite(rb[\"Rs_worst\"]) or rb[\"Rs_worst\"] >= floor_worst:\n            break\n        if not zones:\n            break\n        slopes = [max(s / 1.6, slow) for s in slopes]\n        regions, slopes = _merge_slopes(regions, slopes)\n        g = build_segments(\n            phi0, phi1, base_slope,\n            [(lo, hi, s) for (lo, hi, _b), s in zip(regions, slopes)], hold)\n        _method, res = _evaluate(comps, g, base, system, tiers, dt_frac)\n        slow = min(slopes)\n        windows = [(lo, hi) for (lo, hi, _b), s in zip(regions, slopes)\n                   if s <= slow * MERGE_RATIO]\n        zones = [(lo, hi, s) for (lo, hi, _b), s in zip(regions, slopes)\n                 if s > slow * MERGE_RATIO]\n        keep = np.isin(res.tier, np.atleast_1d(tiers)) & res.eluted\n        phie = np.asarray(res.phi_e, dtype=float)[keep]\n        inside = sum(any(lo <= x <= hi for lo, hi in windows) for x in phie)\n        rb = robust_evaluation(comps, res.method, system, pert=pert,\n                               tiers=tiers, dt_frac=max(dt_frac, SEARCH_DT_FRAC))\n\n    pmax = float(pressure_profile(system, res.method)[\"max_bar\"])\n    return SegmentPlan(\n        gradient=res.method.gradient, zones=zones, windows=windows,\n        slope_slow=slow, rs_floor=rs_floor,\n        Rs_nominal=res.min_rs(tiers, focus), Rs_worst=rb[\"Rs_worst\"],\n        worst_label=rb[\"worst_label\"], runtime=float(np.nanmax(res.tR)),\n        runtime_linear=float(np.nanmax(base_res.tR)),\n        Rs_linear=base_res.min_rs(tiers, focus),\n        all_eluted=bool(res.all_eluted(tiers) and rb[\"all_eluted\"]),\n        n_inside=int(inside), n_tracked=int(phie.size),\n        pressure_bar=pmax,\n        pressure_fraction=pmax / system.max_pressure_bar,\n        flow_ml_min=float(base.flow_ml_min), result=res,\n    )\n\n\ndef search_slopes(comps: ComponentSet, base: Method, system: System, *,\n                  rs_target: float = 2.0, tiers=(1, 2), focus=None,\n                  pressure_limit: float = 0.90, adjust_flow: bool = False,\n                  n_levels: int = 3,\n                  pert: \"Perturbation | None\" = None,\n                  dt_frac: float = SEARCH_DT_FRAC,\n                  progress=None, **kw) -> list[SegmentPlan]:\n    \"\"\":func:`optimize_slopes` を Rs の下限を数段階振って回し、候補を並べる。\n\n    並び順は :func:`search_segments` と同じで、**目標 Rs を満たすものの中で\n    最短**が先頭。満たすものが無ければ最悪 Rs の高い順。\n    \"\"\"\n    base_res = simulate(comps, base, system, dt_frac=dt_frac)\n    floors = rs_floors(base_res.min_rs(tiers, focus), rs_target, n_levels)\n    plans, span, done = [], max(len(floors), 1), 0\n\n    def sub(a, b):\n        def inner(d, t):\n            if progress:\n                progress(done + (d / max(t, 1)), span)\n        return inner\n\n    for k, floor in enumerate(floors):\n        plans.append(optimize_slopes(\n            comps, base, system, rs_floor=floor, tiers=tiers, focus=focus,\n            pert=pert, dt_frac=dt_frac, pressure_limit=pressure_limit,\n            adjust_flow=adjust_flow, progress=sub(k, len(floors)), **kw))\n        done = k + 1\n        if progress:\n            progress(done, span)\n\n    ok = [p for p in plans if p.all_eluted and p.Rs_worst >= rs_target\n          and p.pressure_fraction <= pressure_limit + 1e-9]\n    rest = [p for p in plans if p not in ok]\n    return (sorted(ok, key=lambda p: p.runtime)\n            + sorted(rest, key=lambda p: -p.Rs_worst))\n", "lcmd/simulate.py": "\"\"\"保持時間・ピーク幅・分離度の計算（このパッケージの心臓部）\n\n■ 保持時間 tR — なぜ数値積分が要るか\n多段グラジエントを同じ手順で扱うため、\n溶質をカラムの中で少しずつ動かして、出口に着いた時刻を拾います。\n\n溶質のカラム内位置を z ∈ [0,1]（0 = 入口, 1 = 出口）とすると\n\n    dz/dt = 1 / (t0 · (1 + k))\n\nk が大きいほど遅く進む、というだけの式です。k はその瞬間その場所の\n移動相組成で決まります:\n\n    Φ_local(z, t) = Φ_prog(t − tD − z·t0)\n\n「ポンプが組成を変えてから tD 遅れてカラム入口に届き、そこからさらに\n移動相と同じ速さで進むので、位置 z に届くまで z·t0 かかる」という意味。\nこの \"カラム内の界面移動\" 補正が多段では効きます（リニアでは影響が小さい）。\n\n■ ピーク幅 σ\n    σ_col = t0 · (1 + kE) · G / √N          （kE = 溶出時点の k）\n    σ_tot = √(σ_col² + σ_ext²)\n\nG は溶出までの組成履歴から積分するバンド圧縮係数。グラジエントではピークの後ろ側の方が強い溶媒に\n乗るので前より速く進み、ピークが「押し縮められて」細くなります。\nその効果が G（0.58〜1.0、実用条件では 0.8-0.88）。無視すると Rs を\n1-2 割過小評価します。\n\n■ 分離度 Rs\n    Rs = |tR2 − tR1| / (2·(σ1 + σ2))\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\n\nfrom .gradient import Gradient\nfrom .hardware import Method, System\nfrom .model import LOGK_MAX, LOGK_MIN, ComponentSet\n\n# 教科書の式に出てくる「2.3」は ln(10) = 2.302585... の丸めです。\n# 本ツールでは厳密値を使います。丸めた 2.3 のままだと、この系の条件で\n# 保持時間が約 0.005 min（0.3 秒）系統的にずれ、数値積分との突き合わせで\n# 「実装バグかな?」と悩む原因になります。\nLN10 = float(np.log(10.0))\n_QUAD_X, _QUAD_W = np.polynomial.legendre.leggauss(32)\n\n\ndef history_compression(gradient, logkw, S, t_prog, kE, t0, tD):\n    \"\"\"溶出までの組成履歴を積分する一定段高モデル。\n\n    τ=t−tD−z·t0 とすると、G²=[kE/(1+kE)]²/t0 ×\n    ∫[-tD, τE] (1+k(τ))²/k(τ)³ dτ。\n    Hao et al., J. Chromatogr. A 1619 (2020) 460908、および\n    https://pmc.ncbi.nlm.nih.gov/articles/PMC9274839/ の式(10)。\n    各折れ線区間で32点Gauss積分。初期・最終ホールドも含む。\n    局所勾配だけから計算すると、段の直後で幅が不連続になるため使用しない。\n    \"\"\"\n    end = np.asarray(t_prog)\n    integral = np.zeros_like(end)\n    max_end = max(float(np.max(end)), -tD)\n    knots = sorted(set([-tD, max_end] +\n                       [float(x) for x in gradient.times if -tD < x < max_end]))\n    for left, right in zip(knots[:-1], knots[1:]):\n        span = np.maximum(0.0, np.minimum(end, right) - left)\n        tau = left + span[:, None] * (_QUAD_X[None, :] + 1.0) / 2.0\n        phi = gradient.phi(tau)\n        lk = LN10 * np.clip(logkw[:, None] - S[:, None] * phi,\n                            LOGK_MIN, LOGK_MAX)\n        # kEで規格化してから積分し、極端なkでも積の桁あふれを避ける。\n        logf = (2 * np.log(kE / (1 + kE)))[:, None] + 2 * np.logaddexp(0, lk) - 3 * lk\n        integral += span / 2 * (np.exp(logf) @ _QUAD_W)\n    return np.sqrt(np.maximum(integral / t0, 0.0))\n\n\n# ----------------------------------------------------------------------\n# バンド圧縮係数 G（Poppe の式）\n# ----------------------------------------------------------------------\ndef compression_factor(b_local, kE):\n    \"\"\"比較用の局所近似G。simulate本体はhistory_compressionを使う。\n\n    p     = ln(10) · b_local · kE/(1+kE)      （教科書の「2.3」は ln(10)）\n    G     = √((1 + p + p²/3) / (1+p)²)\n\n    b_local = t0 · S · (dΦ/dt at elution)   ※Φ は分率\n    p → 0 で G = 1（圧縮なし）、p → ∞ で G = 1/√3 ≈ 0.577。\n    \"\"\"\n    p = LN10 * np.asarray(b_local, dtype=float) * (kE / (1.0 + kE))\n    p = np.maximum(p, 0.0)  # 下り勾配など負になる場合は圧縮なし扱い\n    return np.sqrt((1.0 + p + p**2 / 3.0) / (1.0 + p) ** 2)\n\n\n# ----------------------------------------------------------------------\n# 結果の入れ物\n# ----------------------------------------------------------------------\n@dataclass\nclass SimResult:\n    \"\"\"1 ランの予測結果。\"\"\"\n\n    names: list[str]\n    tier: np.ndarray\n    tR: np.ndarray           # 保持時間[min]（溶出しなければ NaN）\n    sigma: np.ndarray        # 総ピーク標準偏差[min]\n    sigma_col: np.ndarray    # カラム由来のみ\n    kE: np.ndarray           # 溶出時点の保持係数\n    phi_e: np.ndarray        # 溶出時点の Φ（分率）\n    G: np.ndarray            # バンド圧縮係数\n    b_local: np.ndarray      # 溶出時点の局所勾配パラメータ\n    eluted: np.ndarray       # bool。t_max までに出てきたか\n    t0: float\n    tD: float\n    plates: float\n    method: Method\n\n    # --- 便利メソッド -------------------------------------------------\n    @property\n    def width_half_min(self) -> np.ndarray:\n        \"\"\"半値幅[min]（＝ 2.355·σ）。実測と突き合わせるのはこれ。\"\"\"\n        return 2.35482 * self.sigma\n\n    def order(self) -> np.ndarray:\n        \"\"\"溶出順のインデックス（溶出しなかったものは末尾）。\"\"\"\n        t = np.where(self.eluted, self.tR, np.inf)\n        return np.argsort(t, kind=\"stable\")\n\n    def pairs(self, tiers=(1, 2), adjacent=True) -> list[dict]:\n        \"\"\"溶出順で隣り合うペアの分離度。\n\n        adjacent=False なら非隣接を含む全ペアを返す。目的ピークだけに\n        制約を課す場合、離れた幅広い夾雑ピークも評価する必要がある。\n        \"\"\"\n        keep = np.isin(self.tier, np.atleast_1d(tiers)) & self.eluted\n        idx = [i for i in self.order() if keep[i]]\n        out = []\n        pair_indices = (zip(idx[:-1], idx[1:]) if adjacent else\n                        ((a, b) for k, a in enumerate(idx) for b in idx[k + 1:]))\n        for a, b in pair_indices:\n            dt = abs(self.tR[b] - self.tR[a])\n            rs = dt / (2.0 * (self.sigma[a] + self.sigma[b]))\n            out.append(\n                {\n                    \"i\": int(a),\n                    \"j\": int(b),\n                    \"first\": self.names[a],\n                    \"second\": self.names[b],\n                    \"tR_first\": float(self.tR[a]),\n                    \"tR_second\": float(self.tR[b]),\n                    \"delta_tR\": float(dt),\n                    \"Rs\": float(rs),\n                    # 注意: これは「選択性 α」ではありません。グラジエントでは\n                    # 全ピークがほぼ同じ k で溶出するので、この比は常に 1 付近に\n                    # なります。N_req に使う α は design.critical_n_req() が\n                    # 「共通の組成での k の比」として別途計算します。\n                    \"kE_ratio\": float(self.kE[b] / self.kE[a]) if self.kE[a] > 0 else np.inf,\n                    \"phi_e_mean\": float(0.5 * (self.phi_e[a] + self.phi_e[b])),\n                }\n            )\n        return out\n\n    def _focused(self, tiers, focus):\n        \"\"\"`focus` が与えられたら、その成分を含むペアだけに絞る。\n\n        「この成分たちは**他の何から見ても**分かれていてほしいが、それ以外\n        どうしはいくら重なってもよい」という要求を表すためのものです。\n        tiers で絞ると相手側まで候補から消えてしまい、目的成分と夾雑の\n        重なりを見落とします（実際それで無意味に速い解が出ました）。\n        \"\"\"\n        ps = self.pairs(tiers, adjacent=focus is None)\n        if focus is None:\n            return ps\n        f = set(focus)\n        unknown = f.difference(self.names)\n        if unknown:\n            raise ValueError(f\"focus に未知の成分があります: {sorted(unknown)}\")\n        if not f:\n            raise ValueError(\"focus は少なくとも1成分を含めてください。\")\n        return [p for p in ps if p[\"first\"] in f or p[\"second\"] in f]\n\n    def min_rs(self, tiers=(1, 2), focus=None) -> float:\n        \"\"\"最小分離度。ペアが 1 つも無ければ inf。\n\n        focus : 成分名の集合, optional\n            与えると「focus の成分を含む隣接ペア」だけを見ます。相手は\n            tiers に入っていれば誰でもよい（＝夾雑も相手に数える）。\n        \"\"\"\n        ps = self._focused(tiers, focus)\n        return min((p[\"Rs\"] for p in ps), default=np.inf)\n\n    def critical_pair(self, tiers=(1, 2), focus=None) -> dict | None:\n        ps = self._focused(tiers, focus)\n        return min(ps, key=lambda p: p[\"Rs\"]) if ps else None\n\n    def all_eluted(self, tiers=(1, 2)) -> bool:\n        keep = np.isin(self.tier, np.atleast_1d(tiers))\n        return bool(np.all(self.eluted[keep]))\n\n    def table(self, tiers=(1, 2, 3)) -> str:\n        head = (\n            f\"{'#':>3} {'name':<26}{'tier':>5}{'tR':>9}{'phi_e%':>9}\"\n            f\"{'kE':>8}{'G':>7}{'w1/2':>9}{'Rs(prev)':>10}\"\n        )\n        lines = [head, \"-\" * len(head)]\n        ps = {p[\"j\"]: p[\"Rs\"] for p in self.pairs(tuple(tiers))}\n        n = 0\n        for i in self.order():\n            if self.tier[i] not in np.atleast_1d(tiers):\n                continue\n            n += 1\n            rs = ps.get(int(i))\n            rs_s = f\"{rs:>10.2f}\" if rs is not None else f\"{'-':>10}\"\n            if not self.eluted[i]:\n                lines.append(f\"{n:>3} {self.names[i]:<26}{int(self.tier[i]):>5}\"\n                             f\"{'not eluted':>9}\
