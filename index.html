")\n                continue\n            lines.append(\n                f\"{n:>3} {self.names[i]:<26}{int(self.tier[i]):>5}\"\n                f\"{self.tR[i]:>9.3f}{self.phi_e[i] * 100:>9.2f}\"\n                f\"{self.kE[i]:>8.2f}{self.G[i]:>7.3f}\"\n                f\"{self.width_half_min[i]:>9.4f}{rs_s}\"\n            )\n        return \"\\n\".join(lines)\n\n\n# ----------------------------------------------------------------------\n# 数値積分本体\n# ----------------------------------------------------------------------\ndef simulate(\n    comps: ComponentSet,\n    method: Method,\n    system: System,\n    dt_frac: float = 0.01,\n    t_max: float | None = None,\n) -> SimResult:\n    \"\"\"任意のグラジエント × 温度 × 流速で全成分の tR・σ を予測する。\n\n    Parameters\n    ----------\n    dt_frac : float\n        積分刻み幅を t0 の何倍にするか。既定 0.01（＝ t0 の 1/100）。\n        探索でたくさん回すときは 0.02 くらいまでなら実用上ほぼ同じです。\n    t_max : float\n        これを過ぎても出てこない成分は「溶出せず」扱い。既定は\n        グラジエント終了後 30·t0（最低 10 min）まで。\n\n    Notes\n    -----\n    積分は中点法（2 次精度）。全成分を 1 本の NumPy 配列で同時に進めるので、\n    成分数が増えてもほとんど遅くなりません。\n    \"\"\"\n    g: Gradient = method.gradient\n    if not np.isfinite(dt_frac) or dt_frac <= 0:\n        raise ValueError(\"dt_frac は有限の正の値にしてください。\")\n    if t_max is not None and (not np.isfinite(t_max) or t_max <= 0):\n        raise ValueError(\"t_max は有限の正の値にしてください。\")\n    T = method.temperature_C\n    F = method.flow_ml_min\n\n    t0 = system.t0(F)\n    tD = system.tD(F)\n    N = system.plates_at(F)   # van Deemter を設定していれば流速で変わる\n    n = len(comps)\n\n    # 温度を固定してしまえば、log k は Φ の一次式。係数を先に出しておく。\n    A = comps.logkw(T)       # 切片\n    B = comps.S(T)           # 傾き（符号は式の中で引く）\n    gt, gp = g.times, g.phis\n\n    def k_of(phi):\n        return np.power(10.0, np.clip(A - B * phi, LOGK_MIN, LOGK_MAX))\n\n    dt = dt_frac * t0\n    if t_max is None:\n        t_max = tD + t0 + g.duration + max(10.0, 30.0 * t0)\n\n    z = np.zeros(n)\n    tR = np.full(n, np.nan)\n    t = 0.0\n    inv_t0 = 1.0 / t0\n\n    while t < t_max:\n        active = z < 1.0\n        if not active.any():\n            break\n\n        # --- 中点法 1 段目 ---\n        phi1 = np.interp(t - tD - z * t0, gt, gp)\n        f1 = inv_t0 / (1.0 + k_of(phi1))\n        z_mid = z + 0.5 * dt * f1\n\n        # --- 中点法 2 段目 ---\n        phi2 = np.interp(t + 0.5 * dt - tD - z_mid * t0, gt, gp)\n        f2 = inv_t0 / (1.0 + k_of(phi2))\n        z_new = z + dt * f2\n\n        # --- 出口通過の検出（線形補間で通過時刻を求める）---\n        crossed = active & (z_new >= 1.0)\n        if crossed.any():\n            frac = (1.0 - z[crossed]) / (z_new[crossed] - z[crossed])\n            tR[crossed] = t + frac * dt\n\n        z = np.where(active, z_new, z)\n        t += dt\n\n    eluted = ~np.isnan(tR)\n\n    # --- 溶出時点の量（kE, G, σ）---\n    # 溶出時の「プログラム時刻」= tR − tD − t0。\n    # ここでの Φ とその傾きが、ピーク幅を決める。\n    t_prog = np.where(eluted, tR - tD - t0, 0.0)\n    phi_e = g.phi(t_prog)\n    kE = k_of(phi_e)\n    dphidt = g.dphi_dt(t_prog)\n    b_local = t0 * B * dphidt\n    G = history_compression(g, A, B, t_prog, kE, t0, tD)\n\n    sigma_col = t0 * (1.0 + kE) * G / np.sqrt(N)\n    # 装置分散は容積で与えられていれば流速で割る（時間固定だと流速スキャンで\n    # 寄与を過大評価する）。詳しくは System のドキュメント。\n    sigma_ext = system.sigma_ext_at(F)\n    sigma = np.sqrt(sigma_col**2 + sigma_ext**2)\n\n    nan = np.where(eluted, 1.0, np.nan)\n    return SimResult(\n        names=list(comps.names),\n        tier=comps.tier.copy(),\n        tR=tR,\n        sigma=sigma * nan,\n        sigma_col=sigma_col * nan,\n        kE=kE * nan,\n        phi_e=phi_e * nan,\n        G=G * nan,\n        b_local=b_local * nan,\n        eluted=eluted,\n        t0=t0,\n        tD=tD,\n        plates=N,\n        method=method,\n    )\n\n\n# ----------------------------------------------------------------------\n# 解析解（リニアグラジエント専用。検算とフィットの高速化に使う）\n# ----------------------------------------------------------------------\ndef analytic_tr_linear(\n    logkw, S, phi0: float, delta_phi: float, tG: float, t0: float, tD: float,\n    dwell_migration: bool = True,\n):\n    \"\"\"リニアグラジエントの保持時間の解析解（LSS）。\n\n        b  = t0·S·ΔΦ / tG\n        k0 = 10^(log k_w − S·Φ0)\n\n    教科書形（Snyder & Dolan）:\n\n        tR = (t0/b)·log10(2.3·b·k0 + 1) + t0 + tD\n\n    厳密形（dwell_migration=True、既定）:\n\n        tR = (t0/b)·log10(2.3·b·k0 + 1 − 2.3·b·tD/t0) + t0 + tD\n\n    最後の項について\n    ----------------\n    教科書形は「ドウェル時間 tD の間、溶質はカラム入口に留まっている」と\n    暗に仮定しています。実際には溶質は初期組成 Φ0 のまま少し進みます。\n    進む距離は z1 = tD/(t0·k0) で、これを厳密に解くと上の追加項が出ます。\n\n    導出: τ = t − tD − z·t0 とおくと dz/dτ = 1/(t0·k(τ)) という簡単な式に\n    なり、τ が −tD から 0 まで（＝プレ溶出区間）と 0 以降を繋いで積分できます。\n\n    k0 が大きい（＝よく保持される）ほどこの項は小さく、教科書形と一致します。\n    逆に初期組成での保持が弱い早期溶出ピークでは無視できません。本ツールの\n    条件では 0.1-0.2 min の差になり、これが\n    「tD 依存の系統誤差 → Hao et al. (2020) の拡張版」に相当します。\n\n    t=0から始まる1本のリニア勾配と、その前後の一定組成に対応する。\n    初期組成での早期溶出と、勾配終了後の溶出も処理する。多段はsimulateを使う。\n    \"\"\"\n    logkw = np.asarray(logkw, dtype=float)\n    S = np.asarray(S, dtype=float)\n    b = t0 * S * delta_phi / tG\n    k0 = np.power(10.0, np.clip(logkw - S * phi0, LOGK_MIN, LOGK_MAX))\n\n    # b がほぼ 0（＝ほぼアイソクラティック）のときは極限をとる\n    small = np.abs(b) < 1e-12\n    b_safe = np.where(small, 1.0, b)\n\n    arg = LN10 * b_safe * k0 + 1.0\n    if dwell_migration:\n        arg = arg - LN10 * b_safe * tD / t0\n    # ドウェル中に溶出しきってしまう場合（tD >= t0·k0）はアイソクラティック扱い\n    escaped = (tD >= t0 * k0) | (arg <= 0.0)\n    arg = np.where(escaped, 1.0, arg)\n\n    tr_grad = (t0 / b_safe) * np.log10(arg) + t0 + tD\n    # 注入時刻は0。ドウェルは溶媒プログラムの遅れであり、試料の待機時間ではない。\n    tr_iso = t0 * (1.0 + k0) + (0.0 if dwell_migration else tD)\n    # 勾配終了後は最終組成を保持する。リニアを無限に延長してはいけない。\n    a = LN10 * b_safe / t0\n    z_pre = tD / (t0 * k0) if dwell_migration else 0.0\n    z_ramp = np.expm1(np.clip(a * tG, -700, 700)) / (a * t0 * k0)\n    k_end = np.power(10.0, np.clip(logkw - S * (phi0 + delta_phi),\n                                  LOGK_MIN, LOGK_MAX))\n    tr_post = tD + t0 + tG + (1.0 - z_pre - z_ramp) * t0 * k_end\n    tr_grad = np.where(z_pre + z_ramp < 1.0, tr_post, tr_grad)\n    return np.where(small | escaped, tr_iso, tr_grad)\n\n\ndef is_simple_linear(g: Gradient) -> bool:\n    \"\"\"解析解が使える形か（節点 2 個・t=0 始まり）を判定。\"\"\"\n    return g.times.size == 2 and abs(g.times[0]) < 1e-12\n\n\n# ----------------------------------------------------------------------\n# 便利関数\n# ----------------------------------------------------------------------\ndef phi_e_from_tr(tR, method: Method, system: System):\n    \"\"\"実測 tR から溶出組成 Φe を逆算する（溶出組成の分布図用）。\n\n        Φe = Φ0 + (ΔΦ/tG)·(tR − t0 − tD)\n\n    フィット前でも、実測クロマトグラムだけで「どのピークがどの組成で\n    出ているか」が分かります。台帳づくりの主役。\n    \"\"\"\n    g = method.gradient\n    t0 = system.t0(method.flow_ml_min)\n    tD = system.tD(method.flow_ml_min)\n    return g.phi(np.asarray(tR, dtype=float) - t0 - tD)\n\n\ndef last_elution(result: SimResult, tiers=(1, 2, 3)) -> float:\n    \"\"\"最終溶出時刻。1 本も出ていなければ NaN（警告を出さずに）。\n\n    np.nanmax は全部 NaN だと RuntimeWarning を出して NaN を返すので、\n    「誰も溶出しなかった」条件を素通しさせないための小さなラッパです。\n    \"\"\"\n    keep = np.isin(result.tier, np.atleast_1d(tiers)) & result.eluted\n    if not keep.any():\n        return float(\"nan\")\n    return float(np.max(result.tR[keep]))\n\n\ndef chromatogram(result: SimResult, areas=None, npoints: int = 4000,\n                 t_range=None, tiers=(1, 2, 3)):\n    \"\"\"予測クロマトグラム（ガウシアンの重ね合わせ）を返す。\n\n    1 本も溶出していない場合は、空のシグナル（長さ npoints のゼロ配列）を\n    返します。呼び出し側で「ピークが無い」ことを表示できるようにするためです。\n\n    Returns\n    -------\n    t : ndarray, signal : ndarray\n    \"\"\"\n    keep = np.isin(result.tier, np.atleast_1d(tiers)) & result.eluted\n    idx = np.flatnonzero(keep)\n    if areas is None:\n        areas = np.ones(len(result.names))\n    areas = np.asarray(areas, dtype=float)\n    if t_range is not None:\n        lo, hi = t_range\n    elif idx.size == 0:\n        lo, hi = 0.0, max(result.method.gradient.duration, 1.0)\n    else:\n        lo = float(np.min(result.tR[idx])) - 1.0\n        hi = float(np.max(result.tR[idx])) + 1.0\n    t = np.linspace(lo, hi, npoints)\n    sig = np.zeros_like(t)\n    for i in idx:\n        s = result.sigma[i]\n        sig += areas[i] / (s * np.sqrt(2 * np.pi)) * np.exp(\n            -0.5 * ((t - result.tR[i]) / s) ** 2\n        )\n    return t, sig\n", "lcmd/validate.py": "\"\"\"検算（実装が正しいかを自分で確かめるためのツール）\n\n数値積分は「それっぽい答え」を必ず返してしまうので、正しさは別途\n確かめないと分かりません。ここでは 3 つ確認します:\n\n1. リニアグラジエントで 数値解 vs 解析解\n       tR = (t0/b)·log10(2.3·b·k0 + 1) + t0 + tD\n   0.1 min 以内で一致すべき。ずれたときに疑うのは\n   tD の二重計上 / t0 の足し忘れ / 刻みが粗い / k のクリップが強すぎる /\n   Φ の単位（分率 vs 百分率）の取り違え。\n\n2. 積分刻み幅の収束\n   dt を半分にしても答えが変わらないなら刻みは十分。\n\n3. バンド圧縮係数 G\n   tG を半分にすると b が 2 倍、p もほぼ 2 倍になる。表と照合できる。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport numpy as np\n\nfrom .gradient import Gradient\nfrom .hardware import Method, System\nfrom .model import ComponentSet\nfrom .simulate import analytic_tr_linear, compression_factor, simulate\n\n\ndef check_analytic(comps: ComponentSet, system: System, phi0: float, phi1: float,\n                   tG: float, T: float, flow: float, dt_frac: float = 0.01,\n                   tol: float = 0.1) -> dict:\n    \"\"\"リニアグラジエントで数値解と解析解を比べる。\"\"\"\n    method = Method(Gradient.linear(phi0, phi1, tG), T, flow)\n    res = simulate(comps, method, system, dt_frac=dt_frac)\n    t0, tD = res.t0, res.tD\n    args = (comps.logkw(T), comps.S(T), phi0, phi1 - phi0, tG, t0, tD)\n    exact = analytic_tr_linear(*args, dwell_migration=True)\n    classic = analytic_tr_linear(*args, dwell_migration=False)\n\n    # 解析解が有効なのは「勾配の途中で溶出する」場合だけ\n    valid = (res.tR - t0 - tD >= 0) & (res.tR - t0 - tD <= tG) & res.eluted\n    d_exact = res.tR - exact\n    d_classic = res.tR - classic\n    return {\n        \"names\": comps.names,\n        \"tR_numeric\": res.tR,\n        \"tR_analytic\": exact,\n        \"tR_classic\": classic,\n        \"diff\": d_exact,\n        \"diff_classic\": d_classic,\n        \"valid\": valid,\n        \"max_abs_diff\": float(np.nanmax(np.abs(d_exact[valid]))) if valid.any() else np.nan,\n        \"max_abs_diff_classic\": (float(np.nanmax(np.abs(d_classic[valid])))\n                                 if valid.any() else np.nan),\n        \"passed\": bool(valid.any() and np.nanmax(np.abs(d_exact[valid])) < tol),\n        \"tol\": tol,\n        \"t0\": t0,\n        \"tD\": tD,\n        \"tG\": tG,\n    }\n\n\ndef check_analytic_table(chk: dict) -> str:\n    head = (f\"{'name':<26}{'numeric':>10}{'exact':>10}{'diff':>9}\"\n            f\"{'textbook':>10}{'diff':>9}{'valid':>7}\")\n    lines = [head, \"-\" * len(head)]\n    for i, n in enumerate(chk[\"names\"]):\n        lines.append(\n            f\"{n:<26}{chk['tR_numeric'][i]:>10.4f}{chk['tR_analytic'][i]:>10.4f}\"\n            f\"{chk['diff'][i]:>9.4f}{chk['tR_classic'][i]:>10.4f}\"\n            f\"{chk['diff_classic'][i]:>9.4f}{'y' if chk['valid'][i] else '-':>7}\"\n        )\n    lines.append(\"\")\n    verdict = \"PASS\" if chk[\"passed\"] else \"FAIL\"\n    lines.append(\n        f\"厳密形との最大差   {chk['max_abs_diff']:.4f} min  \"\n        f\"(許容 {chk['tol']} min) -> {verdict}\"\n    )\n    lines.append(\n        f\"教科書形との最大差 {chk['max_abs_diff_classic']:.4f} min  \"\n        f\"<- tD プレ溶出項を落とした分。早期溶出ピークほど大きい。\"\n    )\n    return \"\\n\".join(lines)\n\n\ndef check_step_convergence(comps: ComponentSet, method: Method, system: System,\n                           fracs=(0.04, 0.02, 0.01, 0.005)) -> dict:\n    \"\"\"刻み幅を細かくしていって、答えが動かなくなるか見る。\"\"\"\n    ref = simulate(comps, method, system, dt_frac=min(fracs) / 2.0)\n    rows = []\n    for f in fracs:\n        r = simulate(comps, method, system, dt_frac=f)\n        d = np.abs(r.tR - ref.tR)\n        rows.append({\"dt_frac\": f, \"dt_min\": f * ref.t0,\n                     \"max_abs_diff\": float(np.nanmax(d)),\n                     \"Rs_min\": r.min_rs()})\n    return {\"rows\": rows, \"reference_dt_frac\": min(fracs) / 2.0}\n\n\ndef check_step_convergence_table(chk: dict) -> str:\n    lines = [f\"{'dt/t0':>8}{'dt/min':>10}{'max|dtR|':>12}{'Rs_min':>9}\", \"-\" * 39]\n    for r in chk[\"rows\"]:\n        lines.append(f\"{r['dt_frac']:>8.3f}{r['dt_min']:>10.5f}\"\n                     f\"{r['max_abs_diff']:>12.5f}{r['Rs_min']:>9.3f}\")\n    lines.append(f\"(基準は dt/t0 = {chk['reference_dt_frac']:.4f})\")\n    return \"\\n\".join(lines)\n\n\ndef check_compression_table(t0: float, S: float, delta_phi: float,\n                            tG_values=(80.0, 40.0, 20.0, 10.0),\n                            kE_values=(2.0, 5.0, 10.0)) -> str:\n    \"\"\"tG を半分にすると b が 2 倍・p が約 2 倍になることを表で確認する。\n\n    b = t0·S·ΔΦ/tG,  p = 2.3·b·kE/(1+kE),  G = √((1+p+p²/3)/(1+p)²)\n    \"\"\"\n    lines = [\n        f\"t0 = {t0:.4f} min, S = {S:.2f}, dPhi = {delta_phi:.2f} (分率)\",\n        f\"{'tG/min':>8}{'b':>9}\" + \"\".join(\n            f\"{'p(kE=' + str(k) + ')':>13}{'G':>7}\" for k in kE_values\n        ),\n        \"-\" * (17 + 20 * len(kE_values)),\n    ]\n    for tG in tG_values:\n        b = t0 * S * delta_phi / tG\n        cells = \"\"\n        for kE in kE_values:\n            p = 2.3 * b * kE / (1 + kE)\n            G = float(compression_factor(b, kE))\n            cells += f\"{p:>13.4f}{G:>7.3f}\"\n        lines.append(f\"{tG:>8.1f}{b:>9.4f}{cells}\")\n    lines.append(\"\")\n    lines.append(\"G の理論範囲: p->0 で 1.000、p->inf で 1/sqrt(3) = 0.577\")\n    return \"\\n\".join(lines)\n\n\ndef check_phi_units(gradient: Gradient) -> list[str]:\n    \"\"\"Φ の単位取り違えの兆候を拾う（分率のはずが %B になっていないか）。\"\"\"\n    warn = []\n    if np.any(gradient.phis > 1.0):\n        warn.append(\"Φ が 1 を超えています。%B のまま入れていませんか。\")\n    if np.all(gradient.phis > 0.99):\n        warn.append(\"Φ が全部 1 付近です。組成がほぼ 100% ACN のままです。\")\n    span = gradient.phis.max() - gradient.phis.min()\n    if 0 < span < 0.02:\n        warn.append(f\"Φ の振れ幅が {span * 100:.2f} %B しかありません。単位を確認してください。\")\n    return warn\n\n\ndef compare_predicted_vs_measured_width(result, measured_half_widths: dict) -> str:\n    \"\"\"予測 σ と実測半値幅を突き合わせる（ピーク幅モデルの妥当性検証）。\n\n    読み方:\n      予測より実測が細い／太い → 残差として評価し、段数・装置分散・幅測定を確認\n      tG 依存の系統誤差 → 勾配履歴、保持モデル、一定段高の仮定を確認\n      平均の一致だけで、各ピークの分離度や未測定条件を保証しない\n    \"\"\"\n    head = (f\"{'name':<26}{'w1/2 pred':>11}{'w1/2 obs':>11}\"\n            f\"{'obs/pred':>10}{'G used':>9}\")\n    lines = [head, \"-\" * len(head)]\n    ratios = []\n    for i, n in enumerate(result.names):\n        if n not in measured_half_widths or not result.eluted[i]:\n            continue\n        pred = result.width_half_min[i]\n        obs = measured_half_widths[n]\n        ratios.append(obs / pred)\n        lines.append(f\"{n:<26}{pred:>11.4f}{obs:>11.4f}{obs / pred:>10.3f}\"\n                     f\"{result.G[i]:>9.3f}\")\n    if ratios:\n        r = float(np.mean(ratios))\n        lines.append(\"\")\n        lines.append(f\"平均 obs/pred = {r:.3f}\")\n        if r < 0.95:\n            lines.append(\"-> 実測の方が細い。段数・積分範囲・幅モデルの系統差を確認してください。\")\n        elif r > 1.05:\n            lines.append(\"-> 実測の方が太い。σ_ext の見積もり不足を疑う。\"\n                         \"（配管長・セル容量・注入量を確認）\")\n        else:\n            lines.append(\"-> 平均値は近い結果です。ピークごとの残差と別条件での検証も確認してください。\")\n    return \"\\n\".join(lines)\n", "lcmd/width.py": "\"\"\"実測のピーク幅から分散パラメータを推定する（回帰②）\n\n保持の回帰（`fitting.py`）が「ピークがいつ出るか」を決めるのに対して、\nここは「ピークがどれだけ太いか」を決めます。分離度は\n\n    Rs = |tR2 − tR1| / (2·(σ1 + σ2))\n\nなので、**分子だけ実測に合わせても Rs の絶対値は当たりません**。分母を\n実測で較正して初めて「Rs 2.0 を確保できる」と言えるようになります。\n\n決める 3 つ\n-----------\nN（理論段数）\n    カラムの性能。基準流速での値として持ちます。\nC（van Deemter の C 項）\n    流速を上げたときに N がどれだけ落ちるか。**流速を振ったランがないと\n    決まりません**。A 項と B 項は 2-3 水準では分離できないので固定します。\nV_ext（装置分散）\n    配管・セル・注入による広がり。容積 [µL] で持つので、流速を変えても\n    整合します（σ_ext = V_ext/F）。\n\nなぜ保持の回帰が先に要るのか\n----------------------------\n幅の式に入る kE（溶出時点の保持係数）と G（バンド圧縮係数）は**実測できません**。\n保持モデルからしか出せないので、回帰① → 回帰② の順は動かせません。\n\n    σ_col = t0·(1 + kE)·G / √N(F)\n    σ_ext = V_ext / F\n    w½    = 2.35482·√(σ_col² + σ_ext²)\n\nN と V_ext はどうやって分かれるのか\n-----------------------------------\nσ_col は (1+kE) に比例し、σ_ext は kE に依りません。つまり **kE を振れば\n2 つは分かれます**。kE を動かすのはグラジエント時間であって流速ではない、\nというのが「モデル用ランの設計」でグラジエント時間を 3 水準置く理由です。\n流速のほうは C だけを決めます。\n\n計算量について\n--------------\nkE・G・t0 は N にも C にも V_ext にも依存しません（保持だけで決まります）。\nそこで**ラン 1 本につき数値積分は 1 回だけ**回して kE・G を取り出し、あとは\n閉じた式で 3 パラメータを当てはめます。反復のたびに積分し直す作りにすると\n数秒かかりますが、この形なら一瞬です。\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nfrom scipy.optimize import least_squares\n\nfrom .hardware import Column, System, VanDeemter\nfrom .simulate import simulate\n\nFWHM = 2.35482          # σ → 半値幅\n\n# 探索範囲（物理的にありえない所へ逃げないための柵）\nBOUNDS_LO = np.array([np.log(500.0), 0.001, 0.0])\nBOUNDS_HI = np.array([np.log(500_000.0), 1.0, 200.0])\n\n# kE の広がりがこれ未満だと、N と V_ext を分ける情報がありません。\n# （合成データで確認: 広がり 3 倍以上あれば両方決まる）\nMIN_KE_RATIO = 1.5\n\n\n@dataclass\nclass WidthFit:\n    \"\"\"回帰② の結果。\"\"\"\n\n    plates: float                 # N（基準流速での理論段数）\n    C: float                      # van Deemter の C 項\n    sigma_ext_ul: float           # 装置分散 [µL]\n    stderr: np.ndarray            # [N, C, V_ext] の標準誤差（近似）\n    reference_flow: float\n    fixed: tuple[str, ...] = ()   # 情報が足りず固定した項目\n    rows: list[dict] = field(default_factory=list)   # 診断用の 1 点ずつ\n    converged: bool = True\n    notes: list[str] = field(default_factory=list)\n\n    # --- まとめ -------------------------------------------------------\n    @property\n    def n_points(self) -> int:\n        return len(self.rows)\n\n    @property\n    def ratio(self) -> np.ndarray:\n        \"\"\"実測 ÷ 予測。1.0 が完全一致。\"\"\"\n        return np.array([r[\"w_obs\"] / r[\"w_pred\"] for r in self.rows])\n\n    @property\n    def rms_percent(self) -> float:\n        \"\"\"予測からのずれ [%]。Rs の誤差はおおよそこれと同じ大きさになります。\"\"\"\n        return float(100.0 * np.sqrt(np.mean((self.ratio - 1.0) ** 2)))\n\n    def calibrated(self, base: System) -> System:\n        \"\"\"推定値を入れた System を返す（元の System は変更しません）。\"\"\"\n        col = base.column\n        vd = col.van_deemter or VanDeemter()\n        new_col = Column(\n            length_mm=col.length_mm, id_mm=col.id_mm,\n            particle_um=col.particle_um, porosity=col.porosity,\n            plates=self.plates, name=col.name,\n            van_deemter=VanDeemter(A=vd.A, B=vd.B, C=self.C,\n                                   diffusion_cm2_s=vd.diffusion_cm2_s,\n                                   reference_flow_ml_min=vd.reference_flow_ml_min),\n        )\n        return System(column=new_col, dwell_volume_ml=base.dwell_volume_ml,\n                      sigma_ext_min=0.0, sigma_ext_ul=self.sigma_ext_ul,\n                      max_pressure_bar=base.max_pressure_bar)\n\n    def table(self) -> str:\n        head = (f\"{'run':<12}{'component':<20}{'flow':>7}{'kE':>7}{'G':>7}\"\n                f\"{'w obs':>9}{'w pred':>9}{'obs/pred':>10}\")\n        lines = [head, \"-\" * len(head)]\n        for r in sorted(self.rows, key=lambda x: (x[\"run_id\"], x[\"component\"])):\n            lines.append(\n                f\"{r['run_id'][:11]:<12}{r['component'][:19]:<20}\"\n                f\"{r['flow']:>7.2f}{r['kE']:>7.2f}{r['G']:>7.3f}\"\n                f\"{r['w_obs']:>9.4f}{r['w_pred']:>9.4f}\"\n                f\"{r['w_obs'] / r['w_pred']:>10.3f}\")\n        lines.append(\"\")\n        lines.append(f\"N = {self.plates:,.0f}   C = {self.C:.4f}   \"\n                     f\"V_ext = {self.sigma_ext_ul:.2f} uL   \"\n                     f\"({self.n_points} points, {self.rms_percent:.1f}% rms)\")\n        return \"\\n\".join(lines)\n\n\ndef _geometry(comps, runs, system, widths, exclude) -> list[dict]:\n    \"\"\"ラン 1 本につき 1 回だけ数値積分して、kE・G・t0 を取り出す。\n\n    ここで得た値は N・C・V_ext に依存しないので、当てはめの反復では\n    使い回せます。\n    \"\"\"\n    skip = set(exclude or ())\n    rows = []\n    for r in runs:\n        obs = widths.get(r.run_id) or {}\n        if not obs:\n            continue\n        res = simulate(comps, r.method, system)\n        F = float(r.method.flow_ml_min)\n        t0 = float(system.t0(F))\n        for name, kE, G, ok in zip(res.names, res.kE, res.G, res.eluted):\n            w = obs.get(name)\n            if not ok or w is None or (r.run_id, name) in skip:\n                continue\n            w = float(w)\n            if not np.isfinite(w) or w <= 0:\n                continue\n            rows.append({\"run_id\": r.run_id, \"component\": name, \"flow\": F,\n                         \"t0\": t0, \"kE\": float(kE), \"G\": float(G),\n                         \"w_obs\": w, \"w_pred\": np.nan})\n    return rows\n\n\ndef _predict(x, rows, column, fit_C: bool, C_fixed: float) -> np.ndarray:\n    \"\"\"3 パラメータから半値幅を出す（閉じた式）。\"\"\"\n    plates = float(np.exp(x[0]))\n    C = float(x[1]) if fit_C else C_fixed\n    v_ext_ul = float(x[2]) if fit_C else float(x[1])\n\n    vd = column.van_deemter or VanDeemter()\n    tuned = VanDeemter(A=vd.A, B=vd.B, C=C, diffusion_cm2_s=vd.diffusion_cm2_s,\n                       reference_flow_ml_min=vd.reference_flow_ml_min)\n    h_ref = tuned.reduced_h(column.reduced_velocity(tuned.reference_flow_ml_min))\n\n    out = np.empty(len(rows))\n    for i, r in enumerate(rows):\n        h = tuned.reduced_h(column.reduced_velocity(r[\"flow\"]))\n        N = max(plates * h_ref / h, 1.0)\n        sigma_col = r[\"t0\"] * (1.0 + r[\"kE\"]) * r[\"G\"] / np.sqrt(N)\n        sigma_ext = (v_ext_ul / 1000.0) / r[\"flow\"]\n        out[i] = FWHM * np.hypot(sigma_col, sigma_ext)\n    return out\n\n\ndef fit_widths(comps, runs, system: System, widths: dict,\n               exclude=None, fit_C: bool | None = None) -> WidthFit:\n    \"\"\"実測半値幅から N・C・V_ext を推定する。\n\n    Parameters\n    ----------\n    comps : ComponentSet\n        **回帰① で当てはめたもの**。kE と G をここから出します。\n    runs : list[Run]\n        実際に流した条件。\n    system : System\n        いまの装置設定。カラム寸法とドウェルはここから、N・C・V_ext は\n        推定値で置き換えます。\n    widths : dict\n        {run_id: {成分: 半値幅[min]}}。谷にぶつかって測れていない幅\n        （帰属ページの「幅が谷どまり」）は **必ず exclude してください**。\n        隣とくっついたピークの幅は本来より太く出るので、入れると N を\n        小さく見積もります。\n    exclude : iterable of (run_id, 成分), optional\n        使わない点。\n    fit_C : bool, optional\n        C も推定するか。省略時は流速が 2 水準以上あれば True。\n\n    Returns\n    -------\n    WidthFit\n    \"\"\"\n    rows = _geometry(comps, runs, system, widths, exclude)\n    notes: list[str] = []\n    col = system.column\n    vd = col.van_deemter or VanDeemter()\n    if len(rows) < 4:\n        raise ValueError(\n            f\"使える半値幅が {len(rows)} 点しかありません。\"\n            \"3 パラメータを決めるには最低 4 点必要です。\")\n\n    flows = sorted({round(r[\"flow\"], 4) for r in rows})\n    if fit_C is None:\n        fit_C = len(flows) >= 2\n    fixed: list[str] = []\n    if not fit_C:\n        fixed.append(\"C\")\n        notes.append(\n            f\"流速が {len(flows)} 水準しかないので C は既定値 {vd.C:.3f} に\"\n            \"固定しました。流速を上げたときの N の落ち方は未検証のままです。\")\n\n    kE = np.array([r[\"kE\"] for r in rows])\n    ke_ratio = float((1 + kE.max()) / (1 + kE.min()))\n    if ke_ratio < MIN_KE_RATIO:\n        notes.append(\n            f\"kE の広がりが {ke_ratio:.2f} 倍しかありません。N と V_ext を\"\n            \"分ける情報が乏しいので、両者の値は当てになりません\"\n            \"（グラジエント時間の水準を広げてください）。\")\n\n    w_obs = np.array([r[\"w_obs\"] for r in rows])\n\n    def resid(x):\n        # 相対残差。Rs の誤差は幅の「比」で効くので、絶対値で合わせると\n        # 太いピークばかりに引きずられます。\n        return _predict(x, rows, col, fit_C, vd.C) / w_obs - 1.0\n\n    x0 = ([np.log(col.plates), vd.C, (system.sigma_ext_ul or 2.0)] if fit_C\n          else [np.log(col.plates), (system.sigma_ext_ul or 2.0)])\n    lo = BOUNDS_LO if fit_C else BOUNDS_LO[[0, 2]]\n    hi = BOUNDS_HI if fit_C else BOUNDS_HI[[0, 2]]\n    x0 = np.clip(np.array(x0, dtype=float), lo + 1e-9, hi - 1e-9)\n\n    sol = least_squares(resid, x0, bounds=(lo, hi), x_scale=np.abs(x0) + 1e-3)\n\n    plates = float(np.exp(sol.x[0]))\n    C = float(sol.x[1]) if fit_C else float(vd.C)\n    v_ext = float(sol.x[2]) if fit_C else float(sol.x[1])\n    if fit_C and (C <= BOUNDS_LO[1] + 1e-5 or C >= BOUNDS_HI[1] - 1e-5):\n        notes.append(\"Cが推定範囲の端に達しています。最適値が十分に決まらず、未測定流速への段数予測は外挿です。\")\n\n    pred = _predict(sol.x, rows, col, fit_C, vd.C)\n    for r, p in zip(rows, pred):\n        r[\"w_pred\"] = float(p)\n\n    # 標準誤差（ヤコビアンからの近似）。log N で解いているので N の SE は\n    # 「N × log N の SE」に直します。\n    stderr = np.full(3, np.nan)\n    dof = len(rows) - len(sol.x)\n    if dof > 0:\n        try:\n            s2 = float(np.sum(sol.fun**2)) / dof\n            cov = np.linalg.inv(sol.jac.T @ sol.jac) * s2\n            se = np.sqrt(np.clip(np.diag(cov), 0.0, None))\n            stderr = (np.array([plates * se[0], se[1], se[2]]) if fit_C\n                      else np.array([plates * se[0], np.nan, se[1]]))\n        except np.linalg.LinAlgError:\n            pass\n\n    return WidthFit(\n        plates=plates, C=C, sigma_ext_ul=v_ext, stderr=stderr,\n        reference_flow=float(vd.reference_flow_ml_min),\n        fixed=tuple(fixed), rows=rows, converged=bool(sol.success), notes=notes,\n    )\n\n\ndef rs_sensitivity(fit: WidthFit) -> float:\n    \"\"\"N の不確かさが Rs に効く割合 [%]。\n\n    Rs ∝ √N なので、N の相対誤差の半分がそのまま Rs の相対誤差になります。\n    「較正してどれだけ確かになったか」を 1 つの数で言うために使います。\n    \"\"\"\n    se = fit.stderr[0]\n    if not np.isfinite(se) or fit.plates <= 0:\n        return float(\"nan\")\n    return float(50.0 * se / fit.plates)\n", "app/__init__.py": "", "app/common.py": "\"\"\"アプリ共通の道具（状態管理・サイドバー・表示ヘルパ）\n\n設計方針\n--------\n`lcmd/` の計算ロジックには一切手を入れず、ここから呼ぶだけにしています。\nアプリを消しても計算部分はそのまま使えますし、逆にこの層を React などに\n差し替えることもできます。\n\nStreamlit は操作のたびにスクリプトを頭から実行し直します。時間のかかる\n計算（分離度マップ・多段探索）は「ボタンを押したときだけ実行して\nst.session_state に置く」方式にしています。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport io\nimport json\nimport os\nimport sys\n\nimport pandas as pd\nimport streamlit as st\nimport matplotlib.pyplot as plt\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nfrom lcmd import Column, ComponentSet, System, VanDeemter  # noqa: E402\n\n# 圧力は計算の中身（lcmd/）では bar、画面ではすべて psi。境界はこの層だけです。\n# 設定 JSON も bar のまま保存します（lcmd 側の値をそのまま書くため）。\nPSI_PER_BAR = 14.5038\n\n\ndef to_psi(bar_value) -> float:\n    return float(bar_value) * PSI_PER_BAR\n\n\n# ----------------------------------------------------------------------\n# 見た目\n# ----------------------------------------------------------------------\n_STYLE_PATH = os.path.join(os.path.dirname(os.path.abspath(__file__)),\n                           \"assets\", \"style.css\")\n\n# 図もアプリと同じ色の言葉で話す（lcmd/plots.py は計算コアなので触らない）。\n# 先頭がブランドのティール、以降は区別しやすい順。\nplt.rcParams.update({\n    \"axes.prop_cycle\": plt.cycler(color=[\n        \"#0D9488\", \"#6366F1\", \"#F59E0B\", \"#E11D48\", \"#0EA5E9\",\n        \"#65A30D\", \"#8B5CF6\", \"#EA580C\", \"#0891B2\", \"#64748B\",\n    ]),\n    \"axes.edgecolor\": \"#CBD5E1\",\n    \"axes.labelcolor\": \"#334155\",\n    \"axes.titlecolor\": \"#0F172A\",\n    \"axes.titleweight\": \"bold\",\n    \"xtick.color\": \"#64748B\",\n    \"ytick.color\": \"#64748B\",\n    \"grid.color\": \"#E2E8F0\",\n    \"legend.frameon\": False,\n    \"font.size\": 9.5,\n})\n\n\ndef inject_style() -> None:\n    \"\"\"アプリ全体の CSS を当てる。入口（streamlit_app.py）が毎 run 呼びます。\n\n    見た目の定義は app/assets/style.css の 1 枚だけ。テーマの基礎色は\n    .streamlit/config.toml と stlite の streamlitConfig にもあるが、\n    形・質感（カード・ナビ・グラデーション）はすべて CSS 側。\n    \"\"\"\n    with open(_STYLE_PATH, encoding=\"utf-8\") as fh:\n        st.markdown(f\"<style>{fh.read()}<\/style>\", unsafe_allow_html=True)\n\n\n# ----------------------------------------------------------------------\n# 状態\n# ----------------------------------------------------------------------\ndef init_state() -> None:\n    \"\"\"session_state の初期値。**生きているページが読むキーだけ**を置きます。\n\n    使われないキーを置いておくと「どこかで使っているのだろう」と読めてしまい、\n    退避したページの痕跡と現役の状態が見分けられなくなります。退避ページ用の\n    キー（fit / runs_df / rmap / ref_point / search / method / method_label /\n    flow_rows / length_rows / doe）は `_archive/common_legacy.py` に控えてあります。\n    \"\"\"\n    ss = st.session_state\n    ss.setdefault(\"cfg\", dict(CFG_DEFAULTS))   # 装置・カラム設定の実体\n    ss.setdefault(\"comps\", None)          # ComponentSet\n    ss.setdefault(\"comps_source\", \"\")     # どこから来たパラメータか\n    ss.setdefault(\"obs_df\", None)         # 帰属 → モデル推定へ渡す tR\n    ss.setdefault(\"fit\", None)            # FitReport（回帰①の結果）\n    ss.setdefault(\"wfit\", None)           # WidthFit（回帰②の結果）\n    ss.setdefault(\"width_exclude\", [])    # 幅として使えない (run_id, 成分)\n    ss.setdefault(\"rmap\", None)           # ResolutionMap（tG × T の地図）\n    ss.setdefault(\"ref_point\", None)      # 地図で選んだ基準条件\n    ss.setdefault(\"search\", None)         # SearchReport（多段グラジエント探索）\n    ss.setdefault(\"method\", None)         # 採用した Method\n    ss.setdefault(\"method_label\", \"\")\n    ss.setdefault(\"doe\", None)            # ロバストネス DoE の結果\n    # --- ピーク帰属（ARW）---\n    ss.setdefault(\"pda\", {})              # {run_id: PDAData}\n    ss.setdefault(\"pda_cond\", None)       # ランごとの条件（DataFrame）\n    ss.setdefault(\"ptables\", {})          # {run_id: PeakTable}\n    ss.setdefault(\"ref_labels\", None)     # 基準ランの命名（DataFrame）\n    ss.setdefault(\"assign\", None)         # AssignmentReport\n    ss.setdefault(\"width_obs\", None)      # {run_id: {成分: 実測半値幅}}\n    ss.setdefault(\"peak_targets\", None)   # 分離対象の選択（DataFrame）\n    ss.setdefault(\"peak_tiers\", None)     # {ピーク番号: Tier}\n    # --- 実験計画 ---\n    ss.setdefault(\"design_runs\", None)    # 確定したモデル構築ラン（list[Run]）\n    ss.setdefault(\"design_df\", None)\n\n\ndef comps() -> ComponentSet | None:\n    return st.session_state.get(\"comps\")\n\n\ndef set_comps(c: ComponentSet, source: str) -> None:\n    \"\"\"成分パラメータを差し替える。\"\"\"\n    st.session_state[\"comps\"] = c\n    st.session_state[\"comps_source\"] = source\n\n\n# ----------------------------------------------------------------------\n# 装置とカラムのプリセット\n# ----------------------------------------------------------------------\n# 値はカタログまたは一般的な目安。実測で置き換える前提です。\nCUSTOM = \"手入力\"\n\nCOLUMN_PRESETS: dict[str, dict | None] = {\n    \"ACQUITY BEH C18  2.1 × 50 mm, 1.7 µm\":\n        {\"col_len\": 50.0, \"col_id\": 2.1, \"col_dp\": 1.7, \"col_eps\": 0.65,\n         \"col_N\": 9500.0},\n    \"ACQUITY BEH C18  2.1 × 100 mm, 1.7 µm\":\n        {\"col_len\": 100.0, \"col_id\": 2.1, \"col_dp\": 1.7, \"col_eps\": 0.65,\n         \"col_N\": 18000.0},\n    \"ACQUITY BEH C18  2.1 × 150 mm, 1.7 µm\":\n        {\"col_len\": 150.0, \"col_id\": 2.1, \"col_dp\": 1.7, \"col_eps\": 0.65,\n         \"col_N\": 25000.0},\n    \"ACQUITY BEH C18  3.0 × 100 mm, 1.7 µm\":\n        {\"col_len\": 100.0, \"col_id\": 3.0, \"col_dp\": 1.7, \"col_eps\": 0.65,\n         \"col_N\": 18000.0},\n    \"XBridge BEH C18  4.6 × 150 mm, 5 µm\":\n        {\"col_len\": 150.0, \"col_id\": 4.6, \"col_dp\": 5.0, \"col_eps\": 0.65,\n         \"col_N\": 12000.0},\n    CUSTOM: None,\n}\nDEFAULT_COLUMN = \"ACQUITY BEH C18  2.1 × 100 mm, 1.7 µm\"\n\n# バンドスプレッドは 5σ 表記なので σ = 値 / 5\nINSTRUMENT_PRESETS: dict[str, dict | None] = {\n    \"ACQUITY UPLC H-Class PLUS\":\n        {\"sys_dwell\": 0.400, \"sys_sig_ul\": 12.0 / 5, \"sys_pmax_psi\": 15000.0},\n    \"UHPLC（低ドウェル・バイナリ）\":\n        {\"sys_dwell\": 0.100, \"sys_sig_ul\": 8.0 / 5, \"sys_pmax_psi\": 14500.0},\n    \"HPLC（汎用）\":\n        {\"sys_dwell\": 0.800, \"sys_sig_ul\": 40.0 / 5, \"sys_pmax_psi\": 5800.0},\n    CUSTOM: None,\n}\nDEFAULT_INSTRUMENT = \"ACQUITY UPLC H-Class PLUS\"\n\nCOLUMN_PRESET_HELP = (\n    \"よく使うカラムの寸法をまとめて入れます。N は同じ充填品質を仮定した\"\n    \"目安なので、実測で置き換えてください。\"\n)\nINSTRUMENT_PRESET_HELP = (\n    \"ドウェル容量・装置分散・最大圧力をまとめて入れます。\"\n    \"ACQUITY UPLC H-Class PLUS はカタログ値\"\n    \"（ドウェル ≤400 µL / 100 µL ミキサー、バンドスプレッド ≤12 µL、15,000 psi）。\"\n    \"装置分散はバンドスプレッド（5σ）÷ 5 を σ として入れています。\"\n)\nSIGMA_MODE_HELP = \"\"\"\n装置分散（配管・セル・注入による広がり）の与え方。\n\n- **容積 [µL]**（推奨）… 物理的にはこちらが正しい。時間に直すときに\n  流速で割るので、流速を変えても整合します\n- **時間 [min]** … 1 つの流速でしか使わないなら手軽\n\n時間で固定したまま流速を上げると、カラム由来の幅だけが縮んで装置分散が\n縮まないため、装置分散の寄与を過大評価します。デモ条件では流速 3 倍で\n分離度を 5.5% 低く見積もりました（＝速くできる範囲を狭く判定する）。\n\"\"\"\n\n\n# ----------------------------------------------------------------------\n# 設定の実体\n# ----------------------------------------------------------------------\n# 設定ウィジェットはホーム画面にしかありません。Streamlit は「その run で\n# 描画されなかったウィジェット」の値を session_state から捨てるため、値の\n# 実体はこの cfg（ただの dict）に置きます。ウィジェットはその写しです。\n# キー名は設定 JSON（_SETTINGS_MAP）と共通なので、変えるなら両方直すこと。\nCFG_DEFAULTS: dict = {\n    # カラム\n    \"col_len\": 100.0, \"col_id\": 2.1, \"col_dp\": 1.7, \"col_eps\": 0.65,\n    \"col_N\": 18000.0,\n    # 装置\n    \"sys_dwell\": 0.400, \"sys_sig_mode\": True, \"sys_sig_ul\": 12.0 / 5,\n    \"sys_sig\": 0.006, \"sys_pmax_psi\": 15000.0,\n    # 流速による N の低下\n    \"vd_on\": True, \"vd_A\": 1.0, \"vd_B\": 2.0, \"vd_C\": 0.05, \"vd_fref\": 0.40,\n    # 既定の分析条件\n    \"flow\": 0.40, \"temp\": 40.0, \"rs_target\": 2.0,\n    # プリセットの選択（表示名）\n    \"preset_column\": DEFAULT_COLUMN, \"preset_instrument\": DEFAULT_INSTRUMENT,\n}\n\n\ndef _apply_presets() -> None:\n    \"\"\"プリセットの選択をウィジェットの初期値に反映する。\n\n    ウィジェットを作る前に呼ぶこと（作った後で session_state のウィジェット\n    キーへ代入すると Streamlit が例外を出します）。\n    \"\"\"\n    for state_key, presets, default in (\n        (\"preset_column\", COLUMN_PRESETS, DEFAULT_COLUMN),\n        (\"preset_instrument\", INSTRUMENT_PRESETS, DEFAULT_INSTRUMENT),\n    ):\n        chosen = st.session_state.get(state_key, default)\n        applied_key = f\"_{state_key}_applied\"\n        if chosen == CUSTOM or st.session_state.get(applied_key) == chosen:\n            continue\n        values = presets.get(chosen)\n        if values:\n            st.session_state.update(values)\n        st.session_state[applied_key] = chosen\n\n\ndef _num(label, lo, hi, default, step, key, **kw):\n    \"\"\"number_input。session_state に値があれば default を渡さない。\n\n    プリセットで session_state を先に埋めているため、そこへさらに default を\n    渡すと Streamlit が「both default and Session State」と警告します。\n    \"\"\"\n    if key in st.session_state:\n        return st.number_input(label, lo, hi, step=step, key=key, **kw)\n    return st.number_input(label, lo, hi, default, step, key=key, **kw)\n\n\nVD_HELP = \"\"\"\n流速を上げると N が落ちます。その落ち方の式（換算段高 h = A·ν^(1/3) + B/ν + C·ν）。\n\n**手で入れる値ではありません。** モデル構築ランの流速を振れば、実測の半値幅から\nC を推定できます（回帰②）。A と B は 2-3 水準の流速では分離できないので固定し、\n自由にするのは C だけにします。\n\nいまは相場値のまま動いているので、「流速とカラム長」ページの屈曲点も暫定です。\n0.3 → 0.6 mL/min で N が落ちる量は、C = 0.05 なら 12.6%。C が 0.025-0.10 の\nどこかだとすると 9.7-17.4% の幅があり、**Rs の予測が 4% ぶれます**。\nモデル構築ランに流速を 2 点入れて C を推定すると、このぶれは 2% まで縮みます。\n\"\"\"\n\n\n# ----------------------------------------------------------------------\n# System の組み立てと、設定パネル（ホーム画面）\n# ----------------------------------------------------------------------\ndef build_system() -> System:\n    \"\"\"cfg から System を組む。\n\n    ウィジェットを一切参照しないので、どのページからでも同じ結果になります。\n    \"\"\"\n    cfg = st.session_state[\"cfg\"]\n    vd = None\n    if cfg[\"vd_on\"]:\n        vd = VanDeemter(A=cfg[\"vd_A\"], B=cfg[\"vd_B\"], C=cfg[\"vd_C\"],\n                        reference_flow_ml_min=cfg[\"vd_fref\"])\n    column = Column(length_mm=cfg[\"col_len\"], id_mm=cfg[\"col_id\"],\n                    particle_um=cfg[\"col_dp\"], porosity=cfg[\"col_eps\"],\n                    plates=cfg[\"col_N\"], name=\"column\", van_deemter=vd)\n    by_volume = bool(cfg[\"sys_sig_mode\"])\n    system = System(\n        column=column,\n        dwell_volume_ml=cfg[\"sys_dwell\"],\n        sigma_ext_min=0.0 if by_volume else cfg[\"sys_sig\"],\n        max_pressure_bar=cfg[\"sys_pmax_psi\"] / PSI_PER_BAR,\n        sigma_ext_ul=cfg[\"sys_sig_ul\"] if by_volume else None,\n    )\n    st.session_state[\"system\"] = system\n    return system\n\n\ndef settings_editor() -> None:\n    \"\"\"装置・カラムの編集ウィジェット。**ホームだけが呼びます**。\n\n    Streamlit はその run で描画されなかったウィジェットの値を捨てます。設定を\n    ホームに集約した以上、他のページへ移った瞬間に装置設定が既定値へ戻って\n    しまうため、値の実体は cfg（ただの dict）に置き、ウィジェットはその写しと\n    して扱います。順番を崩さないこと:\n\n      1. cfg → ウィジェットキーへ種を蒔く（捨てられた値を戻す）\n      2. プリセットを反映する（ウィジェットを作る前でないと Streamlit が例外）\n      3. ウィジェットを作る\n      4. ウィジェット → cfg へ書き戻す\n    \"\"\"\n    cfg = st.session_state[\"cfg\"]\n    for k, v in cfg.items():\n        st.session_state.setdefault(k, v)\n    _apply_presets()\n\n    tab_col, tab_sys, tab_run = st.tabs([\"カラム\", \"装置\", \"既定の分析条件\"])\n\n    with tab_col:\n        st.selectbox(\"プリセット\", list(COLUMN_PRESETS), key=\"preset_column\",\n                     help=COLUMN_PRESET_HELP)\n        a, b = st.columns(2)\n        with a:\n            _num(\"長さ [mm]\", 20.0, 300.0, 100.0, 5.0, \"col_len\")\n            _num(\"内径 [mm]\", 0.5, 10.0, 2.1, 0.1, \"col_id\")\n            _num(\"粒子径 [µm]\", 1.0, 10.0, 1.7, 0.1, \"col_dp\")\n        with b:\n            _num(\"空隙率\", 0.30, 0.90, 0.65, 0.01, \"col_eps\",\n                 help=\"t0 の実測値から逆算すると正確です（ε = t0·F / (π r² L)）。\"\n                      \"全多孔性シリカ系で 0.6-0.7 が目安。\")\n            _num(\"理論段数 N\", 1000.0, 200000.0, 18000.0, 500.0, \"col_N\",\n                 help=\"装置分散込みの実測値。2.1 mm i.d. / 1.7 µm での目安は \"\n                      \"50 mm: 8,000-11,000 / 100 mm: 16,000-20,000 / \"\n                      \"150 mm: 22,000-28,000\")\n        st.divider()\n        st.caption(\n            f\"流速を上げたときの N の落ち方は **回帰② で推定する値**です\"\n            f\"（いまは相場値 C = {CFG_DEFAULTS['vd_C']:.3f} で暫定）。\",\n            help=VD_HELP,\n        )\n\n    with tab_sys:\n        st.selectbox(\"プリセット\", list(INSTRUMENT_PRESETS),\n                     key=\"preset_instrument\", help=INSTRUMENT_PRESET_HELP)\n        a, b = st.columns(2)\n        with a:\n            _num(\"ドウェル容量 [mL]\", 0.0, 3.0, 0.400, 0.005, \"sys_dwell\",\n                 format=\"%.3f\",\n                 help=\"ポンプで組成を変えてからカラム入口に届くまでの容量。\"\n                      \"tD = これ ÷ 流速。装置が変わるとここが変わり、\"\n                      \"保持時間が丸ごとずれます。\")\n            _num(\"最大圧力 [psi]\", 1000.0, 25000.0, 15000.0, 100.0,\n                 \"sys_pmax_psi\",\n                 help=\"装置の上限。圧力の見積もりはこの何割かで判定します。\"\n                      \"計算の中身は bar ですが、画面はすべて psi で統一しています\"\n                      \"（1 bar = 14.5038 psi）。\")\n        with b:\n            st.toggle(\"装置分散を容積で入れる\", key=\"sys_sig_mode\",\n                      help=SIGMA_MODE_HELP)\n            if st.session_state[\"sys_sig_mode\"]:\n                _num(\"装置分散 σ_ext [µL]\", 0.0, 200.0, 2.4, 0.1, \"sys_sig_ul\",\n                     format=\"%.2f\",\n                     help=\"カタログのバンドスプレッド（5σ, µL）÷ 5。\"\n                          \"σ_tot² = σ_col² + σ_ext²\")\n            else:\n                _num(\"装置分散 σ_ext [min]\", 0.0, 0.2, 0.006, 0.001, \"sys_sig\",\n                     format=\"%.4f\",\n                     help=\"配管・セル・注入によるピーク幅の増加。\"\n                          \"σ_tot² = σ_col² + σ_ext²\")\n\n    with tab_run:\n        a, b, c = st.columns(3)\n        with a:\n            _num(\"流速 [mL/min]\", 0.05, 3.0, 0.40, 0.05, \"flow\")\n        with b:\n            _num(\"カラム温度 [℃]\", 10.0, 90.0, 40.0, 1.0, \"temp\")\n        with c:\n            _num(\"目標 Rs\", 0.5, 5.0, 2.0, 0.1, \"rs_target\",\n                 help=\"分離度の目標値。高速化で余裕を消費するので、\"\n                      \"設計段階では 2.0-2.5 を置いて余裕を先に確保します。\")\n        st.caption(\"各ページの初期値になります。ページ側で上書きできます。\")\n\n    for k in CFG_DEFAULTS:\n        if k in st.session_state:\n            cfg[k] = st.session_state[k]\n\n\ndef settings_payload(system: System, flow, temp, rs_target) -> dict:\n    \"\"\"設定 JSON の中身（保存とテストの両方から使う純粋関数）。\"\"\"\n    col = system.column\n    return {\n        \"column\": {\"length_mm\": col.length_mm, \"id_mm\": col.id_mm,\n                   \"particle_um\": col.particle_um, \"porosity\": col.porosity,\n                   \"plates\": col.plates},\n        \"van_deemter\": (None if col.van_deemter is None else {\n            \"A\": col.van_deemter.A, \"B\": col.van_deemter.B,\n            \"C\": col.van_deemter.C,\n            \"reference_flow_ml_min\": col.van_deemter.reference_flow_ml_min}),\n        \"system\": {\"dwell_volume_ml\": system.dwell_volume_ml,\n                   \"sigma_ext_min\": system.sigma_ext_min,\n                   \"sigma_ext_ul\": system.sigma_ext_ul,\n                   \"max_pressure_bar\": system.max_pressure_bar},\n        \"conditions\": {\"flow_ml_min\": flow, \"temperature_C\": temp,\n                       \"rs_target\": rs_target},\n    }\n\n\ndef settings_download(system: System, flow, temp, rs_target, where=None) -> None:\n    box = where or st\n    box.download_button(\n        \"設定を保存\", json.dumps(settings_payload(system, flow, temp, rs_target),\n                             ensure_ascii=False, indent=2),\n        file_name=\"lc_settings.json\", mime=\"application/json\",\n        width=\"stretch\",\n        help=\"カラム・装置・既定条件を JSON に書き出します。\"\n             \"装置ごとに 1 つ作っておくと、次から読み込むだけで済みます。\",\n    )\n\n\n# 設定 JSON のキー → ウィジェットの key\n_SETTINGS_MAP = {\n    (\"column\", \"length_mm\"): \"col_len\",\n    (\"column\", \"id_mm\"): \"col_id\",\n    (\"column\", \"particle_um\"): \"col_dp\",\n    (\"column\", \"porosity\"): \"col_eps\",\n    (\"column\", \"plates\"): \"col_N\",\n    (\"system\", \"dwell_volume_ml\"): \"sys_dwell\",\n    (\"system\", \"sigma_ext_min\"): \"sys_sig\",\n    (\"system\", \"sigma_ext_ul\"): \"sys_sig_ul\",\n    (\"system\", \"max_pressure_bar\"): \"sys_pmax_psi\",\n    (\"conditions\", \"flow_ml_min\"): \"flow\",\n    (\"conditions\", \"temperature_C\"): \"temp\",\n    (\"conditions\", \"rs_target\"): \"rs_target\",\n    (\"van_deemter\", \"A\"): \"vd_A\",\n    (\"van_deemter\", \"B\"): \"vd_B\",\n    (\"van_deemter\", \"C\"): \"vd_C\",\n    (\"van_deemter\", \"reference_flow_ml_min\"): \"vd_fref\",\n}\n\n\ndef settings_to_state(payload: dict) -> dict:\n    \"\"\"設定 JSON を「ウィジェットキー → 値」に変換する（純粋関数）。\n\n    UI から切り離してあるのは、ここが黙って効かなくなる種類の処理だからです。\n    キー名を 1 つ打ち間違えても例外は出ず、ただ「読み込んだのに変わらない」に\n    なります。テストで照合できるよう関数に切り出しています。\n    \"\"\"\n    out: dict = {}\n    for (section, field), widget_key in _SETTINGS_MAP.items():\n        block = payload.get(section)\n        if not isinstance(block, dict) or field not in block:\n            continue\n        value = block[field]\n        if value is None:\n            continue\n        try:\n            value = float(value)\n        except (TypeError, ValueError):\n            continue\n        # ファイルは bar、画面は psi。ここが唯一の換算点です。\n        if widget_key == \"sys_pmax_psi\":\n            value *= PSI_PER_BAR\n        out[widget_key] = value\n    if \"van_deemter\" in payload:\n        out[\"vd_on\"] = payload[\"van_deemter\"] is not None\n    if \"system\" in payload and isinstance(payload[\"system\"], dict):\n        out[\"sys_sig_mode\"] = payload[\"system\"].get(\"sigma_ext_ul\") is not None\n    return out\n\n\ndef _settings_load(where=None) -> None:\n    \"\"\"保存した設定 JSON を読み戻す（設定ウィジェットを作る前に呼ぶこと）。\"\"\"\n    box = where or st\n    up = box.file_uploader(\n        \"設定を読み込む\", type=[\"json\"], key=\"settings_upload\",\n        help=\"「設定を保存」で書き出した JSON。カラム・装置・既定条件が戻ります。\",\n    )\n    if up is None:\n        return\n    stamp = f\"{getattr(up, 'name', '')}:{getattr(up, 'size', 0)}\"\n    if st.session_state.get(\"_settings_stamp\") == stamp:\n        return          # 同じファイルで毎回上書きしない（手で直せなくなる）\n    try:\n        up.seek(0)\n        payload = json.loads(up.read().decode(\"utf-8\"))\n    except Exception as e:  # noqa: BLE001\n        box.error(f\"読めませんでした: {e}\")\n        return\n\n    values = settings_to_state(payload)\n    st.session_state[\"_settings_stamp\"] = stamp\n    if not values:\n        box.warning(\"読み取れる項目がありませんでした。\")\n        return\n    # 読み込んだ値とプリセット名が食い違わないよう「手入力」に落とす\n    values[\"preset_column\"] = CUSTOM\n    values[\"preset_instrument\"] = CUSTOM\n    st.session_state.update(values)\n    st.session_state[\"cfg\"].update(\n        {k: v for k, v in values.items() if k in CFG_DEFAULTS})\n    st.session_state[\"_preset_column_applied\"] = CUSTOM\n    st.session_state[\"_preset_instrument_applied\"] = CUSTOM\n    box.success(f\"{len(values) - 2} 項目を読み込みました。\")\n    st.rerun()\n\n\n# ----------------------------------------------------------------------\n# 表示ヘルパ\n# ----------------------------------------------------------------------\ndef busy_button(label: str, *, key=None, help=None, kind=\"primary\"):\n    \"\"\"押した瞬間に、**ボタンそのものが進捗表示に変わる**ボタン。\n\n    返り値は ``(clicked, slot)``。clicked が True のとき slot に進捗を出します::\n\n        clicked, slot = busy_button(\"デザインスペースを計算\")\n        if clicked:\n            bar = slot.progress(0.0, text=\"計算中…\")\n            ...                      # bar.progress(done / total, text=...)\n            st.rerun()               # 終わったらボタンを描き直す\n\n    Streamlit のボタンは押しても見た目が変わらず、重い計算の間ページは\n    前の内容を映したままです。**ボタンの下**に進捗を置くと、視線がボタンから\n    動かないので「押せたのか固まったのか」が分かりません（10 秒かかる\n    デザインスペースの計算で実際にそうなりました）。だから同じ場所を\n    差し替えます。\n\n    計算が終わったら ``st.rerun()`` を呼んでください。slot は空のままなので、\n    描き直さないとボタンが消えたように見えます。\n    \"\"\"\n    slot = st.empty()\n    return slot.button(label, type=kind, key=key, help=help), slot\n\n\ndef show(fig) -> None:\n    \"\"\"matplotlib の Figure を表示して確実に閉じる。\"\"\"\n    st.pyplot(fig, width=\"stretch\")\n    plt.close(fig)\n\n\ndef mono(text: str) -> None:\n    \"\"\"等幅の表（lcmd の *_table() の出力）をそのまま出す。\"\"\"\n    st.code(text, language=None)\n\n\ndef download_df(df: pd.DataFrame, label: str, filename: str,\n                help: str | None = None, key: str | None = None) -> None:\n    buf = io.StringIO()\n    df.to_csv(buf, index=False)\n    st.download_button(label, buf.getvalue(), file_name=filename,\n                       mime=\"text/csv\", help=help, key=key)\n\n\n# ----------------------------------------------------------------------\n# モデル構築ラン ⇄ DataFrame\n# ----------------------------------------------------------------------\ndef df_to_runs(df: pd.DataFrame):\n    from lcmd import Run\n\n    out = []\n    for _, r in df.iterrows():\n        if not str(r[\"run_id\"]).strip():\n            continue\n        p0, p1 = float(r[\"phi0_pctB\"]), float(r[\"phi1_pctB\"])\n        if p0 > 1.0 or p1 > 1.0:\n            p0, p1 = p0 / 100.0, p1 / 100.0\n        out.append(Run.linear(str(r[\"run_id\"]), p0, p1, float(r[\"tG_min\"]),\n                              float(r[\"T_C\"]), float(r[\"flow_ml_min\"])))\n    return out\n\n\n# 「2. ピーク帰属」の条件表（日本語の列名）→ df_to_runs が読む列名\nCOND_COLUMNS = {\n    \"ラン\": \"run_id\", \"開始 %B\": \"phi0_pctB\", \"終了 %B\": \"phi1_pctB\",\n    \"tG [min]\": \"tG_min\", \"温度 [℃]\": \"T_C\", \"流速 [mL/min]\": \"flow_ml_min\",\n}\n\n\ndef cond_df_to_runs(df: pd.DataFrame | None):\n    \"\"\"帰属ページの条件表を Run のリストにする。\n\n    **設計（ページ 1）ではなく、実際に流した条件**を使うための入口です。\n    設計どおりに流せているとは限らず（温度を 45 のつもりが 40 で流した等）、\n    フィットが読むべきは実測条件のほうです。列名の対応はここ 1 か所。\n    \"\"\"\n    if df is None or not len(df):\n        return []\n    missing = [k for k in COND_COLUMNS if k not in df.columns]\n    if missing:\n        raise KeyError(f\"条件表に列がありません: {', '.join(missing)}\")\n    return df_to_runs(df.rename(columns=COND_COLUMNS)[list(COND_COLUMNS.values())])\n", "app/streamlit_app.py": "\"\"\"LC グラジエントメソッド開発支援 — アプリの入口\n\n起動:\n    ./.venv/bin/streamlit run app/streamlit_app.py\n\n設計\n----\n`lcmd/` の計算ロジックには手を入れず、この層は入出力だけを担当します。\n状態は st.session_state に置き、時間のかかる計算はボタンを押したときだけ\n実行します（Streamlit は操作のたびにスクリプトを頭から流し直すため）。\n\n画面には結果と操作だけを置き、説明は ``help=`` のツールチップに寄せています。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\n\nimport streamlit as st\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\nst.set_page_config(page_title=\"LC メソッド開発支援\", page_icon=\"🧪\",\n                   layout=\"wide\", initial_sidebar_state=\"expanded\")\n\nfrom app.common import build_system, init_state, inject_style  # noqa: E402\nfrom app.sections import (  # noqa: E402\n    assign_page, design, export_page, fit_page, home, map_page, tune_page,\n    width_page,\n)\n\n# 表示名 → (モジュール, 説明)。並びがそのまま作業順です。\n#\n# 作り直しの途中なので、退避したページは `_archive/sections/` にあります\n# （保持パラメータ・溶出組成の分布・モデル検証・シミュレータ・旧メソッド出力）。\n# 戻すときは app/sections/ に移してここへ 1 行足すだけです。\n# `lcmd/` の計算コアは何も消していません。\nPAGES = {\n    \"ホーム\": (home, \"進捗と装置・カラム条件\"),\n    \"1. 実験計画\": (\n        design,\n        \"保持 4 パラメータと分散 3 パラメータの推定に必要なランを決める\",\n    ),\n    \"2. ピーク帰属\": (\n        assign_page,\n        \"生データから全ピークを検出し、ラン間で対応づけて \"\n        \"保持時間と半値幅を得る\",\n    ),\n    \"3. 保持モデル推定\": (\n        fit_page,\n        \"実測保持時間から保持 4 パラメータを推定（回帰①）\",\n    ),\n    \"4. 分散モデル推定\": (\n        width_page,\n        \"実測半値幅から N・C・装置分散を推定（回帰②）。\"\n        \"ピーク幅と分離度の予測を実測で較正する\",\n    ),\n    \"5. デザインスペース探索\": (\n        map_page,\n        \"グラジエント時間 × 温度の等高線から、目標 Rs を満たす最短条件を選ぶ\",\n    ),\n    \"6. メソッド最適化\": (\n        tune_page,\n        \"流速・カラム長による高速化と、グラジエントのセグメント化\",\n    ),\n    \"7. 頑健性評価・出力\": (\n        export_page,\n        \"設定誤差・装置差に対する頑健性を評価し、メソッド表とレポートを出力\",\n    ),\n}\n\ninit_state()\ninject_style()\n\nst.sidebar.title(\"🧪 LC メソッド開発\")\nst.sidebar.markdown('<div class=\"brand-rule\"><\/div>', unsafe_allow_html=True)\nchoice = st.sidebar.radio(\"ページ\", list(PAGES), key=\"nav\",\n                          label_visibility=\"collapsed\",\n                          captions=[t for _m, t in PAGES.values()])\n\n# 装置・カラムの設定はホームに集約。ここではウィジェットに触れず、\n# session_state[\"cfg\"] から System を組み直すだけにします。\nsystem = build_system()\ncfg = st.session_state[\"cfg\"]\nPAGES[choice][0].render(system, cfg[\"flow\"], cfg[\"temp\"], cfg[\"rs_target\"])\n", "app/sections/__init__.py": "", "app/sections/assign_page.py": "\"\"\"ピーク帰属（クロマトグラム生データ → 成分 × ラン の保持時間）\n\n本ツールで最も難度の高い「夾雑を含めた全ピークの帰属」を機械にやらせるページ。\n手でやっている 3 つの判断（似たスペクトル・同じくらいの面積・近い条件なら\n保持時間と溶出順は大きく変わらない）を、そのままコストにして解きます。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom lcmd import (\n    MARGIN_CAP, MatchWeights, assign_runs, cost_terms, detect_peaks, plots,\n    read_arw, tier_from_area,\n)\nfrom app.common import busy_button, download_df, mono, show\n\n# 検出パラメータの初期値。ここに残っているのは「装置とカラムからは決められない」\n# 4 つだけです（何を見たいかの選択と、手動に切り替えたときの出発点）。\n# 残りは _auto_params() が装置とカラムから毎回計算します。\nDEFAULTS = dict(wavelength=230.0, bandwidth=0.0, min_snr=25.0,\n                min_area_frac=0.0)\n\n# 波長の間引き幅。スペクトルのコサイン類似度を取るので、これより粗くすると\n# 形が崩れて帰属の手がかりが弱くなります。\nWAVELENGTH_STEP_NM = 2.0\n\n\nPAGE_HELP = \"\"\"\nクロマトグラムの生データを読み込んで、**夾雑ピークまで含めた全ピークを\nラン間で対応づけ**、モデル推定に渡せる「成分 × ラン の保持時間」にします。\n手でやっている 3 つの判断をそのまま数値にします。\n\n| 手がかり | 数値にすると | 効き方 |\n|---|---|---|\n| 似たスペクトル | 頂点 UV スペクトルのコサイン類似度 | 別物をはじく。ただし**同族体は区別できない** |\n| 同じくらいの面積 | 面積比の対数（全体のスケールは自動補正） | 同族体の取り違えを防ぐ |\n| 保持時間 | 条件の近いランから予測した tR とのずれ | 寄与が最大 |\n\n3 つを足したコストが最小になる対応を探します。**溶出順は保ちません** ——\n温度や勾配時間を振れば順序は実際に入れ替わるからです。そのぶん、スペクトルが\n酷似な同族体を取り違える可能性は残ります。\n\n**全自動にはしていません。** 機械が決めた対応には必ず margin\n（2 番手の候補とのコスト差）が付きます。これが小さいものだけを目で\n確かめれば済むようにするのがこのページの狙いです。\n\"\"\"\n\nDEMO_HELP = (\n    \"架空の 8 ラン（グラジエント時間 20/40/80 min × 温度 30/45 ℃ の格子 ＋ \"\n    \"グラジエント容量をそろえた流速違い 2 本）を、いまサイドバーで設定して\"\n    \"いる装置・カラムで作ります。「1. 実験計画」が薦める形と同じです。\"\n    \"同じ群の成分はスペクトルを意図的に同一にしてあるので、面積と溶出順が\"\n    \"効いているかを確かめられます。\"\n)\n\n\ndef render(system, flow, temp, rs_target) -> None:\n    st.title(\"ピーク帰属\", help=PAGE_HELP)\n\n    _load(system)\n    if not st.session_state[\"pda\"]:\n        return\n\n    st.divider()\n    _conditions()\n\n    st.divider()\n    _detect(system)\n    if not st.session_state[\"ptables\"]:\n        return\n\n    st.divider()\n    _reference_pick()\n\n    st.divider()\n    _assign()\n\n    rep = st.session_state.get(\"assign\")\n    if rep is not None:\n        st.divider()\n        _results(rep)\n\n\n# ----------------------------------------------------------------------\n# 1. 読み込み\n# ----------------------------------------------------------------------\ndef _load(system) -> None:\n    st.header(\"1. データ読み込み\",\n              help=\"Waters ARW（Empower のテキスト書き出し）。3D（全波長）でも \"\n                   \"単一波長でも読めます。`.arw` / `.arw.gz` に対応、\"\n                   \"日本語ヘッダ（cp932）も自動判定します。\")\n\n    # 間引きは自動。PDA 1 ランは 30 MB を超えるので、そのまま何本も抱えると\n    # ブラウザ版がメモリで落ちます。ピークの形が崩れない範囲だけ削ります。\n    #   時間 … 最も狭いピークを 20 点で描ける刻み\n    #   波長 … 2 nm（スペクトルの形はこれで保てる）\n    # 元データがこれより粗ければ、間引きは起きません（downsample が素通し）。\n    _, w_half = _narrowest_peak(system, float(st.session_state[\"cfg\"][\"flow\"]))\n    t_step, w_step = w_half / 20.0, WAVELENGTH_STEP_NM\n    st.caption(\n        f\"読み込むときに、時間 {t_step * 60:.2f} 秒・波長 {w_step:.0f} nm より\"\n        \"細かい刻みは間引きます（ピークの形は保たれます）。\"\n        \"元データがこれより粗ければそのままです。\")\n\n    ups = st.file_uploader(\"ARW ファイル（複数可）\",\n                           type=[\"arw\", \"gz\", \"txt\", \"csv\", \"tsv\"],\n                           accept_multiple_files=True, key=\"arw_upload\")\n    a, b = st.columns([1, 3])\n    with a:\n        clicked, slot = busy_button(\"読み込む\")\n    if clicked and ups:\n        got, errs = {}, []\n        bar = slot.progress(0.0, text=\"読み込み中…\")\n        for k, up in enumerate(ups or []):\n            try:\n                pda = read_arw(up, time_step_min=t_step or None,\n                               wavelength_step_nm=w_step or None)\n                name = pda.name or up.name\n                if name in got:\n                    name = f\"{name}_{k + 1}\"\n                pda.name = name\n                got[name] = pda\n            except Exception as e:  # noqa: BLE001\n                errs.append(f\"{up.name}: {e}\")\n            bar.progress((k + 1) / max(len(ups), 1),\n                         text=f\"読み込み中… {k + 1}/{len(ups)}\")\n        if got:\n            st.session_state[\"pda\"] = got\n            st.session_state[\"ptables\"] = {}\n            st.session_state[\"assign\"] = None\n            st.success(f\"{len(got)} ラン読み込みました。\")\n        for e in errs:\n            st.error(e)\n\n    with b.expander(\"サンプルデータで試す\"):\n        st.caption(\"実測ファイルの代わりにサンプルを合成します。\", help=DEMO_HELP)\n        if st.button(\"合成データ生成\", help=DEMO_HELP):\n            with st.spinner(\"合成中…\"):\n                pdas, cond = _demo_pdas(system)\n                st.session_state[\"pda\"] = pdas\n                # 条件はファイル名から推測させず、合成に使った値をそのまま渡す。\n                # 流速違いのランは名前（F0.2 など）に tG も温度も入っていないので、\n                # 推測に任せると既定値（tG 40 / 40 ℃）で埋まってしまいます。\n                st.session_state[\"pda_cond\"] = cond\n                st.session_state[\"ptables\"] = {}\n                st.session_state[\"assign\"] = None\n            st.rerun()\n\n    pdas = st.session_state[\"pda\"]\n    if pdas:\n        st.dataframe(pd.DataFrame([\n            {\"ラン\": p.name, \"種類\": \"3D (PDA)\" if p.is_3d else \"2D\",\n             \"時間 [min]\": round(p.duration, 2),\n             \"データ点数\": p.n_times, \"刻み [秒]\": round(p.dt * 60, 3),\n             \"波長数\": p.n_wavelengths if p.is_3d else 1,\n             \"メモリ [MB]\": round(p.nbytes / 1e6, 1)}\n            for p in pdas.values()\n        ]), width=\"stretch\", hide_index=True)\n        tot = sum(p.nbytes for p in pdas.values()) / 1e6\n        if tot > 400:\n            st.warning(\n                f\"合計 {tot:.0f} MB あります。ブラウザ版だと重いので、\"\n                \"ランを分けて読み込むか、装置側の取り込み間隔を粗くしてください。\",\n                icon=\"⚠️\")\n\n\ndef _demo_pdas(system):\n    \"\"\"サンプルの生データを合成する。\n\n    **いまサイドバーで設定している装置・カラムで作ります。**\n    別の装置で作ると、後段のフィットが「違う装置のデータ」を当てはめる\n    ことになり、復元したパラメータが系統的にずれます。\n\n    構成は「1. 実験計画」が薦める形に合わせてあります\n    ——（グラジエント時間 × 温度）の格子 ＋ グラジエント容量をそろえた\n    流速違い 2 本。流速を振っておかないと回帰② で C（流速を上げたときの\n    N の落ち方）が決まらず、サンプルだけ機能が欠けることになります。\n    \"\"\"\n    from lcmd import Run\n    from examples.demo_case import true_components\n    from examples.synthetic_pda import synth_run_set\n\n    comps = true_components()\n    flow = float(st.session_state[\"cfg\"][\"flow\"])\n    runs = [Run.linear(f\"tG{int(tG)}_T{int(T)}\", 0.05, 0.95, tG, T, flow)\n            for tG in (20.0, 40.0, 80.0) for T in (30.0, 45.0)]\n    volume = 40.0 * flow          # 中心ランのグラジエント容量 [mL]\n    runs += [Run.linear(f\"F{f:g}\", 0.05, 0.95, volume / f, 37.5, f)\n             for f in (round(flow / 2, 3), round(flow * 2, 3)) if f > 0]\n\n    cond = pd.DataFrame([{\n        \"ラン\": r.run_id, \"開始 %B\": 5.0, \"終了 %B\": 95.0,\n        \"tG [min]\": r.method.gradient.duration,\n        \"温度 [℃]\": r.method.temperature_C,\n        \"流速 [mL/min]\": r.method.flow_ml_min,\n    } for r in runs])\n    return synth_run_set(comps, runs, system), cond\n\n\n# ----------------------------------------------------------------------\n# 2. ラン条件\n# ----------------------------------------------------------------------\nCOND_HELP = \"\"\"\n帰属を「条件が近い順」に伝播させるために使います。勾配時間 20 と 80 を直接\n比べるより、20 → 40 → 80 と繋いだ方が安全だからです。\n\n**「実験計画」で条件を確定していれば、そこから自動で当てます。**\nファイル名に設計のラン ID（`tG16.9_T45` など）が入っていれば名前で照合し、\n入っていなければ**溶出順**で仮に当てます。溶出順で当てた場合は必ず\n確認してください。ここが 1 行ずれると、以降の推定が丸ごとずれます。\n\"\"\"\n\n\ndef _design_options() -> dict:\n    \"\"\"「実験計画」で確定した条件を {run_id: 条件} で返す。\"\"\"\n    out = {}\n    for r in st.session_state.get(\"design_runs\") or []:\n        g, m = r.method.gradient, r.method\n        out[r.run_id] = {\n            \"開始 %B\": float(g.phis[0] * 100.0),\n            \"終了 %B\": float(g.phis[-1] * 100.0),\n            \"tG [min]\": float(g.duration),\n            \"温度 [℃]\": float(m.temperature_C),\n            \"流速 [mL/min]\": float(m.flow_ml_min),\n        }\n    return out\n\n\ndef _auto_map(names: list[str], design_ids: list[str]) -> tuple[dict, bool]:\n    \"\"\"ファイル名 → 設計のラン ID。(対応, 溶出順で当てたか) を返す。\n\n    名前で照合できたものだけを当て、1 つも当たらなければ溶出順に落とします。\n    一部だけ当たった場合に残りを溶出順で埋めないのは、そのほうが危ないからです\n    （当たった分でずれた並びを、正しいものとして埋めてしまう）。\n    \"\"\"\n    def norm(s):\n        return \"\".join(str(s).lower().split())\n\n    used, out = set(), {}\n    for n in names:\n        hit = next((d for d in design_ids\n                    if d not in used and norm(d) in norm(n)), None)\n        if hit:\n            used.add(hit)\n            out[n] = hit\n    if out:\n        return out, False\n    # 本数が違うのに並び順で当てると、まず間違いなくずれます\n    if len(names) != len(design_ids):\n        return {}, False\n    return {n: d for n, d in zip(names, design_ids)}, len(names) > 1\n\n\ndef _conditions() -> None:\n    st.header(\"2. 分析条件\", help=COND_HELP)\n\n    names = list(st.session_state[\"pda\"])\n    flow = float(st.session_state[\"cfg\"][\"flow\"])\n    design = _design_options()\n\n    df = st.session_state.get(\"pda_cond\")\n    if df is None or set(df[\"ラン\"]) != set(names):\n        df = pd.DataFrame([_guess_condition(n, flow) for n in names])\n        if design:\n            mapping, by_order = _auto_map(names, list(design))\n            df.insert(1, \"設計のラン\", [mapping.get(n, \"\") for n in names])\n            st.session_state[\"_map_by_order\"] = by_order\n    if design and \"設計のラン\" not in df.columns:\n        df.insert(1, \"設計のラン\", \"\")\n\n    # 設計のランが選ばれている行は、その条件で上書きする（手入力より設計を優先）\n    if design:\n        for i, rid in enumerate(df[\"設計のラン\"]):\n            if rid in design:\n                for k, v in design[rid].items():\n                    df.loc[df.index[i], k] = v\n\n    cfg = {\n        \"ラン\": st.column_config.TextColumn(disabled=True),\n        \"開始 %B\": st.column_config.NumberColumn(format=\"%.1f\"),\n        \"終了 %B\": st.column_config.NumberColumn(format=\"%.1f\"),\n        \"tG [min]\": st.column_config.NumberColumn(format=\"%.1f\"),\n        \"温度 [℃]\": st.column_config.NumberColumn(format=\"%.1f\"),\n        \"流速 [mL/min]\": st.column_config.NumberColumn(format=\"%.2f\"),\n    }\n    if design:\n        cfg[\"設計のラン\"] = st.column_config.SelectboxColumn(\n            \"設計のラン\", options=[\"\"] + list(design),\n            help=\"選ぶと右の条件がその設計値で埋まります。空にすれば手入力できます。\")\n\n    edited = st.data_editor(df, width=\"stretch\", hide_index=True,\n                            key=\"cond_editor\", column_config=cfg)\n    st.session_state[\"pda_cond\"] = edited\n\n    if design:\n        mapped = [r for r in edited[\"設計のラン\"] if r]\n        if st.session_state.get(\"_map_by_order\") and mapped:\n            st.warning(\"ファイル名から判別できなかったので、**溶出順**で仮に\"\n                       \"当てています。1 行ずつ確認してください。\", icon=\"⚠️\")\n        if len(set(mapped)) != len(mapped):\n            st.error(\"同じ設計のランが複数のファイルに割り当てられています。\",\n                     icon=\"🚨\")\n        missing = [r for r in design if r not in mapped]\n        if missing:\n            st.info(f\"まだ読み込まれていない設計のラン: {', '.join(missing)}\",\n                    icon=\"📄\")\n    else:\n        st.caption(\"「実験計画」で設計を確定しておくと、\"\n                   \"ここは自動で埋まります。\")\n\n\ndef _guess_condition(name: str, flow: float = 0.40) -> dict:\n    \"\"\"ラン名から tG と温度を読み取る（`tG40_T30` のような命名を想定）。\n\n    流速はサイドバーの既定値を初期値にします。ここを 0.40 に決め打ちすると、\n    別の流速で測ったデータを 0.40 として当てはめることになり、\n    復元されるパラメータが黙ってずれます。\n    \"\"\"\n    import re\n\n    tG = re.search(r\"tG\\s*_?(\\d+(?:\\.\\d+)?)\", name, re.I)\n    T = re.search(r\"[_\\-]T\\s*_?(\\d+(?:\\.\\d+)?)\", name, re.I)\n    return {\"ラン\": name, \"開始 %B\": 5.0, \"終了 %B\": 95.0,\n            \"tG [min]\": float(tG.group(1)) if tG else 40.0,\n            \"温度 [℃]\": float(T.group(1)) if T else 40.0,\n            \"流速 [mL/min]\": float(flow)}\n\n\ndef _cond_dict() -> dict:\n    df = st.session_state.get(\"pda_cond\")\n    if df is None:\n        return {}\n    return {r[\"ラン\"]: {\"tG\": float(r[\"tG [min]\"]), \"T\": float(r[\"温度 [℃]\"]),\n                        \"phi0\": float(r[\"開始 %B\"]) / 100.0,\n                        \"phi1\": float(r[\"終了 %B\"]) / 100.0,\n                        \"flow\": float(r[\"流速 [mL/min]\"])}\n            for _, r in df.iterrows()}\n\n\n# ----------------------------------------------------------------------\n# 3. ピーク検出\n# ----------------------------------------------------------------------\n# 感度は「最小 S/N」1 本に集約します。ほかのしきい値は、装置とカラムから\n# 計算できる「最も狭いピークの幅」から自動で決まります。\nSENSITIVITY = {\"控えめ\": 50.0, \"標準\": 25.0, \"敏感\": 10.0}\n\nAUTO_HELP = \"\"\"\n検出のしきい値は、**装置とカラムの設定から自動で決めています**。手で決める\n必要があるのは、検出波長（何を見たいか）と感度（どこまで拾うか）だけです。\n\n自動で決まるもの:\n\n| 項目 | 決め方 |\n|---|---|\n| 開始時刻 | ボイド時間 t0 の 1.15 倍。溶媒ピークを外します |\n| 平滑化の窓 | 予測される最も狭いピークの σ の半分 |\n| 最小 半値幅 | 同じく予測 w½ の 0.3 倍。スパイクノイズだけが落ちます |\n| ベースラインの硬さ | ピーク幅の 25 倍より緩やかな起伏だけを追うように |\n\nもとになる「最も狭いピークの幅」は σ² = (t0·2·0.9/√N)² + σ_ext² から\n出しています（ボイド直後に出る、最も保持の弱いピークを想定）。\nつまり**カラムを変えたり流速を変えたりすると、しきい値も追随します**。\n\"\"\"\n\n\ndef _narrowest_peak(system, flow: float) -> tuple[float, float]:\n    \"\"\"このカラム・この流速で予想される、最も狭いピークの (σ, w½)[min]。\n\n    ボイド直後（kE≈1、G≈0.9）に出る、最も保持の弱いピークを想定します。\n    間引き幅も検出のしきい値も、すべてこの 1 つの量から決まります。\n    \"\"\"\n    t0 = system.t0(flow)\n    n_plates = max(system.plates_at(flow), 1.0)\n    sigma_col = t0 * 2.0 * 0.9 / math.sqrt(n_plates)\n    sigma = math.hypot(sigma_col, system.sigma_ext_at(flow))\n    return sigma, 2.3548 * sigma\n\n\ndef _auto_params(pda, system, flow: float) -> dict:\n    \"\"\"装置とカラムから検出のしきい値を決める。\n\n    要になるのは「このカラム・この流速で、最も狭いピークはどれくらいか」。\n    それさえ分かれば、平滑化の窓も最小幅もベースラインの硬さも、そこからの\n    比で決まります。ここを手入力にしていたのが、設定項目が多い原因でした。\n    \"\"\"\n    t0 = system.t0(flow)\n    sigma, w_half = _narrowest_peak(system, flow)\n\n    dt = float(pda.dt) or 1e-4\n    w_pts = max(w_half / dt, 3.0)\n    # Whittaker 平滑化は「λ^(1/4)·2π 点」より細かい起伏を追えなくなります。\n    # ベースラインに求めるのは 2 つ。\n    #   (a) ピークに食い込まない       → ピーク幅の 50 倍より細かい起伏は追わない\n    #   (b) グラジエントのドリフトは追う → ラン全体の 1/20 の起伏は追える\n    # 両方を満たすため硬いほうを採ります。25 倍まで緩めると合成データで\n    # 偽ピークが 1 本増えました（14 成分に対して 15 本）。\n    length_pts = max(50.0 * w_pts, pda.n_times / 20.0)\n    lam = (length_pts / (2.0 * math.pi)) ** 4\n\n    return {\n        \"t_lo\": 1.15 * t0,\n        \"smooth\": max(0.5 * sigma, dt * 3),\n        \"min_width\": 0.3 * w_half,\n        \"lam\": float(np.clip(lam, 1e4, 1e10)),\n        \"w_half\": w_half,\n    }\n\n\ndef _scan_wavelength(pda, params_fn, rid: str, bw: float, afrac: float,\n                     step_nm: float = 10.0):\n    \"\"\"最も多くピークが見える波長を探す。3D でなければ None。\n\n    同数なら**総面積が大きいほう**を採ります。ピーク数だけで選ぶと、\n    ノイズの多い端の波長がスパイクを拾って勝つことがあるためです。\n    \"\"\"\n    if not pda.is_3d:\n        return None\n    wl = np.asarray(pda.wavelengths, dtype=float)\n    lo, hi = float(wl.min()), float(wl.max())\n    grid = np.arange(max(lo, 200.0), min(hi, 500.0) + 1e-9, step_nm)\n    if grid.size == 0:\n        return None\n\n    best, bar = None, st.progress(0.0, text=\"波長を走査しています…\")\n    for k, w in enumerate(grid):\n        try:\n            tb = detect_peaks(pda, wavelength=float(w), bandwidth_nm=bw,\n                              min_area_fraction=afrac, **params_fn(rid))\n            score = (len(tb), tb.total_area())\n        except Exception:  # noqa: BLE001\n            score = (0, 0.0)\n        if best is None or score > best[1]:\n            best = (float(w), score)\n        bar.progress((k + 1) / grid.size, text=f\"波長を走査中… {w:.0f} nm\")\n    bar.empty()\n    return None if best is None else (best[0], best[1][0])\n\n\ndef _detect(system) -> None:\n    st.header(\"3. ピーク検出\", help=AUTO_HELP)\n    ss = st.session_state\n    pdas = ss[\"pda\"]\n    cond = _cond_dict()\n    default_flow = float(ss[\"cfg\"][\"flow\"])\n\n    # 「波長を自動で選ぶ」からの反映。ウィジェットを作る前に済ませます\n    if \"_wl_suggest\" in ss:\n        ss[\"pk_wl\"] = ss.pop(\"_wl_suggest\")\n\n    c1, c2, c3 = st.columns([2, 1, 2])\n    wl = c1.number_input(\n        \"検出波長 [nm]\", 190.0, 800.0, DEFAULTS[\"wavelength\"], 1.0, key=\"pk_wl\",\n        help=\"何を見たいかの選択なので、ここだけは決めてください。\"\n             \"多成分を一律に見るなら 220-230 nm が無難です。\")\n    with c2:\n        st.write(\"\")\n        pick_wl = st.button(\"自動で選ぶ\", width=\"stretch\",\n                            help=\"最も多くピークが見える波長を探します\"\n                                 \"（先頭のランで走査）。\")\n    sens = c3.radio(\"検出感度\", list(SENSITIVITY), index=1, horizontal=True,\n                    key=\"pk_sens\",\n                    help=\"拾う下限。控えめ = S/N 50、標準 = 25、敏感 = 10。\"\n                         \"微量の夾雑まで追うなら敏感、\"\n                         \"ピークが増えすぎたら控えめへ。\")\n\n    # --- 自動値（ランごとに流速が違えば、しきい値も変わる）---\n    auto = {rid: _auto_params(p, system,\n                              cond.get(rid, {}).get(\"flow\", default_flow))\n            for rid, p in pdas.items()}\n    ref_auto = next(iter(auto.values()))\n\n    manual = False\n    with st.expander(\"検出条件の手動設定\"):\n        manual = st.checkbox(\"手で設定する\", key=\"pk_manual\")\n        c1, c2, c3 = st.columns(3)\n        bw = c1.number_input(\"バンド幅 [nm]\", 0.0, 40.0, DEFAULTS[\"bandwidth\"],\n                             1.0, key=\"pk_bw\",\n                             help=\"0 なら 1 チャンネル。広げるとノイズが減ります\")\n        afrac = c2.number_input(\n            \"最小 面積比（最大ピーク比）\", 0.0, 1.0, DEFAULTS[\"min_area_frac\"],\n            0.001, format=\"%.3f\", key=\"pk_afrac\",\n            help=\"目的ピークの 1/100 で切るなら 0.01。0 なら無効\")\n        t_hi = c3.number_input(\"終了 [min]（0 = 最後まで）\", 0.0, 1000.0,\n                               0.0, 0.5, key=\"pk_thi\")\n        st.divider()\n        c1, c2, c3, c4 = st.columns(4)\n        m_snr = c1.number_input(\"最小 S/N\", 3.0, 500.0, DEFAULTS[\"min_snr\"],\n                                1.0, key=\"pk_snr\", disabled=not manual)\n        m_tlo = c2.number_input(\"開始 [min]\", 0.0, 1000.0,\n                                round(ref_auto[\"t_lo\"], 3), 0.05,\n                                format=\"%.3f\", key=\"pk_tlo\", disabled=not manual)\n        m_wmin = c3.number_input(\"最小 半値幅 [min]\", 0.0, 1.0,\n                                 round(ref_auto[\"min_width\"], 4), 0.001,\n                                 format=\"%.4f\", key=\"pk_wmin\",\n                                 disabled=not manual)\n        m_smooth = c4.number_input(\"平滑化の窓 [min]\", 0.0005, 0.5,\n                                   round(ref_auto[\"smooth\"], 4), 0.0005,\n                                   format=\"%.4f\", key=\"pk_smooth\",\n                                   disabled=not manual)\n        m_lam = st.slider(\"ベースラインの硬さ log₁₀(λ)\", 4.0, 10.0,\n                          float(round(math.log10(ref_auto[\"lam\"]), 1)), 0.1,\n                          key=\"pk_lam\", disabled=not manual,\n                          help=\"大きいほど直線に近い。小さすぎるとベースラインが\"\n                               \"ピークに食い込んで面積が減ります\")\n\n    if manual:\n        st.caption(\"**手動**　\"\n                   f\"S/N {m_snr:.0f}　開始 {m_tlo:.3f} min　\"\n                   f\"最小 w½ {m_wmin:.4f} min　平滑化 {m_smooth:.4f} min　\"\n                   f\"λ 1e{m_lam:.1f}\")\n    else:\n        st.caption(\n            f\"**自動**　S/N {SENSITIVITY[sens]:.0f}　\"\n            f\"開始 {ref_auto['t_lo']:.3f} min　\"\n            f\"最小 w½ {ref_auto['min_width']:.4f} min　\"\n            f\"平滑化 {ref_auto['smooth']:.4f} min　\"\n            f\"λ 1e{math.log10(ref_auto['lam']):.1f}\"\n            f\"　（想定する最も狭いピーク w½ = {ref_auto['w_half'] * 60:.2f} 秒）\",\n            help=AUTO_HELP)\n\n    def _params(rid):\n        a = auto[rid]\n        if manual:\n            return dict(t_range=(m_tlo or None, t_hi or None), min_snr=m_snr,\n                        min_width_min=m_wmin, smooth_min=m_smooth,\n                        baseline_lam=10.0 ** m_lam)\n        return dict(t_range=(a[\"t_lo\"], t_hi or None),\n                    min_snr=SENSITIVITY[sens], min_width_min=a[\"min_width\"],\n                    smooth_min=a[\"smooth\"], baseline_lam=a[\"lam\"])\n\n    if pick_wl:\n        best = _scan_wavelength(next(iter(pdas.values())), _params, next(iter(pdas)),\n                                bw, afrac)\n        if best is None:\n            st.warning(\"この生データは単一波長なので、波長は選べません。\")\n        else:\n            ss[\"_wl_suggest\"] = float(best[0])\n            st.rerun()\n\n    clicked, slot = busy_button(\"全ランでピーク検出\")\n    if clicked:\n        tables = {}\n        bar = slot.progress(0.0, text=f\"検出中… 0/{len(pdas)}\")\n        for k, (rid, p) in enumerate(pdas.items()):\n            try:\n                tables[rid] = detect_peaks(\n                    p, wavelength=wl, bandwidth_nm=bw,\n                    min_area_fraction=afrac, **_params(rid))\n            except Exception as e:  # noqa: BLE001\n                st.error(f\"{rid}: {e}\")\n            bar.progress((k + 1) / max(len(pdas), 1),\n                         text=f\"検出中… {k + 1}/{len(pdas)}\")\n        ss[\"ptables\"] = tables\n        ss[\"assign\"] = None\n        ss[\"ref_labels\"] = None\n        st.rerun()\n\n    tables = st.session_state[\"ptables\"]\n    if not tables:\n        st.info(\"「全ランでピーク検出」を押してください。\"\n                \"うまくいかなければ感度を変えてもう一度。\")\n        return\n\n    counts = pd.DataFrame([\n        {\"ラン\": rid, \"ピーク数\": len(tb),\n         \"要確認\": sum(p.needs_check for p in tb.peaks),\n         \"ノイズ [AU]\": tb.noise, \"総面積\": tb.total_area()}\n        for rid, tb in tables.items()\n    ])\n    st.dataframe(counts, width=\"stretch\", hide_index=True,\n                 column_config={\n                     \"ノイズ [AU]\": st.column_config.NumberColumn(format=\"%.2e\"),\n                     \"総面積\": st.column_config.NumberColumn(format=\"%.4g\")})\n\n    spread = counts[\"ピーク数\"].max() - counts[\"ピーク数\"].min()\n    if spread > max(3, 0.3 * counts[\"ピーク数\"].max()):\n        st.warning(\n            f\"ランによってピーク数が {counts['ピーク数'].min()}–\"\n            f\"{counts['ピーク数'].max()} とばらついています。\"\n            \"分離が悪いランで融合しているだけなら問題ありませんが、\"\n            \"しきい値が厳しすぎないかも確かめてください。\", icon=\"⚠️\")\n\n    st.subheader(\"検出結果の確認\",\n                 help=\"塗った範囲がそのまま積分範囲です。裾を巻き込みすぎて\"\n                      \"いないか、逆に切りすぎていないかを見てください。\")\n    pick = st.selectbox(\"ラン\", list(tables), key=\"pk_view\")\n    tb = tables[pick]\n    zoom = st.slider(\"表示範囲 [min]\", float(tb.times[0]), float(tb.times[-1]),\n                     (float(tb.times[0]), float(tb.times[-1])), key=\"pk_zoom\")\n    show(plots.plot_peaks(tb, t_range=zoom))\n    mono(tb.table())\n\n\n# ----------------------------------------------------------------------\n# 4. 基準ランに名前をつける\n# ----------------------------------------------------------------------\nREF_HELP = \"\"\"\n**最もよく分離しているラン**（ふつうは勾配時間が最も長いもの）を基準ランに\nします。基準ランで見つかったピークが、そのまま帰属の「登場人物」になります。\n\nここで名前をつける必要はありません。P01, P02 … と機械的に振っておいて、\n**どれが分離対象かは帰属が終わってから選びます**（そのほうが、全ランでの\n挙動を見てから決められます）。\n\n外したいピーク（溶媒、システムピークなど）だけ、下の折りたたみで名前を\n空にしてください。空にしたピークは帰属の対象から外れます。\n\"\"\"\n\n\ndef _reference_pick() -> None:\n    st.header(\"4. 基準ラン\", help=REF_HELP)\n    tables = st.session_state[\"ptables\"]\n    ids = list(tables)\n    cond = _cond_dict()\n    # tG が最も長いランを既定に（最もよく分離しているはずなので）\n    default = max(ids, key=lambda r: cond.get(r, {}).get(\"tG\", 0.0))\n    ref = st.selectbox(\"基準ラン\", ids, index=ids.index(default), key=\"ref_run\")\n    tb = tables[ref]\n\n    prev = st.session_state.get(\"ref_labels\")\n    # Tier はここでは決めません。「7. 対象成分の選択」で選んだ結果から\n    # 機械的に付きます（Tier の出どころを 1 か所にするため）。\n    df = pd.DataFrame([\n        {\"#\": i, \"tR [min]\": round(p.tR, 3),\n         \"面積%\": round(100 * p.area / (tb.total_area() or 1), 2),\n         \"λmax\": round(p.lambda_max, 1), \"純度\": round(p.purity, 4),\n         \"半値幅\": round(p.width_half, 4),\n         \"名前\": p.label}\n        for i, p in enumerate(tb.peaks)\n    ])\n    if prev is not None and len(prev) == len(df):\n        df[\"名前\"] = prev[\"名前\"].values\n\n    n_on = int((df[\"名前\"].astype(str).str.strip() != \"\").sum())\n    st.caption(f\"{ref} のピーク {len(df)} 本のうち **{n_on} 本**を帰属します。\"\n               \"名前は仮のものです（分離対象はあとで選びます）。\")\n\n    with st.expander(\"対象外ピークの除外（任意）\"):\n        st.caption(\"名前を空にすると、そのピークは帰属の対象から外れます。\"\n                   \"溶媒ピークやシステムピークをここで落としてください。\")\n        edited = st.data_editor(\n            df, width=\"stretch\", hide_index=True, key=\"ref_editor\",\n            disabled=[\"#\", \"tR [min]\", \"面積%\", \"λmax\", \"純度\", \"半値幅\"],\n            column_config={\n                \"名前\": st.column_config.TextColumn(\"名前（空にすると外す）\"),\n                \"純度\": st.column_config.NumberColumn(format=\"%.4f\"),\n            },\n        )\n    st.session_state[\"ref_labels\"] = edited\n\n    dup = edited[edited[\"名前\"].astype(str).str.strip() != \"\"][\"名前\"]\n    if dup.duplicated().any():\n        st.error(f\"名前が重複しています: \"\n                 f\"{', '.join(sorted(set(dup[dup.duplicated()])))}\", icon=\"🚨\")\n\n\n# ----------------------------------------------------------------------\n# 5. 帰属\n# ----------------------------------------------------------------------\n# 帰属の解き方は固定です。\n#\n# ORDER_PRESERVING = False\n#     温度や勾配時間を振れば溶出順は実際に入れ替わります（それが温度を\n#     選択性の因子に使う理由でもあります）。順序を強制すると、入れ替わった\n#     ペアは取り違えるかわりに**片方を捨てる**ので、対応数が減ります。\n#     入れ替わりを許す代わりに、スペクトルが酷似な同族体を取り違える\n#     危険は残ります。だから「要確認の対応」を必ず見てください。\n# CHAIN = True\n#     tG 20 と 80 を直接比べず、20 → 40 → 80 と条件の近い順に繋ぎます。\n#     近い条件どうしなら手がかりが強いので、常に有利です。\nORDER_PRESERVING = False\nCHAIN = True\n\nASSIGN_HELP = \"\"\"\n**溶出順は保ちません。** 温度や勾配時間を振れば順序は実際に入れ替わるからです。\nそのぶん、スペクトルが酷似な同族体を取り違える可能性は残ります。\n下の「要確認の対応」が唯一の関門なので、必ず目を通してください。\n\n伝播は**条件の近い順に数珠つなぎ**で行います（tG 20 → 40 → 80）。\n離れた条件どうしを直接比べるより手がかりが強く働きます。\n\"\"\"\n\n\n# 「相手なし」のコスト。これだけが実質の因子です。大きいほど、多少\n# 自信がなくても対応をつけにいきます（＝「落とした」が減る）。\n# 合成データ（14 成分 × 6 ラン、同族体のスペクトルは同一）での実測:\n#   慎重 1.2 → 落とした 21 件 / 取り違え 0\n#   標準 2.0 → 落とした 12 件 / 取り違え 0\n#   積極的 3.0 → 落とした  7 件 / 取り違え 0\n# どの値でも取り違えは出ませんでしたが、実データで同族体が多い場合は\n# 積極的にするほど取り違えの危険が上がります。\nBOLDNESS = {\"慎重\": 1.2, \"標準\": 2.0, \"積極的\": 3.0}\n\nBOLDNESS_HELP = \"\"\"\n自信が持てないときに、**対応をつけにいくか、保留するか**の度合いです。\n\n- **慎重** … 確信が持てなければ「そのランには無い」と答える。取り違えは\n  減りますが、回帰に使える点も減ります\n- **標準**（推奨）\n- **積極的** … 多少あやしくても対応をつける。点は増えますが、\n  スペクトルが酷似な同族体を取り違える危険が上がります\n\n保留された対応は「要確認の対応」の**未検出の対応**に\n出ます。そこが多いようなら積極的側へ動かしてください。\n\"\"\"\n\n# 手がかりの重みと許容幅は固定。合成データで振ってみたところ、時間の許容を\n# 狭めると（0.30 → 0.15 min）落とす数が 21 → 48 件に倍増しました。条件が\n# 大きく違うランどうしでは、時間の予測はピーク幅よりずっと粗いためです。\nDEFAULT_WEIGHTS = dict(w_spectrum=1.0, w_area=0.6, w_time=1.0,\n                       spectrum_tol=0.01, area_tol=3.0, time_tol_min=0.30,\n                       min_similarity=0.95, review_margin=0.5)\n\n\ndef _assign() -> None:\n    st.header(\"5. ピーク帰属\", help=ASSIGN_HELP)\n    ss = st.session_state\n\n    c1, c2 = st.columns([2, 1])\n    bold = c1.radio(\"対応づけの許容度\", list(BOLDNESS), index=1, horizontal=True,\n                    key=\"mw_bold\", help=BOLDNESS_HELP)\n    use_model = False\n    if ss.get(\"comps\") is not None:\n        use_model = c2.checkbox(\n            \"モデルの予測 tR を使う（2 巡目）\", value=False, key=\"mw_model\",\n            help=\"1 巡目の帰属 → フィット → この 2 巡目、の順で使います。\"\n                 \"時間の手がかりが格段に強くなり、\"\n                 \"保留されたピークを拾い直せます\")\n\n    with st.expander(\"重みと許容幅の手動設定\"):\n        st.caption(\"コスト = w_s·(1−類似度)/許容 + w_a·|ln(面積比)|/ln(許容) \"\n                   \"+ w_t·|予測との差|/許容。\"\n                   \"許容幅は「この程度ずれても不思議ではない」値です。\"\n                   \"触らなくて構いません。\")\n        manual_w = st.checkbox(\"手で設定する\", key=\"mw_manual\")\n        c1, c2, c3 = st.columns(3)\n        ws = c1.number_input(\"w スペクトル\", 0.0, 5.0, 1.0, 0.1, key=\"mw_s\",\n                             disabled=not manual_w)\n        wa = c2.number_input(\"w 面積\", 0.0, 5.0, 0.6, 0.1, key=\"mw_a\",\n                             disabled=not manual_w)\n        wt = c3.number_input(\"w 時間\", 0.0, 5.0, 1.0, 0.1, key=\"mw_t\",\n                             disabled=not manual_w)\n        c1, c2, c3 = st.columns(3)\n        stol = c1.number_input(\"許容 1−類似度\", 0.0001, 0.2, 0.01, 0.001,\n                               format=\"%.4f\", key=\"mw_stol\",\n                               disabled=not manual_w)\n        atol = c2.number_input(\"許容 面積比\", 1.1, 20.0, 3.0, 0.5, key=\"mw_atol\",\n                               disabled=not manual_w)\n        ttol = c3.number_input(\"許容 時間ずれ [min]\", 0.01, 5.0, 0.30, 0.05,\n                               key=\"mw_ttol\", disabled=not manual_w)\n        c1, c2 = st.columns(2)\n        minsim = c1.number_input(\"同一とみなす最低類似度\", 0.5, 1.0, 0.95, 0.01,\n                                 key=\"mw_minsim\", disabled=not manual_w)\n        revm = c2.number_input(\"要確認にする margin\", 0.0, 5.0, 0.5, 0.1,\n                               key=\"mw_revm\", disabled=not manual_w)\n\n    clicked, slot = busy_button(\"帰属を実行\")\n    if not clicked:\n        return\n\n    tables = ss[\"ptables\"]\n    ref = ss[\"ref_run\"]\n    labels = [str(x).strip() for x in ss[\"ref_labels\"][\"名前\"]]\n\n    if manual_w:\n        w = MatchWeights(w_spectrum=ws, w_area=wa, w_time=wt,\n                         spectrum_tol=stol, area_tol=atol, time_tol_min=ttol,\n                         gap=BOLDNESS[bold], min_similarity=minsim,\n                         review_margin=revm)\n    else:\n        w = MatchWeights(gap=BOLDNESS[bold], **DEFAULT_WEIGHTS)\n\n    predicted = None\n    if use_model:\n        predicted = _model_predictions()\n        if predicted is None:\n            st.warning(\"モデル予測を作れなかったので、時間の手がかりは\"\n                       \"データから推定します。\")\n\n    # 進捗のコールバックが無い処理なので、ボタンのあった場所を\n    # 回転するスピナーに差し替えます（空の進捗バーだと「止まっている」に\n    # 見えるため）。\n    with slot.container(), st.spinner(\"対応づけ中…\"):\n        try:\n            rep = assign_runs(tables, ref, labels=labels,\n                              conditions=_cond_dict(), weights=w,\n                              predicted=predicted,\n                              order_preserving=ORDER_PRESERVING, chain=CHAIN)\n        except Exception as e:  # noqa: BLE001\n            st.error(f\"帰属に失敗しました: {e}\")\n            return\n    st.session_state[\"assign\"] = rep\n    # スコアの内訳を出すのに、そのとき使った重みが要る（重みが変われば\n    # 同じ Match でも内訳の数字は変わる）。レポートと一緒に取っておきます。\n    st.session_state[\"assign_w\"] = w\n    st.rerun()\n\n\ndef _model_predictions():\n    from lcmd import predicted_from_model\n    from app.common import cond_df_to_runs\n\n    comps = st.session_state.get(\"comps\")\n    system = st.session_state.get(\"system\")\n    if comps is None or system is None:\n        return None\n    try:\n        runs = cond_df_to_runs(st.session_state.get(\"pda_cond\"))\n        return predicted_from_model(comps, runs, system)\n    except Exception:  # noqa: BLE001\n        return None\n\n\n# ----------------------------------------------------------------------\n# 6. 結果\n# ----------------------------------------------------------------------\ndef _results(rep) -> None:\n    st.header(\"6. 帰属結果\")\n    tables = st.session_state[\"ptables\"]\n\n    cov = rep.coverage()\n    n_full = sum(1 for v in cov.values() if v == len(rep.runs))\n    review = rep.review_list()\n    a, b, c, d = st.columns(4)\n    a.metric(\"成分\", len(rep.labels))\n    b.metri
