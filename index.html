<script id="py-files" type="application/json">{"lcmd/__init__.py": "\"\"\"lcmd — LC グラジエントメソッド開発の計算パッケージ\n\n逆相 LC の多成分一斉分析メソッドを、LSS（線形溶媒強度）＋温度一次の\n保持モデルで設計・最適化します。試料や成分の種類は問いません。\n\n    from lcmd import *\n\nで主要なものが一通り入ります。作図だけは別 import です:\n\n    from lcmd import plots\n\n（plots を import しない限り matplotlib は読み込まれません。ブラウザ配布や\nサーバ実行を見据えて、計算ロジックと UI/作図を分けてあります。）\n\n構成\n----\narw.py       Waters ARW（PDA の 3D データ）の読み書き\npeaks.py     クロマトグラムのピーク検出・面積/幅/スペクトルの測定\nassign.py    ラン間のピーク対応づけ（帰属の自動化）\nmodel.py     保持モデル log k(Φ,T)。成分パラメータの入れ物\ngradient.py  グラジエントプログラム（折れ線）\nhardware.py  カラム・装置・分析条件、粘度と圧力の概算\nsimulate.py  数値積分による tR・σ・Rs（このパッケージの心臓部）\nfitting.py   実測 tR から 4 パラメータを推定\ndesign.py    N_req 判定と (tG × T) 分離度マップ\noptimize.py  多段プロファイル探索・ロバスト評価・流速/カラム長スキャン・DoE\nvalidate.py  検算（解析解との突き合わせ、刻み幅収束、G の表）\nplots.py     作図\n\"\"\"\n\nfrom .model import (\n    ComponentSet,\n    TIER_TARGET,\n    TIER_TRACKED,\n    TIER_UNTRACKED,\n)\nfrom .gradient import Gradient\nfrom .hardware import (\n    Column,\n    Method,\n    System,\n    VanDeemter,\n    pressure_bar,\n    pressure_profile,\n    viscosity_cP,\n)\nfrom .simulate import (\n    SimResult,\n    analytic_tr_linear,\n    chromatogram,\n    compression_factor,\n    last_elution,\n    phi_e_from_tr,\n    simulate,\n)\nfrom .fitting import (\n    ComponentFit,\n    FitReport,\n    Run,\n    fit_components,\n    load_observations_csv,\n    load_runs_csv,\n)\nfrom .design import (\n    ResolutionMap,\n    critical_n_req,\n    diagnose_infeasible,\n    gradient_steepness,\n    k_star,\n    n_required,\n    n_required_table,\n    plates_required_for_rs,\n    resolution_map,\n)\nfrom .optimize import (\n    Perturbation,\n    SearchReport,\n    TwoSegmentSpec,\n    column_length_scan,\n    column_length_scan_table,\n    flow_scan,\n    flow_scan_table,\n    robust_evaluation,\n    robustness_doe,\n    robustness_doe_table,\n    search_two_segment,\n)\nfrom .arw import (\n    PDAData,\n    read_arw,\n    read_arw_folder,\n    write_arw_3d,\n)\nfrom .peaks import (\n    Peak,\n    PeakTable,\n    baseline_als,\n    detect_peaks,\n    estimate_noise,\n    spectral_similarity,\n)\nfrom .assign import (\n    MARGIN_CAP,\n    AssignmentReport,\n    Match,\n    MatchWeights,\n    RunAssignment,\n    assign_runs,\n    cost_terms,\n    match_tables,\n    predicted_from_model,\n    tier_from_area,\n)\nfrom .segments import (\n    SegmentPlan,\n    build_segments,\n    elution_bands,\n    optimize_segments,\n    search_segments,\n)\nfrom .width import (\n    WidthFit,\n    fit_widths,\n    rs_sensitivity,\n)\nfrom .validate import (\n    check_analytic,\n    check_analytic_table,\n    check_compression_table,\n    check_step_convergence,\n    check_step_convergence_table,\n    compare_predicted_vs_measured_width,\n)\n\n__version__ = \"0.1.0\"\n\n__all__ = [\n    \"ComponentSet\", \"TIER_TARGET\", \"TIER_TRACKED\", \"TIER_UNTRACKED\",\n    \"Gradient\", \"Column\", \"Method\", \"System\", \"VanDeemter\",\n    \"viscosity_cP\", \"pressure_bar\", \"pressure_profile\",\n    \"SimResult\", \"simulate\", \"compression_factor\", \"analytic_tr_linear\",\n    \"phi_e_from_tr\", \"chromatogram\", \"last_elution\",\n    \"Run\", \"ComponentFit\", \"FitReport\", \"fit_components\",\n    \"load_runs_csv\", \"load_observations_csv\",\n    \"ResolutionMap\", \"resolution_map\", \"n_required\", \"n_required_table\",\n    \"k_star\", \"gradient_steepness\", \"critical_n_req\", \"diagnose_infeasible\",\n    \"plates_required_for_rs\",\n    \"Perturbation\", \"TwoSegmentSpec\", \"SearchReport\", \"search_two_segment\",\n    \"robust_evaluation\", \"flow_scan\", \"flow_scan_table\",\n    \"column_length_scan\", \"column_length_scan_table\",\n    \"robustness_doe\", \"robustness_doe_table\",\n    \"PDAData\", \"read_arw\", \"read_arw_folder\", \"write_arw_3d\",\n    \"Peak\", \"PeakTable\", \"detect_peaks\", \"baseline_als\", \"estimate_noise\",\n    \"spectral_similarity\",\n    \"MatchWeights\", \"Match\", \"RunAssignment\", \"AssignmentReport\", \"MARGIN_CAP\",\n    \"match_tables\", \"assign_runs\", \"cost_terms\", \"predicted_from_model\",\n    \"tier_from_area\",\n    \"WidthFit\", \"fit_widths\", \"rs_sensitivity\",\n    \"SegmentPlan\", \"elution_bands\", \"build_segments\",\n    \"optimize_segments\", \"search_segments\",\n    \"check_analytic\", \"check_analytic_table\", \"check_step_convergence\",\n    \"check_step_convergence_table\", \"check_compression_table\",\n    \"compare_predicted_vs_measured_width\",\n    \"__version__\",\n]\n", "lcmd/arw.py": "\"\"\"Waters ARW（Empower のテキスト書き出し）を読む\n\nARW は Empower が吐くタブ区切りのテキストです。中身は 2 種類あります。\n\n3D（PDA の全波長データ）::\n\n    \"サンプル名\"                     <- メタ情報の見出し行\n    \"Samplerun08\"                    <- その値\n    波長  199.9129  200.5199  ...    <- 波長軸（1 行目のラベル + 波長の並び）\n    時間                             <- 時間列のラベルだけの行\n    0        0        0        ...   <- ここから下がデータ。左端が時間 [min]\n    0.00083  3.6e-06  3.6e-06  ...\n\n2D（単一波長のクロマトグラム）::\n\n    \"サンプル名\"\n    \"Samplerun08\"\n    時間  吸光度\n    0        0\n    0.00083  3.6e-06\n\n読み取りで気をつけていること\n----------------------------\n- **文字コード**: 日本語 Empower は cp932（Shift-JIS）で吐きます。utf-8 で\n  開くと 1 バイト目で落ちるので、cp932 → utf-8 → latin-1 の順に試します。\n- **改行コード**: このファイルは CR（``\\\\r``）だけで区切られていました。\n  Windows の CRLF や Unix の LF もあり得るので 3 種類とも受けます。\n- **区切り**: タブ。値の前に空白が入ることがある（``\\\\t  199.9129``）ので\n  数値化するときに strip します。\n- **メタ情報の行数は決め打ちにしない**: 「最初に全部が数値で埋まった行」を\n  データの先頭とみなし、その上を後ろ向きに解釈します。装置や書き出し設定で\n  見出しが増減しても読めるようにするためです。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport gzip\nimport io\nimport os\nimport re\nfrom dataclasses import dataclass, field\n\nimport numpy as np\n\nENCODINGS = (\"cp932\", \"utf-8-sig\", \"utf-8\", \"latin-1\")\n\n# 「時間」「Time」のような 1 列だけのラベル行を見分ける\n_TIME_LABELS = (\"時間\", \"time\", \"min\", \"minutes\", \"retention time\")\n_WL_LABELS = (\"波長\", \"wavelength\", \"nm\")\n\n\n# ----------------------------------------------------------------------\n# データの入れ物\n# ----------------------------------------------------------------------\n@dataclass\nclass PDAData:\n    \"\"\"1 ラン分のクロマトグラムデータ。\n\n    Attributes\n    ----------\n    name : str\n        サンプル名（メタ情報から拾えなければファイル名）。\n    times : np.ndarray, shape (nt,)\n        時間軸 [min]。\n    wavelengths : np.ndarray, shape (nw,)\n        波長軸 [nm]。2D データなら長さ 1 のダミー（NaN）。\n    absorbance : np.ndarray, shape (nt, nw)\n        吸光度。float32 で持ちます（PDA は 1 ランで数十 MB になるため）。\n    meta : dict\n        メタ情報の見出し → 値。\n    source : str\n        読み込み元のファイル名。\n    \"\"\"\n\n    name: str\n    times: np.ndarray\n    wavelengths: np.ndarray\n    absorbance: np.ndarray\n    meta: dict = field(default_factory=dict)\n    source: str = \"\"\n\n    # --- 基本情報 -----------------------------------------------------\n    @property\n    def is_3d(self) -> bool:\n        \"\"\"波長軸を持つ（= PDA の全波長データ）か。\"\"\"\n        return self.wavelengths.size > 1 and np.isfinite(self.wavelengths).all()\n\n    @property\n    def n_times(self) -> int:\n        return int(self.times.size)\n\n    @property\n    def n_wavelengths(self) -> int:\n        return int(self.wavelengths.size)\n\n    @property\n    def dt(self) -> float:\n        \"\"\"サンプリング間隔 [min]（中央値）。\"\"\"\n        if self.times.size < 2:\n            return float(\"nan\")\n        return float(np.median(np.diff(self.times)))\n\n    @property\n    def duration(self) -> float:\n        return float(self.times[-1] - self.times[0]) if self.times.size else 0.0\n\n    @property\n    def nbytes(self) -> int:\n        return int(self.absorbance.nbytes + self.times.nbytes\n                   + self.wavelengths.nbytes)\n\n    # --- 切り出し -----------------------------------------------------\n    def nearest_wavelength(self, wl: float) -> tuple[int, float]:\n        \"\"\"指定波長にいちばん近いチャンネルの (番号, 実際の波長)。\"\"\"\n        if not self.is_3d:\n            return 0, float(\"nan\")\n        j = int(np.argmin(np.abs(self.wavelengths - float(wl))))\n        return j, float(self.wavelengths[j])\n\n    def chromatogram(self, wl: float | None = None,\n                     bandwidth_nm: float = 0.0) -> np.ndarray:\n        \"\"\"指定波長のクロマトグラム（時間 → 吸光度）を取り出す。\n\n        bandwidth_nm を与えると、その幅の中のチャンネルを平均します\n        （実機の「バンド幅」設定に相当。ノイズが 1/√本数 に減ります）。\n        \"\"\"\n        if not self.is_3d:\n            return self.absorbance[:, 0].astype(float)\n        if wl is None:\n            return self.absorbance.max(axis=1).astype(float)\n        if bandwidth_nm and bandwidth_nm > 0:\n            lo, hi = wl - bandwidth_nm / 2.0, wl + bandwidth_nm / 2.0\n            sel = (self.wavelengths >= lo) & (self.wavelengths <= hi)\n            if sel.any():\n                return self.absorbance[:, sel].mean(axis=1).astype(float)\n        j, _ = self.nearest_wavelength(wl)\n        return self.absorbance[:, j].astype(float)\n\n    def total_absorbance(self) -> np.ndarray:\n        \"\"\"全波長を足したもの（TIC 相当）。ピーク探しの補助に使えます。\"\"\"\n        return self.absorbance.sum(axis=1).astype(float)\n\n    def spectrum(self, t: float) -> np.ndarray:\n        \"\"\"指定時刻のスペクトル（波長 → 吸光度）。\"\"\"\n        i = int(np.argmin(np.abs(self.times - float(t))))\n        return self.absorbance[i].astype(float)\n\n    def spectrum_at_index(self, i: int) -> np.ndarray:\n        return self.absorbance[int(i)].astype(float)\n\n    def index_at(self, t: float) -> int:\n        return int(np.argmin(np.abs(self.times - float(t))))\n\n    # --- 加工 ---------------------------------------------------------\n    def crop(self, t_min: float | None = None,\n             t_max: float | None = None,\n             wl_min: float | None = None,\n             wl_max: float | None = None) -> \"PDAData\":\n        \"\"\"時間・波長の範囲を切り出す。\n\n        溶媒ピークの塊（ボイド付近）を外す、200 nm 付近のノイズだらけの\n        波長を捨てる、といった用途。\n        \"\"\"\n        ti = np.ones(self.times.size, dtype=bool)\n        if t_min is not None:\n            ti &= self.times >= t_min\n        if t_max is not None:\n            ti &= self.times <= t_max\n        wi = np.ones(self.wavelengths.size, dtype=bool)\n        if self.is_3d:\n            if wl_min is not None:\n                wi &= self.wavelengths >= wl_min\n            if wl_max is not None:\n                wi &= self.wavelengths <= wl_max\n        return PDAData(\n            name=self.name,\n            times=self.times[ti].copy(),\n            wavelengths=self.wavelengths[wi].copy(),\n            absorbance=self.absorbance[np.ix_(ti, wi)].copy(),\n            meta=dict(self.meta),\n            source=self.source,\n        )\n\n    def downsample(self, time_step_min: float | None = None,\n                   wavelength_step_nm: float | None = None) -> \"PDAData\":\n        \"\"\"間引いて軽くする。\n\n        PDA 1 ランは 20 Hz × 326 波長で 30 MB を超えます。6 ラン持つと\n        メモリを圧迫するので、ピークの形が崩れない範囲で間引きます。\n\n        目安: ピーク 1 本を 20 点以上で描ければ tR も面積もほぼ変わりません。\n        いちばん細いピークの半値幅が 0.05 min なら 0.0025 min 刻みで十分です。\n        \"\"\"\n        ts = 1\n        if time_step_min and np.isfinite(self.dt) and self.dt > 0:\n            ts = max(1, int(round(time_step_min / self.dt)))\n        ws = 1\n        if wavelength_step_nm and self.is_3d and self.wavelengths.size > 1:\n            step = float(np.median(np.diff(self.wavelengths)))\n            if step > 0:\n                ws = max(1, int(round(wavelength_step_nm / step)))\n        if ts == 1 and ws == 1:\n            return self\n        return PDAData(\n            name=self.name,\n            times=self.times[::ts].copy(),\n            wavelengths=self.wavelengths[::ws].copy(),\n            absorbance=self.absorbance[::ts, ::ws].copy(),\n            meta=dict(self.meta),\n            source=self.source,\n        )\n\n    def summary(self) -> str:\n        kind = \"3D (PDA)\" if self.is_3d else \"2D (single wavelength)\"\n        wl = (f\"{self.wavelengths[0]:.1f}-{self.wavelengths[-1]:.1f} nm \"\n              f\"x {self.n_wavelengths}\" if self.is_3d else \"-\")\n        return (f\"{self.name}: {kind}  \"\n                f\"{self.times[0]:.3f}-{self.times[-1]:.3f} min \"\n                f\"x {self.n_times} pts ({self.dt * 60:.3f} s)  {wl}  \"\n                f\"{self.nbytes / 1e6:.1f} MB\")\n\n\n# ----------------------------------------------------------------------\n# 読み込み\n# ----------------------------------------------------------------------\ndef _decode(raw: bytes) -> str:\n    for enc in ENCODINGS:\n        try:\n            return raw.decode(enc)\n        except UnicodeDecodeError:\n            continue\n    return raw.decode(\"latin-1\", errors=\"replace\")\n\n\ndef _read_bytes(source) -> tuple[bytes, str]:\n    \"\"\"パス・bytes・ファイルオブジェクトのどれでも受けて (中身, 名前) を返す。\"\"\"\n    if isinstance(source, (bytes, bytearray)):\n        return bytes(source), \"\"\n    if isinstance(source, (str, os.PathLike)):\n        path = os.fspath(source)\n        with open(path, \"rb\") as fh:\n            return fh.read(), os.path.basename(path)\n    # Streamlit の UploadedFile など。\n    # UploadedFile は再実行をまたいで同じオブジェクトが生き残り、読み取り位置も\n    # 残ります。巻き戻さずに 2 回目を読むと空になるので、必ず先頭へ戻します。\n    try:\n        source.seek(0)\n    except Exception:  # noqa: BLE001  シーク不能なストリームはそのまま読む\n        pass\n    data = source.read()\n    if isinstance(data, str):\n        data = data.encode(\"utf-8\")\n    if not data:\n        raise ValueError(\"ファイルの中身が空です（読み取り位置が末尾のままか、\"\n                         \"空ファイルです）。\")\n    return data, getattr(source, \"name\", \"\")\n\n\ndef _maybe_gunzip(raw: bytes) -> bytes:\n    if raw[:2] == b\"\\x1f\\x8b\":\n        return gzip.decompress(raw)\n    return raw\n\n\n_NUM = re.compile(r\"^[+-]?(\\d+\\.?\\d*|\\.\\d+)([eE][+-]?\\d+)?$\")\n\n\ndef _all_numeric(fields: list[str]) -> bool:\n    if not fields:\n        return False\n    return all(_NUM.match(f.strip()) for f in fields if f.strip() != \"\")\n\n\ndef _split_lines(text: str) -> list[str]:\n    return text.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").split(\"\\n\")\n\n\ndef _unquote(s: str) -> str:\n    s = s.strip()\n    if len(s) >= 2 and s[0] == s[-1] and s[0] in \"\\\"'\":\n        return s[1:-1]\n    return s\n\n\n# ----------------------------------------------------------------------\n# 省メモリの本体読み取り\n# ----------------------------------------------------------------------\n# PDA 1 ランは 84 MB のテキストになります。素直に\n#   「全部 str に decode」→「全行を \\t で split」→「\\t で join し直す」\n# とやると、途中で 900 MB 使いました（ブラウザで動かす stlite 版では致命的）。\n# 内訳は\n#   - str への decode: 日本語のヘッダが 1 文字でもあると Python の文字列は\n#     2 バイト/文字になり、84 MB が 169 MB に膨らむ\n#   - 全行の split: 26,401 行 x 327 列 = 863 万個の文字列オブジェクトで約 520 MB\n#   - join し直し: もう 84 MB\n# どれも要りません。**ヘッダの数行だけ decode し、本体は bytes のまま\n# numpy に渡す**のがここの方針です。numpy は sep=\"\\t\" を指定すると\n# CR / LF も区切りとして扱ってくれるので、行に分ける必要すらありません。\nCHUNK_ROWS = 4096\n\n\ndef _find_newline(raw: bytes) -> bytes:\n    \"\"\"使われている改行コードを判定する（CRLF / CR のみ / LF）。\"\"\"\n    head = raw[:65536]\n    if b\"\\r\\n\" in head:\n        return b\"\\r\\n\"\n    if b\"\\r\" in head:\n        return b\"\\r\"\n    return b\"\\n\"\n\n\ndef _head_lines(raw: bytes, nl: bytes, max_lines: int = 40):\n    \"\"\"先頭の数行だけを (デコード済み文字列, 次の行の開始オフセット) で返す。\n\n    ヘッダを読むのに必要なぶんだけ。ここで全行を触らないのが肝心です。\n    \"\"\"\n    out = []\n    pos = 0\n    for _ in range(max_lines):\n        nxt = raw.find(nl, pos)\n        end = len(raw) if nxt < 0 else nxt\n        out.append((_decode(raw[pos:end]), pos,\n                    len(raw) if nxt < 0 else nxt + len(nl)))\n        if nxt < 0:\n            break\n        pos = nxt + len(nl)\n        if pos >= len(raw):\n            break\n    return out\n\n\ndef _parse_matrix(raw: bytes, offset: int, ncol: int, nl: bytes):\n    \"\"\"数値ブロックを (時間 float64, 吸光度 float32) に読む。\n\n    ``raw`` を**切り出さずにオフセットで**扱います。``raw[offset:]`` と\n    書くと 84 MB のコピーがもう 1 つできてしまうためです。\n    ``bytes.find`` は開始位置を取れるので、これで足ります。\n\n    さらに ``CHUNK_ROWS`` 行ずつ処理して、float64 の中間配列が大きく\n    ならないようにします（一気に読むと 69 MB、chunk なら 10 MB）。\n    \"\"\"\n    n = len(raw)\n    while n > offset and raw[n - 1:n].isspace():\n        n -= 1\n    if n <= offset:\n        raise ValueError(\"データ行がありません。\")\n\n    nrows = raw.count(nl, offset, n) + 1\n    times = np.empty(nrows, dtype=np.float64)\n    absorb = np.empty((nrows, ncol - 1), dtype=np.float32)\n\n    pos, row = offset, 0\n    while pos < n and row < nrows:\n        end = pos\n        for _ in range(CHUNK_ROWS):\n            nxt = raw.find(nl, end, n)\n            if nxt < 0:\n                end = n\n                break\n            end = nxt + len(nl)\n        chunk = np.fromstring(raw[pos:end], sep=\"\\t\")\n        if chunk.size == 0:\n            break\n        k, rem = divmod(chunk.size, ncol)\n        if rem or row + k > nrows:\n            return None          # 列数がそろっていない → 遅い経路へ\n        chunk = chunk.reshape(k, ncol)\n        times[row:row + k] = chunk[:, 0]\n        absorb[row:row + k] = chunk[:, 1:]\n        row += k\n        pos = end\n    if row != nrows:\n        return None\n    return times, absorb\n\n\ndef read_arw(source, name: str | None = None,\n             time_step_min: float | None = None,\n             wavelength_step_nm: float | None = None) -> PDAData:\n    \"\"\"ARW を読んで PDAData にする。\n\n    Parameters\n    ----------\n    source : str | Path | bytes | file-like\n        ``.arw`` でも ``.arw.gz`` でも、Streamlit のアップロードでも可。\n    name : str, optional\n        サンプル名を上書きする。省略時はメタ情報 →（無ければ）ファイル名。\n    time_step_min, wavelength_step_nm : float, optional\n        読んだ直後に間引く。詳しくは :meth:`PDAData.downsample`。\n\n    Raises\n    ------\n    ValueError\n        数値の行が見つからないなど、ARW として解釈できないとき。\n    \"\"\"\n    raw, fname = _read_bytes(source)\n    raw = _maybe_gunzip(raw)\n    if not raw.strip():\n        raise ValueError(\"ファイルが空です。\")\n\n    nl = _find_newline(raw)\n    # ヘッダを読むのに必要な先頭数行だけデコードする（本体は bytes のまま）\n    head = _head_lines(raw, nl)\n    lines = [t for t, _, _ in head]\n    split = [ln.split(\"\\t\") for ln in lines]\n\n    # --- データの先頭行を探す ---\n    # 「2 列以上あって、全部が数値」の最初の行。メタ情報の行数を決め打ちしない。\n    start = None\n    for i, f in enumerate(split):\n        if len(f) >= 2 and _all_numeric(f):\n            start = i\n            break\n    if start is None:\n        raise ValueError(\n            \"数値のデータ行が見つかりません。ARW のテキスト書き出しか確認してください。\"\n        )\n\n    # --- その 1 行上を見て、波長軸があるか判定する ---\n    wavelengths = np.array([np.nan])\n    header_end = start\n    for k in (start - 1, start - 2):\n        if k < 0:\n            continue\n        f = split[k]\n        if len(f) < 3:\n            continue\n        body = f[1:]\n        if _all_numeric(body):\n            wl = np.array([float(x) for x in body if x.strip() != \"\"])\n            # 単調増加していて、200-900 nm あたりに収まっていれば波長軸\n            if wl.size >= 3 and np.all(np.diff(wl) > 0) and 100 < wl[0] < 1000:\n                wavelengths = wl\n                header_end = k\n                break\n\n    # --- メタ情報（見出し行と値行の組）---\n    meta: dict = {}\n    head_lines = [f for f in split[:header_end]\n                  if any(x.strip() for x in f)]\n    # 「時間」だけの行のようなラベルは落とす\n    head_lines = [f for f in head_lines\n                  if not (len(f) == 1\n                          and _unquote(f[0]).lower() in _TIME_LABELS + _WL_LABELS)]\n    for a, b in zip(head_lines[0::2], head_lines[1::2]):\n        for ka, vb in zip(a, b):\n            ka, vb = _unquote(ka), _unquote(vb)\n            if ka:\n                meta[ka] = vb\n\n    # --- 本体 ---\n    # データ行の先頭バイト位置から末尾までを、bytes のまま numpy に渡す。\n    ncol = len(split[start])\n    body_at = head[start][1]\n    parsed = _parse_matrix(raw, body_at, ncol, nl) if ncol >= 2 else None\n\n    if parsed is None:\n        # 列数がそろっていない（途中で切れたファイルなど）。\n        # 遅くて重いが確実な経路に落とす。\n        rows = []\n        for ln in _split_lines(_decode(raw[body_at:])):\n            f = [x for x in ln.split(\"\\t\") if x.strip() != \"\"]\n            if len(f) != ncol:\n                continue\n            rows.append([float(x) for x in f])\n        if not rows:\n            raise ValueError(\"データ行の列数がそろっていません。\")\n        data = np.asarray(rows, dtype=float)\n        times = data[:, 0].copy()\n        absorbance = np.ascontiguousarray(data[:, 1:], dtype=np.float32)\n    else:\n        times, absorbance = parsed\n\n    if wavelengths.size > 1 and wavelengths.size != absorbance.shape[1]:\n        raise ValueError(\n            f\"波長軸の本数（{wavelengths.size}）とデータの列数\"\n            f\"（{absorbance.shape[1]}）が合いません。\"\n        )\n    if wavelengths.size == 1 and absorbance.shape[1] > 1:\n        # 波長軸の行が無いのに列が複数 → チャンネル番号で代用する\n        wavelengths = np.arange(absorbance.shape[1], dtype=float)\n\n    if name is None:\n        name = _guess_name(meta) or (os.path.splitext(fname)[0] if fname else \"run\")\n\n    pda = PDAData(name=str(name), times=times, wavelengths=wavelengths,\n                  absorbance=absorbance, meta=meta, source=fname)\n    if time_step_min or wavelength_step_nm:\n        pda = pda.downsample(time_step_min, wavelength_step_nm)\n    return pda\n\n\n_NAME_KEYS = (\"サンプル名\", \"SampleName\", \"Sample Name\", \"サンプル\", \"Name\",\n              \"試料名\", \"SampleID\", \"Sample ID\")\n\n\ndef _guess_name(meta: dict) -> str:\n    for k in _NAME_KEYS:\n        if meta.get(k):\n            return str(meta[k])\n    # 見出しが読めなくても、値が 1 つだけならそれを使う\n    vals = [v for v in meta.values() if str(v).strip()]\n    return str(vals[0]) if len(vals) == 1 else \"\"\n\n\ndef read_arw_folder(folder: str, pattern: str = \".arw\",\n                    **kwargs) -> list[PDAData]:\n    \"\"\"フォルダ内の ARW をまとめて読む（ファイル名順）。\"\"\"\n    out = []\n    for fn in sorted(os.listdir(folder)):\n        if pattern in fn.lower() or fn.lower().endswith(pattern):\n            out.append(read_arw(os.path.join(folder, fn), **kwargs))\n    return out\n\n\ndef write_arw_3d(path, pda: PDAData, encoding: str = \"cp932\") -> str:\n    \"\"\"PDAData を ARW 形式で書き出す（主にテスト用）。\"\"\"\n    buf = io.StringIO()\n    buf.write('\"サンプル名\"\\r')\n    buf.write(f'\"{pda.name}\"\\r')\n    buf.write(\"波長\\t\" + \"\\t\".join(f\"{w:g}\" for w in pda.wavelengths) + \"\\r\")\n    buf.write(\"時間\\r\")\n    for i, t in enumerate(pda.times):\n        buf.write(f\"{t:g}\\t\" + \"\\t\".join(f\"{v:g}\" for v in pda.absorbance[i]) + \"\\r\")\n    with open(path, \"wb\") as fh:\n        fh.write(buf.getvalue().encode(encoding))\n    return str(path)\n", "lcmd/assign.py": "\"\"\"ラン間でピークを対応づける（帰属の自動化）\n\n手で帰属するときに見ている 3 つの手がかりを、そのまま数値にします。\n\n1. **スペクトルが似ている** — PDA の頂点スペクトルのコサイン類似度。\n   同じ化合物なら 0.999 を超えます。ただし同族体（6- と analyte-B2）や\n   幾何異性体も 0.999 を超えるので、これだけでは決まりません。\n2. **面積が同じくらい** — 同じ試料を打っているなら、成分ごとの面積比は\n   条件を変えてもほぼ保たれます。1 本だけ 10 倍違えば別物です。\n3. **保持時間・並び順が大きくは変わらない** — 近い条件どうしなら、\n   保持時間は「全体が少し伸び縮みする」程度しか動きません。\n\nこれを 1 つのコストにまとめ、**溶出順を保ったまま**いちばん安い対応を\n動的計画法で探します。\n\n    コスト = w_s·(1 − 類似度)/許容 + w_a·|ln(面積比)|/ln(許容)\n             + w_t·|予測とのずれ|/許容\n\nなぜ「順序を保つ」のが既定か\n----------------------------\n近い条件どうしなら溶出順は変わりません。順序を保つ制約を入れると、\n「スペクトルがそっくりな同族体を取り違える」という一番怖い間違いが\n原理的に起きなくなります。tG を大きく変えて順序が入れ替わることを\n承知で対応づけたいときだけ ``order_preserving=False``（ハンガリアン法）に\nしてください。\n\n必ず人が見るべき所を教える\n--------------------------\n自動でつけた帰属には、必ず **margin（2 番手との差）** を付けます。\nこれが小さいピークは「1 番手と 2 番手がほぼ互角」＝機械には決められない\nものなので、そこだけ目で確認すれば済みます。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport math\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nfrom scipy.optimize import linear_sum_assignment\n\nfrom .peaks import PeakTable, resample_spectrum, spectral_similarity\n\nBIG = 1e6\n# margin（2 番手との差）の頭打ち。「候補が実質 1 つしかない」場合の値。\nMARGIN_CAP = 99.0\n\n\n# ----------------------------------------------------------------------\n# 重みと許容幅\n# ----------------------------------------------------------------------\n@dataclass\nclass MatchWeights:\n    \"\"\"3 つの手がかりの重みと「どれだけずれたらコスト 1 か」。\n\n    許容幅（*_tol）は「この程度ずれても不思議ではない」という値です。\n    重み（w_*）は手がかりどうしの相対的な信頼度。既定はスペクトルと\n    時間を同格に、面積はやや軽く（注入量や希釈でぶれるため）しています。\n    \"\"\"\n\n    w_spectrum: float = 1.0\n    w_area: float = 0.6\n    w_time: float = 1.0\n    spectrum_tol: float = 0.01      # 1 − 類似度 がこれでコスト 1\n    area_tol: float = 3.0           # 面積が何倍ずれたらコスト 1 か\n    time_tol_min: float = 0.30      # 予測とのずれ [min] がこれでコスト 1\n    gap: float = 1.2                # 「相手なし」にするコスト\n    min_similarity: float = 0.95    # これ未満は同一成分とみなさない\n    review_margin: float = 0.5      # margin がこれ未満なら要確認\n    review_similarity: float = 0.99\n    review_area_ratio: float = 3.0\n\n\n@dataclass\nclass Match:\n    \"\"\"1 成分 × 1 ラン の対応づけ結果。\"\"\"\n\n    label: str\n    run_id: str\n    peak: int | None                # PeakTable 内の番号。None = 見つからず\n    tR: float = float(\"nan\")\n    area: float = float(\"nan\")\n    height: float = float(\"nan\")\n    width_half: float = float(\"nan\")\n    sigma: float = float(\"nan\")\n    similarity: float = float(\"nan\")\n    area_ratio: float = float(\"nan\")  # スケール補正後の 相手/自分\n    dt: float = float(\"nan\")          # 予測 tR とのずれ [min]\n    cost: float = float(\"nan\")\n    margin: float = float(\"nan\")      # 2 番手との コスト差（大きいほど確か）\n    purity: float = float(\"nan\")\n    flags: list[str] = field(default_factory=list)\n    # 「未検出」にしたが、スペクトルがそっくりな余りピークが近くにある場合の候補。\n    # 溶出順の入れ替わりを疑うべき場所を教えるためのもの。\n    candidate_peak: int | None = None\n    candidate_tR: float = float(\"nan\")\n\n    @property\n    def found(self) -> bool:\n        return self.peak is not None\n\n    @property\n    def needs_review(self) -> bool:\n        return bool(self.flags)\n\n\n@dataclass\nclass RunAssignment:\n    \"\"\"1 ラン分の対応づけ。\"\"\"\n\n    run_id: str\n    template: str                   # どのランを手本にしたか\n    matches: list[Match]\n    n_unassigned: int = 0           # 手本に無かった（新しく出た）ピークの数\n\n    def by_label(self, label: str) -> Match | None:\n        for m in self.matches:\n            if m.label == label:\n                return m\n        return None\n\n\n@dataclass\nclass AssignmentReport:\n    \"\"\"全ランの対応づけ結果。\"\"\"\n\n    reference: str\n    labels: list[str]\n    runs: list[str]\n    assignments: dict           # run_id -> RunAssignment\n    tiers: dict = field(default_factory=dict)\n    notes: list[str] = field(default_factory=list)\n\n    # --- 取り出し -----------------------------------------------------\n    def value_matrix(self, field_name: str = \"tR\") -> dict:\n        \"\"\"{成分: {run_id: 値}} を作る。\"\"\"\n        out: dict = {}\n        for lab in self.labels:\n            row = {}\n            for rid in self.runs:\n                m = self.assignments[rid].by_label(lab)\n                if m is not None and m.found:\n                    row[rid] = getattr(m, field_name)\n            out[lab] = row\n        return out\n\n    def coverage(self) -> dict:\n        \"\"\"成分ごとに「何本のランで見つかったか」。\"\"\"\n        return {lab: sum(1 for rid in self.runs\n                         if (m := self.assignments[rid].by_label(lab)) and m.found)\n                for lab in self.labels}\n\n    def to_observations(self, min_runs: int = 4):\n        \"\"\":func:`lcmd.fit_components` にそのまま渡せる形にする。\n\n        Parameters\n        ----------\n        min_runs : int\n            この本数以上のランで見つかった成分だけ返します。4 パラメータを\n            決めるには最低 4 点必要なので既定は 4。\n\n        Returns\n        -------\n        (observations, tiers)\n            observations = {成分: {run_id: tR}}\n        \"\"\"\n        mat = self.value_matrix(\"tR\")\n        obs = {lab: row for lab, row in mat.items() if len(row) >= min_runs}\n        tiers = {lab: int(self.tiers.get(lab, 1)) for lab in obs}\n        return obs, tiers\n\n    def review_list(self) -> list[Match]:\n        \"\"\"人が目で確かめるべき対応づけだけを、危ない順に返す。\"\"\"\n        bad = [m for rid in self.runs for m in self.assignments[rid].matches\n               if m.needs_review]\n        return sorted(bad, key=lambda m: (m.margin if np.isfinite(m.margin) else -1))\n\n    # --- 表示 ---------------------------------------------------------\n    def table(self, field_name: str = \"tR\", fmt: str = \"{:>9.3f}\") -> str:\n        w = max(16, min(28, max((len(x) for x in self.labels), default=16) + 1))\n        head = f\"{'label':<{w}}\" + \"\".join(f\"{r:>10}\" for r in self.runs) + \"   n\"\n        lines = [head, \"-\" * len(head)]\n        mat = self.value_matrix(field_name)\n        cov = self.coverage()\n        for lab in self.labels:\n            row = mat[lab]\n            cells = \"\".join(\n                (fmt.format(row[r]) + \" \") if r in row else f\"{'-':>9} \"\n                for r in self.runs\n            )\n            lines.append(f\"{lab[:w - 1]:<{w}}{cells}{cov[lab]:>4}\")\n        lines.append(\"\")\n        lines.append(f\"(reference = {self.reference}, {len(self.labels)} labels x \"\n                     f\"{len(self.runs)} runs; '-' = not found)\")\n        return \"\\n\".join(lines)\n\n    def confidence_table(self, only_review: bool = False) -> str:\n        w = max(16, min(28, max((len(x) for x in self.labels), default=16) + 1))\n        head = (f\"{'label':<{w}}{'run':<11}{'tR':>8}{'sim':>8}{'area x':>8}\"\n                f\"{'dt':>8}{'cost':>7}{'margin':>8}  flags\")\n        lines = [head, \"-\" * len(head)]\n        for rid in self.runs:\n            for m in self.assignments[rid].matches:\n                if only_review and not m.needs_review:\n                    continue\n                lab = m.label[:w - 1]\n                if not m.found:\n                    hint = \"not found\"\n                    if m.candidate_peak is not None:\n                        hint = (f\"not found; candidate at {m.candidate_tR:.3f} min \"\n                                f\"(sim {m.similarity:.4f}) -> {','.join(m.flags)}\")\n                    lines.append(f\"{lab:<{w}}{rid:<11}{'-':>8}{'':>8}{'':>8}\"\n                                 f\"{'':>8}{'':>7}{'':>8}  {hint}\")\n                    continue\n                mg = \">99\" if m.margin >= MARGIN_CAP else f\"{m.margin:.2f}\"\n                lines.append(\n                    f\"{lab:<{w}}{rid:<11}{m.tR:>8.3f}{m.similarity:>8.4f}\"\n                    f\"{m.area_ratio:>8.2f}{m.dt:>8.3f}{m.cost:>7.2f}\"\n                    f\"{mg:>8}  {','.join(m.flags)}\"\n                )\n        return \"\\n\".join(lines)\n\n\n# ----------------------------------------------------------------------\n# コスト行列\n# ----------------------------------------------------------------------\ndef cost_terms(similarity: float, area_ratio: float, dt: float,\n               w: MatchWeights) -> tuple[float, float, float]:\n    \"\"\"3 つの手がかりそれぞれのコスト寄与 (スペクトル, 面積, 時間)。\n\n    足し合わせたものが対応づけのコストです。**式の置き場所はここ 1 か所**で、\n    行列を作るときも、あとから「何がどれだけ効いたか」を表示するときも\n    この関数を通します。\n\n    それぞれ「許容幅ぶんずれたら 1」になるよう規格化してあるので、\n    どの項が大きいかを見れば、その対応が何を根拠に（あるいは何に逆らって）\n    決まったかが分かります。\n    \"\"\"\n    cs = w.w_spectrum * (1.0 - similarity) / max(w.spectrum_tol, 1e-9)\n    if np.isfinite(area_ratio) and area_ratio > 0:\n        ca = w.w_area * abs(math.log(area_ratio)) / math.log(max(w.area_tol, 1.01))\n    else:\n        # 面積が取れない（片方が 0 など）。無視せず、はっきり不利にしておく。\n        ca = w.w_area * 5.0\n    ct = w.w_time * abs(dt) / max(w.time_tol_min, 1e-9)\n    return float(cs), float(ca), float(ct)\n\n\ndef _cost_matrix(ref: PeakTable, tgt: PeakTable, w: MatchWeights,\n                 predicted: np.ndarray, area_scale: float) -> tuple:\n    \"\"\"(コスト行列, 類似度, 面積比, 時間ずれ) を作る。\n\n    predicted[i] = 手本の i 番ピークが、相手のランで出るはずの時刻。\n    area_scale = 相手のランの面積が全体として何倍になっているか。\n    \"\"\"\n    ns, nt = len(ref), len(tgt)\n    sim = np.zeros((ns, nt))\n    ratio = np.ones((ns, nt))\n    dt = np.zeros((ns, nt))\n    cost = np.zeros((ns, nt))\n\n    tgt_spec = tgt.spectra\n    if (tgt.wavelengths.size != ref.wavelengths.size\n            or not np.allclose(tgt.wavelengths, ref.wavelengths)):\n        tgt_spec = np.vstack([\n            resample_spectrum(s, tgt.wavelengths, ref.wavelengths)\n            for s in tgt_spec\n        ]) if nt else tgt_spec\n\n    ref_spec = ref.spectra\n    for i in range(ns):\n        ai = ref.peaks[i].area\n        for j in range(nt):\n            s = spectral_similarity(ref_spec[i], tgt_spec[j])\n            aj = tgt.peaks[j].area\n            r = (aj / area_scale) / ai if ai > 0 and aj > 0 else np.inf\n            d = tgt.peaks[j].tR - predicted[i]\n\n            sim[i, j] = s\n            ratio[i, j] = r\n            dt[i, j] = d\n\n            if s < w.min_similarity:\n                cost[i, j] = BIG\n                continue\n            cost[i, j] = sum(cost_terms(s, r, d, w))\n    return cost, sim, ratio, dt\n\n\ndef _align_ordered(cost: np.ndarray, gap: float):\n    \"\"\"溶出順を保ったまま最小コストの対応を探す（動的計画法）。\n\n    配列の比較でおなじみの Needleman-Wunsch と同じ形です。3 つの選択肢\n    「対応させる／手本側を余らせる／相手側を余らせる」を全部試して、\n    合計コストが最小になる道を選びます。\n\n    Returns\n    -------\n    list[(i, j)]\n        手本の i 番と相手の j 番の対応。余ったものは含まれません。\n    \"\"\"\n    ns, nt = cost.shape\n    D = np.full((ns + 1, nt + 1), np.inf)\n    ptr = np.zeros((ns + 1, nt + 1), dtype=np.int8)   # 0=対応 1=手本余り 2=相手余り\n    D[0, 0] = 0.0\n    for i in range(1, ns + 1):\n        D[i, 0] = D[i - 1, 0] + gap\n        ptr[i, 0] = 1\n    for j in range(1, nt + 1):\n        D[0, j] = D[0, j - 1] + gap\n        ptr[0, j] = 2\n    for i in range(1, ns + 1):\n        for j in range(1, nt + 1):\n            c = (D[i - 1, j - 1] + cost[i - 1, j - 1], 0)\n            u = (D[i - 1, j] + gap, 1)\n            l = (D[i, j - 1] + gap, 2)\n            best = min(c, u, l)\n            D[i, j], ptr[i, j] = best[0], best[1]\n\n    pairs = []\n    i, j = ns, nt\n    while i > 0 or j > 0:\n        p = ptr[i, j]\n        if i > 0 and j > 0 and p == 0:\n            pairs.append((i - 1, j - 1))\n            i, j = i - 1, j - 1\n        elif i > 0 and (p == 1 or j == 0):\n            i -= 1\n        else:\n            j -= 1\n    return pairs[::-1]\n\n\ndef _align_hungarian(cost: np.ndarray, gap: float):\n    \"\"\"順序を無視して総コスト最小の 1 対 1 対応を探す（ハンガリアン法）。\n\n    溶出順が入れ替わるほど条件を変えた場合に使います。取り違えの危険は\n    上がるので、既定では使いません。\n    \"\"\"\n    ns, nt = cost.shape\n    n = ns + nt\n    big = np.full((n, n), gap)\n    big[:ns, :nt] = np.minimum(cost, BIG)\n    r, c = linear_sum_assignment(big)\n    return [(int(i), int(j)) for i, j in zip(r, c)\n            if i < ns and j < nt and cost[i, j] < BIG]\n\n\n# ----------------------------------------------------------------------\n# 2 ラン間の対応づけ\n# ----------------------------------------------------------------------\ndef match_tables(ref: PeakTable, tgt: PeakTable,\n                 weights: MatchWeights | None = None,\n                 predicted: dict | None = None,\n                 order_preserving: bool = True,\n                 labels: list[str] | None = None) -> tuple:\n    \"\"\"手本のラン ``ref`` のピークを、相手のラン ``tgt`` に対応づける。\n\n    Parameters\n    ----------\n    predicted : dict, optional\n        {手本のラベル: 相手のランでの予測 tR}。モデルで予測できるなら\n        渡してください。無ければ、スペクトルと面積だけで一度対応づけて、\n        そこから「時間の伸び縮み」を推定します（2 段階）。\n    order_preserving : bool\n        True（既定）なら溶出順を保つ。False ならハンガリアン法。\n\n    Returns\n    -------\n    (matches, n_unassigned, info)\n    \"\"\"\n    w = weights or MatchWeights()\n    labels = labels or [p.label for p in ref.peaks]\n    ns, nt = len(ref), len(tgt)\n    if ns == 0 or nt == 0:\n        # 片方にピークが 1 本も無い（検出条件が厳しすぎる／空のラン）。\n        # 落とさずに「全部未検出」を返し、info の形は揃えておきます。\n        return (\n            [Match(lab, tgt.name, None, flags=[\"未検出\"]) for lab in labels],\n            nt,\n            {\"stage\": \"empty\", \"slope\": np.nan, \"intercept\": np.nan,\n             \"area_scale\": 1.0, \"n_anchor\": 0},\n        )\n\n    tR_ref = ref.tR\n    # --- 1 段階目: 時間を使わずに、スペクトルと面積だけで当たりをつける ---\n    # ここで得た「確かな組（アンカー）」から、注入量のずれ（面積スケール）と、\n    # モデル予測が無い場合の「時間の伸び縮み」を推定します。\n    w0 = MatchWeights(**{**w.__dict__, \"w_time\": 0.0})\n    c0, s0, _, _ = _cost_matrix(ref, tgt, w0, tR_ref, 1.0)\n    pairs0 = (_align_ordered(c0, w0.gap) if order_preserving\n              else _align_hungarian(c0, w0.gap))\n    anchors = [(i, j) for i, j in pairs0 if s0[i, j] >= 0.999]\n    if len(anchors) < 3:\n        anchors = [(i, j) for i, j in pairs0 if s0[i, j] >= w.min_similarity]\n    scale = _area_scale(ref, tgt, anchors)\n\n    if predicted is not None:\n        pred = np.array([predicted.get(lab, np.nan) for lab in labels],\n                        dtype=float)\n        known = np.isfinite(pred)\n        # モデルに乗っていない成分（1 巡目で落ちた夾雑など）は、\n        # 予測できた成分の tR_ref -> 予測 tR の関係を延長して埋めます。\n        # 手本の tR をそのまま使うと、条件の違う相手には大外れの予測になり、\n        # かえって「見つからない」を増やします。\n        if known.sum() >= 3 and (~known).any() and np.ptp(tR_ref[known]) > 1e-6:\n            b, a = np.polyfit(tR_ref[known], pred[known], 1)\n            pred[~known] = a + b * tR_ref[~known]\n        elif (~known).any():\n            slope, intercept = _time_map(tR_ref, tgt.tR, anchors)\n            pred[~known] = intercept + slope * tR_ref[~known]\n        info = {\"stage\": \"model\", \"slope\": np.nan, \"intercept\": np.nan,\n                \"area_scale\": scale, \"n_anchor\": len(anchors),\n                \"n_predicted\": int(known.sum())}\n    else:\n        slope, intercept = _time_map(tR_ref, tgt.tR, anchors)\n        pred = intercept + slope * tR_ref\n        info = {\"stage\": \"two-pass\", \"slope\": slope, \"intercept\": intercept,\n                \"area_scale\": scale, \"n_anchor\": len(anchors)}\n\n    # --- 2 段階目: 3 つの手がかり全部を使って本番の対応づけ ---\n    cost, sim, ratio, dt = _cost_matrix(ref, tgt, w, pred, scale)\n    pairs = (_align_ordered(cost, w.gap) if order_preserving\n             else _align_hungarian(cost, w.gap))\n\n    taken = {j for _, j in pairs}\n    matches = []\n    for i, lab in enumerate(labels):\n        j = next((jj for ii, jj in pairs if ii == i), None)\n        if j is None:\n            matches.append(Match(lab, tgt.name, None, flags=[\"未検出\"]))\n            continue\n        p = tgt.peaks[j]\n        # margin = 2 番手との差。小さいほど「機械には決められない」。\n        # 類似度が足りない候補（コスト BIG）は「そもそも候補ではない」ので、\n        # 2 番手を探すときに数えません。数えると margin が 100 万になって、\n        # 「候補が 1 つしか無い」のか「僅差でない」のか区別できなくなります。\n        others = np.delete(cost[i], j)\n        others = others[others < BIG]\n        second = float(np.min(others)) if others.size else np.inf\n        margin = min(second - float(cost[i, j]), MARGIN_CAP)\n\n        m = Match(\n            label=lab, run_id=tgt.name, peak=j, tR=p.tR, area=p.area,\n            height=p.height, width_half=p.width_half, sigma=p.sigma,\n            similarity=float(sim[i, j]), area_ratio=float(ratio[i, j]),\n            dt=float(dt[i, j]), cost=float(cost[i, j]), margin=margin,\n            purity=p.purity,\n        )\n        if margin < w.review_margin:\n            m.flags.append(\"僅差\")\n        if m.similarity < w.review_similarity:\n            m.flags.append(\"低類似度\")\n        if np.isfinite(m.area_ratio) and (\n                m.area_ratio > w.review_area_ratio\n                or m.area_ratio < 1.0 / w.review_area_ratio):\n            m.flags.append(\"面積不一致\")\n        if np.isfinite(p.purity) and p.purity < 0.98:\n            m.flags.append(\"純度低\")\n        if not p.resolved:\n            m.flags.append(\"幅が谷どまり\")\n        matches.append(m)\n\n    # --- 「未検出」の正体が順序の入れ替わりでないかを調べる ---\n    # 溶出順を保つ制約は、順序が入れ替わったペアを「取り違える」のではなく\n    # 「片方を捨てる」形で失敗します（安全側）。ただし黙って捨てると、\n    # 本当に出ていないのか順序が変わっただけなのか分かりません。そこで、\n    # 余ったピークの中にスペクトルがそっくりなものがあれば候補として示します。\n    leftover = [j for j in range(nt) if j not in taken]\n    if leftover:\n        for i, lab in enumerate(labels):\n            m = matches[i]\n            if m.found:\n                continue\n            cands = [(sim[i, j], j) for j in leftover\n                     if sim[i, j] >= 0.999\n                     and abs(dt[i, j]) <= 3.0 * w.time_tol_min]\n            if cands:\n                s, j = max(cands)\n                m.candidate_peak = j\n                m.candidate_tR = float(tgt.peaks[j].tR)\n                m.similarity = float(s)\n                m.flags.append(\"順序入替の疑い\")\n\n    # 順序が入れ替わっていないかを最後に確かめる（ハンガリアン法のとき用）\n    got = [(i, j) for i, j in pairs]\n    if got and any(got[k][1] >= got[k + 1][1] for k in range(len(got) - 1)):\n        for i, j in got:\n            lab = labels[i]\n            mm = next(m for m in matches if m.label == lab)\n            if \"順序入替\" not in mm.flags:\n                mm.flags.append(\"順序入替\")\n\n    return matches, nt - len(taken), info\n\n\ndef _time_map(tR_ref: np.ndarray, tR_tgt: np.ndarray, anchors) -> tuple:\n    \"\"\"アンカーから「時間の伸び縮み」tR_tgt ≈ a + b·tR_ref を推定する。\n\n    条件が少し違うだけなら、保持時間は全体としてこの 1 次式でよく揃います。\n    アンカーが足りなければ恒等写像（そのまま）にします。\n    \"\"\"\n    if len(anchors) >= 3:\n        x = np.array([tR_ref[i] for i, _ in anchors])\n        y = np.array([tR_tgt[j] for _, j in anchors])\n        if np.ptp(x) > 1e-6:\n            b, a = np.polyfit(x, y, 1)\n            if 0.2 < b < 5.0:          # 極端な傾きは推定失敗とみなす\n                return float(b), float(a)\n    if len(anchors) >= 1:\n        shift = float(np.median([tR_tgt[j] - tR_ref[i] for i, j in anchors]))\n        return 1.0, shift\n    return 1.0, 0.0\n\n\ndef _area_scale(ref: PeakTable, tgt: PeakTable, anchors) -> float:\n    \"\"\"相手のランの面積が全体として何倍か（注入量・希釈のずれを吸収）。\"\"\"\n    if anchors:\n        r = [tgt.peaks[j].area / ref.peaks[i].area\n             for i, j in anchors if ref.peaks[i].area > 0]\n        if r:\n            return float(np.median(r))\n    a, b = ref.total_area(), tgt.total_area()\n    return float(b / a) if a > 0 else 1.0\n\n\n# ----------------------------------------------------------------------\n# 全ランの対応づけ\n# ----------------------------------------------------------------------\ndef assign_runs(tables: dict, reference: str,\n                labels: dict | list | None = None,\n                tiers: dict | None = None,\n                conditions: dict | None = None,\n                weights: MatchWeights | None = None,\n                predicted: dict | None = None,\n                order_preserving: bool = True,\n                chain: bool = True) -> AssignmentReport:\n    \"\"\"全ランのピークを、手本のランのラベルに対応づける。\n\n    Parameters\n    ----------\n    tables : dict\n        {run_id: PeakTable}。\n    reference : str\n        手本にするラン。**いちばんよく分離しているラン**を選んでください\n        （ふつうは tG がいちばん長いもの）。\n    labels : dict | list, optional\n        {手本のピーク番号: 名前} か、手本のピーク数と同じ長さの名前リスト。\n        省略時は PeakTable が振った P01, P02, ... をそのまま使います。\n    conditions : dict, optional\n        {run_id: {\"tG\": .., \"T\": .., \"phi0\": .., \"phi1\": ..}}。\n        与えると「条件が近い順」に対応づけを伝播します（下記）。\n    predicted : dict, optional\n        {run_id: {ラベル: 予測 tR}}。フィット後にモデルの予測を渡すと、\n        時間の手がかりが格段に強くなります（2 巡目の帰属に有効）。\n    chain : bool\n        True（既定）なら**数珠つなぎ**にします。手本から直接ではなく、\n        「すでに帰属済みのランのうち、条件がいちばん近いもの」を手本にして\n        1 本ずつ広げます。tG 20 min と 80 min を直接比べるより、\n        20 → 40 → 80 と繋いだ方がずっと安全です。\n\n    Returns\n    -------\n    AssignmentReport\n    \"\"\"\n    w = weights or MatchWeights()\n    if reference not in tables:\n        raise ValueError(f\"手本のラン '{reference}' が tables にありません。\")\n\n    ref_table = tables[reference]\n    if isinstance(labels, dict):\n        names = [labels.get(i, p.label) for i, p in enumerate(ref_table.peaks)]\n    elif isinstance(labels, (list, tuple)):\n        if len(labels) != len(ref_table.peaks):\n            raise ValueError(\n                f\"labels の数（{len(labels)}）が手本のピーク数\"\n                f\"（{len(ref_table.peaks)}）と合いません。\"\n            )\n        names = list(labels)\n    else:\n        names = [p.label for p in ref_table.peaks]\n\n    # 空の名前は帰属対象から外す（見なくていいピークを消すため）\n    keep = [i for i, n in enumerate(names) if str(n).strip()]\n    if not keep:\n        raise ValueError(\"名前のついたピークが 1 つもありません。\")\n    ref_sub = _subset(ref_table, keep)\n    label_list = [str(names[i]).strip() for i in keep]\n    for p, lab in zip(ref_sub.peaks, label_list):\n        p.label = lab\n\n    order = _chain_order(list(tables), reference, conditions)\n    notes = []\n    assignments: dict = {}\n\n    # 手本そのものは自分自身に対応\n    assignments[reference] = RunAssignment(\n        reference, reference,\n        [Match(lab, reference, i, tR=p.tR, area=p.area, height=p.height,\n               width_half=p.width_half, sigma=p.sigma, similarity=1.0,\n               area_ratio=1.0, dt=0.0, cost=0.0, margin=MARGIN_CAP,\n               purity=p.purity)\n         for i, (lab, p) in enumerate(zip(label_list, ref_sub.peaks))],\n        n_unassigned=len(ref_table) - len(keep),\n    )\n    templates = {reference: ref_sub}\n\n    for rid in order:\n        if rid == reference:\n            continue\n        src = (_nearest_assigned(rid, list(templates), conditions)\n               if chain else reference)\n        tmpl = templates[src]\n        pred = (predicted or {}).get(rid)\n        matches, n_extra, info = match_tables(\n            tmpl, tables[rid], weights=w, predicted=pred,\n            order_preserving=order_preserving,\n            labels=[p.label for p in tmpl.peaks],\n        )\n        # 手本を乗り換えている場合、手本に無かったラベルは「未検出」で補う\n        have = {m.label for m in matches}\n        for lab in label_list:\n            if lab not in have:\n                matches.append(Match(lab, rid, None, flags=[\"未検出\"]))\n        matches.sort(key=lambda m: label_list.index(m.label))\n        assignments[rid] = RunAssignment(rid, src, matches, n_extra)\n\n        stage = info.get(\"stage\")\n        scale = info.get(\"area_scale\", 1.0)\n        if stage == \"two-pass\":\n            notes.append(\n                f\"{rid}: 手本 {src} / 時間の伸び縮み \"\n                f\"tR' = {info['intercept']:+.3f} + {info['slope']:.4f}·tR \"\n                f\"（アンカー {info.get('n_anchor', 0)} 本）, \"\n                f\"面積スケール {scale:.2f}\"\n            )\n        elif stage == \"model\":\n            notes.append(\n                f\"{rid}: 手本 {src} / モデル予測 tR を使用\"\n                f\"（{info.get('n_predicted', 0)}/{len(tmpl)} 成分）, \"\n                f\"面積スケール {scale:.2f}\"\n            )\n        else:\n            notes.append(f\"{rid}: 手本 {src} / ピークが検出されず全て未検出\")\n\n        # 対応がついたピークを次の手本にする（数珠つなぎ）\n        found = [m for m in matches if m.found]\n        if chain and len(found) >= 3:\n            idx = [m.peak for m in found]\n            nxt = _subset(tables[rid], idx)\n            for p, m in zip(nxt.peaks, found):\n                p.label = m.label\n            templates[rid] = nxt\n\n    runs = [reference] + [r for r in order if r != reference]\n    return AssignmentReport(\n        reference=reference, labels=label_list, runs=runs,\n        assignments=assignments,\n        tiers=dict(tiers or {}), notes=notes,\n    )\n\n\ndef _subset(table: PeakTable, idx) -> PeakTable:\n    \"\"\"ピークの一部だけを持つ PeakTable を作る（手本用）。\"\"\"\n    return PeakTable(\n        name=table.name, times=table.times, signal=table.signal,\n        baseline=table.baseline, peaks=[table.peaks[i] for i in idx],\n        noise=table.noise, detection_wavelength=table.detection_wavelength,\n        wavelengths=table.wavelengths, meta=dict(table.meta),\n    )\n\n\ndef _cond_distance(a: dict, b: dict) -> float:\n    \"\"\"条件どうしの「近さ」。小さいほど似た条件。\n\n    tG は倍率で効くので対数、温度は 10 ℃ を 1 単位、組成は 0.1（10%B）を\n    1 単位として足します。\n    \"\"\"\n    d = 0.0\n    if a.get(\"tG\") and b.get(\"tG\"):\n        d += abs(math.log(float(a[\"tG\"]) / float(b[\"tG\"])))\n    if a.get(\"T\") is not None and b.get(\"T\") is not None:\n        d += abs(float(a[\"T\"]) - float(b[\"T\"])) / 10.0\n    for k in (\"phi0\", \"phi1\"):\n        if a.get(k) is not None and b.get(k) is not None:\n            d += abs(float(a[k]) - float(b[k])) / 0.1\n    if a.get(\"flow\") and b.get(\"flow\"):\n        d += abs(math.log(float(a[\"flow\"]) / float(b[\"flow\"])))\n    return d\n\n\ndef _chain_order(run_ids: list, reference: str, conditions: dict | None) -> list:\n    \"\"\"手本に近い順にランを並べる。\"\"\"\n    others = [r for r in run_ids if r != reference]\n    if not conditions:\n        return [reference] + others\n    ref_c = conditions.get(reference, {})\n    others.sort(key=lambda r: _cond_distance(conditions.get(r, {}), ref_c))\n    return [reference] + others\n\n\ndef _nearest_assigned(rid: str, done: list, conditions: dict | None) -> str:\n    \"\"\"すでに帰属済みのランのうち、条件がいちばん近いものを手本に選ぶ。\"\"\"\n    if not conditions or rid not in conditions:\n        return done[0]\n    c = conditions[rid]\n    return min(done, key=lambda r: _cond_distance(conditions.get(r, {}), c))\n\n\n# ----------------------------------------------------------------------\n# モデル予測を手がかりに使う（2 巡目）\n# ----------------------------------------------------------------------\ndef predicted_from_model(comps, runs, system, dt_frac: float = 0.02) -> dict:\n    \"\"\"フィット済みモデルから {run_id: {成分: 予測 tR}} を作る。\n\n    使い方（2 巡目の帰属）::\n\n        rep  = assign_runs(tables, ref)             # 1 巡目（スペクトル+面積+時間）\n        obs, tiers = rep.to_observations()\n        fit  = fit_components(obs, runs, system, tiers=tiers)\n        pred = predicted_from_model(fit.components, runs, system)\n        rep2 = assign_runs(tables, ref, predicted=pred)   # 2 巡目\n\n    1 巡目で決まった成分だけでモデルを作り、その予測を使って\n    「見つからなかった」「僅差だった」ものを決めにいく、という順番です。\n    \"\"\"\n    from .simulate import simulate\n\n    out = {}\n    for r in runs:\n        res = simulate(comps, r.method, system, dt_frac=dt_frac)\n        out[r.run_id] = {n: float(t) for n, t, ok\n                         in zip(res.names, res.tR, res.eluted) if ok}\n    return out\n\n\ndef tier_from_area(table: PeakTable, targets: list[str],\n                   fraction: float = 0.01,\n                   near_min: float = 0.2) -> dict:\n    \"\"\"仕様の Tier 分類を面積と近さから機械的につける。\n\n    - Tier 1: ``targets`` に名前がある目的成分\n    - Tier 2: 目的成分の最大面積の ``fraction`` 以上、または目的成分の\n      ``near_min`` 分以内にいる夾雑（面積によらず追跡する）\n    - Tier 3: それ以外\n\n    「±0.2 min 以内なら面積によらず追跡」は、小さくても目的成分に\n    かぶってくるピークを取りこぼさないための規則です。\n    \"\"\"\n    tgt_peaks = [p for p in table.peaks if p.label in targets]\n    ref_area = max((p.area for p in tgt_peaks), default=0.0)\n    tgt_tR = [p.tR for p in tgt_peaks]\n    tiers = {}\n    for p in table.peaks:\n        if p.label in targets:\n            tiers[p.label] = 1\n        elif ref_area > 0 and p.area >= fraction * ref_area:\n            tiers[p.label] = 2\n        elif any(abs(p.tR - t) <= near_min for t in tgt_tR):\n            tiers[p.label] = 2\n        else:\n            tiers[p.label] = 3\n    return tiers\n", "lcmd/design.py": "\"\"\"必要理論段数の判定と (tG, T) 分離度マップ\n\n■ N_req とは\n「目標の分離度 Rs を、この選択性 α と保持 k* で達成するには、\n  理論段数がいくつ要るか」を返す式:\n\n    N_req = 16 · Rs_target² · (α/(α−1))² · ((1+k*)/k*)²\n\n3 つの掛け算はそれぞれ独立したノブです:\n  - Rs_target : 欲しい分離度（安全率）\n  - α/(α−1)  : 選択性。α が 1 に近い（＝2 成分が似ている）ほど爆発的に増える\n  - (1+k*)/k*: 保持。k* が小さい（＝早く出過ぎ）と不利。k* > 5 ならほぼ頭打ち\n\n■ k* とは\nグラジエントでの「実効的な保持係数」。アイソクラティックの k に相当する量。\n\n    b  = t0·S·ΔΦ / tG        （勾配の急さ。無次元）\n    k* = 1/(1.15·b) = tG·F / (1.15·S·ΔΦ·Vm)\n\n勾配を緩くする（tG を長くする）と b が小さくなり k* が上がる、という関係。\n\n■ 使い方\nN_req を、実際に持っているカラムの N（N_available）と比べます。\nN_req > N_available なら、その条件では原理的に目標 Rs に届きません。\n分離度マップの上にこの境界を重ねると「どこなら物理的に可能か」が一目で分かります。\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\n\nimport numpy as np\n\nfrom .gradient import Gradient\nfrom .hardware import Method, System, pressure_profile\nfrom .model import ComponentSet\nfrom .simulate import SimResult, simulate\n\n\ndef gradient_steepness(t0: float, S, delta_phi: float, tG: float):\n    \"\"\"b = t0·S·ΔΦ/tG。Φ は必ず分率で。\"\"\"\n    return t0 * np.asarray(S, dtype=float) * delta_phi / tG\n\n\ndef k_star(t0: float, S, delta_phi: float, tG: float):\n    \"\"\"k* = 1/(1.15·b)。\"\"\"\n    b = gradient_steepness(t0, S, delta_phi, tG)\n    return 1.0 / (1.15 * b)\n\n\ndef n_required(alpha_sel, k_star_value, rs_target: float = 2.0):\n    \"\"\"N_req。α ≤ 1 のときは inf（分離不可能）を返す。\"\"\"\n    a = np.asarray(alpha_sel, dtype=float)\n    ks = np.asarray(k_star_value, dtype=float)\n    with np.errstate(divide=\"ignore\", invalid=\"ignore\"):\n        sel = np.where(a > 1.0, a / (a - 1.0), np.inf)\n        ret = (1.0 + ks) / ks\n        return 16.0 * rs_target**2 * sel**2 * ret**2\n\n\ndef n_required_table(alphas=(1.10, 1.08, 1.06, 1.04), k_star_value=6.0,\n                     rs_target=2.0) -> str:\n    \"\"\"α ごとの必要理論段数を表にする。\"\"\"\n    lines = [\n        f\"Rs_target = {rs_target}, k* = {k_star_value}\",\n        f\"{'alpha':>8}{'N_req':>12}   最低限必要なカラム長の目安\",\n        \"-\" * 52,\n    ]\n    for a in alphas:\n        nr = float(n_required(a, k_star_value, rs_target))\n        if nr <= 11000:\n            hint = \"50 mm で足りる\"\n        elif nr <= 20000:\n            hint = \"100 mm\"\n        elif nr <= 28000:\n            hint = \"150 mm でぎりぎり\"\n        else:\n            hint = \"カラム固定では不可能\"\n        lines.append(f\"{a:>8.3f}{nr:>12,.0f}   {hint}\")\n    return \"\\n\".join(lines)\n\n\n# ----------------------------------------------------------------------\n# 臨界ペアの N_req\n# ----------------------------------------------------------------------\ndef critical_n_req(result: SimResult, comps: ComponentSet,\n                   delta_phi: float | None = None, tG: float | None = None,\n                   rs_target: float = 2.0, tiers=(1, 2)) -> dict | None:\n    \"\"\"シミュレーション結果から、臨界ペアの α・k*・N_req を出す。\n\n    α（選択性）の求め方に注意\n    -------------------------\n    グラジエントでは全ピークがほぼ同じ保持係数で溶出します（それが k* の\n    意味）。したがって「溶出時点の kE の比」を α に使うと、どんなに離れた\n    2 成分でも α ≒ 1 になってしまい、意味を成しません。\n\n    正しくは「共通の組成における k の比」を使います。ここではペアの\n    溶出組成の平均 Φ で評価します:\n\n        α = k_後(Φ_mean) / k_前(Φ_mean)\n\n    k* の求め方に注意\n    -----------------\n    k* = 1/(1.15·b) の b は「そのピークが溶出する場所での勾配の急さ」です。\n    リニアなら b = t0·S·ΔΦ/tG で全区間共通ですが、**多段では区間ごとに違う**ため、\n    全体の ΔΦ/tG から出すと実態とかけ離れます（デモ条件で k* が 2 倍ずれた）。\n\n    そこでシミュレーションが各成分について持っている局所値\n    `b_local = t0·S·(dΦ/dt at elution)` を使います。リニアではこれが\n    b と一致するので、結果は従来どおりです。溶出がホールド区間に入って\n    b_local = 0 になる場合だけ、引数の delta_phi / tG から計算します。\n    \"\"\"\n    pair = result.critical_pair(tiers)\n    if pair is None:\n        return None\n    i, j = pair[\"i\"], pair[\"j\"]\n    T = result.method.temperature_C\n    S_pair = float(np.mean([comps.S(T)[i], comps.S(T)[j]]))\n\n    b_local = float(np.mean([result.b_local[i], result.b_local[j]]))\n    if np.isfinite(b_local) and b_local > 1e-12:\n        ks = 1.0 / (1.15 * b_local)\n        ks_source = \"local\"\n    elif delta_phi is not None and tG is not None and tG > 0:\n        ks = float(k_star(result.t0, S_pair, delta_phi, tG))\n        ks_source = \"overall\"\n    else:\n        ks = np.inf\n        ks_source = \"isocratic\"\n\n    phi_mean = pair[\"phi_e_mean\"]\n    k_pair = comps.k(phi_mean, T)\n    a = float(k_pair[j] / k_pair[i])\n    if a < 1.0:\n        a = 1.0 / a\n    return {\n        **pair,\n        \"S_pair\": S_pair,\n        \"k_star\": ks,\n        \"k_star_source\": ks_source,\n        \"b_local\": b_local,\n        \"phi_alpha\": phi_mean,\n        \"alpha_sel\": a,\n        \"N_req\": float(n_required(a, ks, rs_target)),\n        \"N_req_direct\": plates_required_for_rs(result, i, j, rs_target),\n    }\n\n\ndef plates_required_for_rs(result: SimResult, i: int, j: int,\n                           rs_target: float = 2.0,\n                           sigma_ext: float | None = None) -> float:\n    \"\"\"あるペアで目標 Rs を出すのに必要な N を、σ の定義から直接逆算する。\n\n    なぜ 2 通り計算するのか\n    -----------------------\n    N_req の教科書式は「2 成分の S が同じ」ことを暗に仮定しています\n    （α を 1 つの組成で評価するため）。今回の系のように S が成分ごとに\n    違う場合、α の評価点しだいで N_req が数割変わってしまいます。\n\n    そこで、シミュレーションが出した ΔtR と σ をそのまま使って\n\n        Rs(N) = ΔtR / (2·(σ1(N) + σ2(N))),\n        σ(N)  = √( (t0·(1+kE)·G)² / N + σ_ext² )\n\n    を Rs = 目標値 について数値的に解きます。こちらはモデルの中で\n    閉じているぶん信頼できます。両方出して食い違いを見てください。\n\n    σ_ext があるので、N をいくら増やしても Rs には上限があります。\n    上限を超える目標を与えると inf を返します（＝カラムでは解決しない。\n    装置分散を減らすか選択性を変えるしかない、というサイン）。\n    \"\"\"\n    if sigma_ext is None:\n        # σ_col と σ_tot から σ_ext を復元する\n        sigma_ext = float(np.sqrt(max(result.sigma[i] ** 2 - result.sigma_col[i] ** 2, 0.0)))\n    dt = abs(result.tR[j] - result.tR[i])\n    # c = σ_col · √N（N に依存しない定数）\n    c1 = result.sigma_col[i] * np.sqrt(result.plates)\n    c2 = result.sigma_col[j] * np.sqrt(result.plates)\n\n    def rs_of(N):\n        s1 = np.sqrt(c1**2 / N + sigma_ext**2)\n        s2 = np.sqrt(c2**2 / N + sigma_ext**2)\n        return dt / (2.0 * (s1 + s2))\n\n    rs_limit = dt / (4.0 * sigma_ext) if sigma_ext > 0 else np.inf\n    if rs_target >= rs_limit:\n        return np.inf\n\n    lo, hi = 1e2, 1e9\n    if rs_of(lo) >= rs_target:\n        return float(lo)\n    for _ in range(200):\n        mid = np.sqrt(lo * hi)\n        if rs_of(mid) < rs_target:\n            lo = mid\n        else:\n            hi = mid\n    return float(np.sqrt(lo * hi))\n\n\n# ----------------------------------------------------------------------\n# (tG × T) 分離度マップ\n# ----------------------------------------------------------------------\n@dataclass\nclass ResolutionMap:\n    tG: np.ndarray            # (ntG,)\n    T: np.ndarray             # (nT,)\n    rs_min: np.ndarray        # (nT, ntG)\n    n_req: np.ndarray         # (nT, ntG) 教科書式（α と k* から）\n    n_req_direct: np.ndarray  # (nT, ntG) σ の定義から直接逆算\n    n_available: float        # そのマップの流速での実際の N（公称値ではない）\n    critical_first: np.ndarray   # (nT, ntG) 臨界ペアの前側成分名\n    critical_second: np.ndarray\n    runtime: np.ndarray       # (nT, ntG) 最終溶出時間\n    rs_target: float\n    phi0: float\n    phi1: float\n    pressure: np.ndarray | None = None    # (nT, ntG) 最大圧力 [bar]\n    pressure_limit_bar: float = float(\"nan\")  # 使った圧力上限\n\n    @property\n    def over_pressure(self) -> np.ndarray:\n        \"\"\"圧力上限を超えて流せない領域。\"\"\"\n        if self.pressure is None or not np.isfinite(self.pressure_limit_bar):\n            return np.zeros_like(self.rs_min, dtype=bool)\n        return self.pressure > self.pressure_limit_bar\n\n    @property\n    def feasible(self) -> np.ndarray:\n        \"\"\"N_req ≤ N_available の領域（教科書式）。\"\"\"\n        return self.n_req <= self.n_available\n\n    @property\n    def feasible_direct(self) -> np.ndarray:\n        \"\"\"σ から直接逆算した N_req による判定。こちらの方が信頼できる。\"\"\"\n        return self.n_req_direct <= self.n_available\n\n    def robust_rs(self, radius: int = 1) -> np.ndarray:\n        \"\"\"各格子点の「近傍最小 Rs」。高原を探すための指標。\n\n        自分と周囲 radius マスの中でいちばん低い Rs を、その点の評価値に\n        します。尖った最大点は隣が悪いので評価が下がり、広く平らな領域だけ\n        が高い値で残ります。\n\n        格子の外は端の値で埋めます（端の点を「隣が少ないぶん有利」に\n        してしまわないため）。ただし端で選ばれた条件は、格子の外側が\n        本当に平らかを確認していない点に注意してください。\n        \"\"\"\n        m = np.nan_to_num(self.rs_min, nan=-np.inf)\n        pad = np.pad(m, radius, mode=\"edge\")\n        out = np.full_like(m, np.inf)\n        nT, ntG = m.shape\n        for di in range(2 * radius + 1):\n            for dj in range(2 * radius + 1):\n                out = np.minimum(out, pad[di:di + nT, dj:dj + ntG])\n        return out\n\n    def best(self, require_feasible: bool = True) -> dict:\n        \"\"\"最大 Rs の点。尖った頂点を拾いがちなので目安まで（plateau() 推奨）。\"\"\"\n        m = self.rs_min.copy()\n        if require_feasible:\n            m = np.where(self.feasible, m, -np.inf)\n        idx = np.unravel_index(np.argmax(np.nan_to_num(m, nan=-np.inf)), m.shape)\n        return self.point(idx)\n\n    def plateau(self, radius: int = 1, require_feasible: bool = True) -> dict:\n        \"\"\"「高原」を選ぶ ＝ 近傍最小 Rs が最大になる点。\n\n        分離度マップは、成分同士が入れ替わる条件で急に落ち込むため、\n        現実には非常に尖った形になります。最大点をそのまま採用すると、\n        設定が少しずれただけで谷に落ちます。そこで「周囲を含めて\n        いちばん悪いときでも高い」点を選びます。\n        \"\"\"\n        rr = self.robust_rs(radius)\n        if require_feasible:\n            rr = np.where(self.feasible, rr, -np.inf)\n        idx = np.unravel_index(np.argmax(rr), rr.shape)\n        out = self.point(idx)\n        out[\"Rs_neighbourhood_min\"] = float(rr[idx])\n        out[\"radius\"] = radius\n        return out\n\n    def point(self, idx) -> dict:\n        \"\"\"格子点 (i, j) の中身を dict で返す（アプリの表示にも使う公開 API）。\"\"\"\n        a, b = int(idx[0]), int(idx[1])\n        return {\n            \"T\": float(self.T[a]),\n            \"tG\": float(self.tG[b]),\n            \"Rs_min\": float(self.rs_min[a, b]),\n            \"N_req\": float(self.n_req[a, b]),\n            \"N_req_direct\": float(self.n_req_direct[a, b]),\n            \"feasible\": bool(self.feasible[a, b]),\n            \"feasible_direct\": bool(self.feasible_direct[a, b]),\n            \"critical_pair\": (str(self.critical_first[a, b]),\n                              str(self.critical_second[a, b])),\n            \"runtime\": float(self.runtime[a, b]),\n            \"index\": (a, b),\n        }\n\n\ndef resolution_map(\n    comps: ComponentSet,\n    system: System,\n    tG_values,\n    T_values,\n    phi0: float,\n    phi1: float,\n    flow: float = 0.40,\n    rs_target: float = 2.0,\n    tiers=(1, 2),\n    dt_frac: float = 0.02,\n    progress=None,\n) -> ResolutionMap:\n    \"\"\"tG × T の格子を総当たりして、各点の最小 Rs と N_req を計算する。\n\n    progress : callable(done, total) or None\n        UI に進捗を出したいときに渡す（Streamlit の progress bar など）。\n    \"\"\"\n    tG_values = np.asarray(tG_values, dtype=float)\n    T_values = np.asarray(T_values, dtype=float)\n    shape = (T_values.size, tG_values.size)\n\n    rs = np.full(shape, np.nan)\n    nreq = np.full(shape, np.inf)\n    nreq_direct = np.full(shape, np.inf)\n    first = np.empty(shape, dtype=object)\n    second = np.empty(shape, dtype=object)\n    runtime = np.full(shape, np.nan)\n\n    total = shape[0] * shape[1]\n    done = 0\n    for a, T in enumerate(T_values):\n        for b, tG in enumerate(tG_values):\n            method = Method(Gradient.linear(phi0, phi1, tG), T, flow)\n            res = simulate(comps, method, system, dt_frac=dt_frac)\n            rs[a, b] = res.min_rs(tiers)\n            runtime[a, b] = np.nanmax(res.tR)\n            info = critical_n_req(res, comps, phi1 - phi0, tG, rs_target, tiers)\n            if info is not None:\n                nreq[a, b] = info[\"N_req\"]\n                nreq_direct[a, b] = info[\"N_req_direct\"]\n                first[a, b] = info[\"first\"]\n                second[a, b] = info[\"second\"]\n            else:\n                first[a, b] = \"\"\n                second[a, b] = \"\"\n            done += 1\n            if progress is not None:\n                progress(done, total)\n\n    return ResolutionMap(\n        tG=tG_values, T=T_values, rs_min=rs, n_req=nreq, n_req_direct=nreq_direct,\n        n_available=system.plates_at(flow), critical_first=first,\n        critical_second=second,\n        runtime=runtime, rs_target=rs_target, phi0=phi0, phi1=phi1,\n    )\n\n\n# ----------------------------------------------------------------------\n# 対処法の提示（N_req が足りないとき）\n# ----------------------------------------------------------------------\ndef diagnose_infeasible(alpha_sel: float, k_star_value: float,\n                        n_available: float, rs_target: float = 2.0) -> list[str]:\n    \"\"\"N_req > N_available のときに何をどれだけ変えれば届くかを列挙する。\n\n    Notes\n    -----\n    ここは教科書式（α と k*）に基づく概算です。「目標 Rs を下げる」の行は\n    Rs ∝ √N を仮定しており、σ_ext が効く領域では楽観側にずれます。\n    厳密な必要段数は plates_required_for_rs()（σ の定義から直接逆算）を\n    見てください。\n    \"\"\"\n    out = []\n    n_req = float(n_required(alpha_sel, k_star_value, rs_target))\n    if n_req <= n_available:\n        return [f\"N_req = {n_req:,.0f} <= N = {n_available:,.0f}: 現状で達成可能。\"]\n\n    out.append(f\"N_req = {n_req:,.0f} > N = {n_available:,.0f}（{n_req / n_available:.1f} 倍不足）\")\n\n    # 目標 Rs を下げる\n    rs_ok = rs_target * math_sqrt(n_available / n_req)\n    out.append(f\"- 目標 Rs を {rs_ok:.2f} まで下げれば現状の N で足りる\")\n\n    # k* を上げる（無限大にしても得られる改善は限定的）\n    n_inf = float(n_required(alpha_sel, 1e9, rs_target))\n    if n_inf <= n_available:\n        # k* を解く: ((1+k)/k)² = n_available / (16 Rs² sel²)\n        sel2 = (alpha_sel / (alpha_sel - 1.0)) ** 2\n        r = math_sqrt(n_available / (16.0 * rs_target**2 * sel2))\n        if r > 1.0:\n            out.append(f\"- k* を {1.0 / (r - 1.0):.1f} 以上に上げれば足りる\"\n                       f\"（現在 {k_star_value:.1f}。tG を延ばすか ΔΦ を狭める）\")\n    else:\n        out.append(f\"- k* をいくら上げても N_req は {n_inf:,.0f} までしか下がらない\"\n                   f\"（保持では解決しない。選択性を変えるしかない）\")\n\n    # 必要な α\n    ret2 = ((1.0 + k_star_value) / k_star_value) ** 2\n    s = math_sqrt(n_available / (16.0 * rs_target**2 * ret2))\n    if s > 1.0:\n        alpha_need = s / (s - 1.0)\n        out.append(f\"- 選択性を α = {alpha_need:.3f} 以上にできれば足りる\"\n                   f\"（現在 {alpha_sel:.3f}）→ 温度域の再検討 / MeOH・三元移動相 / \"\n                   f\"固定相変更（Phenyl 系）/ MS で分離\")\n\n    # カラム長\n    out.append(f\"- カラム長で稼ぐなら現在の {n_req / n_available:.1f} 倍の N が必要\"\n               f\"（N は長さにほぼ比例。ただし圧力も比例して上がる）\")\n    return out\n\n\ndef math_sqrt(x: float) -> float:\n    return float(np.sqrt(max(x, 0.0)))\n\n\ndef segment_map(comps: ComponentSet, method: Method, system: System,\n                scales, T_values, *, tiers=(1, 2), focus=None,\n                rs_target: float = 2.0, pressure_limit: float = 0.90,\n                dt_frac: float = 0.02, progress=None) -> ResolutionMap:\n    \"\"\"**セグメント化した後の**デザインスペース。\n\n    リニアなら「tG × T」で振れば全部見られますが、セグメント化した後は\n    傾きが区間ごとに違うので tG が 1 つに決まりません。そこで**形はそのまま、\n    全体の時間だけを伸縮させる**（全区間の傾きを一律に ``scales`` 倍する）\n    軸を取ります。x 軸はその結果のグラジエント時間です。\n\n    「採用した条件がどれくらい崖の上にいるか」を見るための図です。等高線が\n    詰まっているところに乗っていたら、少しのずれで Rs が落ちます。\n\n    Parameters\n    ----------\n    scales : array-like\n        時間の伸縮率。1.0 が採用条件そのもの。2.0 なら 2 倍速（半分の時間）。\n    focus : 成分名の集合, optional\n        :meth:`SimResult.min_rs` と同じ。目的成分を含むペアだけを見ます。\n    pressure_limit : float\n        圧力上限の何割まで使うか。**超える点は Rs を NaN にして図から抜きます**\n        （流せない条件を「分離が良い」と見せない）。温度を下げると粘度が上がる\n        ので、地図の低温側がここで削れることがあります。\n    \"\"\"\n    scales = np.asarray(scales, dtype=float)\n    T_values = np.asarray(T_values, dtype=float)\n    g0 = method.gradient\n    phi0, phi1 = float(g0.phis[0]), float(g0.phis[-1])\n    shape = (T_values.size, scales.size)\n\n    rs = np.full(shape, np.nan)\n    nreq = np.full(shape, np.inf)\n    nreq_direct = np.full(shape, np.inf)\n    first = np.empty(shape, dtype=object)\n    second = np.empty(shape, dtype=object)\n    runtime = np.full(shape, np.nan)\n    press = np.full(shape, np.nan)\n    tG = np.array([g0.duration / s for s in scales], dtype=float)\n    p_limit = pressure_limit * system.max_pressure_bar\n\n    total, done = shape[0] * shape[1], 0\n    for a, T in enumerate(T_values):\n        for b, s in enumerate(scales):\n            m = Method(g0.scale_time(1.0 / float(s)), float(T),\n                       method.flow_ml_min)\n            res = simulate(comps, m, system, dt_frac=dt_frac)\n            press[a, b] = pressure_profile(system, m)[\"max_bar\"]\n            rs[a, b] = (res.min_rs(tiers, focus)\n                        if press[a, b] <= p_limit else np.nan)\n            runtime[a, b] = np.nanmax(res.tR)\n            info = critical_n_req(res, comps, phi1 - phi0, float(tG[b]),\n                                  rs_target, tiers)\n            if info is not None:\n                nreq[a, b] = info[\"N_req\"]\n                nreq_direct[a, b] = info[\"N_req_direct\"]\n                first[a, b] = info[\"first\"]\n                second[a, b] = info[\"second\"]\n            else:\n                first[a, b] = second[a, b] = \"\"\n            done += 1\n            if progress:\n                progress(done, total)\n\n    return ResolutionMap(\n        tG=tG, T=T_values, rs_min=rs, n_req=nreq, n_req_direct=nreq_direct,\n        n_available=system.plates_at(method.flow_ml_min),\n        critical_first=first, critical_second=second, runtime=runtime,\n        rs_target=rs_target, phi0=phi0, phi1=phi1,\n        pressure=press, pressure_limit_bar=p_limit)\n", "lcmd/doe.py": "\"\"\"モデル用ランの実験計画（どの条件で何本測るか）\n\nメソッド開発の最初の仕事は「パラメータを入れること」ではなく、\n**パラメータを決めるための実験を設計すること**です。ここはその計算をします。\n\nやること\n--------\n1. スカウティングラン（最初の 1-2 本）の勾配時間を決める\n2. モデル用ラン一式（勾配時間 × 温度）の候補を作る\n3. **その設計で測ったとき、モデルがどれだけ確からしくなるか**を先に見積もる\n4. 候補の中から一番良い設計を選ぶ\n\n「どれだけ確からしくなるか」の測り方\n------------------------------------\n保持時間の測定には必ずばらつき σ があります。そのばらつきが、推定する\n4 パラメータ θ = (log k_w0, α, S0, β) にどれだけ伝わるかは、**実験する前に**\n計算できます。\n\n    共分散 ≈ σ² (JᵀJ)⁻¹        J[i,j] = ∂tR_i / ∂θ_j\n\nJ は「条件 i での保持時間が、パラメータ j を少し動かすとどれだけ変わるか」を\n並べた行列（感度行列）です。J の列どうしが似ていると (JᵀJ) が潰れて逆行列が\n巨大になる ＝ そのパラメータの組が分離できない、という意味になります。\n勾配時間を近い値ばかりにすると log k_w と S がまさにこれになります。\n\nパラメータの標準誤差そのものより分かりやすいのは、**狙っている条件で保持時間を\nどれだけの精度で予測できるか**です:\n\n    σ_pred(新条件) = √( jᵀ · 共分散 · j )      j = その条件での感度ベクトル\n\n本モジュールはこれを主な指標にします。「この設計なら tG 30 min の条件での\n保持時間予測は ±2 秒」と言えれば、設計の良し悪しが実感できます。\n\n前提と限界\n----------\n- 線形化（局所近似）です。真のパラメータが仮の値から大きく外れていると\n  見積もりもずれます。だから複数の仮パラメータで評価します（ロバスト設計）。\n- 測定ばらつきは全ランで同じ（等分散）・独立と仮定しています。\n- 「モデルが正しい」前提の誤差です。LSS で足りない系では、ここで出る\n  数字より実際の予測誤差は大きくなります。\n\"\"\"\n\nfrom __future__ import annotations\n\nimport itertools\nimport math\nfrom dataclasses import dataclass, field\n\nimport numpy as np\n\nfrom .fitting import Run\nfrom .gradient import Gradient\nfrom .hardware import Method, System\nfrom .simulate import analytic_tr_linear\n\n# 有限差分の刻み。log k_w も S も O(1) の量なので同じ値でよい\n_H = 1e-4\n\nPARAM_NAMES = (\"log k_w0\", \"α\", \"S0\", \"β\")\n\n\n# ----------------------------------------------------------------------\n# 感度行列\n# ----------------------------------------------------------------------\ndef _geometry(run: Run, system: System) -> dict:\n    g = run.method.gradient\n    F = run.method.flow_ml_min\n    return {\n        \"phi0\": g.phi_start,\n        \"dphi\": g.phi_end - g.phi_start,\n        \"tG\": g.duration,\n        \"t0\": system.t0(F),\n        \"tD\": system.tD(F),\n        \"T\": run.method.temperature_C,\n    }\n\n\ndef _tr(logkw: float, S: float, geo: dict) -> float:\n    return float(analytic_tr_linear(logkw, S, geo[\"phi0\"], geo[\"dphi\"],\n                                    geo[\"tG\"], geo[\"t0\"], geo[\"tD\"]))\n\n\ndef sensitivity_row(logkw0: float, alpha: float, S0: float, beta: float,\n                    geo: dict, T_ref: float) -> np.ndarray:\n    \"\"\"1 条件での ∂tR/∂θ を返す（長さ 4）。\n\n    log k_w と S に対する微分さえ出せば、温度係数の微分は ΔT を掛けるだけです:\n\n        log k_w = log k_w0 + α·ΔT   →  ∂tR/∂α = ∂tR/∂log k_w · ΔT\n        S       = S0      + β·ΔT   →  ∂tR/∂β = ∂tR/∂S       · ΔT\n\n    こうすると、桁の違う α・β を直接差分せずに済み、数値誤差が乗りません。\n    \"\"\"\n    dT = geo[\"T\"] - T_ref\n    logkw = logkw0 + alpha * dT\n    S = S0 + beta * dT\n\n    d_logkw = (_tr(logkw + _H, S, geo) - _tr(logkw - _H, S, geo)) / (2 * _H)\n    d_S = (_tr(logkw, S + _H, geo) - _tr(logkw, S - _H, geo)) / (2 * _H)\n    return np.array([d_logkw, d_logkw * dT, d_S, d_S * dT])\n\n\ndef sensitivity_matrix(theta, runs: list[Run], system: System,\n                       T_ref: float) -> np.ndarray:\n    \"\"\"設計全体の感度行列 J（ラン数 × 4）。\"\"\"\n    logkw0, alpha, S0, beta = theta\n    return np.vstack([\n        sensitivity_row(logkw0, alpha, S0, beta, _geometry(r, system), T_ref)\n        for r in runs\n    ])\n\n\ndef _eluted(theta, geo, T_ref) -> bool:\n    \"\"\"その条件で溶出するか（しない条件は情報を持たない）。\"\"\"\n    dT = geo[\"T\"] - T_ref\n    tr = _tr(theta[0] + theta[1] * dT, theta[2] + theta[3] * dT, geo)\n    if not np.isfinite(tr):\n        return False\n    # 勾配終了から 30·t0 を過ぎても出ないなら「出ない」扱い\n    return tr <= geo[\"tD\"] + geo[\"t0\"] + geo[\"tG\"] + max(10.0, 30.0 * geo[\"t0\"])\n\n\n# ----------------------------------------------------------------------\n# 設計の評価\n# ----------------------------------------------------------------------\n@dataclass\nclass DesignQuality:\n    \"\"\"1 つの設計（＝ラン一式）を 1 つの仮パラメータで評価した結果。\"\"\"\n\n    n_runs: int\n    n_usable: int                 # 溶出して情報になったラン数\n    n_params: int\n    stderr: np.ndarray            # 4 パラメータの標準誤差\n    correlation: np.ndarray       # パラメータ間の相関行列\n    condition_number: float       # 感度行列の条件数（大きいほど分離できない）\n    pred_sigma: dict              # {条件ラベル: 予測 tR の標準偏差[min]}\n    worst_pred_sigma: float       # 上の最大値[min] ← 設計の良し悪しの主指標\n    singular: bool                # 逆行列が取れなかった（＝決まらない設計）\n    notes: list[str] = field(default_factory=list)\n\n    @property\n    def worst_pred_sec(self) -> float:\n        return self.worst_pred_sigma * 60.0\n\n\ndef design_quality(\n    theta,\n    runs: list[Run],\n    system: System,\n    T_ref: float,\n    sigma_tR: float = 0.005,\n    targets: list[Method] | None = None,\n    temperature_dependent: bool = True,\n) -> DesignQuality:\n    \"\"\"設計の良し悪しを、実験する前に見積もる。\n\n    Parameters\n    ----------\n    theta : (log k_w0, α, S0, β)\n        仮に置く真のパラメータ。1 成分ぶん。\n    runs : list[Run]\n        測ろうとしているモデル用ラン一式。\n    sigma_tR : float\n        保持時間の測定ばらつき（標準偏差）[min]。既定 0.005 min = 0.3 秒。\n    targets : list[Method], optional\n        「この条件での予測が知りたい」という狙いの条件。省略時はモデル用ランの\n        勾配時間の範囲を内挿・外挿した 3 条件を自動で作ります。\n    temperature_dependent : bool\n        False なら α=β=0 の 2 パラメータモデルとして評価します。\n\n    Returns\n    -------\n    DesignQuality\n    \"\"\"\n    theta = np.asarray(theta, dtype=float)\n    n_params = 4 if temperature_dependent else 2\n    cols = [0, 1, 2, 3] if temperature_dependent else [0, 2]\n\n    geos = [_geometry(r, system) for r in runs]\n    usable = [g for g in geos if _eluted(theta, g, T_ref)]\n    notes: list[str] = []\n    if len(usable) < len(geos):\n        notes.append(f\"{len(geos) - len(usable)} 本は溶出しないため情報になりません。\")\n\n    if len(usable) < n_params:\n        return DesignQuality(\n            n_runs=len(runs), n_usable=len(usable), n_params=n_params,\n            stderr=np.full(4, np.inf), correlation=np.full((4, 4), np.nan),\n            condition_number=np.inf, pred_sigma={}, worst_pred_sigma=np.inf,\n            singular=True,\n            notes=notes + [f\"使えるランが {len(usable)} 本しかなく、\"\n                           f\"{n_params} パラメータを決められません。\"],\n        )\n\n    J = np.vstack([sensitivity_row(*theta, g, T_ref) for g in usable])[:, cols]\n\n    # 条件数は「列どうしがどれだけ似ているか」。桁を揃えてから測る\n    scale = np.linalg.norm(J, axis=0)\n    scale[scale == 0] = 1.0\n    cond = float(np.linalg.cond(J / scale))\n\n    try:\n        cov_small = np.linalg.inv(J.T @ J) * sigma_tR**2\n    except np.linalg.LinAlgError:\n        return DesignQuality(\n            n_runs=len(runs), n_usable=len(usable), n_params=n_params,\n            stderr=np.full(4, np.inf), correlation=np.full((4, 4), np.nan),\n            condition_number=cond, pred_sigma={}, worst_pred_sigma=np.inf,\n            singular=True,\n            notes=notes + [\"感度行列が退化しています（同じ情報のランばかり）。\"],\n        )\n\n    cov = np.zeros((4, 4))\n    for a, ia in enumerate(cols):\n        for b, ib in enumerate(cols):\n            cov[ia, ib] = cov_small[a, b]\n    se = np.sqrt(np.clip(np.diag(cov), 0.0, None))\n    se_full = np.where(np.isin(np.arange(4), cols), se, 0.0)\n\n    d = np.sqrt(np.clip(np.diag(cov), 1e-300, None))\n    corr = cov / np.outer(d, d)\n\n    # --- 狙いの条件での予測の確からしさ ---\n    if targets is None:\n        targets = _default_targets(runs)\n    pred = {}\n    for m in targets:\n        g = _geometry(Run(\"target\", m), system)\n        j = sensitivity_row(*theta, g, T_ref)[cols]\n        var = float(j @ cov_small @ j)\n        pred[_target_label(m)] = float(np.sqrt(max(var, 0.0)))\n    worst = max(pred.values()) if pred else float(\"nan\")\n\n    if cond > 1e3:\n        notes.append(f\"条件数 {cond:.0f}。ランどうしが似すぎていて \"\n                     \"log k_w と S を分離しきれていません。\")\n    return DesignQuality(\n        n_runs=len(runs), n_usable=len(usable), n_params=n_params,\n        stderr=se_full, correlation=corr, condition_number=cond,\n        pred_sigma=pred, worst_pred_sigma=worst, singular=False, notes=notes,\n    )\n\n\ndef _target_label(m: Method) -> str:\n    g = m.gradient\n    return (f\"tG {g.duration:.0f} min / {m.temperature_C:.0f} ℃\")\n\n\ndef _default_targets(runs: list[Run]) -> list[Method]:\n    \"\"\"狙いの条件を自動で作る（校正範囲の内側と、少し外側）。\"\"\"\n    tGs = [r.method.gradient.duration for r in runs]\n    Ts = [r.method.temperature_C for r in runs]\n    g0 = runs[0].method.gradient\n    phi0, phi1 = g0.phi_start, g0.phi_end\n    F = runs[0].method.flow_ml_min\n    lo, hi = min(tGs), max(tGs)\n    mid = math.sqrt(lo * hi)\n    T_mid = 0.5 * (min(Ts) + max(Ts))\n    out = []\n    for tG, T in ((mid, T_mid), (lo, T_mid), (hi, T_mid)):\n        out.append(Method(Gradient.linear(phi0, phi1, tG), T, F))\n    return out\n\n\n# ----------------------------------------------------------------------\n# ロバスト評価（仮パラメータが分からないので範囲で見る）\n# ----------------------------------------------------------------------\ndef nominal_grid(logkw_range=(2.0, 4.5), S_range=(3.0, 6.0),\n                 alpha: float = -0.020, beta: float = -0.020,\n                 n: int = 3) -> list[tuple]:\n    \"\"\"仮パラメータの格子。設計は「一番苦しい成分」で評価します。\n\n    log k_w と S は成分によって大きく違うので、実験計画は**その範囲全部で\n    そこそこ良い**ものを選ぶべきです。1 点だけで最適化すると、その点に\n    都合の良い設計になります。\n    \"\"\"\n    out = []\n    for lk in np.linspace(logkw_range[0], logkw_range[1], n):\n        for S in np.linspace(S_range[0], S_range[1], n):\n            out.append((float(lk), alpha, float(S), beta))\n    return out\n\n\ndef robust_quality(runs: list[Run], system: System, T_ref: float,\n                   nominals: list[tuple] | None = None,\n                   sigma_tR: float = 0.005,\n                   targets: list[Method] | None = None,\n                   temperature_dependent: bool = True) -> dict:\n    \"\"\"仮パラメータの範囲全体で設計を評価し、**一番苦しい値**を返す。\"\"\"\n    nominals = nominals or nominal_grid()\n    quals = [design_quality(th, runs, system, T_ref, sigma_tR, targets,\n                            temperature_dependent) for th in nominals]\n    worst_i = int(np.argmax([q.worst_pred_sigma for q in quals]))\n    worst = quals[worst_i]\n    return {\n        \"worst\": worst,\n        \"worst_nominal\": nominals[worst_i],\n        \"all\": quals,\n        \"worst_pred_sigma\": worst.worst_pred_sigma,\n        \"worst_pred_sec\": worst.worst_pred_sigma * 60.0,\n        \"max_condition_number\": max(q.condition_number for q in quals),\n        \"any_singular\": any(q.singular for q in quals),\n        \"n_nominal\": len(nominals),\n    }\n\n\n# ----------------------------------------------------------------------\n# スカウティングランの設計\n# ----------------------------------------------------------------------\ndef scouting_gradient(system: System, flow: float, phi0: float, phi1: float,\n                      S_nominal: float = 4.0, target_b: float = 0.10) -> dict:\n    \"\"\"最初に流す 1 本の勾配時間を決める。\n\n    勾配の急さ b（無次元）で決めます:\n\n        b = t0 · S · ΔΦ / tG        →      tG = t0 · S · ΔΦ / b\n\n    b が小さいほど緩い勾配 ＝ ピークが時間軸に広がって、溶出組成の分布が\n    よく見えます。目安:\n\n    - b ≈ 0.05  … かなり緩い。台帳づくり向き。時間はかかる\n    - b ≈ 0.1   … 標準的なスカウティング（既定）\n    - b ≈ 0.2-0.4 … 実用メソッドの範囲。スカウティングには急すぎる\n\n    k* = 1/(1.15·b) なので、b = 0.1 なら k* ≈ 8.7 で、ほとんどの成分が\n    ボイドからも末端からも離れた所に出ます。\n    \"\"\"\n    t0 = system.t0(flow)\n    dphi = phi1 - phi0\n    tG = t0 * S_nominal * dphi / target_b\n    return {\n        \"tG\": float(tG),\n        \"b\": float(target_b),\n        \"k_star\": float(1.0 / (1.15 * target_b)),\n        \"t0\": float(t0),\n        \"tD\": float(system.tD(flow)),\n        \"runtime\": float(tG + system.tD(flow) + t0),\n        \"S_nominal\": float(S_nominal),\n    }\n\n\ndef scouting_pair(system: System, flow: float, phi0: float, phi1: float,\n                  S_nominal: float = 4.0, target_b: float = 0.10,\n                  ratio: float = 3.0) -> list[dict]:\n    \"\"\"スカウティングを 2 本にする案（勾配時間を ratio 倍違えて流す）。\n\n    2 本流すと、その時点で成分ごとに (log k_w, S) の 2 つが決まります\n    ＝ 温度を振らないなら、もうモデルが作れます。1 本だけだと溶出組成の\n    分布しか分からないので、余裕があれば 2 本流す価値は大きいです。\n\n    勾配時間の比は 3 倍前後が定石。近すぎると 2 本の情報がほぼ同じになり、\n    log k_w と S を分離できません。\n    \"\"\"\n    a = scouting_gradient(system, flow, phi0, phi1, S_nominal, target_b)\n    b = scouting_gradient(system, flow, phi0, phi1, S_nominal,\n                          target_b / ratio)\n    a[\"label\"], b[\"label\"] = \"短い方\", \"長い方\"\n    return [a, b]\n\n\n# ----------------------------------------------------------------------\n# モデル用ランの設計\n# ----------------------------------------------------------------------\ndef build_runs(tG_levels, T_levels, phi0: float, phi1: float, flow: float,\n               prefix: str = \"\") -> list[Run]:\n    \"\"\"勾配時間 × 温度の総当たりでラン一式を作る。\"\"\"\n    out = []\n
